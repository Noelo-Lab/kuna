# kuna-facing options of the JVM engine (kuna-jvm, a port of Vineflower 1.12.0).
#
# One [[option]] row per exposed decision, spelled jvm_<vineflower long name with
# '-' turned into '_'>; `vineflower` and `short` are Vineflower's own long and
# three-letter names, accepted as aliases. Fields follow a [[settable]] row of
# decompiler/crates/kuna-decomp/phases.toml; `phase`/`subphase` name the
# kuna-jvm source folder and the module(s) that read the key. build.rs turns
# this file into the static table of src/p0_knowledge/kuna_options.rs; a test
# checks it one to one against IFernflowerPreferences.all_options().
#
# [[driver_owned]] keys are set by kuna's driver or front end, or fixed at
# Vineflower's default (the corpus runner may still pass them), never by a row.

[[option]]
option = "jvm_remove_bridge"
vineflower = "remove-bridge"
short = "rbr"
aliases = ["remove-bridge", "rbr"]
values = "on|off"
default = "on"
destructive = false
phase = "p9_emit"
subphase = "class_writer"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Leave out methods flagged ACC_BRIDGE: the forwarders javac generates for covariant return types and erased generic overrides."
use_when = "Turn off to see the bridge forwarders a class really carries, e.g. when checking which erased signatures a library exposes or when an obfuscator hid code in a method marked bridge."
example = "kuna decompile app.jar com.ex.Box --option jvm_remove_bridge off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.REMOVE_BRIDGE (remove-bridge, -rbr)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "method javap lists as bridge is missing from the output|need the generated Object-typed forwarder of a generic override|an obfuscated method marked bridge vanished"

[[option]]
option = "jvm_remove_synthetic"
vineflower = "remove-synthetic"
short = "rsy"
aliases = ["remove-synthetic", "rsy"]
values = "on|off"
default = "on"
destructive = false
phase = "p9_emit"
subphase = "class_writer"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Leave out synthetic fields, methods and member classes (this$0, val$x, access$000, lambda$main$0, switch-map classes) once their uses have been folded back into source form."
use_when = "Turn off when reversing obfuscated or non-javac bytecode that keeps real code in members flagged synthetic, or to read the accessor and lambda implementation methods themselves."
example = "kuna decompile app.jar com.ex.Main --option jvm_remove_synthetic off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.REMOVE_SYNTHETIC (remove-synthetic, -rsy)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "code javap shows is missing from the decompiled class|lambda$main$0 or access$000 body needed but hidden|obfuscator flagged real methods synthetic and they disappeared"

[[option]]
option = "jvm_decompile_inner"
vineflower = "decompile-inner"
short = "din"
aliases = ["decompile-inner", "din"]
values = "on|off"
default = "on"
destructive = false
phase = "p1_classfile"
subphase = "classes_processor"
strength = "HARD"
rewind = "p1_classfile"
issue = ""
summary = "Nest member, local and anonymous classes inside their enclosing class, as the InnerClasses and EnclosingMethod attributes describe; off writes every class file as its own top-level class."
use_when = "Turn off when InnerClasses attributes are stripped or forged and nesting goes wrong, or to get Outer$Inner as a separate compilation unit."
example = "kuna decompile-project app.jar -o out --option jvm_decompile_inner off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.DECOMPILE_INNER (decompile-inner, -din)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "Outer$Inner written as a separate class instead of nested|anonymous class body lands in the wrong method|need each class file decompiled on its own"

[[option]]
option = "jvm_decompile_generics"
vineflower = "decompile-generics"
short = "dgs"
aliases = ["decompile-generics", "dgs"]
values = "on|off"
default = "on"
destructive = false
phase = "p1_classfile"
subphase = "struct_class, struct_method, struct_field, var_exprent"
strength = "HARD"
rewind = "p1_classfile"
issue = ""
summary = "Read Signature and LocalVariableTypeTable attributes so classes, methods, fields and locals print with their generic types (List<String>, <T extends Comparable<T>>); off prints erased types."
use_when = "Turn off when signatures are corrupt or forged (obfuscators) and generic types come out wrong or cause failures; erased types then follow the descriptors exactly."
example = "kuna decompile app.jar com.ex.Repo --option jvm_decompile_generics off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.DECOMPILE_GENERIC_SIGNATURES (decompile-generics, -dgs)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "nonsense generic types from a tampered Signature attribute|need erased types that match the method descriptors|raw List where List<String> was expected (option is off)"

[[option]]
option = "jvm_keep_literals"
vineflower = "keep-literals"
short = "lit"
aliases = ["keep-literals", "lit"]
values = "on|off"
default = "off"
destructive = false
phase = "substrate"
subphase = "const_exprent"
strength = "HARD"
rewind = "substrate"
issue = ""
summary = "Print floating-point and long constants as plain literals (0.0F / 0.0F for NaN, 1.0 / 0.0 for infinity, 3.141592653589793) instead of resugaring them to Double.NaN, Double.POSITIVE_INFINITY, Long.MAX_VALUE or Math.PI."
use_when = "Turn on when the exact numeric value matters more than the named constant, e.g. when a magic number happens to equal Math.PI or Long.MAX_VALUE."
example = "kuna decompile app.jar com.ex.Math2 --option jvm_keep_literals on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.LITERALS_AS_IS (keep-literals, -lit)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "Math.PI where the source had a numeric literal|Long.MAX_VALUE or Double.MAX_VALUE instead of the number|need raw digits of a float constant"

[[option]]
option = "jvm_ascii_strings"
vineflower = "ascii-strings"
short = "asc"
aliases = ["ascii-strings", "asc"]
values = "on|off"
default = "off"
destructive = false
phase = "substrate"
subphase = "const_exprent"
strength = "HARD"
rewind = "substrate"
issue = ""
summary = "Escape every non-ASCII character of string and char literals as \\uXXXX."
use_when = "Turn on for strings with invisible, right-to-left or homoglyph characters (obfuscated keys, spoofed names) or when the output must be pure ASCII."
example = "kuna decompile app.jar com.ex.Keys --option jvm_ascii_strings on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.ASCII_STRING_CHARACTERS (ascii-strings, -asc)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "string literal shows odd or invisible characters|homoglyphs in a compared string|terminal mangles non-ASCII text in decompiled strings"

[[option]]
option = "jvm_synthetic_not_set"
vineflower = "synthetic-not-set"
short = "nns"
aliases = ["synthetic-not-set", "nns"]
values = "on|off"
default = "off"
destructive = false
phase = "p8_structure"
subphase = "nested_class_processor, nested_member_access, class_reference14_processor"
strength = "HARD"
rewind = "p8_structure"
issue = ""
summary = "Recognize compiler-generated members by their shape even without the ACC_SYNTHETIC flag: static accessor methods, outer-instance and captured-variable fields, and Java 1.4 class$ caches."
use_when = "Turn on for class files from compilers or obfuscators that drop the synthetic flag, so access$NNN calls and this$0/val$x fields still fold back into source form."
example = "kuna decompile obf.jar a.b --option jvm_synthetic_not_set on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.SYNTHETIC_NOT_SET (synthetic-not-set, -nns)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "access$000(this) calls left in the output|this$0 or val$name fields printed in inner classes|class$ helper calls remain in old class files"

[[option]]
option = "jvm_use_lvt_names"
vineflower = "use-lvt-names"
short = "udv"
aliases = ["use-lvt-names", "udv"]
values = "on|off"
default = "on"
destructive = false
phase = "p1_classfile"
subphase = "class_wrapper, var_exprent, var_definition_helper, class_writer"
strength = "HARD"
rewind = "p1_classfile"
issue = ""
summary = "Name parameters and locals from the LocalVariableTable (debug info), take local generic types from it, and name parameters (and mark them final) from the MethodParameters attribute (javac -parameters, records), instead of var1/var2-style names."
use_when = "Turn off when the debug names are misleading (obfuscated or forged LocalVariableTable or MethodParameters) or clash with keywords: off trusts no name the class file carries."
example = "kuna decompile obf.jar a.b --option jvm_use_lvt_names off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.USE_DEBUG_VAR_NAMES (use-lvt-names, -udv)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "variables named like keywords or with misleading names from debug info|LocalVariableTable or MethodParameters names contradict their use|unexpected final on parameters|var1 var2 names although debug info exists (option is off)"

[[option]]
option = "jvm_decompile_finally"
vineflower = "decompile-finally"
short = "fdi"
aliases = ["decompile-finally", "fdi"]
values = "on|off"
default = "on"
destructive = false
phase = "p7_regions"
subphase = "finally_processor"
strength = "HARD"
rewind = "p7_regions"
issue = ""
summary = "Rebuild try/finally: find the finally code javac copies onto every exit of the try, keep one copy in a finally block and drop the catch-all handler that rethrows."
use_when = "Turn off when the reconstructed finally is wrong or adds a semaphore variable, to see the duplicated copies and the catch (Throwable) handler as compiled."
example = "kuna decompile app.jar com.ex.Io --option jvm_decompile_finally off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.FINALLY_DEINLINE (decompile-finally, -fdi)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "\"Could not verify finally blocks\" comment with a semaphore variable|cleanup code duplicated after every return|catch (Throwable var) { ...; throw var; } instead of finally (option is off)"

[[option]]
option = "jvm_ignore_invalid_bytecode"
vineflower = "ignore-invalid-bytecode"
short = "iib"
aliases = ["ignore-invalid-bytecode", "iib"]
values = "on|off"
default = "off"
destructive = false
phase = "substrate"
subphase = "expr_util"
strength = "HARD"
rewind = "substrate"
issue = ""
summary = "When a constructor call names a constructor its class does not declare (invalid or tampered bytecode), print the call without hiding synthetic arguments instead of failing the method with \"Constructor .. not found\"."
use_when = "Turn on for obfuscated or patched jars whose methods fail with a Constructor not found error."
example = "kuna decompile obf.jar a.b --option jvm_ignore_invalid_bytecode on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.IGNORE_INVALID_BYTECODE (ignore-invalid-bytecode, -iib)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "$VF: Couldn't be decompiled with RuntimeException: Constructor ... not found|method fails on a new expression in a patched class"

[[option]]
option = "jvm_verify_anonymous_classes"
vineflower = "verify-anonymous-classes"
short = "vac"
aliases = ["verify-anonymous-classes", "vac"]
values = "on|off"
default = "off"
destructive = false
phase = "p1_classfile"
subphase = "classes_processor"
strength = "HARD"
rewind = "p1_classfile"
issue = ""
summary = "Before treating a class as anonymous, check that it has one supertype and that its enclosing class creates it with new exactly once and never casts to, tests for or reads statics of it; a class failing the check is written as a local class."
use_when = "Turn on when anonymous-class bodies end up inlined in the wrong place, typically with obfuscated InnerClasses attributes."
example = "kuna decompile obf.jar a.b --option jvm_verify_anonymous_classes on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.VERIFY_ANONYMOUS_CLASSES (verify-anonymous-classes, -vac)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "anonymous class body inlined at the wrong new expression|class used twice printed as an anonymous class|\"Inconsistent anonymous class\" warnings wanted"

[[option]]
option = "jvm_pattern_matching"
vineflower = "pattern-matching"
short = "pam"
aliases = ["pattern-matching", "pam"]
values = "on|off"
default = "on"
destructive = false
phase = "p8_structure"
subphase = "if_pattern_match_processor, switch_pattern_match_processor, method_processor"
strength = "HARD"
rewind = "p8_structure"
issue = ""
summary = "Rebuild instanceof patterns (if (o instanceof String s)) and pattern switches (case Point(int x, int y) ->) from the checkcast and SwitchBootstraps.typeSwitch code of Java 16+ class files."
use_when = "Turn off to see the explicit casts and typeSwitch bootstrap calls, or for output that older Java versions can compile."
example = "kuna decompile app.jar com.ex.Shapes --option jvm_pattern_matching off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.PATTERN_MATCHING (pattern-matching, -pam)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "String s = (String)o; after an instanceof test (option is off)|typeSwitch bootstrap call instead of a pattern switch|pattern variable reconstructed wrongly"

[[option]]
option = "jvm_decompile_switch_expressions"
vineflower = "decompile-switch-expressions"
short = "swe"
aliases = ["decompile-switch-expressions", "swe"]
values = "on|off"
default = "on"
destructive = false
phase = "p8_structure"
subphase = "switch_expression_helper"
strength = "HARD"
rewind = "p8_structure"
issue = ""
summary = "Rebuild Java 14+ switch expressions (var x = switch (k) { case A -> 1; default -> { yield 2; } }) from the statement switch and temporary javac emits."
