[[driver_owned]]
vineflower = "max-time-per-method"
kuna = "--max-fn-seconds: the driver's cooperative per-method deadline"

[[driver_owned]]
vineflower = "method-to-decompile"
kuna = "method selection (decompile <class>.<method>) slices the class by its method spans"

[[driver_owned]]
vineflower = "log-level"
kuna = "kuna's own logger"

[[driver_owned]]
vineflower = "new-line-separator"
kuna = "output always uses \\n"

[[driver_owned]]
vineflower = "bytecode-source-mapping"
kuna = "line mappings are always collected (method spans)"

[[driver_owned]]
vineflower = "user-renamer-class"
kuna = "not supported: a renamer class needs a JVM to load"

[[driver_owned]]
vineflower = "include-classpath"
kuna = "not supported: there is no JVM class path; use --lib and jvm_include_runtime"

[[driver_owned]]
vineflower = "dump-code-lines"
kuna = "line data of Vineflower's archive saver; kuna writes no archives"

[[driver_owned]]
vineflower = "skip-extra-files"
kuna = "kuna copies no resources"

[[driver_owned]]
vineflower = "decompile-preview"
kuna = "read nowhere in Vineflower 1.12.0: it has no effect"

[[driver_owned]]
vineflower = "__dump_original_lines__"
kuna = "corpus runner only"

[[driver_owned]]
vineflower = "indent-string"
kuna = "fixed at Vineflower's default, three spaces"

[[driver_owned]]
vineflower = "preferred-line-length"
kuna = "fixed at Vineflower's default, 160 columns; the corpus runner sets it for Vineflower's own tests"

[[driver_owned]]
vineflower = "error-message"
kuna = "fixed: the note under a failure comment asks for reports to kuna's tracker; the corpus fixture sets it empty"

[[driver_owned]]
vineflower = "dump-bytecode-on-error"
kuna = "fixed on: a failed method's comment lists its bytecode"

[[driver_owned]]
vineflower = "dump-exception-on-error"
kuna = "fixed on: a failure comment names the exception; the corpus fixture turns it off"

[[driver_owned]]
vineflower = "kt-unknown-defaults"
kuna = "fixed at the Kotlin plugin's default: ... stands for a default argument the $default stub does not reveal"
