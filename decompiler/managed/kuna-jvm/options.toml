symptoms = "\"Could not handle exception ranges with multiple entries\" comment|duplicated try blocks in an obfuscated method"

[[option]]
option = "jvm_include_runtime"
vineflower = "include-runtime"
short = "jrt"
aliases = ["include-runtime", "jrt"]
values = "on|off|current|<path>"
default = "on"
destructive = false
phase = "p0_knowledge"
subphase = "fernflower, jdk_runtime"
strength = "HARD"
rewind = "p0_knowledge"
issue = ""
summary = "Give the decompiler a JDK's class library as context: on/current finds the current JDK (JAVA_HOME, then java on PATH, then usual install directories), a path names a JDK home, off uses none."
use_when = "Point it at the JDK the code was built for when casts, generics or overloads on java.* types come out wrong; use off for reproducible output that does not depend on the machine's JDK."
example = "kuna decompile app.jar com.ex.Main --option jvm_include_runtime /usr/lib/jvm/java-21"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.INCLUDE_JAVA_RUNTIME (include-runtime, -jrt)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "extra casts on calls into java.util or java.lang|@Override missing on JDK interface methods|generic arguments of JDK types erased|output differs between machines with different JDKs|no JDK found note on stderr"

[[option]]
option = "jvm_rename_members"
vineflower = "rename-members"
short = "ren"
aliases = ["rename-members", "ren"]
values = "on|off"
default = "off"
destructive = false
phase = "p0_knowledge"
subphase = "fernflower, identifier_converter, converter_helper"
strength = "HARD"
rewind = "p0_knowledge"
issue = ""
summary = "Rename classes, fields and methods whose names are not valid Java identifiers, are reserved words, or are short obfuscated names, to class_N/field_N/method_N, rewriting every reference and noting the original name."
use_when = "Turn on for obfuscated jars whose names (if, do, a, ., unicode garbage) make the output unreadable or uncompilable."
example = "kuna decompile-project obf.jar -o out --option jvm_rename_members on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.RENAME_ENTITIES (rename-members, -ren)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "class or method named like a Java keyword|identifiers that are not valid Java (obfuscated names)|many classes named a, b, c that clash"

