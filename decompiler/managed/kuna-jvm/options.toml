change_kind = "vineflower-option"
tier = "transform"
symptoms = "one variable reused for two unrelated values|variable read before its assignment in the output|decompiled code does not recompile because of variable scoping"

[[option]]
option = "jvm_verify_pre_post_merges"
vineflower = "verify-pre-post-merges"
short = "pvm"
aliases = ["verify-pre-post-merges", "pvm"]
values = "on|off"
default = "off"
destructive = false
phase = "p6_variables"
subphase = "var_definition_helper"
strength = "HARD"
rewind = "p6_variables"
issue = ""
summary = "Compute, with an extra SSA pass, which assignments each variable read can see, and refuse variable merges that would change it (experimental)."
use_when = "Turn on when merged variables around ++/-- or loops produce wrong values in the output."
example = "kuna decompile app.jar com.ex.Loop --option jvm_verify_pre_post_merges on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.VERIFY_PRE_POST_VARIABLE_MERGES (verify-pre-post-merges, -pvm)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "i++ applied to the wrong variable after merging|loop counter merged with another variable"

[[option]]
option = "jvm_old_try_dedup"
vineflower = "old-try-dedup"
short = ""
aliases = ["old-try-dedup"]
values = "on|off"
default = "off"
destructive = false
phase = "p2_lift"
subphase = "exception_deobfuscator"
strength = "HARD"
rewind = "p2_lift"
