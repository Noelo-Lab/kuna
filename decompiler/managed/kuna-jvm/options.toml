inspiration = "Vineflower 1.12.0 IFernflowerPreferences.SWITCH_EXPRESSIONS (decompile-switch-expressions, -swe)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "switch statement assigning a temporary in every case where a switch expression was written|yield statements misplaced"

[[option]]
