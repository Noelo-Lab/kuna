[package]
autotests = false
name = "kuna-harness"
description = "kuna Rust port: dev-only differential-testing helpers (Rust engine vs C++ oracle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kuna-base.workspace = true
kuna-num.workspace = true
kuna-sleigh.workspace = true
kuna-decomp.workspace = true
kuna-console.workspace = true
regex.workspace = true

[lints]
workspace = true

# The XML datatest harness binary (the upstream `decomp_test_dbg` name).  It
# lives here — not in `kuna-console` — because it drives the datatest runner
# (`kuna_harness::testfunction`), and `kuna-harness` depends on `kuna-console`
# (the reverse would be a dependency cycle).  Built to `target/<profile>/
# decomp_test_dbg`, the path `kuna/run_tests.py` resolves.
[[bin]]
name = "decomp_test_dbg"
path = "src/bin/decomp_test_dbg.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "verify_w10_callarg_piece_switchhide_guard"
path = "tests/verify_w10_callarg_piece_switchhide_guard.rs"

[[test]]
name = "verify_w10_inline_body"
path = "tests/verify_w10_inline_body.rs"

[[test]]
name = "verify_w10_rsp_8_guardfold"
path = "tests/verify_w10_rsp_8_guardfold.rs"

[[test]]
name = "verify_w10_rsp_l4l5_stackframe_adversarial"
path = "tests/verify_w10_rsp_l4l5_stackframe_adversarial.rs"
