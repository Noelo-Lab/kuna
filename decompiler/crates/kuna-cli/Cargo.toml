[package]
name = "kuna-cli"
description = "kuna Rust port: the user-facing `kuna` CLI (decompile / test / catalog / specs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kuna-decomp.workspace = true
kuna-base.workspace = true
kuna-console.workspace = true
kuna-analysis.workspace = true
kuna-sleigh.workspace = true
# FID construction also reads archive members.
object = { workspace = true, features = ["archive"] }
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[[bin]]
name = "kuna"
path = "src/main.rs"
