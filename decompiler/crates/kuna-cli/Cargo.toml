[package]
name = "kuna-cli"
description = "kuna Rust port: the user-facing `kuna` CLI (decompile / test / catalog / specs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The single user-facing binary.  It reimplements the four Python entry points
# (kuna/decompile.py, kuna/run_tests.py, kuna/catalog.py, kuna/slacomp.py) so the
# whole project lives under one Rust paradigm.  Most subcommands shell out to the
# already-built engine binaries (decomp_dbg / decomp_test_dbg / slacomp) exactly
# as the Python did — guaranteeing byte-identical output — and parse their
# streams in Rust; `catalog --check` is in-process (it cross-checks the catalog
# table against the registered kuna-option set via `kuna-decomp`).
[dependencies]
kuna-decomp.workspace = true
# `kuna fid build` runs in-process (it needs the live `Sleigh::instruction_mask`
# the FID generator consumes): `kuna-console` bootstraps the architecture from
# the object (`bootstrap_from_object`), `kuna-analysis` hosts the generator + the
# `.fid` writer, and `object` re-opens the parsed image / `ObjectLoadImage`.
kuna-console.workspace = true
kuna-analysis.workspace = true
# The workspace `object` is read_core+formats; `kuna fid build` additionally needs
# the `ar` archive reader to unpack `.a` static libraries member-by-member, so the
# `archive` feature is enabled here (additive — features unify, the rest of the
# workspace is unaffected).
object = { workspace = true, features = ["archive"] }

[lints]
workspace = true

[[bin]]
name = "kuna"
path = "src/main.rs"
