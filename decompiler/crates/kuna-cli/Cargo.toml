[package]
autotests = false
name = "kuna-cli"
description = "kuna Rust port: the user-facing `kuna` CLI (decompile / test / catalog / specs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kuna-decomp.workspace = true
kuna-base.workspace = true
kuna-console.workspace = true
kuna-analysis.workspace = true
kuna-sleigh.workspace = true
kuna-slacomp.workspace = true
kuna-num.workspace = true
kuna-bsim-server = { path = "../kuna-bsim-server", default-features = false }
# FID and FLIRT construction also read archive members.
object = { workspace = true, features = ["archive"] }
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
md-5 = "0.11"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1", features = ["rt", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "native-certs"] }
url = "2.5"
similar = "2.7"
rustls-native-certs = "0.8"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[features]
# Carry the compiled SLEIGH tree inside the binary (build.rs reads `specs/`, so
# `make specs` must run first). Release builds enable it.
embed-specs = ["kuna-console/embed-specs"]

[dev-dependencies]
flirt-sig.workspace = true
object = { workspace = true, features = ["write"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[[bin]]
name = "kuna"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "decompile_all_cli"
path = "tests/decompile_all_cli.rs"

[[test]]
name = "catalog_cli"
path = "tests/catalog_cli.rs"

[[test]]
name = "docs_cli"
path = "tests/docs_cli.rs"

[[test]]
name = "process_helpers"
path = "tests/process_helpers.rs"

[[test]]
name = "single_binary_cli"
path = "tests/single_binary_cli.rs"

[[test]]
name = "ppc32_pic_session"
path = "tests/ppc32_pic_session.rs"
