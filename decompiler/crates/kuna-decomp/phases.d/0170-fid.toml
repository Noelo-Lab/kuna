[[settable]]
option = "fid"
values = "on|off|strict"
default = "off"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-fid"
summary = "Run the FID fingerprint matcher (a Listing/xref consumer): the kuna analog of Ghidra's FID (Function-ID) identification analyzer. Over the built Listing, fingerprint each function with the byte-exact operand-masked FNV-1a64 hash (the MessageDigestFidHasher port, driving Sleigh::instruction_mask) and look the full hash up in a kuna `.fid` fingerprint database (named by the `kuna_fid_db` environment variable). When the full-hash bucket collapses to exactly one name (conservative — never guess on a tie), RENAME the matched function — but only when it still carries an engine FUN_*/sub_* placeholder (the label gate; a real .symtab/DWARF name is never overwritten). This re-identifies a function in a STRIPPED binary purely by its instruction-stream fingerprint (e.g. sub_4017c0 -> kuna_crc32). The optional strict mode also requires a specific-hash and code-unit-count match for the same record; matching evidence is not identity proof. Requires the Listing (option listing on) and a configured `.fid` DB — a no-op when either is absent. DISABLED by default (real-ELF path only, so every parity gate is byte-identical)."
use_when = "Off (default; no Listing consumer runs and there is zero behavior change). Flip on (with option listing on, and `kuna_fid_db` pointing at a `.fid` database built by `kuna fid build`) to re-identify library functions in a STRIPPED real-ELF target by full-hash fingerprint — renaming a FUN_*/sub_* placeholder back to its known library name. Use strict to require matching specific hash and code-unit count when the database comes from the same link as the target: the specific hash folds in operand values that differ between links, so against a libc.a database strict keeps about 3% of the correct names."
example = "option listing on --option fid on"
source_decompiler = "kuna"
inspiration = "Ghidra FID (Function-ID) identification analyzer (FidServiceImpl full-hash re-identification)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "stripped static-linked library function stays sub_<addr> although its fingerprint is known|no .fid database renames applied in a stripped binary"
