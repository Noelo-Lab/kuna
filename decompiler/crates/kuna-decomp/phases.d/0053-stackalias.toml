[[settable]]
option = "stackalias"
values = "on|off"
default = "off"
destructive = true
phase = "P6"
subphase = "alias-facets"
strength = "HARD"
rewind = "P6"
issue = "GH-8500"
summary = "Hold a store-through-a-stack-pointer-alias (int *p=&x; *p=x; return *p) alive across the deadcode race so it is not dropped to an uninitialized stack read."
use_when = "Set on PER FUNCTION when a take-address-of-local + store-through-pointer returns a spurious uninitialized local (xStack_*); DESTRUCTIVE as a global default (conservatively pins stack stores live, suppressing legitimate dead-store removal)."
example = "option stackalias on"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra GH-8500 (stack-pointer-alias store liveness)"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "spurious uninitialized local (xStack_N) returned after storing through a pointer to a local|store through a take-address-of-local pointer dropped as dead so the later read is garbage"
live_field = "stack_alias_deadstore"
live_true = "on"
live_false = "off"
