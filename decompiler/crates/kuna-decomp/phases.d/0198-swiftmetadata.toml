[[settable]]
option = "swiftmetadata"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-swiftmetadata"
summary = "On a Swift-built Mach-O or ELF, run the runtime-metadata recovery pass: read the swift5_* reflection sections a stripped Swift binary keeps (__swift5_types / swift5_type_metadata, the nominal type context descriptors; __swift5_protos, the protocol descriptors; __swift5_proto, the conformance descriptors; __swift5_fieldmd, the field descriptors) and name what they point at, in the demangler's name-only conventions so the names read like symbol-table names: each type's metadata accessor (Module.Type.type_metadata_accessor), each class vtable slot's implementation by position and kind (Module.Class.vtable#3.getter - the slot carries no selector), each override whose overridden method descriptor is an import (Module.Sub.viewDidLoad(), the real member name, read from the …Tq import the override table points at), each resilient protocol witness (<Module.Type:Swift.Hashable>.hash(into:) when the requirement descriptor is an import, <T:P>.requirement#2 for a local protocol, Module.P.requirement#2.default for a default implementation), and the records themselves (….nominal_type_descriptor, ….protocol_descriptor, ….module_descriptor, <T:P>.protocol_conformance_descriptor, <T:P>.protocol_witness_table, ….reflection_field_descriptor). Type paths follow the parent chain (Module.Outer.Inner; a private/anonymous context is transparent; an extension context demangles its extended type; a parent in another image is named through its module-descriptor import). Function names use the FID-precedent label-gated rename: a real symbol is never overwritten, only an engine sub_*/FUN_* placeholder. Everything in the sections is 32-bit self-relative, so no fixup resolution is needed except for indirect references, which go through the chained-fixup overlay (rebases) or the import table (binds); a record the reader cannot follow is skipped, never guessed. Registered for Mach-O and ELF (the formats Swift ships in) when the loader detected a Swift image; an image without the sections produces nothing, so every other binary is byte-identical."
use_when = "On by default: a stripped Swift binary's metadata accessors, class vtable implementations, overrides of imported methods and protocol witnesses render under their type's path instead of sub_<addr>, and the descriptor records are named. Inert on every image the loader did not detect as Swift and on any image without swift5_* sections. Flip off to keep the sub_<addr> placeholders."
example = "option swiftmetadata on"
source_decompiler = "kuna"
inspiration = "The Swift ABI metadata layouts (swift/include/swift/ABI/Metadata.h, MetadataValues.h; docs/ABI/TypeMetadata.rst) and the reflection-section walk of unlace's swift_metadata.rs"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "swift binary functions render as sub_<addr> although swift5 metadata sections are present|type metadata accessors unnamed in a stripped swift mach-o|protocol witnesses and class methods of a stripped swift app have no names"
