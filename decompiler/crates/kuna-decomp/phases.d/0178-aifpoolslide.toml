[[settable]]
option = "aifpoolslide"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "GH-299"
summary = "Never plant an Aggressive Instruction Finder gap entry on a literal-pool word; plant it on the code after the pool (GH-299). ARM code keeps its constants in pools right after the code that loads them, so a pool usually sits between one function and the next, and the Listing walk never decodes it. The gap walk reads a pool word as an instruction (an A32 image address 0x608xxxxx as addvs, the high half of a Thumb SRAM pointer 0x2000xxxx as movs r0,#0) whose pairing with the next function's prologue matches the fingerprint, and whose speculative body runs into that function and validates; the entry lands a word or half a word early and, because an accept consumes its body, the function behind it is never probed. With this on, the walk keeps the set of words that ldr and vldr instructions load PC-relatively (their absolute [0x...] operand or [pc,#imm] form, both words of a 64-bit load; adr only takes an address and does not count), from the decoded Listing and from every body it accepts or consumes. A candidate inside a run of adjacent such words is probed as before, but its accept is planted on the first address after the run when its body decoded an instruction there, and it is rejected otherwise so the walk reaches the code after the pool. When that address is data (bytes that begin a printable NUL-terminated string, or an even address some literal word of Thumb code holds) the candidate is refused but still consumes its body, so bogus literal words decoded from a string table never move an entry onto a string; a bracket refusal also keeps consuming its body. 32-bit ARM only. Measured with each stripped image scored against its unstripped twin's symbol table, default mode: over the 93 non-u-boot 32-bit ARM ELFs of the decbench corpus mid-body entries fall 4,375 to 1,866 net and true function starts rise by 222; on the two u-boot A32 images mid-body entries fall 1,415 to 1,081 and true starts rise by 334; no true start is lost, and CMSIS_DAP.axf, 12 i386 decbench PEs, 17 Wine DLLs, 16 MinGW crackmes and 25 x86-64 images are unchanged. Besides the 556 true starts the new entries are 5 mid-body entries and 63 on data, none on a string start, against 88 data entries removed. Like poolentry it moves a function four bytes in when a literal reference resolves onto the function's own first word, which the gap walk without it gets right in --mode reliable; the corpus has no such case. Inert without aif and without --option listing on, so the datatest corpus is byte-identical."
use_when = "On (default). It only moves or refuses a gap entry whose first bytes some instruction loads as a constant, so it removes entries that are data and lists the function behind the pool at its own address. Flip off to reproduce the GH-299 measurement exactly, or when an ARM image computes into a word it also executes (self-modifying code) and a real function that begins on a loaded word disappears from a stripped function list."
example = "--option aifpoolslide off"
source_decompiler = "kuna"
inspiration = "GH-299 residue: the largest class of mid-body AIF entries left after aifbracket, aifnoppad and thumbswitch sits one literal-pool word before a real function, which it hides; Ghidra's reference analyzer defines PC-relative literal targets as data before its aggressive instruction finder runs, so those bytes are never a gap"
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "a sub_ entry starts on a literal pool word one word before a real function|a stripped arm function list lists a function 4 bytes early|a function's first decoded instruction is a conditional addvs or a movs r0,#0 that no code reaches|a real arm function is missing from a stripped inventory while the entry just before it is a pool word|aif adds entries on literal pools"
