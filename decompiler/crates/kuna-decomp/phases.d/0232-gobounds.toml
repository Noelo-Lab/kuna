[[settable]]
option = "gobounds"
live_field = "go_bounds"
live_true = "on"
live_false = "off"
values = "on|off"
default = "on"
destructive = true
phase = "P7"
subphase = "edge-virtualization"
strength = "HARD"
rewind = "P7"
issue = "angr-go-check-remover"
summary = "REMOVES CODE: fold compiler-generated Go bounds, slice, division, shift and unsafe string/slice checks. On Go images only, remove a conditional edge to a terminal block whose sole call is an exact compiler panic helper. Preserve explicit panic calls, type assertions, arms containing stores or other calls, and branches whose two successors are both panic handlers. The surviving access or arithmetic is unchanged; arguments used only by the removed check can disappear from inferred signatures."
use_when = "Leave on for source-oriented Go decompilation; turn off to audit the actual checks and panic paths. Non-Go images are unchanged. Use sourcelang go for a bytechunk or image whose language metadata was removed."
example = "option gobounds off"
source_decompiler = "angr"
inspiration = "angr GoCheckRemover and GO_CHECK_PANIC_NAMES; tests/analyses/decompiler/test_go_builtins.py"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "Go array accesses surrounded by runtime.panicIndex or runtime.panicBounds calls|Go division retains compiler-generated runtime.panicdivide branches"
