[[settable]]
option = "cortexmvectors"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-cortexmvectors"
summary = "On an ARM ELF, widen the Cortex-M hardware vector-table signature (entry discovery oracle 6). The strict signature confirms a table only when (a) it starts a section the loader maps executable, (b) its word 0 is in the architectural SRAM block 0x20000000-0x3FFFFFFF, and (c) its word 1 equals e_entry. All three over-constrain real firmware: the table is DATA the CPU reads, so a bare-metal link script normally emits .isr_vector as an A-only section in a read-only PT_LOAD; STM32F4 and -M7 parts put the initial stack in CCM/TCM at 0x10000000; and e_entry is the ELF start symbol, which a link script is free to point somewhere other than the reset vector. With this on, a candidate is any allocated section whose word 0 lands in 0x10000000-0x3FFFFFFF and whose slots from word 1 yield at least three Thumb handler pointers (odd, inside an executable section) — the run of handlers replaces the e_entry equality, and three consecutive conforming slots is a shape a .data structure does not reach by accident. Confirming a table arms the reset/exception handler seeds AND the whole-image Thumb (TMode=1) region paint, so a stripped Cortex-M image goes from a handful of functions to the whole firmware. The widened scan runs ONLY where the strict signature found nothing, so an image that resolved a table before resolves the same section with the same harvest: the option can add discovered entries, never remove one. ARM-only and real-object-path only, so every XML datatest is structurally untouched."
use_when = "On by default: a stripped bare-metal ARM Cortex-M firmware image (STM32/nRF/SAM/...) whose vector table the strict signature never confirmed -- the .isr_vector section flagged A (not AX) in a read-only PT_LOAD, a 0x1000xxxx CCM/TCM initial stack pointer rather than 0x2000xxxx, or a second word that does not match the ELF e_entry -- gets its handlers seeded and its text painted Thumb instead of decompiling to a few functions of A32 garbage. Stands alone (it needs no other option), and composes with the listing + funcstart_patterns + aif set the decompile-all/functions drivers already inject on non-x86-64. Inert on every non-ARM image and on any ARM image the strict e_entry-matching signature already resolves. Flip off to keep the strict signature only."
example = "--option cortexmvectors on"
source_decompiler = "kuna"
inspiration = "decbench:O2-cleanflight-cleanflight_DALRCF405, O2-betaflight-betaflight_STM32F405, O2-crazyflie-cf2, O2-nuttx-nuttx; kuna's own ARM entry-recall measurement (docs/features/cortexmvectors/analysis.md; step 1 of the arm-entry-granularity proposal)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "stripped cortex-m firmware yields only a handful of functions|arm firmware body decodes as a32 garbage instead of thumb|nmi/hardfault/systick exception handlers never discovered as entries|isr_vector table present but no vector-derived function starts"
