[[settable]]
option = "elfmain"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "prototype-source"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-elfmain"
summary = "Name the ELF routine crt1 hands to `__libc_start_main` `main`, and declare it `int main(int argc, char **argv, char **envp)`. kuna already finds the address: entry-discovery oracle 4 decodes the `_start` -> `__libc_start_main(main, ...)` idiom on x86-64, AArch64, ARM and RISC-V and seeds the recovered VMA as a function entry - but address-only, so on a stripped ELF the program's own starting point arrives in the inventory as one more `sub_<addr>`, carrying whatever prototype reading its body alone produces. On coreutils `fmt` built -O2 and stripped that is `unsigned long sub_26a0(int a0,char **a1)`: the two slots exist because this particular `main` happens to read them, their widths are right, and everything else is absent - which function this is, that `a0` counts the strings `a1` points at, and that the value handed back is the process exit status rather than an `unsigned long`. The return type in particular is unrecoverable from the body, because `main`'s result is consumed by `__libc_start_main`, outside the image; kuna types it from the widest register write it can see. The C runtime's contract states all of it: the first argument to `__libc_start_main` IS `main`, and what that runtime then calls is `main(argc, argv, envp)`. This is the ELF counterpart of `machomain` (which reads the same two facts off a Mach-O `LC_MAIN`) and it is typed the same way and for the same reason, in contrast to `entrymainproto`, which reports only the widths a recovered PE call site establishes because the same shape carries `wmain`'s `wchar_t **`. All three arguments are declared, including the `envp` most programs ignore, because the prototype is applied LOCKED: declaring two parameters asserts there is no third one, and on a `main` that reads `envp` that deletes a parameter recovery had already found - the entry value stops being an input and the read becomes an uninitialised local the body still passes on. Nothing readable at load time separates that `main` from one that truly ignores its third argument (the in-tree ARM fixture armlibcmain_le32 @0x103dc never touches `r2` at all; it forwards it to `__printf_chk`), and of the two mistakes only one is wrong output. The lock costs something in the other direction and the corpus says how much: a `main` whose body reads an argument register PAST the third loses the slot that read was living in, so the value is dropped from the call site it was handed to, or - when the body stores it - declared as a local nothing assigns. 28 of the 645 stripped decbench ELFs whose `main` this pass names recover more than three parameters from the body, and 13 of those render such a local. None of the extra slots is a real parameter (the unstripped twins of the two loudest, openssh `sftp` -O2 @0x5250 and shadow `login` -O2 @0x3d20, both declare `int main(int argc, char **argv)`), so what changes is how an undefined register read is rendered rather than whether a parameter survives - and on coreutils `true`/`false` the same flip replaces the `undefined16 ... return v2._0_16_ << 0x40` that slot produced with `return 0`. The in-tree fixture elfmainextra_x86_64 @0x1026 pins both shapes. An executable that keeps its symbol table names `main` itself and keeps that name, but the declaration comes from its body alone: the in-tree `elfmainnamed_x86_64` fixture prints `unsigned int main(int a0,struct_0 *a1)` with `score(a1->field_0x8)` where its source says `score(argv[1])`. crt1 references `main` by name and the static linker resolves that to the image's defined `main`, so in an image that names `__libc_start_main` that function IS the routine the runtime calls whether or not oracle 4 can read `_start` (it has no i386 or MIPS arm). There the declaration may only name and type what the analysis already found, so it is applied inside `main`'s own analysis rather than as a locked prototype: only the `int` return is locked, the inputs are recovered exactly as with the option off, and when the inputs the body reads in parameter storage are exactly the first k runtime arguments (argc, argv, envp in order) each takes its runtime type during type inference (unlocked, so the next call does not take it as an argument) and its runtime name as it is recovered. So the fixture prints `int main(int argc,char **argv)` with `score(argv[1])` and a `main(void)` prints `int main(void)`, in the same single decompile. A `main` that reads only `argv` or `envp` (it recovers an unread slot ahead of it), hands `argc` to a callee as the whole 64-bit register, or reads past the third argument is decompiled again without the declaration and prints exactly the option-off output. Executables only (`ET_EXEC`, or `ET_DYN` with a program interpreter or `DF_1_PIE`), so a `.so` exporting `main` is left alone; any prototype another stream parks on `main` (DWARF) wins. Refuses on a non-ELF image, on an ELF that names no `__libc_start_main` at all (a fully stripped static link states nothing that distinguishes a glibc crt1 from a hand-rolled entry point, and a bare-metal `main` is called with nothing in its argument registers), on a recovered address equal to `_start` or outside every executable section, on an address that carries a function symbol other than `main`, on an image that spells `main` at two addresses or as anything but a defined function, and where oracle 4 decodes an address other than the symbol's. The non-PIE ARM32 shape oracle 4 cannot see is `armlibcmain`'s, which already installs the name; only the prototype is added there, so flipping that option off still restores its inventory exactly."
use_when = "On by default. Makes a stripped ELF report its program entry as `main`, with `argc`, `argv` and `envp` named and an `int` result, instead of one more `sub_<addr>` returning a guessed width: the tell-tale is `kuna functions` on a stripped Linux binary listing no `main` at all, and `kuna decompile --addr <the crt1 argument>` rendering `unsigned long sub_<addr>(int a0,char **a1)` or, when that `main` ignores its arguments, `void sub_<addr>(void)`. On an unstripped executable it names the image's own `main`'s parameters argc/argv/envp and types them, declaring only as many as the body reads, where the body alone gave anonymous slots such as `unsigned int main(int a0,struct_0 *a1)`. Flip off to restore the `sub_<addr>` / width-only form exactly - e.g. on an image whose `_start` is a hand-rolled loader that calls `__libc_start_main` with something other than a C `main`, where the name and the two slots would both be misleading, or to see the parameters and the return width body-driven recovery finds on its own."
example = "--option elfmain off"
source_decompiler = "kuna"
inspiration = "decbench coreutils `fmt` built -O2 and stripped: `kuna decompile-all fmt --addr 0x26a0` renders `unsigned long sub_26a0(int a0,char **a1)` while the DWARF of the unstripped twin declares `int main(int argc, char **argv)` at that address, and kuna's own entry oracle 4 recovered 0x26a0 from `_start` in the first place. IDA Pro and Ghidra both label and type that address from the same call site"
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "an unstripped ELF's main decompiles with anonymous a0/a1 parameters and an unsigned return|argv[1] in main reads as a struct field or a cast of a1|kuna functions on a stripped Linux binary lists no main at all|the entry of a stripped ELF is reported only as sub_<addr>|a stripped ELF program routine decompiles as unsigned long sub_<addr>(int a0,char **a1)|argc and argv are invisible in the decompiled main of a stripped elf binary|main returns unsigned long instead of int in a stripped ELF|there is no way to tell which of a stripped ELF's functions the program starts in"
