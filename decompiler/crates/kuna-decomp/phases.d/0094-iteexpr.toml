[[settable]]
option = "iteexpr"
values = "on|off"
default = "off"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ITE-region-converter-expr"
summary = "Extend `iteregion` from single-`COPY` arms to any single-statement COMPUTED pure-value arm (`if (c) v = *p; else v = q;` -> `v = c ? *p : q;`, or `v = c ? b + 5 : b - 3;`). The arm's assignment op may be any pure value op (`LOAD`, `INT_*`, `PTR*`, `CAST`, `SUBPIECE`, …) whose second-level operands are single-use implied varnodes; only side-effecting/control ops (a `STORE`, a call, a branch, an `INDIRECT`/`MULTIEQUAL`) are rejected. The C ternary evaluates only the taken branch, so the rewrite is semantics-preserving. Print-only (same mechanism as iteregion). Matches angr's aggressive `?:` recovery: on decbench O0 coreutils angr emits ~1389 ternaries to kuna's ~177; this roughly doubles kuna's recovery (ls 27->46, sort 2->21, du 19->34)."
use_when = "Turn ON to recover `?:` over computed arms like angr/IDA do, when the source used ternaries (common in format/print/flag/size code). A RUNTIME CHOICE, default-off: it diverges when the source used an explicit if/else (the same object code is emitted either way). Requires `option iteregion on` (default) — it broadens iteregion's arm match. Print-only; on, each rewrite is logged (`iteregion:`)."
example = "option iteexpr on"
source_decompiler = "angr"
inspiration = "decbench:O0-coreutils (ternary under-recovery vs angr/ida); angr ITERegionConverter computed-arm regions"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "if (c) v = <expr1>; else v = <expr2>; where a ternary v = c ? expr1 : expr2 is expected|kuna emits far fewer ?: ternaries than angr/ida on format/flag/size code|computed-arm assignment diamond (v = *p / v = b + k) not folded to a ternary"
