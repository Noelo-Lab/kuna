[[settable]]
option = "swiftobjcthunk"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-swiftobjcthunk"
summary = "The @objc-thunk arm of the Swift metadata pass (inert unless swiftmetadata is on; Mach-O arm64 only). A Swift method descriptor carries no name, so in a stripped image a class's vtable slots print by position (Module.Class.vtable#20.method, vtable#59.setter) and so does every call through them. An @objc member also has an Objective-C entry point: the class's __objc_classlist entry (a Swift class, its class_t data word tagged FAST_IS_SWIFT_*, whose metadata Description is a class descriptor) lists it by selector, and its IMP is a bridging thunk that calls the member's native implementation directly. The arm scans each thunk of each such class for bl/b targets up to the next stated function start (at most 128 instructions); when they reach exactly one implementation the class's vtable or override table lists, the thunk sends no Objective-C message itself (no call into __objc_stubs or through a stub bound to objc_msgSend*: such a thunk is an override of an inherited Objective-C method with its body inlined, super call included, and that override has no vtable slot, so the slot it calls is another method), the slot's kind matches the selector, no own vtable slot of the selector's kind has an empty implementation (a member inlined everywhere, its thunk included, under whole-module -O), and no other implementation of the class calls or branches to the hit directly (a member whose body the thunk inlined but which survives calls what the thunk calls), the slot takes a member name: a getter or setter whose selector is an accessor of an @objc property in the class's property list is named after the property (Class.scrollView.getter, Class.scrollView.setter), and a method or init-prefixed initializer after its selector (Class.addFrameWithTimestamp:label:, which the Swift spelling addFrame(timestamp:label:) does not determine from the selector alone). An instance slot takes only an instance method's selector, a class slot only a class method's, and an initializer an instance init selector (-initWithType:length:). The name belongs to the method descriptor, so a subclass override of the slot takes it too (Sub.addFrameWithTimestamp:label:), as a call through the slot does; two thunks that name one slot differently leave it unnamed, and an implementation that carries a Swift symbol keeps the name the symbol gives it. Default-ON because it is inert unless swiftmetadata is on, the XML corpus never runs the pass (0/675), and the scan reads only the Objective-C method lists' IMPs: on an 84 MB arm64 iOS app the arm before the inlined-body checks named 346 of the 1,723 positional slot implementations with no measurable load cost (kuna functions 49.2 s against 50.6 s user time), and kuna decompile-all of a 0.8 MB Swift framework is unchanged (33.9 s against 33.5 s median user time over 3 interleaved runs)."
use_when = "Off to see a stripped Swift class's @objc members by vtable position (vtable#N.kind) as before. On (default) when swiftmetadata is on: @objc methods, initializers and property accessors of a Swift class, and calls through their slots, carry the selector or property name."
example = "option swiftobjcthunk off"
source_decompiler = "kuna"
inspiration = "The Swift compiler's @objc entry points (swift/lib/SILGen/SILGenBridging.cpp: the thunk ending in a direct call to the native method) and the Objective-C runtime's class_t / method_list_t / property_list_t layouts (objc4 objc-runtime-new.h)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a swift class method in a stripped app is named vtable#N.method|a swift property accessor prints as vtable#N.getter or vtable#N.setter|a call on a swift class instance prints the slot number instead of the method"
