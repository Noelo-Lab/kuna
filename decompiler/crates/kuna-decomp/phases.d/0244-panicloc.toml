[[settable]]
option = "panicloc"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-panicloc"
summary = "Rust images only (the pass is registered for a rustc-detected image and inert everywhere else): type and name the panic `Location` records. Every panic site passes `&'static core::panic::Location { file: &str, line: u32, col: u32 }`, which rustc emits in read-only data, so a bounds check read `panic_bounds_check(a2,a1,0x51150)`. A record is recognized by shape: the file pointer (the R_*_RELATIVE addend on a PIE) reaches read-only text of 1..=0x1000 bytes ending in `.rs` (a trailing NUL counted in the length, as rustc 1.89 emits, is dropped), 1 <= line <= 0xffffff and 1 <= col <= 0xfff (columns are 1-based). Each record becomes a data symbol typed `core::panic::Location` (the `&str` file field included) and named after its position (`panic_loc_src_main_rs_10_5`), and the file name becomes a bounded string of exact length."
use_when = "On by default for Rust binaries: panic and bounds-check calls show the source position they report. Turn it off to see the raw record addresses."
example = "option panicloc off"
source_decompiler = "kuna"
inspiration = "core::panic::Location's layout in the Rust standard library: a &str file name followed by a u32 line and a u32 column"
change_kind = "type-inference"
tier = "analysis"
symptoms = "a rust panic call passes a bare address as its last argument|panic_bounds_check shows a hex constant instead of a source location|rust unwrap_failed or expect_failed location argument is an unnamed address"
live_field = "analysis_panicloc"
live_true = "on"
live_false = "off"
