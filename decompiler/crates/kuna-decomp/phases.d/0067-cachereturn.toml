[[settable]]
option = "cachereturn"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "kuna-cachereturn"
summary = "On a Swift image, return the value of a function's cache cell. A lazy accessor reads a memory cell, returns what it found when it is set, and otherwise computes the value, stores it into the cell and returns it: `void *get(void) { void *v = g; if (v) return v; v = make(); g = v; return v; }` (clang -O2 arm64 `ldr x0,[x19]; cbnz x0,L; bl make; str x0,[x19]; L: ret`). At the RETURN the return register is the cell's load on one path and the value stored into the cell on the other; upstream's ancestorOpUse refuses both, because the load is also branched on and the stored value is also stored, so the function is recovered `void` and every caller reads a result it does not have. With this on and the image's source language Swift (the sourcelang fact), ActionReturnRecovery takes the return trial in the model's first output register when, at every live RETURN, each value reaching it through MULTIEQUAL, COPY and an INDIRECT that does not create it is either a LOAD of the cell or a call's result that a STORE writes into the cell, at least one of each, every access of the trial's size and through one pointer that is not addressed from the stack pointer (the same Varnode once copies are stripped, the same constant, or the same INT_ADD/PTRSUB/PTRADD of such pointers). A cell behind a parameter counts (`*slot`). A value updated in place (`x = *p; if (x) *p = x - n;`) and a register spilled to and reloaded from the stack are not a cache. A prototype that locks the output is left alone. Swift's lazy protocol-witness-table accessors, its type-metadata caches and the mangled-name type cache `__swift_instantiateConcreteTypeFromMangledName` are this shape: 32 of 300 random functions of a stripped Swift app printed `void` with `if (dat) return;`."
use_when = "On (default); it acts only on an image whose source language is Swift, where the code is LLVM-compiled and LLVM tests a `void` function's cell in a scratch register (`ldr x8,[g]`), which does not match. Elsewhere the bytes cannot tell the accessor from a `void` initializer: gcc AArch64, clang ARM32 and gcc MIPS compile `void init(void) { if (!g) g = make(); }` to the accessor's exact bytes (gcc -O2 AArch64 bash and coreutils: 10 of the 11 functions the rule would change are `void`), so a C, Go or Rust image is left alone. Force `option sourcelang swift` on a Swift binary whose language signals were stripped. x86-64 reads a global straight from its address (a COPY, not a LOAD), so x86-64 accessors of a global keep upstream's reading. Flip off to read every such function as upstream does."
example = "option cachereturn off"
source_decompiler = "kuna"
inspiration = "Perplexity iOS 26.46: Swift lazy witness-table accessors and the mangled-name type cache printed void while every caller used the result; upstream ActionReturnRecovery (coreaction.cc:1954) and Funcdata::ancestorOpUse (funcdata_varnode.cc)"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a lazy accessor prints void with if (dat) return; although it returns the cached value|a Swift lazy protocol witness table accessor returns void|callers assign the result of a function printed void|a Swift function that returns a global it tests and sets prints void"
live_field = "cache_return"
live_true = "on"
live_false = "off"
