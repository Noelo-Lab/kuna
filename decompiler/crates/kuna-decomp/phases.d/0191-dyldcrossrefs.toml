[[settable]]
option = "dyldcrossrefs"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "environment-binding"
strength = "HARD"
rewind = "P1"
issue = "kuna-apple-dyldcache"
summary = "Name the calls and GOT loads a dyld shared cache image makes into other images. The cache builder routes most cross-image calls past the image's own stubs: on iOS 16 a bl lands on a stub island in a __TEXT_STUBS sub-cache (adrp x16; add x16; br x16 to the callee), on iOS 14 on another image's rewritten stub, and within branch range on the callee itself. It also coalesces __got sections and drops their indirect-symbol entries. None of those targets is inside the rebuilt image, so a call renders as sub_<island address>(...) and a load through a coalesced slot names nothing. When the image is rebuilt, kuna finds every branch target outside it and every coalesced GOT slot pointing outside it. It follows a stub (adrp/add/ldr then br, braa or braaz) to its final target and names that target from the symbol table of the image holding it: exports first, then the locals in the .symbols file. The table rides in the rebuilt Mach-O as a kuna.dyld.xrefs LC_NOTE, and the Mach-O import walk reads it back, so each island becomes a named import stub and each slot a named import slot. Read inside `load file`, so the gate travels as the KUNA_DYLDCROSSREFS environment variable. Inert on every input that is not a rebuilt cache image."
use_when = "Leave on: CoreFoundation's 9,136 calls into stub islands render as __stack_chk_fail(), os_unfair_lock_lock_with_options(...) instead of sub_18c99b570(). Turn off to see the raw island addresses, for example to check a call against the cache's island layout."
example = "option dyldcrossrefs off"
source_decompiler = "kuna"
inspiration = "dyld_cache_format.h DYLD_CACHE_MAPPING_TEXT_STUBS; Ghidra's DyldCacheExtractLoader, which maps the TEXT_STUBS mappings into the program so islands decompile as thunks"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "calls in a dyld shared cache image render as sub_<addr> into a __TEXT_STUBS island|a cache image's __got loads name nothing|cross-library calls of an ios framework have no names"
