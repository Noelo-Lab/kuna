[[settable]]
option = "returndup"
values = "off|on|record|auto|calls"
default = "auto"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ReturnDuplicatorHigh"
summary = "Before the final block structuring, duplicate a SHARED bare-epilogue RETURN block into each of its predecessors but one, so the classic guard shape `if (cond) { body; return X; } return Y;` -- which gcc -O0 compiles to a single multi-predecessor RETURN block -- structures as per-predecessor early returns instead of ONE merged, comma-folded exit. kuna (like upstream Ghidra) otherwise keeps the merged form: CollapseStructure::rule_block_or fuses the guards (which share the epilogue out-target) into one short-circuit condition with comma-expression side effects (e.g. `if ((A||B) && (v=f(..), C||D)) { rest }`), and the existing ActionReturnSplit (the goto-driven ReturnDuplicatorLow analog) only splits when structuring left a goto into the return -- which the clean guard collapse never does. This is the gotoless complement: it reuses the SAME `return_split_is_splittable` filter (only MULTIEQUAL/COPY/RETURN over constant/annotation/non-free inputs -- a side-effect-free epilogue, angr's `_is_simple_return_graph`) and the SAME `node_split` machinery ActionReturnSplit drives, splitting every in-edge but one. Mirrors angr SAILR `ReturnDuplicatorHigh` (the gotoless return duplicator). SELECTIVE like angr: it duplicates ONLY when the shared return returns a CONSTANT (or a phi/COPY chain resolving to constants) -- angr's `_should_duplicate_dst = dst_is_const_ret`. A `return <variable>` shared block is left merged (the unselective version diverged from the source's short-circuit form often enough to regress the decbench GED-perfect count ~976 across 21768 firings, which reverted DIV-18; the const-return gate drops ~40-60% of firings -- the over-eager variable-return splits -- while keeping the guard-clause wins like coreutils factor, and it is what turned the aggregate measurement positive again for DIV-54). It declines the split whose shared RETURN block is the out-target two guards must keep in common for `rule_block_or` to fuse them (the operand chain of a short-circuit expression), so `return a || (b && c);` stays one condition instead of a cascade of constant-return guards. The value `calls` keeps all of that and also splits a cross-jumped call tail: a block that ends in one direct CALL and a RETURN, has two to four distinct predecessors and at most 16 ops, and whose call takes an argument computed from a MULTIEQUAL in the block (gcc -Os shares one `call f; ret` between paths that set different arguments). Funcdata::node_split_calls clones the block for one in-edge, gives the cloned call its own copy of the call spec and points cloned INDIRECTs at the cloned call, so `if (c) { a = b; k = 2; } return f(a, k);` prints as one call per path. A second call, a computed call, or an INDIRECT that still creates the call's output leaves the block alone. The value `auto` (the default; `calls` includes it) keeps all of `on` and adds a referee in functions the per-function detector p3_dataflow/kuna_unoptimized.rs calls unoptimized: an unoptimizing compiler compiles every source `return` into code of its own (the value set into the return register, then a jump into the one epilogue, or a fall into it), so the raw block graph records which predecessors of the epilogue came through the same `return` statement. p8_structure/kuna_o0returns.rs reads that at the first heritage pass, before simplification empties those blocks, and tags each epilogue in-edge (and each in-edge of a predecessor that only computes the returned value) with its statement in a high bit field of the edge label, which survives the removal of an empty block. The epilogue is one statement when it computes the return register itself (`mov eax, 0` before `leave`); a predecessor with no store and no call is one statement for everything that reaches it; in a void function, where `return;` is a `nop` and a jump, a jump-only predecessor entered on its `nop` is one, and otherwise paths that land on the same instruction (or on a run of `nop`s that falls into the same one) share one. At returndup time Funcdata::returndup_apply first gives every recorded statement its own copy of the epilogue and no more (constant or not), then the heuristics -- the const-return gate, the short-circuit gate, rettriangle, earlyreturn, switchreturn -- skip the recorded blocks, and tailform leaves the tails the record placed (it still nests no-return tails, and prints `if (c) { S; return; } return;` as the guard `if (!c) return; S;`). `-O0` compiles `return c ? a : b;` exactly like `if (c) return a; return b;`, and this prints the second. In optimized functions (not flagged by the detector, and not addressing their frame through a frame pointer, which small `-O0` functions the detector misses do) `auto` re-spells two return shapes the binary's return layout decides (p8_structure/kuna_retshape.rs). Adjacent guards whose arms print the same bare return, `if (a) return K; if (b) return K;`, fold on the final tree into one guard `if (a || b) return K;` when the later test prints nothing in front of it, except when both tests call something and K is void or a constant (sources check one call's result per guard); the condition leaves keep their own polarity, so it is the same program. And a shared return of a value the arms merge, `if (c) v = f(); else { ...; v = -1; } return v;`, gets one return per arm: the return block (spliced first with a block that only runs into it, the join a stripped stack-protector check leaves) may compute the value from the phi of its in-edges by casts and extensions and hold the return's own `glob = glob` guard copies, nothing else, and every in-edge must end an arm (one out-edge) entered from one place, from one `if`, or from one short-circuit chain (`kuna_orchain`'s fold replay), or the two in-edges must be a one-block `if` whose arm does not read the value the branch carries (not the update `if (c) v += k;`); an arm with any other several entries keeps the merge, because its own return would need a `goto`. The split is the same `node_split` the constant duplication uses. `record` is `auto` without the optimized-function shapes (the default before them). `on` restores the heuristics everywhere."
use_when = "On by default (DIV-54), which SUPERSEDES the DIV-18 revert. It recovers the source early-return shape: where kuna/upstream Ghidra collapse two-or-more source early-return guards that share a compiled epilogue into ONE giant short-circuit `if` with comma side effects and a single trailing return, returndup duplicates the shared bare-epilogue RETURN block (<= 16 predecessors, <= 64 splits/function) into each predecessor so the structurer emits separate `if (c) return X;` clauses matching the source and angr (coreutils factor: kuna 3 ifs / 0 early returns -> 4 ifs / early returns, GED 12 -> 0; also closes the ghidra-beats-kuna bash compspec_dispose shape). Bounded and side-effect-safe (the splittable filter admits only a return-only block, so no call/store is ever cloned), each duplication logged (`returndup:`). It shipped default-ON once before and was reverted 2026-07-05 at -976 GED-perfect; that measurement predates the const-return gate, and the SELECTIVE pass re-ablated on the same corpus (536 slices / 52,862 functions) is +417 GED-perfect and -7,756 aggregate GED, net-positive in all nine partitions tested (split count, void vs value return, distinct return values, return count, switch, all-returns-identical, body size, project, opt level). Still a RUNTIME CHOICE: flip OFF (`option returndup off`, byte-identical to upstream) per function where the source plainly used the merged short-circuit form -- the same object code is emitted either way, so the binary cannot distinguish them. The one measured net-negative subpopulation is a split that de-structures a loop (321 firings, -257 GED); a gate for it was built and scored at +2 perfect / -209 GED and NOT kept. Set `calls` when -Os code shows `if (c) { a = b; k = 2; } return f(a, k);` where the source called f on each path. It is not the default because the source often wrote the merged form itself, as a ternary argument (`lua_pushstring(L, isint ? \"integer\" : \"float\")`), which the single call matches better. `auto` (the default) applies only where the code is unoptimized; measured against `on` on the decbench corpus it makes 1,670 more O0 functions structurally exact and 125 fewer (+1,545; +862 on one half of the projects, +683 on the other), changes 7 of 35,197 O2-noinline bodies (+1), and at O0 function tails where exactly one form matches the source it prints the matching form 98% of the time where the 4-line size rule does 73%; set `on` to get the size-rule and const-gate shapes back in an unoptimized function whose source wrote `return c ? a : b;`. In optimized functions `auto` folds adjacent guards into one `||` guard and returns in each arm of a merged return; measured against `record` in the same build on the decbench corpus (main fb88f5865) it makes 305 more O2-noinline functions structurally exact and 23 fewer (+282; +204 on one half of the projects, +78 on the other) and 61 more and 8 fewer at O0 (functions the unoptimized detector misses); one function gains a `goto`, through loopcondhoist's per-structuring goto check. The losses are sources that wrote the other form (a ternary, a result variable assigned in each arm and returned once, separate guards each checking a call). Set `record` to get the binary's guards and merged returns back."
example = "option returndup on"
source_decompiler = "angr"
inspiration = "decbench:O0-coreutils-factor-factor; gcc -O0 return-statement layout (one epilogue, one value-setting block per return); O0-e2fsprogs-e2fsck-ext4_fc_handle_add_extent; ReturnDuplicatorHigh; return_duplicator_base (angr/analyses/decompiler/optimization_passes/return_duplicator_{high,base}.py)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "giant short-circuit if with comma-expression side effects merging several source early-return guards|one trailing return shared by many guard paths where the source used per-guard early returns|merged guard condition containing v = f(...) assignments inline|if (c) x = a; else x = b; return f(x); where the source called f on each path|the compiler shared one call block between two paths and the arguments became a merged variable|-O0 function prints if (c) { S } return K; where the source wrote if (!c) return K; S; return K;|-O0 void function nests its body under a negated test where the source had if (c) return;|if (a) return 0; if (b) return 0; where the source tests a or b in one guard|if (c) v = f(); else v = g(); return v; where the source returns in each arm|one guard joining two tests where the source checked each in a guard of its own|a return in each arm where the source assigned one result variable and returned it once"
