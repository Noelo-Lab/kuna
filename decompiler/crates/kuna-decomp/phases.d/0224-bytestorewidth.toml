[[settable]]
option = "bytestorewidth"
values = "on|off"
default = "off"
destructive = false
phase = "P3"
subphase = "simplification-quiescence"
strength = "HARD"
rewind = "P3"
issue = "kuna-byte-store-width"
summary = "Keep a constant integer write into a byte array at its native width. Upstream `SplitDatatype` (`RuleSplitCopy`, `RuleSplitStore`) splits a constant COPY or STORE into one write per component of its destination type, which is what turns GCC's inlined `memcpy(buf, \"abc\", 4)` into `buf[0] = 'a'; ... buf[3] = '\\0';` and lets the stack-string recovery join the pieces into `builtin_strncpy`. A 4-byte integer that lands in a byte array printed the same way, as four assignments of its bytes: `v1[1].preceding[0] = 3; v1[1].preceding[1] = 0; v1[1].preceding[2] = 0; v1[1].preceding[3] = 0;` for one `movl $0x3,0x18(%rax)` under a record view whose `char` array covers the field, and the same for a stack record whose leading `char` array a `strncpy` destination typed. With the option on, the write stays one access (`*(unsigned int *)v1[1].preceding = 3;`) when its destination range lies inside one array of one-byte integer or character elements, its bytes are not all equal, and they do not read as text: one is a control character other than NUL, tab, newline and carriage return (`3` is `03 00 00 00`), or a byte above 0x7f is no part of UTF-8 (`0x8000`, `-2`). The constant may also be the `INT_ZEXT` of a constant or the `PIECE` of two. Text, including a UTF-8 character cut at either end of the write, a zero or other one-byte fill, and a write into distinct one-byte record fields still split."
use_when = "Off by default, because byte content cannot tell an integer from a string chunk: `100` and the string tail `\"d\\0\\0\\0\"` are the same bytes. Turn on when an integer that lands in a byte array (a mistyped or shifted record view, a stack record whose integer fields a `char` array swallowed) prints as one assignment per byte, to see the native store. With it on, an integer whose bytes read as text (`100`, `0x20`) still splits, and a stack string whose chunk holds an escape such as `\\x1b` or a Latin-1 byte stays a series of wide stores instead of `builtin_strncpy`."
example = "option bytestorewidth on"
source_decompiler = "kuna"
inspiration = "Ghidra SplitDatatype (subflow.cc RuleSplitCopy/RuleSplitStore); a partial-view return assertion that split one native word store into four byte assignments"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "one native word store prints as four byte assignments into a char array|v1[1].preceding[0] = 3; followed by three = 0 assignments|a stack char array receives byte-by-byte copies of an integer constant"
live_field = "byte_store_width"
live_true = "on"
live_false = "off"
