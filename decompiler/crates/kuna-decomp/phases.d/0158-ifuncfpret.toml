[[settable]]
option = "ifuncfpret"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "interp-bee-ifunc-fpret"
summary = "On an x86-64 ELF, name the IFUNC (R_X86_64_IRELATIVE) .plt.sec/.iplt PLT stubs the symbol-keyed PLT pass leaves undiscovered (an IRELATIVE slot carries no symbol, only its resolver's address), so a tail `jmp` to one is recovered as a tail call (tailcalljump) to a discovered `ifunc_<resolver>` function instead of flowing into the stub and rendering `(*dat_...)(...)`. Loader-tier: read via the kuna_ifuncfpret env var (the PLT->name map is baked at load file). Stage A of the ifuncfpret chain; the FP-return-type recovery (a Ghidra-divergent indirect-tail-return change) is the documented follow-up."
use_when = "On by default: a glibc math/mem/str wrapper (e.g. sub_15620 / log) that tail-jumps to an IFUNC stub names the stub `ifunc_<resolver>` and recovers the tail call instead of rendering `(*dat_...)(...)` with the callee dropped. The names are synthetic -- `ifunc_<resolver>` says which resolver fills the slot, not which implementation it picks -- and the FP return type of such a call is still the follow-up's. Inert on every non-x86-64 image and on an x86-64 ELF with no IRELATIVE relocation. Flip off to leave the stubs unnamed."
example = "option ifuncfpret on"
source_decompiler = "ida"
inspiration = "interp-bee/jit-bee IDA study: f64_log_base @ 0xf090 reads xmm0 uninitialized because log (sub_15620) tail-jumps to an undiscovered IFUNC .plt.sec stub"
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "a glibc math/mem/str wrapper tail-jumps to `(*dat_...)(...)` with the callee dropped|an x86-64 IFUNC .plt.sec stub is not a discovered function|xmm0 read uninitialized after calling a void-typed ifunc-dispatching wrapper"
