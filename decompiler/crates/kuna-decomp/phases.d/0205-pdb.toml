[[settable]]
option = "pdb"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-pdb"
summary = "Run the PE PDB (Program Database) metadata recovery pass: on a Windows PE, recover function names from the external .pdb debug file (the kuna analog of Ghidra's PdbUniversalAnalyzer, name-recovery half). PDB is Windows' DWARF, but the debug info lives in a SEPARATE .pdb file the PE only fingerprints. Read the PE CodeView debug record ({guid|sig, age, .pdb path}), then LOCATE the .pdb through an ordered candidate list: (1) an explicit path in the kuna_pdb_path environment variable (the s1_fid kuna_fid_db external-artifact precedent), (2) the CodeView record's own filename resolved beside the image — the recorded string is build-machine content, so only its last path segment is used and only inside the image's own directory, never opened as a path — and (3) <image stem>.pdb beside the image. Each candidate passes the FINGERPRINT GATE: open it via the `pdb` crate and verify its pdb_information().guid/age matches the PE's CodeView record. The first match wins; a MISMATCH or unreadable candidate moves on (with one stderr line naming it, so a stale sidecar is not silently indistinguishable from no sidecar) and an exhausted list emits nothing — never apply a wrong/stale PDB (the FID full-hash-match discipline of never applying wrong external knowledge). On a match, walk the global symbol stream (S_PUB32 publics + S_GPROC32 procedures), resolve each to its VMA (segment:offset -> RVA + the PE ImageBase), and RENAME each stripped function to its real name — but only when it still carries an engine FUN_*/sub_* placeholder (the label gate, the FID precedent; a real symbol is never overwritten). Registered ONLY for a PE binary, so it is a structural no-op on every non-PE target. NAME-level only (stripped FUN_<addr> -> the real name); typed prototypes, typed stack locals, and source lines are deferred. ENABLED by default (DIV-129): the fingerprint gate makes the automatic search safe by construction, so every /Zi Windows build decompiles with its real names at zero configuration. Real-binary path only, so every parity gate is byte-identical."
use_when = "On by default. A Windows PE built with /Zi (or clang -gcodeview) whose matching .pdb sits beside it recovers its real function names with no configuration; a PE with no .pdb on disk, or with one whose GUID/age does not match, is byte-identical to having the pass off. Set kuna_pdb_path to point at a .pdb that lives somewhere else (a symbol store, a build tree). Flip OFF to see the stripped FUN_<addr>/sub_<addr> names — a bisect, an ablation, or a check that a name came from the binary rather than from the sidecar."
example = "option pdb off"
source_decompiler = "kuna"
inspiration = "Ghidra PdbUniversalAnalyzer (PdbInfoCodeView/PdbInfoDotNet record + pdb2/pdbreader; kuna substitutes the `pdb` crate)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "stripped windows pe functions stay FUN_<addr> although a matching .pdb exists|pdb symbol names not applied to a pe|a .pdb beside the exe is ignored|windows function names need kuna_pdb_path to be set by hand"
