[[settable]]
option = "structheadless"
values = "off|closed"
default = "off"
destructive = false
phase = "P5"
subphase = "aggregate-union"
strength = "HARD"
rewind = "P5"
issue = "typecampaign-structdeep"
summary = "Give a record to a parameter a function reads only past the record's start. `structsynth` requires an access at offset 0 before it believes a pointer points at a record, so a function that reads a record's later members and never its first keeps the pointee it had -- `void *` for a pointer known only by its dereferences -- and every access is a cast of it: coreutils `ls` -O0 `sub_53e7` renders `if ((dat_2b358) && (((char *)a0)[0xb9])) v1 = ((unsigned int *)a0)[0x2b]; else v1 = ((unsigned int *)a0)[0xc];` for `struct fileinfo`'s `linkok`, `linkmode` and `stat.st_mode`, and `statx_to_stat` reads eighteen members of a `struct statx` and none of them `stx_mask` at 0. Over the 45 castbench binaries 1,238 parameters are refused for this reason alone, against 1,716 accepted. With `closed`, a parameter read at two or more constant offsets, none of them zero, is a record when every caller of its function is a known direct call (the `calleevote fields` closed set), nothing outside the function gave the parameter its pointee, and the parameter did not take a type its callers state; every other `structsynth` condition still applies, and so does the one `locals` adds for a partial view (no address formed at or past the end of every access, which would print as an element of a record array), and the bytes before the first access are `undefined1` filler like any hole. The closed condition keeps callbacks out: a `qsort` comparator or a hash-table callback reads members of what it was handed exactly like a record reader, and its declared parameter is `void *`. Against DWARF the headless parameters of closed functions are 883 struct pointers, no `void *`, two `char **` and three integers (75 more are -O2 parameters DWARF describes only through an abstract origin); those of functions whose address is stored are 202 struct pointers and 53 `void *`. A function whose main loop ends on the propagation pass that first typed it is never offered to `structsynth`, and a headless record gives the pointer-arithmetic rules nothing to rewrite, so such a function asks for one more pass, as a closed lone field already does. The record never overrides a type from outside the recovery: a headless record is open to `calleevote`'s vote when every caller passes the same `char *`, `char **` or declared record (coreutils `tail`'s `parse_obsolete_option` reads only `argv[1]` and `argv[2]` and keeps the `char **` `main` passes), a callee's synthesized record never replaces a pointer a declared call gives the caller's value (`getgrnam`'s `group *`, `getopt_long`'s `char **argv`), a headless record that types as a word a member the function reads through is refused as a vote, and a headless record the caller's own reads refuse falls back to the `void *` the callee states without it. Measured on main c960fb18d (castimplied, castarith, castsign and globalref on) over the 45 castbench binaries, both arms of one build: casts on the 4,815 functions kuna and IDA share fall 37,477 -> 36,040 (0.991 -> 0.953 times IDA; 219 functions fewer, 57 more, 36 of them where `globalref` stops naming a constant address because the function now passes it as a record and as another pointer, or reads a member of it directly), the 444-slice typesweep keeps 1,615 perfect (1 improved, 2 worse, none lost), the decbench#93 credited replay rises 2,188 -> 2,313 perfect, per-parameter layout recall rises 0.0932 -> 0.1131, and fields-only layout precision falls 0.8713 -> 0.8298 on the published instrument (0.9594 -> 0.9526 with embedded records, arrays of records and unions flattened in the ground truth). That fall, and the two worse rows, are why it ships off."
use_when = "Default OFF. Flip it on when a stripped function reads one pointer at several fixed offsets and the listing is a run of `((unsigned int *)a0)[0x2b]` or `*(unsigned int *)((long)a0 + 0xac)` over a `void *` parameter -- the offsets are all past the start, so `structsynth` never took it -- and you want the reads as `a0->field_0xac`; it removes about 4% of the casts kuna prints on coreutils, grep, gzip, diffutils, tar and findutils. It acts only on a parameter of a function every caller of which is a known direct call in a whole-binary `decompile-all`/`decompile-project` run on x86-64 (the `calleevote fields` closed set), so it is inert under `kuna decompile`, a `--jobs` worker, `calleevote off`, and every other architecture, and only where `structsynth` fires. The record's first bytes are `undefined1` filler, so the exported header declares whatever the program has there as raw bytes. Leave it off when you need one `struct_N` per program object: a function that reads only part of a record mints its own partial view where it used to inherit the record its callers carry or had none, so one object can carry several names, each declaring only the members its reader measured (tar's `tar_stat_info` goes from one name over nine functions to five), and a local that holds a member's address can take the member's type instead of a declared one (gnulib `fts_stat` holds the address of its embedded `struct stat` as `unsigned long *` and casts it to `stat *` at `fstatat`). Leave it off too for an API whose opaque handle is a `void *` the function casts inside: bzip2's `BZ2_bzReadClose` takes `BZFILE *`, which is `void`, and gets a record the metric scores as a miss."
example = "option structheadless closed"
source_decompiler = "kuna"
inspiration = "The cast census (the casts kuna prints against IDA over 4,815 address-matched functions): 1,080 `*(T *)((long)p + K)` sites sit on a `void *` base, and structsynth's offset-0 condition declines 49 of those bases in closed functions. angr's `simple_solver.py` struct branch takes any set of constant offsets as a record; kuna keeps its own precision gates and adds the closed-caller condition `calleevote fields` introduced for lone fields."
change_kind = "structure-recovery"
tier = "transform"
symptoms = "a parameter is declared `void *` and every read of it is `((T *)a0)[K]` or `*(T *)((long)a0 + K)` with no read at offset 0|a function reads a record's later members and the listing shows a cast per access|`statx_to_stat` or a `fileinfo` accessor renders as casts of an untyped pointer|a record reader keeps `void *` while a sibling that reads the first member gets `struct_N *`"
