[[settable]]
option = "swifttypes"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-swifttypes"
summary = "The type-layout arm of the Swift metadata pass (inert unless swiftmetadata is on): a non-generic type whose metadata needs no runtime initialization has it laid out statically, and its accessor is the one-line function that returns the address (adrp/add on arm64, lea on x86-64; a class with Objective-C heritage tail-calls the runtime with the same address). From that metadata the pass reads a struct's size and alignment (its value witness table, or the builtin table an import names) and its 32-bit field offset vector, a class's instance size and pointer-sized field offset vector; from the reflection field descriptor each stored property's name and mangled type, whose symbolic references the descriptor table resolves. The result is one kuna struct per type under its dotted name (Module.Point { long x; long y; }; a class as its object layout, a local superclass embedded as super, an imported one leaving the isa word) with field types mapped from the Swift type (Int/UInt/Double/Float/Bool and their sized forms, Swift.String as its two words, a class reference as a pointer to that class's struct, a nested struct inline, a collection as its storage word, a closure as its two words) and undefined<n> for any other (an enum, an imported value type, a generic instantiation) over the bytes up to the next field. Also typed: the metadata records (….type_metadata / ….class_metadata, ….value_witness_table), the accessors (swift.type_metadata *Module.Type.type_metadata_accessor(long request)), and the self of every class vtable getter and local-protocol witness getter (Class ** for a class witness, Class * under a class-bound protocol), which Swift passes in the swiftself register (x20 / r13) that no calling-convention model describes - pinned on the function as a register-locked parameter, the rest of the signature recovered as usual. The result of every call to a function named as an accessor (`Module.Type.type_metadata_accessor`: a local one this arm gave no prototype, generic or runtime-initialized, or an imported `…Ma` stub) is typed `swift.type_metadata *` at the call site through the per-site output type lock (`sitetypelock`): an accessor returns the metadata first whatever arguments it takes, and a generic type's accessor takes its generic arguments after the request, which an import's name does not tell, so only the result is locked and the arguments stay recovered; a result that is a register pair or joins another value through a phi is left alone. A read outside the 16-byte record (the value witness table word below it, the field offset vector and generic arguments past it) stays a byte offset under `valuewitness`, so these results are typed only while that option is on. A type whose dotted path two descriptors share, whose field count disagrees with its descriptor, or whose offsets overlap is given no layout. Default-ON because it is inert unless swiftmetadata is on (default-off, but ON in the `aggressive` preset, which `auto` selects for any binary under 500 KiB, so this arm runs with no flags on small Swift binaries) and adds about 0.1 s and 3 MB on an 84 MB app."
use_when = "Off only to see a swiftmetadata-named binary without layouts: fields render as raw offsets, getters take no self, the accessors return undefined16. On (default) when swiftmetadata is on: self->field through the recovered struct, typed metadata records."
example = "option swifttypes off"
source_decompiler = "kuna"
inspiration = "The Swift ABI type metadata layouts (swift/include/swift/ABI/Metadata.h: StructMetadata, ClassMetadata, ValueWitnessTable; docs/ABI/TypeMetadata.rst) and the field-descriptor reader of swift/stdlib/public/RemoteInspection"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "swift struct and class fields render as raw offsets off self|swift getters named by swiftmetadata take no self parameter|type metadata accessors return undefined16|long v = X.type_metadata_accessor(0) where the result is a metadata pointer"
