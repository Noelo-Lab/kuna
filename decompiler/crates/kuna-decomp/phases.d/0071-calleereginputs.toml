[[settable]]
option = "calleereginputs"
values = "off|on|custom"
default = "on"
destructive = false
phase = "P4"
subphase = "prototype-source"
strength = "HARD"
rewind = "P4"
issue = "GH-1558"
summary = "On x86-32 Windows (`x86win.cspec`, whose default `__stdcall` model has no register parameters), give a direct call with no declared prototype the spec's own `__thiscall` model when its callee reads ECX before writing it, and `__fastcall` when it reads ECX and EDX. Without it a `this` passed in ECX is dropped at every such call, the computation that set ECX disappears, and the caller's stores for its own locals are offered to the callee as stack arguments in its place: a constructor run on one local is handed another local's fields. Flow decodes the callee's opening straight line when it builds the call spec (through `jmp` stubs, never an import, at most 64 instructions, ending at a conditional branch, call or return; cached per callee). A register counts only when it is read before any part of it is written: `mov cx,[eax+0xa]` then `mov esi,ecx` reads none. A push that saves a register, a copy onto itself (`mov edi,edi`, `lea ecx,[ecx]`) and a result the old value cannot change (`xor ecx,ecx`, `or ecx,-1`) are not reads. A callee that also reads EAX, EBX, ESI or EDI keeps the default: that is a convention no spec model states (Borland `register`, an MSVC whole-program custom convention, `_chkstk`) or a routine capturing every register (`__report_gsfailure`, `_invoke_watson`). A register the callee reads is an argument whatever the caller's data flow says, so it never costs the call its stack arguments: its trial is active (a register the caller never wrote passes the caller's own value through), it does not end the argument list in front of the stack slots, its use does not count against another call taking the same value, and where the function's stack solution rests on a guessed pop the call-site alias test passes over these operands as it did while they were dead. An indirect call that is MSVC's virtual dispatch (`mov eax,[ecx]; call [eax+k]`, ECX unchanged between the vtable load and the call, and no other call since the object was taken from ECX) takes `__thiscall` as well, unless its last push stores the object (ECX or a register holding the same value), which is a COM method's `__stdcall` interface argument, or it stores the object at `[esp+4]` (GCC before 4.7 passes a member function's `this` on the stack, behind the hidden pointer of a returned class), or the caller cleans up after it (`add esp,4`: a C table of `__cdecl` function pointers), or EAX also holds the object (Delphi `register`); its ECX then has a read register's standing. Inert on every other target and compiler spec. The `custom` value also recovers the callee-saved registers EBX, ESI and EDI as custom arguments, on a whole-binary callee-first run (`decompile-all`, `decompile-project`), where both halves of a two-sided rule hold. The callee half: its own body reads the register's entry value before writing it, by the post-heritage entry reads `passthrough` records (a value read past the first branch, or pushed to a sub-call and compared after it; a prologue save or a plain store does not count), and it reads neither ECX nor EDX (such a callee keeps the `__thiscall`/`__fastcall` resolution above). The caller half: every direct call site in the image writes every such register in the call's own basic block before the call, by a recursive-descent decode of the callers (never a value an earlier call left behind, never a write a branch bypasses). A callee whose caller set is not a list of direct calls states nothing: its address is stored as a word in the image or taken in code, it is exported or the entry point, another function branches to it, a call to it comes from no known function or from a site the call graph gives another caller, it is an interior chunk inside another function's extent, or it is a stack-moving CRT helper (`_chkstk`, `__SEH_prolog`). The decided registers lead the parameter list in the order EBX, ESI, EDI, and the callee's own decompile is given the same synthesized model; each decided callee is decompiled again with all its callers, a whole group within a 5% line budget or not at all, so callee and callers agree. A single-function or narrowed run decides nothing (the latter says so on stderr), `decompile-project --stream` and `decompile-graph` warn, and naming `custom` with `--jobs N` is refused. EAX and EDX as custom inputs (the Borland/Delphi EAX,EDX,ECX register convention) are not covered by `custom`."
use_when = "On by default on x86-32 Windows. Flip off to see the calls as the default `__stdcall` model reads them, with no ECX or EDX operand and the pointer a caller loads into ECX left as a dead computation; also flip off when a 32-bit call prints an extra first argument its callee does not take (a callee whose opening code reads ECX for another reason, as obfuscated or hand-written code can, is still given `__thiscall`). Measured base vs default over 224 i386 PEs (MSVC 6 to 2019, MinGW, Delphi, VMProtect and Themida samples, two AutoIt-compiled images, IDA's `win32_remote32.exe`), call by call: about 41,700 calls gain `this` and 2,400 gain ECX and EDX, and a separate reading of the callees' opening code (about 4,600 of them) finds the ECX read in every one it decodes; no call loses a stack argument, and the one call whose stack arguments shrink is a constructor no longer handed a neighbouring local's fields. Where the caller's model says an earlier call clobbered ECX but the compiler knew that callee keeps it (`_chkstk`, an MSVC whole-program leaf), the call passes it as an uninitialized `// ecx` variable. A Delphi image, which is also read under `x86win.cspec`, passes EAX, EDX and ECX: a callee that reads EAX on its opening line keeps the default, and one that does not shows the ECX (and EDX) it reads, in `__fastcall` order. Arguments in other registers (a static function MSVC passes a count in EDI) are not recovered. A 32-bit `/GS` cookie check keeps its argument (`sub_401ee2(v21 ^ (unsigned int)&v10)`) where its pop is the solver's guess, and `msvcstackguard` strips it where its pop is stated. Set `custom` to also recover a callee-saved register argument an MSVC `/O2` static function takes -- a point count in EDI (`sub_437030(a0, a1, a2, a3, a4)` where `mov edi,4` set it), a buffer or object pointer in ESI or EBX -- where every call site in the image sets it and the callee reads it; the register becomes a leading parameter and the callee prints it too. Measured over the corpus above plus 200 more crackme PEs, `custom` against the default `on`: 235 callees in 73 images take a custom register, and an independent reading of the disassembly finds each one read by the callee and set before every one of its 363 calls; no parameter or call argument is lost, and no caller disagrees with its callee. Its cost is the redo of the decided callees with their callers, about 1.5 to 3% more user CPU on an image that decides 25 to 70 callees and under 0.5% on one that decides none; on the one image whose groups outgrow the redo budget, 28 of its 69 decided callees state nothing. It acts only on a serial whole-binary run (`decompile-all`, `decompile-project`), and naming it with `--jobs N` is refused. Leave it `on` (the default) when a callee-saved register the compiler happened to leave live at a call should not read as an argument."
example = "option calleereginputs custom"
source_decompiler = "ida"
inspiration = "Hex-Rays types an un-prototyped x86-32 callee `__thiscall` or `__fastcall` from the registers its body consumes, and a `__usercall` with arguments in other registers; Ghidra's `x86win.cspec` ships the three models (and a `__fastcall/__thiscall/__stdcall` `<resolveprototype>`) but its default stays `__stdcall` and it has no `__usercall`. GH-1558: a VC8 /O2 C++ game whose constructors and stub-called methods lost `this`, and whose static functions MSVC gave a count in EDI, a buffer in EAX or ESI, lost those too."
change_kind = "new-analysis"
tier = "transform"
symptoms = "a 32-bit Windows call prints an extra first argument its callee never reads|a 32-bit Windows constructor or method call prints the caller's locals as its arguments, e.g. sub_401020(a0,a1,0) where the code loads lea ecx,[esp+N]|a method called through a jmp stub prints with no arguments on a 32-bit PE|lea ecx,[...] or mov ecx,esi before a call vanishes from the output|a 32-bit MSVC /O2 static function is called with a count or buffer set in EDI, ESI or EBX that the call drops (set calleereginputs custom)"
