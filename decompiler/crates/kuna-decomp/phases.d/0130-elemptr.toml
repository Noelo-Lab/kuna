[[settable]]
option = "elemptr"
values = "on|off"
default = "on"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "castcampaign-elemptr"
summary = "Declare a pointer-width value the program uses only as an array of one element type as a pointer to that element. `TypeOpIntAdd` votes an integer for both operands of `p + i`, and nothing carries the element type a load through the sum implies back over the add (`typeop.cc:1217`, the refusal `ptrfromuse` documents), so a byte buffer indexed by a computed value reaches the reader as `long` (a parameter, a global read before it is written) or `void *` (what `malloc` returns), and every access prints as `*(char *)((long)v6 + (long)v8)`. When on, `kuna_elemptr::element_pointer` supplies a `T *` vote in the `getLocalType` fold for four kinds of value: a function input the prototype model could place a parameter in; the value a call returns when its callee left the pointee open (`void *`, an allocator), when no phi joins it with anything but a copy of itself or a null; a global the image names nothing at (`dat_<addr>`), decided from every Varnode of the function that holds it; and a constant address inside a section of program data that is the base of an indexed access, which `globalref` then prints as the array it names (`dat_4020[v1]`) and the `decompile-project` header declares `T dat_4020[]`. A bounded breadth-first walk follows the value through COPY/CAST/MULTIEQUAL/INDIRECT and literal offsets and accepts only when every access through it, at any literal offset, is one width W (1, 2, 4 or 8 bytes) landing on a whole element, and at least one index is a value the program computes: scaled by W (`x * W`, `x << log2 W`), or, for W = 1, an unscaled integer. An index is recognised by how it was made -- a scaling, an extension from a narrower integer, a small mask, a shift, a division, a loop counter that starts at a literal and steps by one, a value the program also multiplies, divides, shifts or orders against a literal (not one it masks: `p & 7` tests a pointer's alignment) -- or because the other operand is already a pointer (C adds no two); an operand already typed as a pointer is the base, and an add whose operands could each be the base says nothing. Constant offsets alone never commit: a record's fields stay with `ptrfromuse` and `structsynth`. The element's sign comes only from evidence, since a function that returns the element returns it at that type: the recovered return type, then the extensions, orderings, shifts and divisions of a loaded element when they agree, then (a byte compared against a character literal is plain `char`) the type the load has without the rule; a wider element nothing votes for is unsigned, as an undefined word prints, and a byte plain `char`. An element as wide as a pointer commits only to a pointer type something else names (a loaded value already typed `char *`, a stored `FILE *`, a callee's declared pointee), or to an integer when its uses are only arithmetic: an unnamed `void **` would pre-empt the `char **` argv `calleevote` states on a later decompile. The walk refuses a second width (a record, not an array), an index scaled by something other than the element or itself a multiple of elements (`p[2 * i]`, `p[2 * i + 1]` walk 16-byte records), a non-zero field (`PTRSUB`), integer arithmetic on the pointer, a float, a comparison against a non-zero literal, a call argument declared as a scalar or as a pointer to something of another width, a comparison or difference with a pointer to something of another width, a use as the index of another base (a `PTRADD` index, an add to a constant already typed a pointer; an add that subtracts one more pointer than it adds is a difference, not an element), and a global copied into a register the function returns another value in; it never replaces a type-locked, symbol-seeded or already-named pointer vote. A global, and a constant table, is typed only where every function of a batch agrees on the element, sign included: `decompile-all` and `decompile-project` record what each function said about each (an array of which element, whether evidence or the default chose its sign, or for a global a refusal), block an object two functions' evidence types differently for every function that typed it, and decide again at the evidenced sign a function whose sign was only the default (a function that returns the element keeps its own); the header declares no array two functions index at different elements. A function that holds a global and leaves it untyped refuses it unless nothing it prints depends on the pointee (copied, dereferenced at its own address, stored, passed, returned, compared): `gp++` prints `dat_4018 += 4`, which one `int *dat_4018` declaration would make four elements. A global whose vote already names a pointee (a callee's `char *`) files that pointee as evidence, never as a function to decide again. A function that reads or writes a table's first element by name (`dat_4040 + 1`) blocks every function that named the table an array; one that names it and indexes the table too prints `(&dat_4040)[i]` and keeps its type. A narrow load through a pointee this option supplies keeps its own width in both arms (`*(unsigned short *)&a0[1]`, never the 4-byte `(unsigned short)a0[1]`; chapter 03's `RuleExpandLoad`). Only such a batch -- the callee-first driver, or a single function -- types a global or a table: a `--jobs` worker, the streamed export and a serial run of several functions that is not callee-first type neither, and leave untyped a parameter or call return they store into a global, so a pool prints what `--jobs 1 --option protoorder off` prints. The printer declines a string literal for a table indexed by a computed value unless the index provably stays inside the literal (a zero-extended byte, a mask, an unsigned remainder), because `\"\"[x]` reads bytes the literal does not have; and a character-pointer constant whose type comes from the rule alone -- it reaches a pointer the rule typed, or a callee's parameter the rule typed and stated for its callers, and nothing reads it as a C string, through it a byte at a time directly, or as a declared `char *` argument -- prints as its address, since an index says nothing about where the bytes end (a 15-byte DigestInfo prefix compared by `timingsafe_bcmp` printed as a literal that stopped at its zero byte)."
use_when = "On by default. Turn it off to see the integer spelling upstream prints -- `*(char *)((long)v6 + (long)v8)`, `*(unsigned char *)((long)v1 + 0x4020)` -- or when a consumer matches the older declarations (`long a0` for a byte buffer, `void *` for an allocator's result). Measured with the default on against `--option elemptr off` on one build: 0 of 675 datatest assertions move; 8 stage assertions of other options and 2 `tests/cli` probes pinned the integer spelling and now read the subscript, each the same access, and 3 stage assertions pinned upstream's widened read of a 4-byte field and now read it 4 bytes wide; the 444-slice decbench type sweep goes 1,631 -> 1,674 perfect functions (15.17% -> 15.57%), mean .3717 -> .3752, 189 functions better and none worse, 243 scored variables gained and none lost, no function's variable or argument count moved; over the 45-binary castbench corpus casts fall 33,289 -> 32,073 on the 4,815 functions kuna and IDA both emit, measured on a main that already has `castindex`, `castternary`, `callrettype`, `castobject` and `castwiden` (0.880x -> 0.848x IDA, 176.0 -> 169.6 per 1,000 lines), 301 functions with fewer and 18 with more (+26, a callee now declaring `char *` making a caller's integer argument print its conversion, a constant used at two pointee types, or a narrow read respelled); the `off` arm is byte-identical to main. Speed, interleaved min-of-15 whole-binary on main `f96e80805`: fmt +0.03%, ls +0.25%, sort +0.36%, bash +1.81%. A global or a table is typed only by a batch that agrees on it (a callee-first `decompile-all` or `decompile-project`, or one function); `--jobs N`, `--stream` and a serial run of several functions without the callee-first order type neither, which keeps `--jobs N` byte-identical to `--jobs 1` under `--option protoorder off`."
example = "option elemptr on"
source_decompiler = "ida"
inspiration = "IDA Pro prints a textbook base64 decoder's table lookup as `v8 = *((char *)ptr + *(unsigned __int8 *)(a1 + v9));`, its output store as `v26[v12] = BYTE2(v19);` with `v26` typed `_BYTE *`, and the table build as `*((_BYTE *)ptr + byte_5020[i]) = i;`: the element type comes from the access, and a constant table read with a computed index is a named array. kuna printed the same function with every one of those as an integer sum behind two casts."
change_kind = "type-inference"
tier = "transform"
symptoms = "a buffer indexed one byte at a time prints as *(char *)((long)v6 + (long)v8)|a parameter only ever indexed is declared long|malloc's result is declared void * and every store through it casts|a table in .data read with a computed index prints as *(unsigned char *)((long)v1 + 0x4020)|argv-like parameters are declared long and each element is cast to char *"
live_field = "elem_ptr"
live_true = "on"
live_false = "off"
