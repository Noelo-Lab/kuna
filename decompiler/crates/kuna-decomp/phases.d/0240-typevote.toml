[[settable]]
option = "typevote"
values = "on|off"
default = "on"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "kuna-typevote"
summary = "Type a variable the type passes leave undefinedN by a vote over the ops that write and read it, once every variable is final. Logical shifts and zero extension vote unsigned; arithmetic shifts, sign extension and signed compares vote signed; a copy from or to an integer-typed value votes its signedness; other integer ops vote numeric (int on a tie, the C default); float ops vote float. A returned value is not voted and a parameter takes only an unsigned vote, so no signature changes; a piece of a union keeps its type. Merge copies added after type inference start untyped, so an unsigned int parameter printed (unsigned int)a1 at each read."
use_when = "On (default). Flip off to see which values type inference left undefined."
example = "option typevote off"
source_decompiler = "kuna"
inspiration = "C's usual arithmetic rules: an operation that only makes sense signed or unsigned says which its operand is"
change_kind = "presentation-default"
tier = "transform"
symptoms = "a variable declared undefined4/undefined8 although it is shifted, masked or compared|a cast back to a variable's own declared type at each read"
live_field = "type_vote"
live_true = "on"
live_false = "off"
