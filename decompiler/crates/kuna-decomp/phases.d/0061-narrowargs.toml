[[settable]]
option = "narrowargs"
values = "off|on|callers"
default = "callers"
destructive = false
phase = "P4"
subphase = "own-input-prototype-recovery"
strength = "HARD"
rewind = "P4"
issue = "ty17-narrow-register-parameters"
summary = "Declare a register parameter at the narrow width its body actually reads. An ARM AAPCS or x86-64 caller passes a `uint8_t`, a `short` or an `int` in a whole register, so a callee that computes with the register at full width (`and.w r2, r1, #7`, `mov %edi,%eax` beside a forwarded `%rdi`) keeps the input Varnode register-wide and recovers `unsigned int` or `unsigned long`. `ActionDeadCode` knows which bits of every register input any use can observe. Once `mainloop` settles, `fullloop`'s dead-code pass looks at each input that is a whole integer argument register of the model: when those bits all lie in its low 1, 2 or 4 bytes and reach that part's top bit, the input is replaced by that low part, zero-extended back to the register at the function entry. Every use then reads the same bits it read before, so every value the function computes is unchanged, and `ActionInputPrototype` recovers the parameter at the narrow width. In the callee-first `decompile-all` run, the narrow parameter a callee states through `protoorder` caps the bytes `ActionDeadCode::markConsumedParameters` treats as consumed at each call to it (`FuncCallSpecs::getInputBytesConsumed`), so a caller that only forwards its own parameter there narrows too. A left shift (`priority << 24`, `(a0 ^ 0x8000) << 0x10`, a multiply by a multiple of 256) and a register shift amount (ARM's `lsl r6, r7, lr` reads `lr & 0xff`) are not evidence about the value, and a mask that stops below the part's top bit (`flags & 0x10`, `x & 7`) is as often an `int` of flags as a narrow value, so none of them narrows. With `callers` (the default) a whole-binary `decompile-all` of a 32-bit ARM image also narrows a parameter from its call sites, because the AAPCS has the CALLER extend a `uint8_t`, `int16_t` or `_Bool` argument and the callee body then holds no evidence of it. After the first pass, a function whose callers kuna can list (no loaded value at any byte offset is its address or a self-relative offset to it, no dynamic relocation targets it, no `movw`/`movt` pair, `adr` or PIC `ldr`/`add pc` builds it, no decompiled body holds it as a constant or resolves an indirect call or branch to it, it is exported nowhere, and the calls and tail jumps decompiled as calls are exactly the instructions that branch to it; an image with Android packed relocations closes nothing) is decompiled again with a register parameter replaced by its low 1 or 2 bytes, zero- or sign-extended back at the entry, when every call passes a value that fits (its nonzero bits, a sign extension, a constant) and at least one caller extended the value itself (`uxtb`, `sxth`, a mask by exactly `0xff` or `0xffff`); a parameter every call passes 0 or 1, one of them computed, becomes `bool`. A caller passing a wider value, a sign and a zero extension, or a function reached any other way keeps the register-wide parameter. The redo pass reprints at most 5% of the lines the first pass printed (a function of at most 32 lines always fits). Unseen: a table of offsets relative to the table or another function, read through an index kuna cannot resolve (hand-written assembly; C compilers do not emit one on 32-bit ARM)."
use_when = "On by default. The tell it fixes is a `uint8_t` or `uint16_t` parameter printed as `unsigned int` on ARM firmware, or an `int` printed as `unsigned long` on x86-64, whose every use reads only its low bytes (`a1 & 0xff`, two byte stores of `a1` and `a1 >> 8`, `(unsigned int)a0`). Set it off to get the register-wide parameter back, or when a parameter the source declares `int` (a byte written through `*p = c`, a 32-bit `len` passed as a `size_t`) should keep its source width; the C is the same value either way. Callers of a narrowed callee may print a narrower argument expression (`(unsigned char)(v2 + 5)` for `v2 + 5`): the callee reads only those bytes. Measured against `off` with decbench's published type_match: 96 ARM firmware slices 2,505 -> 2,631 perfect functions (mean .2287 -> .2366, 19 functions off a perfect score), the 444-slice x86-64 campaign set 1,664 -> 1,683 (none off), the 96-binary nightly optimized sample 1,517 -> 1,597; every function that leaves a perfect score declares an `int` or enum the body reads one byte or one word of. `callers` (the default) also fixes a 32-bit ARM `uint8_t`, `int16_t` or `_Bool` parameter printed `unsigned int` or `int` although every caller extends what it passes (`uxtb r1, r4; bl f`); set `on` to keep only the body rule when such a parameter is an `int` or a short enum in the source (every caller passing a byte cannot tell the two apart). Measured against `on` with decbench's published type_match: 96 ARM firmware slices 3,279 -> 3,351 perfect functions (115 onto a perfect score, 43 off: `int` flags every caller passes a truth value, short enums), 23 mostly-Thumb slices 1,055 -> 1,086; the x86-64 sets do not move."
example = "option narrowargs on"
source_decompiler = "kuna"
inspiration = "decbench type_match census of ARM firmware (betaflight, crazyflie, cleanflight): `uint8_t`/`uint16_t`/`_Bool` parameters typed at register width; upstream `FuncCallSpecs::getInputBytesConsumed` (fspec.cc:5877) is the consumed-bytes channel this fills from recovered callee prototypes"
change_kind = "type-inference"
tier = "transform"
symptoms = "a uint8_t parameter prints as unsigned int and is only ever used as a1 & 0xff or (char)a1|an int parameter prints as unsigned long on x86-64 and is used as (unsigned int)a0|a caller passes v + 5 to a callee whose parameter is a byte and another caller passes v - 8 & 0xff"
