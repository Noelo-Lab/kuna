[[settable]]
option = "castwiden"
values = "off|on|literal"
default = "literal"
destructive = false
phase = "P9"
subphase = "cast-policy"
strength = "HARD"
rewind = "P9"
issue = "kuna-castwiden"
summary = "Leave out a 64-bit widening that C's own conversions perform. `CastStrategyC::isExtensionCastImplied` (cast.cc:249) hides an `INT_SEXT`/`INT_ZEXT` only when an arithmetic or comparison op reads it beside an explicit variable of the same metatype, so kuna prints `((long *)a0)[1] + (long)a1`, `v2 % (long)a1` over a structure field, `(long)i * 0xc + 7`, and `v = (unsigned long)i;` into an `unsigned long v`. With `on`, `kuna_castwiden` decides at print time, with the IR unchanged: the widening of an operand of `+ - * / % & | ^` goes when, for every type the other operand may have as printed (a declared variable, a cast that stays, a load through a pointer printed as a declared variable, a cast, a structure field or an element, a literal, or an arithmetic expression over those), the usual arithmetic conversions (C11 6.3.1.8) give the operation the type it had and that type is the cast's own or the cast keeps the operand's value (an integer conversion depends only on the value converted, 6.3.1.3); and the extension is the one C performs on the operand's printed type, a sign-extension of a signed type and a zero-extension of an unsigned one. Of two widened operands only the right one's cast goes, so the survivor keeps the operation 64-bit; one widened value read by both operands (`(long)i * (long)i`) keeps both casts. The bare operand keeps the parentheses the cast gave it (`p[1] + (a1 + a2)`), and beside a chain of its own operator, which the printer writes without parentheses and C regroups (`x + (y + z)` prints `x + y + z`), the left operand's cast goes only when the chain's first leaf would let it go. `castimplied`'s destinations widen too, for a widening to eight bytes of an operand printed as a C integer: a widening that does not keep the value (`(unsigned long)i` of an `int`) goes into a destination declared with exactly its spelling, where the assignment, argument or return conversion is that very conversion (6.5.16.1p2, 6.5.2.2p7, 6.8.6.4p3); a value-keeping one also goes into an 8-byte integer of the other signedness (`memchr(p,c,n)` for an `int n`); and a store through a pointer printed as a declared variable, a cast, a field or an element is a destination like an assignment (`((long *)a0)[1] = a1;`). With `literal`, an operand beside an integer literal goes too, and the literal, an 8-byte constant in the IR that C would type `int`, is printed with the suffix of its width (`L`, or `UL` for an unsigned target) so C converts the other operand itself: `a0 * 0xcL + 7`; a literal whose value the suffix would change (a negated unsigned literal such as `-0x80000000`) keeps the cast. Never touched: comparisons (castsign's domain), a shift's operands, unary minus, a widening beside a signed operand of the other signedness that would change the operation's type (`(unsigned long)c + l` for a `long l`), narrowings, widenings to fewer than eight bytes, float, pointer and bool conversions, varargs positions and untrusted prototypes, and an operand whose printed type is unknown or not the IR's. Only where `int` is 4 bytes, and C output only. On the 45-binary cast corpus casts on the 4,815 functions kuna and IDA both emit go 35,588 -> 34,061 with `literal` (0.941x -> 0.901x IDA; 29.9 -> 28.7 per 100 statements against IDA's 27.0), 481 functions fewer and 0 more; every changed line over 64 binaries (2,341 functions) parses to the same C tree with the removed casts typed from the declarations and each conversion shown to give the same type and value (semhunks.py), and the 444-slice typesweep is identical on all 10,748 functions."
use_when = "`literal` by default: a widening C's usual arithmetic and assignment conversions perform prints no cast (`((long *)a0)[1] + a1`, `v1 = a0;` into an `unsigned long v1`, `((long *)a0)[1] = a1;`), and a widened index or offset beside an 8-byte literal reads `i * 8L + base`, as IDA's `8LL * i + base` does. `on` keeps every literal unsuffixed and only drops the casts that need no literal typed. Set it off to get every widening upstream prints, for example when diffing against Ghidra; the value computed is the same in all three."
example = "option castwiden literal"
source_decompiler = "ida"
inspiration = "The 2026-09-27 widening census over the 45 castbench binaries: of the 2,904 SEXT/ZEXT widenings kuna prints on the 4,815 functions it shares with IDA, 1,640 sit beside an 8-byte literal C types `int` and about 400 beside an operand or destination that already has the cast's type; IDA prints `12LL * j`, `v7[j] - (int)v5` and `*a1 = v2` for the same shapes"
change_kind = "presentation-default"
tier = "transform"
symptoms = "an int widened to long beside a long operand, ((long *)a0)[1] + (long)a1|a widened index times a literal, (long)i * 8 + 0x2b200|v = (unsigned long)i; into a variable already declared unsigned long|a store of (long)i through a long pointer|memchr(p,c,(long)n) for an int n"
