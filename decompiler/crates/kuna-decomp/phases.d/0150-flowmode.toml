[[settable]]
option = "flowmode"
values = "on|aftercall|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-flowmode"
summary = "Paint the ARM decode mode that control flow proves over code the Listing walk left in the other mode. An interworking blx runs a SLEIGH globalset that writes the callee's mode into the context database from the target to the next point where the mode was set explicitly. A stripped image has no such point, so once a caller of a Thumb helper is decoded, every address above the helper reads as Thumb, and an A32 function placed there, called with a plain bl, decompiles as Thumb garbage. On, after the walk, kuna decodes again, without writing any context into the database, the code whose mode the image proves: it starts at an even e_entry and at each even function symbol, keeps the mode across branches and across the fall-through of an instruction that neither calls nor runs a user-defined p-code operation, and takes the mode a call commits at its target (blx switches, bl keeps). It never continues past an unconditional call, because a call can fail to return at its site even when the callee returns elsewhere (f(); __builtin_unreachable(); or a noreturn alias of a function that can return), nor past a user-defined operation such as svc or bkpt, which can raise an exception that does not come back; the bytes after either may be the next function in the other mode. A function is painted only when every instruction it can run is proven: each of its proven instructions whose mode the database disagrees with gets its proven mode at the analysis commit, after every other decode-mode paint. Nothing else changes: the walk, the function inventory and every other address keep what they had. When two proofs give one address different modes, or proven instructions of different modes overlap, nothing is painted. aftercall also continues after an unconditional call once the callee is proven to return; that fixes an A32 function called after a returning Thumb helper (GH-780), but paints the next function in the wrong mode when a call never returns at its site. Off by default, because both values still trust the fall-through of an ordinary instruction and the target of a branch: a function the compiler ends with __builtin_unreachable() after a store or a conditional branch (a noreturn function built at -O0, for one) carries its mode into the next function, which is then painted in the wrong mode. Runs only on an ARM ELF with no mapping symbol, no Thumb function symbol, no Cortex-M vector table, an even e_entry or an even function symbol, and build attributes that allow A32 code, and not under --isa."
use_when = "Off (default) leaves the context database exactly as the walk leaves it. With armwalkmode on (its default) the walk already decodes the code this proves in the mode its flow carries, so this matters with armwalkmode off. Set on for a stripped ARM image that mixes A32 and Thumb code when an A32 function placed after a Thumb helper decompiles as halt_missing or halt_baddata with a warning that flow starts two bytes into an A32 instruction, while --isa arm or --option listing off prints it correctly. on fixes only A32 functions that make no unconditional call and run no svc, bkpt or other user-defined operation. When the broken function is reached only after another call returns, as in a caller that runs blx to a Thumb helper and then bl to an A32 one, set aftercall. Under either value, check that a function placed right after a noreturn function still decompiles as it did with the option off."
example = "--option flowmode aftercall"
source_decompiler = "kuna"
inspiration = "GH-780: in a 136-byte stripped ELF, an A32 entry runs blx 0x2000040 (Thumb) and then bl 0x2000080 (A32); the blx write made 0x2000080 decode as Thumb, so kuna decompile printed halt_missing for a function that returns a0 + 1. Ghidra's disassembler carries the context along the flow it follows instead of reading a database the first blx already flattened."
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "an A32 function after a Thumb helper decompiles as halt_missing in a stripped ARM binary|flow reaches unmapped memory two bytes into an A32 instruction|--isa arm decompiles an ARM function correctly that the default run turns into garbage|a function reached with bl after a blx call decodes in the wrong instruction set|--option listing off fixes the decompilation of an ARM function"
