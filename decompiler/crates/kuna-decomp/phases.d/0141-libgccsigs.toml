[[settable]]
option = "libgccsigs"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "pr-1252-libgcc-divdi3"
summary = "Seed two compiler-runtime contracts: the libgcc DI-mode `long long __divdi3(long long, long long)` onto a SPARC32 big-endian ELF (`sparc:BE:32:default:default`) that names `__divdi3`, defined or imported, and `void __stack_chk_fail_local(void)` onto any ELF that defines that helper at an address no other function name holds. The `__divdi3` widths come from GCC machine modes, not the C data model: it takes two eight-byte operands in %o0:%o1 and %o2:%o3 and returns the eight-byte quotient in %o0:%o1, high word first. Without the contract the caller sees an unknown callee that writes only %o0, so a caller that stores only the low word (`*p = (int)(a / b);`, the `st %o1` after the call) stores a local nothing assigns. With it the call prints `__divdi3(CONCAT44(a0,a1),CONCAT44(a2,a3))` and the stored word is `(int)__divdi3(..)`. A DWARF or explicit `--assert prototype` declaration keeps precedence, a stripped image names no helper and is unchanged, and every other target and helper (`__moddi3`, `__udivdi3`, `__umoddi3`) keeps its inferred contract. GCC's `-fPIC` stack protector on 32-bit PowerPC and x86 links `__stack_chk_fail_local` hidden into each PIE and shared object, where it is no import, so the imports-only `libcsigs` row does not reach it: a PowerPC caller that sets its return value in r3 before the canary test prints `__stack_chk_fail_local(a0 * 3)`, and with the contract `__stack_chk_fail_local()`. Static glibc aliases the helper to `__stack_chk_fail` at one address; that address keeps its inferred contract."
use_when = "Off by default: the locked eight-byte result still costs a caller that RETURNS arithmetic on the quotient. Return recovery keeps a caller's two return words only when each is a bare slice of the call result or a literal and nothing else reads the quotient (`return a / b;`, a quotient kept across a call, a guarded `return -1`), so `return a / b + 1;` prints `int inc(..)` with only the high word, `return -(a / b);` prints `int neg(..)`, and `return f ? a / b : c;` prints `void sel(..)`, dropping both values; with the option off all three return every word (in the first-register-low join `bejoin` leaves without evidence). Of 21 authored caller shapes at clang -O2, 14 lose words that way: +1, +c, negation, abs, `>> 3`, an unsigned `>> 32`, ^c, |c, *c, a sum of two quotients, an accumulation loop, a quotient an argument replaces on one path, a clamp (`if (x > 100) x = 100;`), and the `sel` phi. Turn on for a SPARC32 binary whose callers store or pass the quotient (`*p = (int)(a / b);`, `g(a / b)`) or return it unchanged, where the off output reads an unassigned local; check any `int` or `void` caller that should return a `long long` against the disassembly. The `__stack_chk_fail_local` half also moves more than the argument: over GCC 15 `-fPIC -fstack-protector-strong` PowerPC32 shared objects at -O1 to -O3 and -Os it removes every invented argument (391 calls on the default target, 234 on e500) and gives 240 functions on the default target the return value their source declares, but 43 PLT call stubs (32 on e500) lose an inferred return the argument was the only use of, and at -Os 4 functions lose a parameter whose only use was the argument (`void gather(int a0,unsigned char *a1)` becomes `void gather(int a0)`; e500 `void main(unsigned int a0)` becomes `void main(void)`); on an i386 PIE one function in 141 (`xstrtoimax`) splits a 64-bit local into two 32-bit halves. Turn on for such a PIE or shared object whose calls to `__stack_chk_fail_local` carry an argument."
example = "option libgccsigs on"
source_decompiler = "kuna"
inspiration = "libgcc/compiler-rt `__divdi3` (di_int __divdi3(di_int a, di_int b), di_int = int64_t); Ghidra ApplyDataArchiveAnalyzer"
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "a SPARC32 caller stores the low word of a 64-bit quotient from a local nothing assigns|__divdi3 is called with four 32-bit arguments and only %o0 is read back|*p = v1; after a __divdi3 call where v1 is never written|a PIE or shared object calls __stack_chk_fail_local with an argument (__stack_chk_fail_local(a0 * 3))|a function that returns a value before its stack-protector check is void"
