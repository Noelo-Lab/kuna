[[settable]]
option = "ppc32picimports"
values = "off|on|abi"
default = "off"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "PPC32 secure-PLT caller bases"
summary = "Recover PPC32 secure-PLT imports. on proves terminal calls in the selected caller without global stub names; abi additionally names stubs across compiled functions under explicit compiler and ABI assumptions."
use_when = "Use on for terminal PPC32 helpers: returning paths, unknown calls and unproved writes withhold recovery. Use abi for ordinary compiler-linked libraries or PIEs only when imports preserve SysV nonvolatiles, callbacks target function entries, computed gotos stay within their function, and application code does not overwrite GOT entries or saved registers. abi walks every function and costs about 1.05-1.35x a function listing and up to 2.9x a single-function decompile of a large library. Entering or leaving abi requires reloading the image; the CLI loads with the selected mode. on and off can be toggled live on an image loaded without abi. Default off leaves PIC calls unresolved; the aggressive preset sets abi, so auto applies it to an image under 500 KiB. BSS-PLT and absolute imports are unchanged."
example = "option ppc32picimports on"
source_decompiler = "kuna"
inspiration = "PowerPC 32-bit System V ABI secure-PLT calling convention"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "PPC32 PIC calls retain local linker stub names|a PPC32 PIC no-return call flows into padding|PPC32 PIC imports are missing from named cross-reference queries|every import call in a PPC32 shared library linked with the start files prints as sub_"
