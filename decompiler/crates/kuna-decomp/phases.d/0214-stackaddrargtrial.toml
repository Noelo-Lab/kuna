[[settable]]
option = "stackaddrargtrial"
values = "on|off"
default = "off"
destructive = false
phase = "P4"
subphase = "active-input-trial-scoring"
strength = "HARD"
rewind = "P4"
issue = "kuna-stack-address-argument"
summary = "Retain an existing register argument trial when its value is a same-width copy or constant displacement of a particular stack-pointer value. The provenance walk is bounded to 64 steps and declines phi nodes, unknown bases, width changes, and call-clobbered values. Known dead callee inputs retain their veto. Keeping the pointer lets ordinary call alias handling preserve the local object's output value."
use_when = "Enable when an unprototyped call loses a local output pointer and subsequent loads incorrectly fold to the pre-call initializer. This is evidence of intent, not a declared prototype: a live stack address can also be incidental, so the option is off by default. Supply a prototype when the interface is known."
example = "option stackaddrargtrial on"
source_decompiler = "kuna"
inspiration = "Synthetic ARM caller passing a halfword local across a conditional branch"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "an unprototyped call loses a local output pointer|a post-call word or halfword output folds to its initializer"
live_field = "stack_addr_arg_trial"
live_true = "on"
live_false = "off"
