[[settable]]
option = "switchmerge"
values = "on|off"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P9"
issue = "kuna-switchmerge"
summary = "Print a compiler's search tree of jump tables as the one C `switch` it came from, and leave out the `case N:` labels of jump-table holes. A sparse source switch compiles to several tables on the same selector: each table's range guard sends the values it does not cover to the next table, and its holes go to the source's `default:` code. The structurer nests the tables (`default: switch (v) { ... }`, or a `default:` arm that runs one table's switch and then the next) and prints every hole as `case N: goto label_X;` next to the `default:` arm that reaches the same code. `kuna_switchmerge` plans each C switch's printed arms on the final structured tree: a `default:` arm that starts with a switch on the same selector (same HighVariable, nothing printed before its `switch`, no label on it, no value listed twice, and leaving the way the arm leaves) is replaced by that switch's arms; an inner switch followed by more code in the arm must have no `default:` and no arm that leaves it, and that code stays the `default:` arm. A switch with a table entry that goes straight to its exit is never merged into, because that value would print no label and take the merged `default:`. Then an arm that is only a `goto` to the code `default:` runs prints no labels; when `default:` is that `goto` and another arm holds the code, that arm prints `default:`. An arm that is only a `goto` or a `break;` also prints no labels when the `default:` code reaches its target for each of its values before printing a statement, deciding every test and switch on the selector with the value (an `==` chain or a range test in `default:` that leads to the next table). An `if (v == c) S` with no else at the head of a `default:` arm prints as `case c: S` before it, and an `if (v relop K)` whose two branches are switches on the selector prints as one switch when every value takes its own branch and the two defaults do the same. An arm moves or goes away only when the arm printed before it cannot fall into it, and the goto census places `break;` and labels for the printed switch. C output only."
use_when = "On by default: 0/675 datatest assertions move. Flip off to print each jump table as its own switch and every hole as a `case` label, for example to read the table layout the compiler emitted."
example = "option switchmerge off"
source_decompiler = "kuna"
inspiration = "cmark-gfm `cmark_utf8proc_case_fold` (arm64, Apple clang): 17 nested jump-table switches over one code point with 779 hole labels that all reach the `default:` code; the source is one switch"
change_kind = "presentation-default"
tier = "core"
symptoms = "default: switch(v) { on the same variable as the enclosing switch|many case labels that only goto the code default: runs|one source switch printed as several nested switches|case N: goto label_X; next to default: label_X:"
live_field = "switchmerge"
live_true = "on"
live_false = "off"
