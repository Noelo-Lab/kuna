[[settable]]
option = "objc"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-objc"
summary = "On a Mach-O, run the Objective-C metadata recovery pass: walk the __objc_* ObjC 2.0 metadata web (the kuna analog of Ghidra's ObjcTypeMetadataAnalyzer, name-recovery half). From __objc_classlist (array of class_t*), per class follow data & FAST_DATA_MASK (~0x7) to the class_ro_t, read .name (class name) and .baseMethods (the - instance method_list_t), and follow class_t.isa to the metaclass baseMethods (the + class methods). Walk method_list_t handling BOTH the large absolute-pointer form and the small/relative form (entsizeAndFlags & 0x80000000), per method_t resolving the selector (ASCII), type encoding, and IMP (function VA). RENAME each IMP function -[Class sel] / +[Class sel] — but only when it still carries an engine FUN_*/sub_* placeholder (the label gate, the FID precedent; a real symbol is never overwritten) — plus emit _OBJC_CLASS_$_<name> + selector symbols. Selectors are plain ASCII, so no demangler is needed. Also walks `__objc_catlist`/`__objc_nlcatlist` and renames each category method `-[Class(Category) sel]` (the class read off its class_t, or off the import name when the category extends a class from another image), walks `__objc_protolist` and names each protocol_t `_OBJC_PROTOCOL_$_<P>` while recording its methods' type encodings (a selector this image only declares in a protocol still types its `objc_msgSend$<sel>` stub), and names the reference slots code actually loads from — `selRef_<sel>` for __objc_selrefs, `classRef_<Class>` / `superRef_<Class>` for __objc_classrefs / __objc_superrefs, `protoRef_<P>` for __objc_protorefs (a bind slot is named from its chained import or classic LC_DYLD_INFO bind program) — and each `__objc_stubs` entry as the function `objc_msgSend$<sel>` it is the linker's stub for, so a send through a stub renders `objc_msgSend$init(obj)` instead of `sub_<addr>(obj)`. Each ivar offset variable in __objc_ivar is the 4-byte data object `<Class>::<ivar>`. Registered ONLY for a Mach-O binary, so it is a structural no-op on every non-Mach-O target. arm64 and x86-64; chained fixups (LC_DYLD_CHAINED_FIXUPS) are resolved. DISABLED in the shipped catalog (output-changing: renames IMP functions + adds symbols; real-binary-path only, so every parity gate is byte-identical), but ON in the `aggressive` preset, which `auto` selects for any binary under 500 KiB, so on a Mach-O image of that size it runs without being asked for. The rebase reference slots are also painted read-only and foldable (dyld writes them once, before any code runs), so a load through a selref/classref/superref folds to the selector or class it holds — `objc_msgSend(obj, sel_init)` rather than `objc_msgSend(obj, selRef_init)`; a bind slot has no static value and keeps its name (formerly the objcrefconst option)."
use_when = "On by default: a Mach-O Objective-C binary gets its method names recovered -- a stripped IMP renders -[Greeter greet:] instead of sub_<addr>, the class/selector strings and the selector/class reference slots are named, and a send through an `__objc_stubs` entry renders `objc_msgSend$<sel>(obj, ...)`; `objcrefconst` (on by default) then folds the reference slots to what they hold. Inert on every non-Mach-O image and on a Mach-O with no __objc_classlist. Flip off to keep the engine placeholders."
example = "option objc on"
source_decompiler = "kuna"
inspiration = "Ghidra ObjcTypeMetadataAnalyzer (Objc2Class / Objc2ClassRW / Objc2Method / Objc2MethodList, ObjC 2.0 __objc_* metadata)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "objective-c methods render as sub_<addr> instead of -[Class sel]|__objc_ metadata present but classes and selectors unnamed in a mach-o|a message send renders as sub_<addr>(obj) through an __objc_stubs entry|objc_msgSend selector argument renders as dat_<addr>|a category method renders as sub_<addr> instead of -[Class(Category) sel]"
