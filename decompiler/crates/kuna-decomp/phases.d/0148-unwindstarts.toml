[[settable]]
option = "unwindstarts"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-unwindstarts"
summary = "On a Mach-O, extend function discovery with the function starts the linker recorded in __TEXT,__unwind_info. The second-level pages (regular and compressed) list in ascending order, relative to the image base, the start offset of each entry the unwinder looks up - a function start, though the linker folds a run of adjacent functions sharing one compact encoding into the entry of its first, so a folded run yields one start. The section lives in the mapped __TEXT segment, so it survives the strip that removes LC_FUNCTION_STARTS from __LINKEDIT. On an image that still carries LC_FUNCTION_STARTS every unwind start is already a function-starts entry (the linker folds runs of adjacent same-encoding functions into one entry, so the set is a strict subset) and this oracle adds nothing. Its value is the stripped App-Store app: with LC_FUNCTION_STARTS gone, the symbol stream, LC_MAIN, exports and __mod_init_func seed only a handful of starts and the arm64 gap walk cannot reach the body, so the inventory collapses to the entry and the import stubs - measured on a 249 MB arm64 third-party iOS app with no LC_FUNCTION_STARTS, kuna discovered 23 of the 204,800 real __text functions __unwind_info records. With this on, those 204,800 starts are recovered. Only the function starts are read; the compact encodings (frame size, saved registers, frameless stack size) are ignored because kuna S5/S7 frame analysis recovers the stack frame from the code."
use_when = "On by default: a Mach-O whose LC_FUNCTION_STARTS was stripped (a common App-Store app) gets its function inventory back from __unwind_info -- the tell-tale without it is an inventory of a few named entries and many __stubs/__got slots over a large __text that holds real code. Inert on every non-Mach-O image and on any Mach-O that still carries LC_FUNCTION_STARTS, where the unwind starts are already a subset of what is discovered. Flip off to keep only the LC_FUNCTION_STARTS, LC_MAIN, export and __mod_init_func starts."
example = "--option unwindstarts on"
source_decompiler = "kuna"
inspiration = "unlace crates/unlace-loader/src/compact_unwind.rs (the __unwind_info header + __compact_unwind reader); measured on a 249 MB arm64 third-party iOS app whose LC_FUNCTION_STARTS is stripped, where kuna discovered 23 of the 204,800 real __text functions __unwind_info records"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a stripped mach-o yields almost no functions although __text is large|an ios app function list is only __mh_execute_header, main, exports and import stubs|LC_FUNCTION_STARTS absent and the arm64 gap walk cannot reach the body|functions the unwinder describes in __unwind_info missing from the inventory"
