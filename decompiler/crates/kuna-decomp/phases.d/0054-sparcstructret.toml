[[settable]]
option = "sparcstructret"
values = "on|off"
default = "on"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "GH-6882"
summary = "On SPARC, let the struct-return `unimp` word after a call fall through instead of becoming a non-returning indirect call."
use_when = "On by default: a SPARC function calling a struct-returning callee keeps its tail instead of rendering a bogus (*pcVar1)() and dropping everything after the call. The marker is recognized by the `IllegalInstructionTrap` user-op only the SPARC SLEIGH declares, so it is inert on every other processor; on SPARC a genuine `unimp` trap that is not an ABI marker is folded the same way, so flip off when auditing code that relies on the trap."
example = "option sparcstructret on"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra GH-6882 (SPARC struct-return unimp fallthrough)"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "bogus (*pcVar1)() indirect call after calling a struct-returning function on sparc|function tail dropped after a sparc call followed by unimp"
live_field = "sparc_struct_return"
live_true = "on"
live_false = "off"
