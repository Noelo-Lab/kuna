[[settable]]
option = "ctypes"
values = "on|off"
default = "off"
destructive = false
phase = "P9"
subphase = "literal-format"
strength = "HARD"
rewind = "P9"
issue = "kuna-ctypes"
summary = "Spell the NAMED core types as the target's own C type names -- int4 -> int, uint1 -> unsigned char, float8 -> double, float10 -> long double, code * -> void * -- resolved against the compiler spec's decoded <data_organization>, so an 8-byte integer reads `long` on LP64 and `long long` on ILP32/LLP64. Extends `realtypes`, which relabels only residual TYPE_UNKNOWN; that split is why one function can declare `unsigned int v3;` and `int4 v1;` in the same block. Sizes no C type has (3/5/6/7, 16-byte integers) keep their undefined<N> form rather than being widened, because widening a truncating cast changes its meaning."
use_when = "The emitted C uses Ghidra's internal type vocabulary (int4/uint1/float8/code) instead of C type names, or mixes the two within one function. ON in the `aggressive` and `fast` presets, and `auto` turns it on at every input size (including the `reliable` tier it selects from 500 KiB up to 2 MiB) -- so this is the default rendering of `kuna decompile`, `decompile-all`, `decompile-project` and the web front-end on any binary. The shipped catalog default is OFF, which is what the XML datatest corpus and an explicit `--mode reliable` run at: 42 datatest assertions pin the Ghidra spellings."
example = "option ctypes on"
source_decompiler = "kuna"
inspiration = "user report: the same function declares `unsigned int v3;` and `int4 v1;`; Ghidra and IDA both keep a private vocabulary and ship a header, so neither emits valid C from the decompiler core"
change_kind = "presentation-default"
tier = "core"
symptoms = "int4/uint1/uint4/float8/float10 appear in the emitted C instead of C type names|the same function mixes `unsigned int` with `int4`|`code *` appears as a function-pointer type|the emitted C does not compile because its type names are not C"
live_field = "ctypes"
live_true = "on"
live_false = "off"
