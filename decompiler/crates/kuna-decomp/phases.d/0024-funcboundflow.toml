[[settable]]
option = "funcboundflow"
values = "on|off"
default = "on"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "interp-bee-func-merge"
summary = "REMOVES CODE: bound a function's fall-through at the entry of another known function. A kuna FunctionSymbol has no extent and CALL is fall-through, so a function whose last act is a `call` to a no-return routine kuna cannot prove no-return (in a stripped static binary: the unnamed `exit`/`abort`/`__stack_chk_fail` bodies and the app-level `die()`/`throw` wrappers built on them) runs its flow past the compiler's inter-function padding straight into the next function's entry and decodes THAT function's body into itself (the merge bug). When a fall-through reaches a known function entry (`query_call(next).is_some()`) not included in an explicit caller-declared extent, plant a no-return artificial RETURN and stop, emitting a `funcboundflow` truncation WARNING. Excludes the function's own entry and admits one safe shared-epilogue shape: if the complete instruction at the foreign entry is an unconditional CPUI_RETURN with no other control transfer, decode that instruction because it has no successor and therefore cannot consume the function after it. Branch, computed-branch, and conditional-return entries stay bounded, and a failed entry decode is conservative. On ARM32 the same bound holds at the function's own literal pool: when an unconditional CALL/CALLIND's fall-through lands on a pool the analysis tier proved (`listing/kuna_poolextents.rs`: maximal runs of 4-aligned executable words that a whole-word load reads at a fixed address from a trusted instruction that no fixed-address load reads as data and no known function entry separates from the word, with no trusted instruction covering or branching to the word, where trusted means reachable from a function entry without falling through a call, indirect call or user operation whose callee is not proven to return to the instruction after the call, or, in a second strict judgement whose words also count, without falling through any call at all), or up to one instruction of do-nothing alignment padding before one, in non-writable image bytes, the compiler put the pool there because the call does not return: the walk plants the no-return halt in the call's block and stops with a `funcboundflow` pool warning, instead of decoding the constants as instructions until one fails to decode (`halt_baddata()` / `Bad instruction`) or a decoded constant carries the walk into code the call never returns to. The pools are a fact of the Listing (`option listing`), so without it (`--mode fast`, and under `auto` at 2 MiB and above) and on every other target no call is bounded at a pool."
use_when = "A function shows a garbage tail that is really the body of the FOLLOWING function (dead code after a call to a die()/throw/exit wrapper, uninitialized reads, a second unrelated function inlined after an error call). On by default; flip OFF to restore the upstream flow-into-the-next-function behavior."
example = "option funcboundflow off"
source_decompiler = "ida"
inspiration = "interp-bee/jit-bee static-pie study: 70/195 app functions end in a call to an unnamed no-return and absorb the next function; IDA/Ghidra bound decompilation to the function body"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "a function's tail is really the body of the NEXT function|dead/garbage code after a call to a die()/fatal()/throw wrapper that never returns|two adjacent functions merged into one, the second also decompiled on its own|uninitialized reads in the tail after an unrecognized no-return call|halt_baddata() Bad instruction - Truncating control flow here right after a call on ARM32, where the words after the call are constants the function loads PC-relatively"
live_field = "funcbound_flow"
live_true = "on"
live_false = "off"
