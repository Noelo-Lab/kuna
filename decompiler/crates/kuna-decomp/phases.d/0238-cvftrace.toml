[[settable]]
option = "cvftrace"
values = "on|lines|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-cvftrace"
summary = "Compaq Visual Fortran x86 PE32 images only: name routines from the `.trace` traceback section the CVF runtime keeps, and optionally comment each statement's source line."
use_when = "On by default (`on`): on a PE32 i386 image that carries a `.trace` section, each traced routine that kuna already discovered as a `sub_<addr>` placeholder takes its Fortran name (`FROM_TRACE` instead of `sub_10001000`). It only renames: no function is created at a traced address, a function another source named (export, COFF symbol, PDB, FID, `--define-function`) keeps its name and gains no alias, a trace name already used by any function, data symbol or alias elsewhere is skipped, and a name the trace gives two addresses (or an address it gives two names) is dropped entirely. Names must be Fortran identifiers (letters, digits, `_`, `$`; at most 127 bytes) or the whole record is declined, as it is for an unknown opcode, a file index past its table, a routine outside the record's code range, a truncated record or an incremental-link type-11 record. When a size cap (16 MiB section, 65,536 file names, 262,144 facts) stops decoding, one `[kuna cvftrace]` note goes to stderr. Set `lines` to also emit each statement's `minimal.for:7` comment, the CVF counterpart of `dwarf_lines` and opt-in for the same reason. Inert everywhere else: nothing is read unless the container is PE, the machine is i386 and a `.trace` section exists. Set `off` to keep the generic names."
example = "option cvftrace lines"
source_decompiler = "kuna"
inspiration = "Compaq Visual Fortran runtime traceback metadata"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a CVF Fortran PE32 image keeps a .trace section but its routines print as sub_<addr>|CVF source file and line comments are missing"
