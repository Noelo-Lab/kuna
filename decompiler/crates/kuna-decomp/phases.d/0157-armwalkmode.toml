[[settable]]
option = "armwalkmode"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-armwalkmode"
summary = "On an ARM ELF whose metadata states no decode mode, decode the code the Listing walk reaches from an even e_entry or an even function symbol in the mode its control flow carries. An interworking blx runs a SLEIGH globalset that writes the callee's mode into the context database from the target up to the next point where the mode was set; a stripped image has no such point, so every address above a Thumb helper read as Thumb, and an A32 function placed there, called with a plain bl, decoded and decompiled as Thumb garbage. On, the walk starts in A32 at the even e_entry and at each even function symbol (A32 by the ELF for the ARM architecture); a branch target and a fall-through keep the mode of the instruction before them, and a direct call target takes the mode the call commits there (blx switches) or else the caller's (bl keeps it). The instruction after a call or after a user-defined operation such as svc or bkpt waits until the functions the walk's calls reach are walked, so a call target decodes in its call's mode before a fall-through can claim it; it then carries the mode on where the database agrees, after an operation or an indirect call, or when the callee reaches a return, and otherwise reads the database. Every other function entry (prologue pattern, pointer, callback or gap seed) and every byte the walk does not reach still read the database, including what the walk's own blx writes put there, so a Thumb function found only through a pointer keeps the mode it had. When the walk ends, each instruction decoded in a carried mode whose span the database holds in the other mode is painted with that mode, so the decompiler reads the instructions the walk found, and a later blx write at a painted run stops at its end. Runs only on a linked ARM ELF with an even e_entry, no mapping symbol, no Thumb function symbol, no Cortex-M vector table and build attributes that allow A32, and not under --isa."
use_when = "On (default): in a stripped ARM image that mixes A32 and Thumb, an A32 function reached with bl keeps A32 although a Thumb helper below it is reached with blx. Flip off to restore the walk that reads every address's mode from the database the blx writes fill: to compare a function that decompiles as halt_missing with a warning that flow starts two bytes into an A32 instruction, or when a function placed right after one that ends without a call (a store or a branch followed by __builtin_unreachable()) decodes in that function's mode instead of its own."
example = "--option armwalkmode off"
source_decompiler = "kuna"
inspiration = "GH-780: in a 136-byte stripped ELF an A32 entry runs blx 0x2000040 (Thumb) and then bl 0x2000080 (A32); the blx write made 0x2000080 decode as Thumb and kuna decompile printed halt_missing for a function that returns a0 + 1. Ghidra's disassembler carries the context along the flow it follows, and a globalset applies to its target."
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "an A32 function after a Thumb helper decompiles as halt_missing in a stripped ARM binary|flow reaches unmapped memory two bytes into an A32 instruction|a function reached with bl after a blx call decodes in the wrong instruction set|--option listing off fixes the decompilation of an ARM function|--isa arm decompiles an ARM function correctly that the default run turns into garbage"
live_field = "analysis_armwalkmode"
live_true = "on"
live_false = "off"
