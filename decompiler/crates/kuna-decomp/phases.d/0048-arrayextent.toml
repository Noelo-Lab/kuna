[[settable]]
option = "arrayextent"
values = "off|bound|on"
default = "on"
destructive = false
phase = "P6"
subphase = "stack-frame-layout"
strength = "HARD"
rewind = "P6"
issue = "GH-867"
summary = "Size an indexed stack array past the four elements upstream assumes when its guard has no locked range. `bound`: an indexed base whose pointer is the stack base plus constants plus indices bounded by their known bits (`v[n & 7]`), and which is only dereferenced, gets room for every element those LOADs and STOREs may touch, up to the next pointer base above it; every slot of the element width inside that reach joins the array, whether the function reads it on its own or not. `on` adds: an indexed base with no such bound, or a guard with a step but no locked range, takes each following slot of its element size while the slot is contiguous with its elements, holds only unlocked fixed hints of that width whose type keeps the element type, starts no other open range, and is observed only through a pointer (no direct read of the slot, and no other use of a value copied into it except copies into stack slots outside the array); a constant stored into the last slot it takes no longer lets upstream's constant absorption grow the array past it, unless upstream's merge of the same hints, with the array at its old length, reaches past that slot anyway. On SPARC32 only, `on` also keeps two adjacent frame words as one two-word array when both are zeroed before a direct call that receives the first word's address, the second zero store sits in that call's delay slot, and neither word is read directly or has its own address; other targets, and SPARC32 stores outside the delay slot, keep the split. `off` is upstream's [0,3] floor."
use_when = "On by default (0/675 datatest assertions move). With it OFF a local array that a loop indexes up to a clamped bound (`for (i = 0; i < n && i < 6; i++) t += v[i];`, `v[n & 7]`) is declared with four elements and the rest split into scalars that are assigned and never read, so the printed loop subscripts past the declared array and the C reads the wrong object (ASan reports a stack-buffer-overflow on the recompiled function). `bound` keeps only the sound known-bits sizing. Flip `bound` or `off` to see the upstream split for a bisect."
example = "option arrayextent off"
source_decompiler = "kuna"
inspiration = "GH-867: clang -O1 `int v[6] = {a, b, c, d, e, f}; for (i = 0; i < n && i < 6; i++) t += v[i] * (i + 1);` printed `int v5 [4]` plus scalars v6/v7 holding v[4]/v[5]; the loop exits on `!=` against a clamped bound, so the value-set refinement locks no range"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a stack array is declared with 4 elements while a loop subscripts it further|the elements after the fourth of a local array are separate scalars that are assigned and never read|a recompiled function reads past a local array under AddressSanitizer|a masked or clamped index (`v[n & 7]`, `min(n, 5)`) subscripts a smaller declared array|on SPARC32 a two-word object zeroed around a call's delay slot and passed by address (`mbstate_t`) splits into a scalar and a neighbour that is assigned and never read"
