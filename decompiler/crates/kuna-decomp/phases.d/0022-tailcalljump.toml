[[settable]]
option = "tailcalljump"
values = "on|direct|off"
default = "on"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "angr-tee-O2-tail-jumps"
summary = "Recover an -O2 tail jump (a direct `jmp` to another function's entry, e.g. `jmp setlocale@plt`) as a tail call (CALL + RETURN) so the callee resolves by name and its return value flows out, instead of flowing into the callee (which inlines a PLT thunk and mis-renders it as a `(*dat_...)(...)` indirect call with a 'Treating indirect jump as call' warning). A caller-declared extent containing a direct or recovered computed branch target keeps that branch intraprocedural, even if discovery knows the target as a function entry. A terminal conditional branch to another known function entry outside an explicit extent becomes a call and return only on its taken path, under both `on` and `direct`; its false path keeps flowing normally. Unknown, mid-function and unbounded conditional targets keep the original flow and clipping policy. `on` also takes a computed jump whose recovered jump table names one destination, when that destination is another known function's entry: an ARM veneer or long-branch stub (`ldr r1,[pc]; bx r1`, `ldr pc,[pc,#-4]`), an x86 `jmp *GOT` in a `-fno-plt` build, or a jump through a read-only function-pointer slot, which kuna otherwise renders as a one-case `switch` copying the callee's body in, or as `halt_missing()` when the stub's exact extent is declared. That jump becomes the same tail call when the destination lies outside the function's declared extent, or when no explicit extent is supplied and the callee's prototype is stated (declared, DWARF, a library signature, a demangled C++ name), so it fixes the call's arguments, and either that prototype states a `void` return or the function's own output is stated, so the return value reaches it. A prototype with no return type (a demangled C++ name) leaves the return unknown, not `void`. Otherwise the copied-in body stays: it states the arguments and return value a call could not. The register that carried the target address is never taken as an argument of the call. `direct` recovers only direct jumps. When it fires it logs a `tailcalljump: recovered tail call` warning at the branch site so the introduced call is observable. Under `on`, a one-destination computed jump to a function with no bytes, or to one a callee-first decompile-all filed as losing nothing to a call, is a tail call as well (the GOT-slot rule of `kuna_gottailcall.rs`)."
use_when = "On by default. A leaf function ends in `jmp <func>@plt` and kuna would emit `(*dat_...)(...)` + a 'Treating indirect jump as call' marker instead of `func(...)`, or a veneer (an ARM long-branch stub, an x86 `-fno-plt` `jmp *GOT`) renders as `switch(0x...)` with one case, or as `halt_missing()` with a 'flows out of bounds' warning under a declared extent. Set `direct` to keep direct-jump tail calls but follow a veneer's computed jump into its destination as before; set `off` to restore the upstream flow-into-callee rendering for both (the two affected datatests, Long double #1/#2, opt out per-test)."
example = "option tailcalljump direct"
source_decompiler = "angr"
inspiration = "test_decompiling_tee_O2_tail_jumps; angr tail-call handling (direct jmp to a function/PLT thunk); setlocale_null_androidfix; GH-781 (an exact ARM veneer bound turns a valid tail transfer into halt_missing)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "leaf function ends in a (*dat_...)(...) computed call with a 'Treating indirect jump as call' warning|jmp to a plt stub inlined into the caller instead of a named tail call|plt thunk body absorbed where func(...) is expected|a veneer renders as switch(0x...) with one case holding another function's body, or halt_missing() with a 'flows out of bounds' warning"
live_field = "tail_call_jumps"
live_true = "on"
live_false = "off"
