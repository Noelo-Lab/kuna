[[settable]]
option = "octeoneffects"
values = "off|atomic|ordered"
default = "atomic"
destructive = false
phase = "P3"
subphase = "heritage-guard"
strength = "HARD"
rewind = "P2"
issue = "octeon-atomics"
summary = "Give the Octeon atomic, reservation and ordering user operations (`octeonAtomics.sinc`) memory effects and types. A fetch-and-add, exchange, load-linked, store-conditional or cache-block zero accesses memory through its address operand, but a user operation has no memory effect of its own, so a store before it was forwarded past it or dropped, and a later read reused the pre-update value. `atomic` places a heritage guard across each of those operations over writable RAM and stack ranges, as a call guard does: read-only image ranges are never guarded, so a GOT or `.rodata` read still folds, and a guard on a local whose address never escapes collapses, so a spill stays a plain value, except at a cache-block zero, which clears the whole 128-byte block holding its address and so can reach a neighboring slot. Through an address built from the stack pointer, loaded, returned by a call or transformed by arithmetic, every local keeps its guard. Only representation changes preserving all target address bits can retain the entry-pointer bound: copies, same-width casts, extensions, low-part extraction (including canonical N32 GPR narrowing) and joins. A negative or variable displacement, mask, shift, wrapping or other unproved transformation may reach a private local even without a stack-pointer dependency. An unchanged constant or incoming address retains guards only on locals in the frame's top 128 bytes; deeper direct-pointer spills stay values. The same operations, with the system calls that guard memory, keep a pointer load ahead of them in the C and count as STOREs for `persistcalls`, so a sparse call guard is never skipped under an atomic's own guard. `ordered` also guards across every ordering operation (SYNC, SYNCW, SYNCWS, SYNCS, SYNCIOBDMA, and the other selectors, printed `sync 0xN` as GNU binutils does: Cavium's assembler names 1 and 3 `syncio`/`syncioall`, which no hardware manual defines), so a store before a barrier is kept and a value is never reused across an ordering point another core could act on; this is conservative about concurrent modification, not a claim that a barrier writes memory. Both also type the address operand as a pointer to the access width (except a cache-block zero's, which clears a whole block; only at the target RAM width, so N32 keeps full-width GPR values) and stored values as unsigned; a word result is `int`, since every constructor sign-extends it into its register, and a doubleword result or the success byte is unsigned. `off` restores upstream's lifting of the instructions upstream's MIPS spec also decodes, and only those, through callother fixups: LL/LLD as a plain load, SC/SCD as a plain store whose success is 1 and SYNC as `SYNC(n)`; the Octeon-only atomics (SAA/SAAD, the LA forms, ZCB/ZCBT), which the base branch rejected and upstream reaches only through the SPECIAL2 catch-all Octeon excludes, decode in every mode and stay opaque under `off`. The fixups apply while lifting, so a mode change rewinds to P2. Where they cannot be compiled (ghidra mode has no local `.sla`), `off` keeps the LL/LLD/SC/SCD memory effects instead. A result for `$zero` is discarded rather than written, which changes the raw p-code but not the C. The option governs decompilation only: raw p-code and the analysis tier see the user operations in every mode."
use_when = "Default `atomic`: only Octeon languages declare these operations, so 0/675 datatest assertions move and other targets are unaffected. Use `ordered` for concurrent code where a store before a barrier must stay and a reload after it must stay a reload (another core may observe or change the location); it places one guard per ordering operation per global range, so a function with 200 barriers and 200 globals decompiles about 11x slower than under `atomic`. Use `off` to compare with upstream's ll/lld/sc/scd/sync lifting."
example = "option octeoneffects ordered"
source_decompiler = "kuna"
inspiration = "Octeon SAA/LA/LL/SC and SYNC families from original GNU-assembled fixtures in tests/fixtures/octeon-atomics"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a value stored before an Octeon atomic add is returned instead of the reloaded memory|a store read only by a following ll or lld disappears|an Octeon fetch-and-add result or old value prints with the wrong width or behind an (int) cast|a store before syncw disappears or a reload after it reuses the stored value (use ordered)"
