[[settable]]
option = "strings"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-strings"
summary = "Run the string-literal analysis pass: detect NUL-terminated ASCII strings (minimum length 4) and plant a typelocked char[N] data symbol at each. The four-character threshold keeps command and mode literals such as quit, show, bind, fork, and dup2 visible while the separate UTF-16 arm retains Ghidra's length-5 default."
use_when = "On (default) lays char[N] data at detected strings; off leaves those addresses undefined."
example = "option strings off"
source_decompiler = "kuna"
inspiration = "Ghidra StringsAnalyzer; pwn.college CSCI 4250 module 5 game servers, where four-character commands and libc operation names rendered as addresses"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "string constants render as raw addresses or unnamed data instead of quoted char[N] literals|no data symbols at ascii runs in rodata|four-character commands such as quit, show, bind, or fork render as hexadecimal addresses"
