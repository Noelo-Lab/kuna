[[settable]]
option = "swiftcall"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-swiftcall"
summary = "The calling-convention arm of the Swift metadata pass (inert unless swiftmetadata is on; it reads the type-layout arm, so swifttypes off turns it off too). Swift passes a method's self in the swiftself register (x20 on arm64, r13 on x86-64) when it is one pointer - a class instance, the address of a mutating or indirect value, a thick metatype - and returns a throwing function's error in the swifterror register (x21 / r12), which the caller zeroes before the call and tests after it. Under the C model neither register is a parameter, so a method's self is an unnamed register read, a call drops the self it passes, and the caller's test reads the zero it stored, so the error path of try? folds away. Every AArch64 and x86-64 compiler spec gains __swiftcall (its default model with swiftself as an input resource section of its own, so self is a parameter exactly when the body reads it and never forces the argument registers around it) and __swiftcall_throws (the same, handing the error register back to the caller), derived when the spec is read unless it declares models of those names, so they need no edit to the vendored specs and a spec a Ghidra host sends carries them too. The arm binds __swiftcall to every function it can place in a type, with no signature so the arity stays recovered: a class's vtable slots and overrides, a conformance's witnesses, a protocol's default implementations, and in an image that kept its symbols each method, accessor, initializer and deinitializer the demangler places in a class, struct or enum (throws read off the function type selects __swiftcall_throws; a struct's static member, whose metatype is thin, takes none). Its self is named and, where the type is known, typed as an unlocked hint the recovered parameter takes: Class * for an instance member, swift.class_metadata * for a class member or allocating initializer, the address of the value for a witness (T * for a struct, Class ** for a class, the reference itself under a class-bound protocol), swift.type_metadata * for a static requirement; a body two types share (identical code folding) keeps the name and drops the type. A direct call to a bound function recovers its arguments under the model, so it passes self; a call to a struct member, which may take self exploded into its trailing arguments instead, keeps a swiftself argument only when the caller set the register after its last call that may read it (a runtime helper with a C name, such as swift_retain, preserves the register and reads none of it). A method's own self handed on untouched (x20 / r13 never rewritten) is passed at a direct call, and an indirect call passes swiftself exactly when its target is loaded through the isa of the value the register holds (obj->isa[k](obj, ...)), so a virtual call on an object shows that object and a value-witness call shows none. Any call, direct or indirect, whose block zeroes the error register as its last write before it and whose next read of the register compares it with zero is given __swiftcall_throws, so the test after it reads the callee's error; a register zeroed for its own sake and read back as a value keeps its value. Default-ON because it is inert unless swiftmetadata is on (default-off, but ON in the `aggressive` preset, which `auto` selects for any binary under 500 KiB, so this arm runs with no flags on small Swift binaries), the XML corpus never runs the pass (0/675), and on a large third-party iOS app (84 MB) the arm adds no measurable load time and about 8 MB, and decompiling the 42,240 functions it binds takes 2.5% longer (1:13:53 against 1:12:07)."
use_when = "Off to see a swiftmetadata-named binary under the C model: methods without self, calls without the self they pass, and try? error paths folded away. On (default) when swiftmetadata is on: self typed in methods, initializers, accessors and witnesses, passed at direct calls, and the error a throwing call returns tested where the binary tests it."
example = "option swiftcall off"
source_decompiler = "kuna"
inspiration = "The Swift calling convention (swift/docs/ABI/CallingConventionSummary.rst; LLVM's swiftself/swifterror parameter attributes) and IDA Pro 9.5's Swift support (its swift plugin's __swiftcall/__swiftthrows flags, Hex-Rays keeping a __swiftself argument only when the register is read, and its callee-throws inference from a caller zeroing the error register); Ghidra's AARCH64_swift.cspec __thiscall puts x20 first in the integer list instead, which forces it whenever x0 is used"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "swift methods named by swiftmetadata read self from an unnamed x20 or r13|calls to swift methods drop the self they pass|a try? error path or a do/catch after a throwing call folds away|swift struct mutating methods write through an untyped register"
