[[settable]]
option = "armfloatreturn"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "arm-hard-float-return"
summary = "On an ARM ELF whose container states the VFP procedure-call standard, recover complete scalar VFP return values and the double-width argument storage they use."
use_when = "On by default: ARM hard-float code returns its double whole in d0 instead of truncating it to the low word, and keeps a double input. Requires consistent ELF ABI evidence (`Tag_ABI_VFP_args` or `EF_ARM_ABI_FLOAT_HARD`); soft-float, softfp, missing metadata, and explicit prototypes keep their existing contracts, so on any other image the option changes nothing. A double argument at a call needs the callee's declared or protoorder-recovered prototype, so it appears in a callee-first decompile-all, not in a single-function decompile. A returned constant no float literal spells (a NaN payload) is returned bit-exact through a union; AEABI and libgcc soft-float helpers keep the base standard; a VFP register-bank save or restore is no parameter and no result. Flip off to see the base-standard truncated return."
example = "option armfloatreturn on"
live_field = "arm_float_return"
live_true = "on"
live_false = "off"
source_decompiler = "kuna"
inspiration = "Synthetic ARM constant-double, arithmetic, and caller fixtures; AAPCS32 VFP procedure-call standard."
change_kind = "correctness-fix"
tier = "core"
symptoms = "a double return becomes SUB84 or zero|an ARM hard-float function loses its d0 parameter|a caller reads an undefined floating result"
