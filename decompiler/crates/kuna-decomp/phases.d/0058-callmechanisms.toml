[[settable]]
option = "callmechanisms"
values = "off|auto|on"
default = "auto"
destructive = false
phase = "P4"
subphase = "abi-trust"
strength = "HARD"
rewind = "P3"
issue = "kuna-call-mechanisms"
summary = "Apply the p-code a compiler spec attaches to a prototype model's call boundaries: `<prototype><pcode inject=\"uponentry\">` before the first operation of a function evaluated with that model, and `<pcode inject=\"uponreturn\">` right after every modeled call whose callee uses it, both installed before SSA so the effects reach dataflow (upstream `ActionConstbase` / `FuncCallSpecs::insertPcode`). A model that declares the x87 register-stack rotation a callee performs, or a store a callee always makes, then reads the values below the call from their real positions. Only payloads with a locally compiled body are applied: a `dynamic` payload with no body (the JVM and Dalvik `uponentry` models), and every payload in ghidra mode, stay unresolved. A late prototype restriction that changes a call's return effect requests a full reflow. At `auto` (the default) a return payload is installed only on a PPC64 image whose ELFv1 function descriptors the loader validated, from a linked image's or a relocatable object's `.opd`, and only at a call whose next instruction loads back a slot the payload stores. There the effect is applied by forwarding: that load reads the stored register directly, and no store is left in the frame (a payload with any other effect is installed as written). Entry payloads are not installed. The stock PPC64 models store `r2Save` (set by `bl`) to `0x28(r1)`, the TOC save doubleword the ELFv1 ABI reserves in every frame, so the `ld r2,40(r1)` that follows an external call reads back the caller's TOC instead of an unwritten stack slot, and a TOC-relative jump table or global after the call keeps its address. A call with no reload, or whose reloaded `r2` is never read, therefore prints as `off` prints it: an unread store after each call would keep a short-circuit `a() && b()` from forming. `on` installs every payload after every modeled call and at every entry, on any image; `off` installs none."
use_when = "Default `auto` is right for nearly every program: it acts only on a PPC64 ELFv1 image (big-endian, with a validated `.opd`, linked or relocatable), where `0x28(r1)` is the TOC save slot, and only at calls the caller follows with the TOC reload; it is inert on every other image, every XML test and every spec that declares no prototype p-code (every stock x86, ARM, AArch64, MIPS and RISC-V spec). Do not force it ON for an ELFv2 PPC64 binary (every little-endian one): there the TOC is saved at `0x18(r1)` and `0x28(r1)` is ordinary frame storage, so a local the function keeps there is replaced by the TOC pointer after each call. Turn ON for upstream Ghidra's behaviour (every payload at every call and entry), for a custom compiler spec whose models declare boundary effects, or for ELFv1 code the loader could not validate (no section headers, or a raw image) whose calls restore `r2` from `0x28(r1)`. Turn OFF to see an ELFv1 function as the bytes alone describe it, with the post-call TOC reload reading an unknown stack slot."
example = "option callmechanisms on"
source_decompiler = "ghidra-upstream"
inspiration = "upstream ActionConstbase getInjectUponEntry + ActionDefaultParams FuncCallSpecs::insertPcode (coreaction.cc, fspec.cc) via Funcdata::doLiveInject; the 64-bit PowerPC ELF ABI v1 TOC save doubleword at 40(r1)"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "values below an x87 call are read from the wrong register-stack positions after consecutive calls|a store the compiler spec says a callee always makes is missing after the call|a custom compiler spec's uponentry or uponreturn p-code has no effect on the output|a PPC64 ELFv1 switch after an external call is a jump-as-call through r2 plus a constant|a PPC64 ELFv1 function reads an r2 local that is never assigned after a call|a TOC-relative global after an external PPC64 call prints as an unknown pointer plus an offset"
