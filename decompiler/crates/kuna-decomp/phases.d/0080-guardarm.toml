[[settable]]
option = "guardarm"
values = "off|auto|on"
default = "auto"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "decbench-ifnoexit-guardarm"
summary = "Break the ARM TIE in CollapseStructure::ruleBlockIfNoExit by code layout instead of by out-index. The rule folds the condition block and ONE terminal out-arm into a BlockIf; the other arm survives as the fall-through, so the pick decides which half of the function is nested inside the `if`. Upstream walks the out-edges in index order and takes the first eligible one (in-degree 1, out-degree 0, a decision edge). Usually only one arm qualifies and there is no choice -- but when the condition guards a fatal no-return call and the other side is the function's own `return`, BOTH arms qualify and index order decides a coin flip. Index order carries no source information at that point: `negateCondition`'s `swapEdges` re-orients the block between the two `collapse_all` runs ActionBlockStructure performs (the pending-flip realization runs between them), so the arm sitting at out(0) in the deciding run is not the arm the branch was assembled with. When the `return` wins the tie kuna emits `if (ok) return v; fatal();` -- condition negated, body re-parented one level deeper, fatal call demoted to the function's trailing fall-through -- where the source, IDA and Ghidra all write `if (!ok) fatal(); return v;`. With this on, a tie is resolved to the arm whose front leaf lies EARLIER in the address space: an unoptimized compiler emits the taken clause of `if (c) A; B;` in front of `B`, and the `then` side of an if/else in front of the `else` side, so the earlier arm is the source's `if` body in both shapes. TIES ONLY -- a block with one eligible arm is byte-identical to upstream, which is why the great majority of guards are untouched. The predicate deliberately does NOT read the artificial-halt (op_mark_halt / pcodeop_flags::noreturn) bit: preferring the no-return arm fixes openssh scp xcalloc and dpkg-query control_list but INVERTS coreutils make-prime-list xalloc, whose source really is `if (p) return p; fprintf(...); exit(1);`. Layout order gets all three right because it reads what the compiler recorded about the source instead of guessing from the callee. `auto` (the default) applies the tie-break only in a function whose code the per-function detector `p3_dataflow/kuna_unoptimized.rs` calls unoptimized: its parameters live in frame slots the body reloads rather than in their registers, or, with no parameter evidence, it addresses its frame through a frame pointer, and it reuses at most one callee-saved register. An unoptimizing compiler lays blocks out in source order, so there the layout is the author's choice; an optimizing one reorders blocks, so elsewhere the layout is noise. Measured on the decbench corpus against main: `auto` gains 248 and loses 46 structurally exact functions at O0 (FIT +131, CHECK +71) and changes 3 of 35,197 O2-noinline bodies with no verdict moved, where `on` everywhere is O0 +221 (279/58) but O2-noinline -43 (24/67). 0/675 datatest assertions move; four stage tests that pin other features take a per-test `option guardarm off`. `off` restores upstream's out-index order everywhere; `on` applies the layout to every function."
use_when = "`auto` is the default and decides per function; turn OFF when the guards of an unoptimized function come out in the wrong polarity, ON when a function `auto` leaves alone (optimized code) shows the inversion below. The inversion: a guard clause that ends in a fatal/no-return call comes out INVERTED -- the condition negated, the whole rest of the function nested one level deeper inside the `if`, and the fatal call emitted as the function's last statement -- where IDA, Ghidra and the source all write the flat `if (bad) fatal(); <body>; return K;`. The tell is a function whose only `return` sits inside an if-arm while the body ends on a `// no-return` call. Verified on the decbench O0 corpus: dpkg-query control_list (both of its two guards come out flat; its second guard was already correct and is unchanged), openssh scp xcalloc, coreutils `[` posixtest. Equally verified NOT to move the two functions a no-return-arm preference would break: coreutils make-prime-list xalloc @0x1906 and coreutils tail xlseek @0x4804 are byte-identical with the option on. MEASURED BIDIRECTIONALLY over the whole decbench O0 slice (32,339 functions scored in both arms, 265 slices, `scripts.decbench.optsweep`): 6,821 bodies change, GED 230,291 -> 227,646 (-2,645), GED-perfect 14,785 -> 15,082 (+297), 316 functions moved TO perfect against 19 moved OFF (16.6:1, McNemar z = +16.2), improved 726 / worsened 243. Per architecture the gain is x86-64 (+305 perfect, -2,672 GED); ARM Cortex-M is -7 and i386 PE -1, on 7 and 1 functions respectively. Every one of the 6,821 changed bodies was audited mechanically: identical callee, string and statement multisets, gotos 1,021 -> 1,019, labels 620 -> 619, `while( true )` and `// no-return` counts unchanged -- the only content difference is the comparison constant a negated condition renders (`x <= 0xb` becoming `10 <= x`). TWO KNOWN FAILURE MODES, both in that 19. (1) The metric, not the option: on betaflight cliDumpPrintLinef and zlib test_inflate the ON pane matches the preprocessed source LITERALLY (`if (!((dumpMask & DO_DIFF) && equalsDefault)) {...} return false;` and `if (strcmp(...)) { fprintf; exit(1); } else { printf; }`) and GED still charges 8 and 6. (2) A real limit: when an arm is a return-split CLONE its start address is the SHARED EPILOGUE's, not the source position of the `return`, so the layout signal is destroyed -- e2fsprogs preenhalt's source `if (!(ctx->options & E2F_OPT_PREEN)) return;` inverts."
example = "option guardarm on"
source_decompiler = "kuna"
inspiration = "decbench O0 triage round 4, cluster `ifnoexit` symptom A (docs/decbench/features-round4.md Rank 2); the layout predicate replaces the refuted `prefer the no-return arm` predicate recorded in the same file as Killed K13"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "guard clause with a fatal no-return call comes out inverted and the whole body is nested inside the if|the function's only return sits inside an if-arm and the body ends on a no-return call|kuna negates a guard condition that ida and ghidra leave alone|a leading validation guard is emitted at the tail of the function"
