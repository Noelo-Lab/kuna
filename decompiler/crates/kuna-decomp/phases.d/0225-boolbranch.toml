[[settable]]
option = "boolbranch"
values = "fold|keep|return"
default = "return"
destructive = false
phase = "P3"
subphase = "simplification-quiescence"
strength = "HARD"
rewind = "P3"
issue = "decbench-boolbranch"
summary = "Whether a branch instruction whose two arms assign the constants 1 and 0 keeps its `if`. P3 `RuleConditionalMove` (upstream `ruleaction.cc`) folds a `MULTIEQUAL` of `1` and `0` under a `CBRANCH` into the branch's condition, whatever the binary did. That is right for conditional execution: an ARM `ite gt; movgt r0,#1; movle r0,#0`, an x86 `cmovg` or an AArch64 `csel` lifts to a `CBRANCH` that skips the rest of its own instruction, and the source wrote `return a > b;`. It erases an `if` the author wrote when the binary has a branch instruction: unoptimized `if (fnmatch(p, s, FNM_CASEFOLD) == 0) return true; return false;` is a `jne` over two `mov` blocks and printed as `return fnmatch(p,s,0x10) == 0;`. `keep` tells them apart by instruction address: a conditional-execution guard falls through into the rest of its own instruction, so one arm block starts at the guard's address, while a branch instruction's arms start at other instructions. A select under a branch instruction is left alone and the structurer prints the `if` (`if (!fnmatch(p,s,0x10)) return 1; return 0;` with `returndup`, `v = c ? 1 : 0;` for an assignment under `iteregion`). Two compiler-made branches still fold: a jump on the unordered flag of a float comparison (`NAN(x)`, the x86 `jp` GCC uses to materialize a float `!=`), and a flag set by a jump whose arms only assign the constant and whose value is only tested (GCC -O0 `__builtin_add_overflow`: `mov $0,%ecx; jno 1f; mov $1,%ecx; 1: test %cl,%cl`). A flag whose arm does other work, or whose value is returned, stored or computed with, keeps its branch. Selects of a boolean expression (`c && x`, `c || x`) fold as before. `fold` is upstream's rule, folding every such select. `return` (the default) is `keep` plus one print, made after the tree is final (p8_structure/kuna_boolret.rs): a function whose whole body (declarations aside) is `if (C) return K; return K';` with K and K' the constants 1 and 0 of an integral return type and C a short-circuit `&&`/`||` chain prints `return (C);`, or `return !(C);` when the guard returns 0. RuleConditionalMove cannot fold that select in any mode: the 0 arm is entered from every short-circuit exit. C prints through the renderer of the `if` header, so the same operands are evaluated in the same order with the same short-circuit, and `&&`, `||` and `!` yield exactly 1 or 0; no p-code changes, and only C output takes it. A simple condition, a guard after other statements, two or more guards, a condition that prints a statement inside it (a comma expression) and a labelled or goto-targeted block keep their `if`."
use_when = "return (default) prints the branches the binary has except in a function that only returns a short-circuit test; keep prints them everywhere: unoptimized code materializes `if (c) return 1; return 0;` and `if (c) v = 1; else v = 0;` with a jump, while a source `return a < b;` compiles to `setcc`, `cmov` or an ARM IT block, which still fold. On the decbench corpus it turns 171 functions at -O0 and 45 at -O2 (ARM firmware built with branches rather than IT blocks) into exact matches of the source's control flow and loses 3. Flip to fold for upstream Ghidra's output, or where a source wrote `return c ? 1 : 0;` and the compiler used a jump for it, which the binary cannot tell apart from the `if`. Against keep on the decbench corpus (main d85062bb5) `return` makes 94 more functions at -O0 and 10 more at -O2 without inlining (ARM firmware; x86 gcc materializes those with setcc) structurally exact and 4 fewer at -O0 (+90: +59 on one half of the projects, +31 on the other; -O2 +10: +2 and +8); the source of every site has one return of the condition (`return path != NULL && path[0] == '/';`) where the binary has two constant returns, and the losses are sources that wrote the `if`. Set keep for the two returns: `if (c >= '0' && c <= '9') return 1; else return 0;` compiles to the same bytes. A simple condition stays an `if` under return: an unoptimizing compiler sets a flag for `return a == b;`, so its branch is the author's `if`; rewriting it, a guard after other statements or a chain of guards loses more functions than it gains on the same corpus."
example = "option boolbranch keep"
source_decompiler = "kuna"
inspiration = "decbench O0 findutils find pred_ipath: the source's `if (fnmatch (...) == 0) return (true); return (false);` printed as `return fnmatch(pattern,a0,0x10) == 0;`"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "if (c) return 1; return 0; in the source prints as return c;|if (a && b) return 1; return 0; where the source returns a && b|return (a && b); where the source has if (a && b) return 1; return 0;|a branch instruction selecting 1 or 0 prints as a boolean expression with no if|an unoptimized 0/1 jump diamond is folded into v = (a == b)|need upstream Ghidra's folding of every 0/1 select into its condition"
