[[settable]]
option = "aif"
values = "off|on|strict|precise"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-aif"
summary = "Run the Aggressive Instruction Finder gap-walk (the third Listing/xref consumer): the kuna analog of Ghidra's AggressiveInstructionFinderAnalyzer, a speculative gap-filler. Over the undefined gaps between discovered functions, speculatively decode each gap start and accept it as a NEW function entry when it BOTH (a) disassembles into a valid subroutine (followSubFlows reaches a clean RET without hitting a bad/undecodable byte or an out-of-range flow, > 2 instructions) AND (b) matches a function-start byte fingerprint (mask-histogram) shared by >= 4 already-discovered functions. Finds functions reachable ONLY through an indirect/data path (a .rodata function-pointer table) that entry discovery + funcsyms + .eh_frame miss. Emits the discovered starts as the existing entries fact -> the existing name_function/add_function commit seam (no new commit arm). Requires the Listing (option listing on) - a no-op when the Listing is absent. Four values, each a cumulative setting of the walk. `off` (default) runs no walk: Ghidra ships setDefaultEnablement(false) with the warning 'IT MAY CREATE A LOT OF BAD CODE!', a speculative gap-filler can create false-positive functions, and it is real-ELF path only, so every parity gate is byte-identical. When the processor spec declares kuna.aif.sectionInstructionStride and executable section headers supply the origins, every enabled mode probes slots counted from each section start. With only segments or raw mappings, the ordinary cursor applies. Ordinarily, `on` slides the gap cursor ONE BYTE at a time, because the undefined-byte partition is byte-granular by construction (first_undefined_after), so every byte of every hole is a candidate function start and both acceptance tests are applied to addresses that cannot be instruction boundaries at all; a candidate starting mid-instruction reads the tail of one encoding plus the head of the next, and that synthetic pair matches a common prologue about as often as a real one does. On the reported 3.4 MB stripped i386 PE, the byte cursor contributes 5,913 entries of which 2,067 land inside a function IDA decodes as one body, and 737 of those are inside a function kuna itself already has an entry for (GH-299). `strict` advances the cursor to the next 4-byte boundary instead and probes a candidate only when it is 4-byte aligned OR is the first byte of its hole: a hole boundary is evidence, since the recursive-descent walk decoded up to exactly there and stopped, while an interior byte the cursor slid onto is a guess. The exemption is also what keeps the aif_gap_x86_64 fixture green, whose indirect-only function at 0x13ae is 2-mod-4 but IS a hole start. The ordinary strict cursor uses 4 bytes deliberately: 16-byte alignment kills 91 percent of the bad Cortex-M entries but takes 80 percent of the real ones with it. The removal is not only a precision win: because an accept advances the cursor past the accepted body, a phantom accepted one halfword inside a literal pool CONSUMES the real function behind it, so declining that probe recovers the true entry. Measured bidirectionally over 110 stripped non-x86-64 decbench binaries against each stripped image unstripped twin symbol table: mid-body entries 11,010 to 6,728 (a 38.9 percent cut) and ground-truth recall 44,613 to 44,957 of 50,724 (plus 344). On the two large PE witnesses, mid-body entries 339 to 135 on a 590 KB i386 crackme scored against its unstripped twin (zero of its 636 AIF-recovered real entries lost, 9 gained) and 421 to 293 on IDA Pro 9.2 win32_remote32.exe (3 of 157 lost). u-boot A32, the image DIV-20 exists for, gains 56 functions at O2 and is unchanged at O2-noinline. The worst single-image cost is CMSIS_DAP.axf, where only 73.5 percent of ground-truth entries are 4-aligned and three Thumb functions at 2-mod-4 interior addresses are lost. This does NOT reach the acceptance bar pre-registered for the default (a 60 percent corpus cut and 100 or fewer crackme mid-body entries), so the aligned cursor reaches the default path through the aggressive preset (which `auto` picks under 500 KiB) and GH-299 stays open. The issue's other direction - reject a candidate bracketed by a known function - costs u-boot 195 of 1,759 recovered functions when the bracket is read off the Listing's entry-ordered function model; it ships as aifbracket, which proves the bracket from the candidate's own flow instead. `precise` is `strict` plus upstream Ghidra's SECOND fingerprint test (GH-313), so a gap candidate that corroborates nothing is refused instead of accepted on four functions sharing its prologue. AggressiveInstructionFinderAnalyzer rejects a candidate twice: startCount < 4 at line 278, and then numInstr <= 2 || (!addsInfo && startCount < 50) at line 367, whose comment reads 'if the routine doesn't add good info, it must start like a large numbe of other functions'. kuna's port of the first test and the numInstr half of the second dropped the addsInfo clause, so under `on` and `strict` a self-contained routine that calls nothing, jumps nowhere known and merely reaches a ret becomes a function on a two-mnemonic coincidence. Under `precise` an accept must EITHER add information - a call, or a jump into already-discovered code, computed upstream's way rather than from kuna's looser adds_info, which also counts a plain fall-through out of the hole and therefore fires on exactly the mid-body phantom this is meant to catch - OR match a prologue that 50 discovered functions share. A refused candidate still CONSUMES its body, because refusing an accept without that would hand the gap cursor back to the interior of the same hole: without the pairing the 3.4 MB PE witness turns a 361-entry mid-body cut into a 222-entry mid-body RISE. Applied only at the gap-walk accept; the raw Thumb-prologue seed, the code-pointer-table seed and the pointer-target validator carry their own corroboration and are untouched. MEASURED OUT FOR THE DEFAULT PATH, which is why no preset sets it. Over the same 110 stripped non-x86-64 decbench binaries, each scored against its own unstripped twin symbol table and compared with `strict`: AIF-marginal mid-body entries 6,728 to 4,653 (a 30.8 percent cut) but ground-truth recall 44,957 to 44,107 of 50,724 (minus 850), with recall raised on ZERO of the 110 images. The two u-boot A32 images, which carry 66 percent of AIF's corpus-wide true recall and are what DIV-20 exists for, lose 84 real functions at O2 and 141 at O2-noinline; CMSIS_DAP.axf loses 16. The PE witnesses are worse: a 590 KB i386 crackme gives up 24 real entries for 16 mid-body ones, and the 3.4 MB stripped i386 PE of GH-299 gives up 1,100 IDA Pro 9.2 agreed entries for 361. A threshold grid over 4, 8, 12, 20, 50 and 100 finds no escape - 4 is the existing fingerprint floor and so inert, and u-boot O2-noinline is already down 79 functions at 8 - so the upstream literal 50 is kept. What upstream assumes, that a function worth finding calls something the analyzer already knows, does not hold for the bare-metal ARM firmware that is AIF's remaining justification in kuna, where the routines only AIF can find are the leaf helpers that call nothing. Speed is inside the budget (interleaved min-of-4: minus 4.3, plus 2.5, minus 0.6 percent). The gap walk also refuses a candidate whose own flow rejoins the known function around it unless boundary evidence says a function starts there (GH-299, formerly the aifbracket option), and it never plants an entry on nop padding or zero fill: zero fill is not probed, padding ending at a known entry is not probed, and an accept behind padding lands on the first instruction after it (formerly aifnoppad); both run whenever this pass does."
use_when = "Off (default; no Listing consumer runs and there is zero behavior change, and a speculative gap-filler can create false-positive functions). Set `on` (with option listing on) when a function is reachable ONLY through an indirect/data path (its address taken into a .rodata function-pointer table and called via call *reg with an opaque index) - so it is in no symbol table, has no .eh_frame FDE, and no static CALL edge points at it, leaving it an undefined gap that entry discovery cannot reach. AIF's fingerprint+validity gap-walk recovers it as a named sub_<addr>. `on` is also what the decompile-all, decompile-project and functions drivers inject on a non-x86-64 image when the selected mode names no aif value (`--mode reliable`), and it reproduces the GH-299 measurement exactly. Set `strict` (what the aggressive preset sets, and so the default path under 500 KiB; every number above was measured there) for a stripped image whose function list is far longer than the binary can hold, or that contains a sub_<addr> sitting on an ordinary call or mov in the middle of another function - and especially when two overlapping entries decompile the same instructions twice: it cuts mid-body entries 38.9 percent AND raises recall by 344 over 110 stripped non-x86-64 binaries. Go back to `on` if a function you know is real disappears on an architecture whose function starts are not 4-byte aligned (Thumb allows a 2-mod-4 start; three are lost on CMSIS_DAP.axf). An explicit `--option aif on` after the aggressive preset replaces its `strict`. Set `precise` only when you are reading a stripped image for PRECISION rather than coverage and would rather miss a real function than chase a sub_<addr> that is not one: a triage pass over a huge stripped binary where the function list is the artifact, or a comparison against a reference decompiler where a mid-body entry is worse than a gap. Expect to lose roughly one real function for every two phantom entries it removes compared with `strict`, and expect that ratio to be much worse on bare-metal ARM firmware and on large i386 PEs. If you are hunting mid-body entries and want to keep recall, use `strict` - it is the one that removes them and raises recall."
example = "--option listing on --option aif strict"
source_decompiler = "kuna"
inspiration = "Ghidra AggressiveInstructionFinderAnalyzer (speculative gap-fill, fingerprint histogram, checkValidSubroutine, default-off; line 367, the second of its two fingerprint rejects - numInstr <= 2 || (!addsInfo && startCount < 50) - whose addsInfo half was never ported); PseudoDisassembler.followSubFlows; GH-299 (the aligned cursor; Ghidra's reference analyzer defines pc-relative literal targets as DATA before AIF runs so the pool is never an undefined gap there, and poolentry solves the same phantom on ARM by inferring the pools from their references); GH-313 (the corroboration test)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "function reachable only through a rodata function-pointer table never discovered|undefined gap between functions that clearly holds code|call *reg targets missing from the function list|a stripped binary reports far more functions than it has|a discovered function starts in the middle of another functions body|a sub_ entry lands on an ordinary call or mov instruction rather than a prologue|two overlapping functions decompile the same instructions twice|aif adds thousands of entries a reference decompiler does not agree are functions|an arm function entry lands one halfword before the real prologue|a sub_ entry lands on a routine that calls nothing and only falls off the end of a hole|aif accepts a function on nothing but four other functions sharing its first two instructions|a stripped function list is full of leaf routines that are not functions"
