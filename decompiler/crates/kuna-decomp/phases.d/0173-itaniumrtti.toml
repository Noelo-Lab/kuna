[[settable]]
option = "itaniumrtti"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-itaniumrtti"
summary = "On a GCC/Clang-built C++ ELF or Mach-O, run the Itanium RTTI + vtable recovery pass -- a capability Ghidra does NOT have (its RttiAnalyzer is a Microsoft-PE analyzer, and its GCC class recovery is script-tier: RecoverClassesFromRTTIScript / RTTIGccClassRecoverer, never auto-analysis), so on a stripped g++ binary Ghidra leaves the Shape vtable as DAT_00107a80. kuna reconstructs it during auto-analysis, directly from the Itanium C++ ABI layouts. On an ELF, discovery is EXACT rather than a byte-pattern scan: the three __cxxabiv1 typeinfo vtables live in libstdc++, so every _ZTI... typeinfo object's leading vptr word is an UND dynamic relocation naming __class_type_info / __si_class_type_info / __vmi_class_type_info with addend 2*ptr -- the relocation's r_offset IS the typeinfo address and its symbol IS the flavour, and `.rela.dyn` is a loader input that `strip --strip-all` cannot remove from a shared object. A defined _ZTI... OBJECT symbol is a second discovery source (unstripped / static link), its flavour sniffed from the object's shape. Each typeinfo's _ZTS... type-name string is demangled to the class name by wrapping it back into the _ZTS symbol form and reusing the existing cpp_demangle Itanium arm (the exact analog of the MSVC ??_R0...@8 wrap; ZERO new demangler code), and its base list gives the inheritance DISPLACEMENTS. Vtables are then reached from the typeinfo, not guessed: one scan finds every pointer slot holding a discovered typeinfo address (a sub-vtable's second header word), and two exact ABI constraints reject the coincidental hits -- offset-to-top is always <= 0, and a real sub-vtable has >= 1 slot pointing into an executable section. A slot whose file word is 0 but which carries a dynamic relocation is an IMPORTED virtual method (__cxa_pure_virtual, a base method in another image); the walk steps over it instead of terminating, so an abstract interface keeps its true extent. Emits Data symbols `<C>::typeinfo`, `<C>::typeinfo_name`, `<C>::vtable`, and for a secondary sub-vtable the base subobject its displacement identifies (`Widget::vtable_for_Drawable`); a Function symbol `<C>::vfunc_<i>` per virtual slot (`<C>::vfunc_for_<Base>_<i>` in a secondary sub-vtable), with an inherited slot attributed to the class that DEFINES it rather than to whichever vtable the scan reached first (so Shape::perimeter, repeated in Circle's and Square's tables, is named once for Shape); and the slot arrays as read-only ranges. Where the Listing is built, it also names constructors and destructors: a function that stores a class's vptr through `this` (its first parameter, followed through frame spills along the fall-through path of its p-code) is `C::~C` when it sits in that class's own primary vtable and its stores make it C's, all of them and also those before any call or conditional branch (a `Release` testing its count before `delete this` stores after one; a `reset` that rebuilds `*this` with a polymorphic member, or builds a derived class in place, also stores that other vptr), and when the class's shaped slots are a D1/D0 pair: two neighbours, or one whose next slot calls it or, for clang's abstract class, only traps (a lone shaped slot beside an ordinary method is a placement-new rebuild or a `delete this` with a non-virtual destructor; a third, or two apart, also leaves the class alone; a virtual method returning its class by value, which reads its `this` from the second parameter or returns the slot's address, is not shaped), and so is the next slot when it calls that function (the deleting destructor); it is `C::C` when it sits in no vtable, the class or a base has a virtual destructor, every store goes through `this` reloaded from the function's own frame spill (unoptimized code: an optimized by-value factory, placement-new helper, holder constructor or `delete p` wrapper stores exactly as an inlined constructor does, so optimized constructors stay unnamed; a `this` re-stored to a second slot with no call after it is an inlined always_inline constructor's parameter), no call before a store but one passed `this` (a by-value return slot spilled across other calls stores the same way), and, when the class has a base, every store follows a call (a destructor, such as a pure virtual one in no slot, stores first); a factory that inlines the constructor stores through operator new's result and keeps its own name, and a function the symbol table already names keeps that name alone. On a Mach-O the anchor is a bind to __ZTVN10__cxxabiv1..._type_infoE: a chained-fixup bind with addend 2*ptr, or a classic LC_DYLD_INFO bind, whose addend the bind replay does not keep, accepted on the name. The walk reads a copy of the sections in which every chained-fixup slot holds what dyld writes (a rebase's target, 0 for a bind), and clears bit 63 of a name pointer (Apple's non-unique-typeinfo flag). ELF and Mach-O only (registered in passes_for for those two formats, and the pass self-gates in run), and an image with no __cxxabiv1 typeinfo relocation or bind and no _ZTI symbol produces nothing, so every other image is byte-identical."
use_when = "On by default: a GCC/Clang-built C++ ELF or Mach-O carrying polymorphic classes -- especially a STRIPPED one, where the relocation anchor is the only surviving type information -- gets its class names, inheritance graph and vtables recovered (an unnamed DAT_* vtable slot becomes `Shape::vfunc_2`, the raw .data.rel.ro bytes become `Shape::typeinfo` / `Shape::vtable`, and with the Listing a constructor call `sub_14ea(v3,2,5)` becomes `shapes::Circle::Circle(v3,2,5)`). Inert on a PE image, on a binary built -fno-rtti (google/leveldb is such a build: 18 _ZTV symbols, zero _ZTI/_ZTS, zero __cxxabiv1 relocations), and on plain C. Flip off to keep the vtable data unnamed."
example = "option itaniumrtti on"
source_decompiler = "kuna"
inspiration = "Itanium C++ ABI 2.9.5 / 2.5.2 (type_info + vtable layout). Ghidra has no equivalent analyzer."
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "gcc/clang c++ class names missing and vtables left as unnamed DAT_ data|no Class::vtable or typeinfo labels in a stripped elf or mach-o with polymorphic classes|virtual dispatch slot resolves to sub_<addr> with no class"
