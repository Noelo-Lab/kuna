[[settable]]
option = "retsplitglobal"
values = "on|off"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "repipe-simd-constant-string-initializer"
summary = "Stop a shared RETURN block that stores to MORE THAN EIGHT globals from being cloned into every predecessor. `ActionReturnSplit::isSplittable` (blockaction.cc:2242) decides whether a multi-predecessor RETURN block is a bare epilogue -- cheap enough that giving every predecessor its own private copy is free. It admits only MULTIEQUAL, COPY and RETURN and, for COPY, checks only that no INPUT is free. It never looks at the COPY's OUTPUT. Upstream that is harmless because the epilogue COPYs it was written for move registers, which die at the return; a COPY into a PERSISTENT Varnode is a store to a global the program can observe, and it is exactly what the C prints as `dat_<addr> = ...`. Both splitters share this one predicate -- upstream ActionReturnSplit and kuna's ActionReturnDup (`returndup`) -- which is why `option returndup off` does not stop the cloning: the goto-driven upstream action picks the block up instead. A macOS crackme initializer ends in one 72-store block reached three ways and kuna emits it three times, 216 statements, 46% of the function. Nothing about that is incorrect (node_split gives each clone its own in-edge, so every copy runs on exactly one path); it is a readability defect, and the fix is a BOUND rather than a veto, which is the house style of this phase -- `crossjumprevert` and `dedupitetail` cap a duplicated leaf run at 8 printed ops, `gotoreduce on` a return tail with a call at 12. A two-store epilogue is cheap to clone and reads BETTER cloned, because the merged form needs a phi per global and can print a global's own value back into it on a path where the binary stores nothing; seventy-two is not. Only COPY is counted: a MULTIEQUAL writing a persistent Varnode is a phi, not an observable write, and RETURN writes nothing. `Heritage::guardReturns`' synthetic `glob = glob` self-copies are excluded two ways, either sufficient -- the `return_copy` flag and input and output naming the same storage -- because those are liveness markers, one per persistent global, present before every RETURN in every function that has a global, and counting them would price a bare epilogue by how many globals the whole PROGRAM has. Declining is one-directional: it can only ever make a split NOT happen, so it cannot create a duplication or change what the surviving merged block does."
use_when = "On by default. Keep it on when the same long run of `dat_<addr> = ...` statements is emitted two or three times in one function, once per path that reaches the exit -- a compiler-shared epilogue that fills message or table globals, where the reader has to notice the blocks are identical before any of them can be read. Flip OFF to restore upstream's predicate and get the per-predecessor private epilogues back (byte-identical to upstream), which is the right call when you are following one path at a time and want each exit's stores inline rather than merged behind a phi. Inert unless a shared RETURN block stores to more than eight distinct globals, so a small epilogue still splits exactly as upstream, and inert on any function whose epilogue only moves registers however long it is."
example = "option retsplitglobal off"
live_field = "ret_split_global"
live_true = "on"
live_false = "off"
source_decompiler = "kuna"
inspiration = "repipe:simd-constant-string-initializer, 653d88600f4238b24302b0ec (macOS x86-64 Crackme0x04) sub_100003790; upstream ActionReturnSplit::isSplittable (blockaction.cc:2242) shared with kuna ActionReturnDup"
change_kind = "presentation-default"
tier = "transform"
symptoms = "the same run of dat_<addr> = ... statements is emitted two or three times in one function|a long global-filling epilogue is duplicated once per path that reaches the return|option returndup off does not stop a shared epilogue from being cloned|46% of a function's text is three copies of one exit block"
