[[settable]]
option = "flirt"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-flirt"
summary = "Name library functions in a stripped binary with IDA FLIRT .sig signature files (versions 5 to 11; raw, deflate, zlib or zstd bodies) named by the KUNA_FLIRT_SIGS environment variable (a :-separated list of files or directories; IDA ships them under <ida>/sig/<processor>). A Listing consumer: at every discovered function entry the signature trie is walked over the first pattern_len bytes, and a module matches when the byte-swapped CRC-16/X.25 of its crc_len bytes after the prefix, its tail bytes and its expected instruction bits agree. A module that names a referenced function is accepted only when the instruction at the reference offset branches, calls, or (x86) holds the 32-bit address of a function of that name; names found in one round satisfy references in the next, for up to three rounds. Modules that disagree on the name are scored by their reference sites (+4 for a site whose target has the expected name, -4 for another name, 0 unnamed); the strictly best name wins and a tie names nothing. A module wholly inside the trie prefix is dropped when a site contradicts it. A name given to two addresses, or one the binary already carries, is withheld; a bare-return entry, startup signatures and signatures whose file-type mask excludes the binary are never used. The names go out through the FID rename, so only a sub_ placeholder is replaced. Requires the Listing (option listing on); inert without a signature file."
use_when = "Off (default). Flip on with listing on and KUNA_FLIRT_SIGS pointing at .sig files (for example IDA's sig/pc/glibc_amd64.sig for a static x86-64 glibc binary) when a stripped statically linked binary shows hundreds of sub_ functions that are library code."
example = "KUNA_FLIRT_SIGS=$IDADIR/sig/pc/glibc_amd64.sig kuna functions ./static-stripped --option listing on --option flirt on"
source_decompiler = "kuna"
inspiration = "IDA FLIRT library function recognition (AU_LIBF rounds, version-11 reference-site checks, ambiguity arbitration)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a stripped static binary lists libc functions as sub_<addr>|kuna cannot use flirt .sig signatures|memcpy and printf in a static binary have no names"
