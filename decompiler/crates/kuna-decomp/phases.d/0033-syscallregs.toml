[[settable]]
option = "syscallregs"
values = "off|auto|on"
default = "auto"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "kuna-syscallregs"
summary = "Give the system-call instruction of ARM and AArch64 (`svc`), RISC-V (`ecall`), MIPS (`syscall`) and PowerPC (`sc`) the registers it reads and writes, so the value a function reads back after the call is the call's result. The SLEIGH specs lower each of them to a CALLOTHER with no register inputs and no output, so kuna is told nothing changes: whatever the function put in the result register (`r0`, `x0`, `a0`, `v0`, `r3`) to set the call up is still there afterwards. A wrapper that moves its arguments into place returns them as a register pair (`return CONCAT44(a0,a1);`), a MIPS wrapper returns the syscall number it loaded into `v0` (`return 0xfa4;`), and a later test of the result tests the argument instead. When it acts, the CALLOTHER is rewritten in place before heritage: it writes the result register, and it reads the number register and then the argument registers in order, each only while the function writes it on every path to the call with no call in between, so a printed argument is always in its own position and no undefined register becomes a parameter. The pair goes away with it: return recovery treats the rewritten call as a call site, so a value it reads as an argument is not also a returned half, even where the function discards the result and the kernel-preserved argument register still reaches the RETURN, and the same value stays free to be the next call's argument. On MIPS and PowerPC the call also writes the register the kernel flags a failure in, `a3` (0 or 1) or `cr0` (its summary-overflow bit), with an opaque `syscall_error()` placed right after it, so the C library's test after the call reads that flag rather than the function's entry `a3` (a phantom fourth parameter) or a `cr0` nothing set; each flag is its own value (two calls' flags are never folded or merged into one), it is never taken as a later call's argument, and it is printed at its definition when another call or system call comes between it and its use. That phantom `a3` used to pull a MIPS wrapper's real parameters in with it, so a MIPS system call also reads, written or not, up to as many argument registers as the kernel's entry point for its constant number takes (a table built from the kernel's o32/n32/n64 syscall tables), and up to all of `a0`..`a3` when the number is not a known constant, each only while no call can have changed it since the function's entry or its write (o32 does not preserve `a0`..`a3` across a call): a `read` wrapper that hands its three parameters to the kernel in place keeps them, and no value from before a call is printed as an argument. `auto` acts only on an image the loader identified as a program for an operating system's user space (an ELF with a Linux/BSD `EI_OSABI`, a `PT_INTERP`, a dynamic section naming a shared object, or an ABI-tag note), because a bare-metal RTOS uses the same instruction for a context switch or a privilege change and keeps live values in the result register across it; `on` acts on any image. Writable default-data and stack ranges have unknown effects across the call, so a buffer loaded after the instruction reads memory the kernel may have replaced instead of the pre-call stored value. A CALLOTHER a compiler spec has specialized with its own `<callotherfixup>` is left alone, and x86-64 keeps its own model (`x64syscall`)."
use_when = "Default `auto`: on a Linux or BSD program or shared library the kernel returns a value in the result register, so the system call writes it there. Set `on` for an image that does not say what system it runs on but whose system calls do return a value: a relocatable object, a raw image, a statically linked musl or uClibc program (no ABI note), or an RTOS that returns in the result register. Do not set `on` for bare-metal code whose SVC handler preserves the registers (FreeRTOS's `svc 2` privilege raise and `svc 0`/`ecall`/`sc` yields): the call then hides the value the function kept in the result register. Set `off` to restore the vendored zero-effect CALLOTHER everywhere. Limits: outside MIPS, arguments a wrapper hands to the kernel untouched are not read, and the argument list stops at the first of them, so a pass-through wrapper prints the number alone and a later argument the function does write is left out too (and can then still be taken as the high half of a returned pair, as with `off`); on MIPS a call whose number is not a known constant (a `syscall` dispatcher) reads `a0`..`a3`, so a test of its flag still reads as a fourth parameter there; a call that sets up fewer registers than the kernel's entry takes, with no call before it, shows the rest as the function's parameters (the kernel does read them); a register that crossed a call is not read, which stops the list there as without the table; and the o32 arguments past `a3` the kernel takes from the stack are not read; the MIPS `v1` a few calls return a second value in is not modelled; an image whose handler preserves `a3` or `cr0` reads the opaque flag where it kept its own value; a function that really returns, as the high half of a 64-bit value, a register it also handed to the kernel loses that half. MEASURED: byte-identical (0/675) on the datatest corpus, where `auto` is inert by construction (the XML bootstrap sets no loader fact). decompile-all `auto` vs `off` over 25 stripped binaries (24,212 functions): the 12 with no operating-system marker are byte-identical -- 7 ARM firmware images (U-Boot, NuttX, FreeRTOS, ChibiOS, Betaflight, Cleanflight, Crazyflie), FreeRTOS RTOSDemo, p2im, a static uClibc MIPS busybox, two RISC-V Keystone enclaves -- and so are two x86-64 Linux programs, where the option does not apply, and the PowerPC64 loader, which has no system call. In the other 10 Linux images (the glibc loaders of AArch64, ARM EABI, ARM hard-float, MIPS, PowerPC and PowerPC64LE, AArch64 libc.so.6, an ARM hard-float server, a MIPS program and a static PowerPC64LE program) 954 functions containing a system call change: 157 register-pair returns become single returns; 5 wrappers that pass their first argument through and write a later one (`sigpending`, `pipe`, `symlink`) now return a pair whose low half is the result, where `off` returned the later argument register on the success path. Another 528 functions without one change, 374 only in variable numbering and the rest in types, casts or arguments inherited from the wrappers they call. The MIPS/PowerPC error flag (GH-857), decompile-all before vs after over 26 images (34,482 functions): 3,426 functions change, all in 19 Linux MIPS and PowerPC images (C libraries, loaders, libgomp and static programs); two static uClibc busyboxes, an AArch64 loader, a PowerPC64 loader and three small MIPS programs are byte-identical. 2,715 now test `syscall_error()` where they read the entry `a3` or an unset `cr0`, among them wrappers whose error test had folded to a constant because they loaded `a3` as the fourth argument (`lutimes` always returned -1, `getcontext` always took its error path); 149 show a system call's arguments it did not read before or a caller dropping the phantom argument its callee lost; 551 are struct renumbering and 11 type spellings inherited from a changed callee. No MIPS function loses a parameter its C prototype has: of the 785 that print fewer parameters than before, the 555 that glibc's headers declare by name keep every register parameter they declare (the variadic `open`/`open64`, `ioctl`, `fcntl` and `sysmips` lose only the phantom `a3`; the three with two parameters are the GLIBC_2.3.3 versions of `sched_getaffinity`, `sched_setaffinity` and `pthread_getaffinity_np`), and the other 230 drop only positions past the system call's kernel count, registers the function sets itself before the call, or (two setxid signal handlers) positions their code never reads; 57 gain parameters the kernel reads (`fchownat`'s flags, the `__mips_syscall5`/`6` dispatchers). 11 MIPS system calls print one argument fewer than before: the `a3` past the kernel's count that held an earlier call's error flag. A detector run over 11 MIPS images finds none of 2,222 forced register reads crossing a call."
example = "option syscallregs on"
source_decompiler = "kuna"
inspiration = "GH-812: an inline ARM `svc` whose arguments sit in r0/r1 decompiled to `return CONCAT44(a0,a1);`, reported while reviewing #797"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "a function containing svc/ecall/syscall/sc returns its arguments as a register pair (CONCAT44 or undefined16)|a MIPS syscall wrapper returns the syscall number it loaded into v0|software_interrupt(0), CallSupervisor(0), ecall() or syscall() shows no arguments while the disassembly loads registers before it|a test of a system call's result tests the argument the function set up instead|a syscall wrapper returns its own first parameter|the same wrapper is right in a linked Linux program but wrong in its .o or a static musl build|a MIPS syscall wrapper grows a fourth parameter a3 it tests after the syscall|a PowerPC syscall wrapper tests an uninitialized cr0 after sc|a MIPS syscall wrapper that passes its parameters straight to the kernel shows none of them"
