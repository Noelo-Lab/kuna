[[settable]]
option = "widestrings32"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "GH-845"
summary = "Plant a typelocked wchar4[N] data symbol at each 4-byte wide string literal (a wchar_t literal of an ELF or Mach-O target, or a char32_t one), so the printer renders L\"hellow\" where it printed the literal's address (lenw(&dat_2004)). The matcher is the 1-byte one widened to 4-byte code units read in the image's byte order on 4-aligned addresses of read-only data: each unit a printable-ASCII (or tab/CR/LF) value, closed by a zero unit. An int table of character codes is byte for byte such a literal, and one that runs on past its zero ({97,98,99,100,101,0,7,8}, a switch lookup table) would be read past it, so a run is planted only when the image backs it as a string: no sized data object of the symbol tables overlaps it (a declared array keeps its name), and either it lies in a mergeable string section of 4-byte entries (a relocatable object's .rodata.str4.4), or it holds at least five units of at least three distinct characters, something points at its start (an operand the scan found, a pointer slot of a data section, a dynamic relocation), what follows its terminator past at most alignment padding is the next literal or object, not a next element (the section end, a table use or a symbol start whose first unit is no character or opens a string, or something an operand, a data slot or a relative-offset table names that opens a string: a zero-terminated wide run or a narrow string of four characters or more), and no code adds a computed index to an address inside it (lea rcx,t then mov eax,[rcx+rax*4]). An operand inside a run nothing points at starts the literal there. An ARM literal pool slot or an address built in two instructions (AArch64 adrp/add, MIPS lui/addiu) backs nothing, so a linked image of those targets plants only what a data slot holds. With operand_refs off the same decode runs for the operand targets and table uses alone. PE and COFF images, whose wchar_t is 2 bytes, are not scanned. The facts are committed before the 2- and 1-byte ones, so they win the address against operand_refs' one-character read of the same bytes."
use_when = "Off by default; the aggressive preset (the auto mode below 500 KiB) turns it on. A wide literal passed to the image's own function prints as its address (lenw(&dat_2004)) or as its first character, while a libc callee with a wchar_t prototype already shows L\"...\". Flip ON to see those literals (on a large image it adds operand_refs' linear decode). Flip OFF when a stripped image's int table of character codes prints as a wide literal: one that ends at its zero, the rows of a 2-D code table, adjacent code tables, a code table followed by a string (a char name[8] field), or a fixed-size code table padded with zeros (int t[8] = {97,98,99,100,101}), where code reading past the first zero reads zeros in the binary but past the literal in the printed C."
example = "option widestrings32 on"
source_decompiler = "kuna"
inspiration = "Ghidra StringsAnalyzer's allCharWidths setting (the UTF-32 arm); issue #845, where lenw(L\"hellow\") printed lenw((int *)\"h\") and then lenw(&dat_2004)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a wchar_t or char32_t string literal argument renders as an address such as &dat_2004|a wide literal renders as its first character in a narrow string|L\"...\" appears only where a libc wide-string prototype types the argument|a wide default such as s = L\"(NULL)\" renders as s = &dat_2038"
