[[settable]]
option = "gobool"
values = "off|auto|always"
default = "auto"
destructive = true
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "kuna-multilang-gobool"
summary = "Narrow a Go boolean return's stale-high concatenation. Go's ABI materializes a bool result as 0/1 in the LOW BYTE of the return register and leaves the upper bytes unspecified: the compiler emits a bare SETcc with no zeroing XOR, so the lifted value is PIECE(stale7, bool1) feeding the RETURN and the C prints the CONCAT71 artifact (v = CONCAT71((undefined7)(v >> 8), x == y); return v & 0xffffffff). SubvariableFlow's return pull rightly refuses to narrow it - nothing proves the high bytes zero - and rustc never shows the shape because it zeroes first. The rule rewrites such a RETURN to read ZEXT(bool) instead, asserting the ABI fact the way rustabi asserts the ScalarPair: the stale bytes are unspecified, so zeroing them is the declared reading, and the dead concatenation is collected by ordinary dead-code elimination. The low byte must be a genuine boolean definition (a comparison, carry/borrow, boolean logic or float predicate opcode); any other 7+1 concatenation is left alone. At auto (default) the rule acts only when the image's source language is Go; always drops the language test (stage-test bytechunks); off keeps the faithful concatenation."
use_when = "Leave auto: Go functions returning bool stop printing CONCAT71 noise and return their comparison directly. Use always on a Go function carved into a bytechunk where detection has nothing to read; off only to audit the raw register dataflow."
example = "option gobool off"
source_decompiler = "kuna"
inspiration = "The Go internal ABI's bool result materialization (SETcc into the low byte, upper bytes unspecified), read the way rustabi reads rustc's ScalarPair"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "go function returning bool prints v = CONCAT71((undefined7)(v >> 8), a == b) instead of returning the comparison|return value masked with 0xffffffff around a boolean|undefined7 casts feeding a concatenation at every boolean return"
