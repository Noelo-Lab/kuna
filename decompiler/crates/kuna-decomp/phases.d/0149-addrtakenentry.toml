[[settable]]
option = "addrtakenentry"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "GH-1039"
summary = "Make code whose address the program takes, and that no flow reaches, a function entry. The Listing walk creates a function only at a CALL target, so a function only ever called through a pointer - a handler a registration stub stores with lea rax,[rip+handler], a callback handed over in a register - was never decoded, and the extent bounder folded its bytes into the function before it; on an x64 PE such a frame-less leaf has no .pdata record either, so no entry oracle named it (GH-1039: 2,065 swallowed starts on one 16 MB MSVC image). Two kinds of evidence name a candidate: a decoded instruction materializes its address (a RIP-relative lea, a mov of an immediate into a register or memory, a push of an immediate, read off the instruction bytes), or, on a PE, a base-relocated word holds it and it lies before the first RUNTIME_FUNCTION of its section, the span the relocation oracle's .pdata hull guard leaves out (the span past the last record, and a section with no record, stay out). A candidate becomes an entry only when it is undecoded executable memory; the instruction before it (decoded, or accepted by this pass in address order) does not fall through and only padding or zero fill lies between them, or between it and its section start; its own flow, decoded inside its gap, ends on every path in a return, a computed jump, a trap, a call followed by padding, or a jump to a known function entry, never falling out of the gap into other code or jumping into the middle of decoded code, with no ret reached above the entry stack and no leave on a path that never set the frame pointer (a frame torn down it never built), and no instruction that is zero fill or hlt (a MinGW delay-import descriptor in .text decodes to add [rax],eax ; add [rax],al ; ... ; ret 0); and it is not a computed-goto or threaded-interpreter label - inside a taker's region that holds a register- or memory-indirect jmp (not jmp [rip+slot]), a candidate followed by more of the region's code, or whose own code dispatches, is refused. Accepted entries re-seed the walk, which resumes from the Listing it has instead of rebuilding it, so their callees and the addresses their own code takes are found too, for at most four rounds. Measured with each stripped image scored against its own symbols: 7 x64 MSVC PEs with a .pdb gain 283 true starts and lose none, with no entry inside a sized function body; of their 870 other new entries 696 are /INCREMENTAL jmp thunks the pointers name and the rest 16-aligned starts in spans the .pdb has no symbol for; 115 MinGW x64 PEs gain 2 true starts; 830 x86-64 ELFs (663 decbench twins, 167 crackmes, PIE and non-PIE) are unchanged, .eh_frame already naming every function a pointer reaches; without .eh_frame, twelve gcc/clang builds of a computed-goto interpreter are unchanged. On jormungandr.exe the 612 relocated pointers into its UTF-16 locale table, before its first record, are all refused. x86-64 only, and not on a Go binary, whose pclntab already names every function (re-seeding one lets the walk split runtime.duffzero at the calls into its middle); on i386 every address is an absolute immediate and the same shape names MinGW SJLJ landing pads (40 i386 PEs: 210 true starts gained, 574 lost, 4,974 mid-body entries). Known limits, both hand-written assembly: a pushed return address (lea rsi,[cont] ; push rsi ; jmp f) and a lea'd .text data table whose first byte is 0xc3 pass. Inert where the walk's set is not committed (reliable mode on x86-64)."
use_when = "On (default) gives a function reached only through a pointer its own entry and extent, so a callback or handler a registration stub stores with lea, or a leaf a relocated table names ahead of the first .pdata record, is listed and decompiles under its own name instead of inside the function before it. Flip off to restore the previous discovery set exactly, for instance to compare against a function list taken before this option existed, or when a hand-written assembly label that the code takes the address of is listed as a function."
example = "--option addrtakenentry off"
source_decompiler = "kuna"
inspiration = "GH-1039 sections 1 and 2: a stripped zig/MinGW x64 build whose handler 0x140001040, stored by lea rax,[handler] in a registration stub, sat inside a 32-byte sub_140001030, and whose three .data-table handlers ahead of the first RUNTIME_FUNCTION the relocation oracle's hull guard dropped; Ghidra's OperandReferenceAnalyzer likewise creates a function at code an instruction operand references"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a function called only through a pointer is missing from kuna functions|kuna xrefs reports a data reference to an address kuna functions does not list|a registration stub's size covers the handler after it|decompile --addr at a lea target prints a body no listed function has|relocated handler pointers before the first .pdata record are not functions|a frame-less leaf with no .pdata record is folded into the function before it"
