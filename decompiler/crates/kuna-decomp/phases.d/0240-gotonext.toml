[[settable]]
option = "gotonext"
values = "on|off"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P9"
issue = "kuna-gotonext"
summary = "Leave out a `goto` whose target is the statement that runs next anyway, print a `goto` to the statement after the innermost enclosing loop or switch as `break;`, and drop the label only those gotos reached. Upstream `PrintC::emitBlockGoto` prints a `BlockGoto`'s jump only when `BlockGoto::gotoPrints` holds (the target is not `nextFlowAfter` of the parent chain); kuna printed every such jump, so a switch case falling into the next case and an `if` arm ending in a jump to the statement after the `if` printed `goto label_X;` directly above `label_X:`. `kuna_gotonext` walks the final structured tree at print time, after every structuring pass that edits it, so its view is the printed layout: it reads `nextFlowAfter` with one addition, that a switch case whose body prints no `break;` falls into the next case even when the body is not a `BlockGoto`. A `goto`, `if (c) goto` or bare-goto switch arm whose target is what follows the innermost loop or switch holding it prints as `break;` while `loopbreak_recovery` is on (`scopeBreak` already lowers most of those during `ActionFinalStructure`; the passes that edit the tree after it leave the rest). The case sort also re-derives each fall-thru chain from the case blocks before sorting: `grab_case_basic` read the chained case's switch out-index from sblocks edges, which a case wrapped in its own `BlockGoto` has lost, so a chain was missed or pointed at the case itself and the sort printed that case first under label 0; with the chain right, a case that jumps to another case prints directly before it and falls through. C output only."
use_when = "On by default: 0/675 datatest assertions move. Flip off to print every `BlockGoto` jump and to sort switch cases by the chains `grab_case_basic` recorded."
example = "option gotonext off"
source_decompiler = "ghidra"
inspiration = "upstream BlockGoto::gotoPrints; a gcc -O2 switch fall-through printed `case 0: ...; goto label_X; case 1: label_X:`, and clang -O2 printed `case 3:` first in the switch with a `goto` from case 2"
change_kind = "presentation-default"
tier = "core"
symptoms = "goto label_N; directly above label_N:|switch case falls into the next case through a goto|case N: label_X: right after a goto label_X;|an if arm ends in a goto to the statement after the if"
live_field = "goto_next"
live_true = "on"
live_false = "off"
