[[settable]]
option = "calltargettype"
values = "on|off"
default = "on"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "GH-869"
summary = "Give the target of an indirect call the function-pointer type the call itself states. Type recovery types a call target `code *`, a pointer to a function of unknown signature, which C cannot spell: under `ctypes` kuna prints it `void *`, so every call through one -- a dispatch table entry, a callback held in a local, a parameter, a global, an `ops->fn` field -- is a call of a `void *` that no C compiler accepts (`(**(void **)&tbl[a0 * 8UL])();`). With `on` (and `ctypes` on; without it the upstream `code *` spelling is left alone), `kuna_calltargettype` runs once every variable has its final type, just before casts are decided: for each indirect call it builds `R (*)(A1,..,An)` from the type of the call's output (`void` when it has none) and the type of each argument it passes (`void *` for an argument printed as an address computed from a base, `&v4` or `&a1[2]`), and keeps it only when the default model lays every parameter and the result out in the storage the call uses -- a `float` held as an `unsigned int` in `xmm0` or `s0`, or a `double`'s bits in `rdi`, would compile to a call that passes something else -- and no value the call overwrites is read after it. The storage the call goes through takes that type when every call through it states the same one and nothing it meets fixes another: a local; in C output also a parameter, whose prototype is declared with it (`int viaparam(int (*a0)(unsigned int,unsigned long),unsigned int a1)`), and a global; a local that receives a function's address only when that function's declared prototype is exactly the call's type; and a field of a synthesized record, which the project header declares with the type every call through it in the export agrees on (`void (*field_0x10)(void);`). In C output a target that still cannot be called -- its calls disagree, it is also used as data, or a declaration says `void *` -- is cast to its call's type at each call instead, and with the option on the C cast strategy treats a record's declaration and its completed definition as one type, so the casts between them go. The DWARF mapper, at load, maps a pointer to a prototyped `DW_TAG_subroutine_type` to a function pointer of that prototype, so DWARF parameters, fields and locals that hold a function pointer are declared as one (`unsigned long (*hasher)(void *,unsigned long);`). Rust output, which spells every pointer to code `*const ()`, is unchanged. On decbench -O2 gzip, dash, diff and bash under `decompile-project --mode aggressive` and gcc 11, the `called object is not a function` errors fall from 63 to 0 and the casts of `decompile-all` from 17,288 to 16,687; gcc's incompatible-pointer-type warnings rise from 247 to 312, where a function whose recovered prototype differs from the DWARF slot it is passed to was passed to a `void *` before."
use_when = "On by default: an indirect call's target takes the function-pointer type the call states, so a call through a table entry, a local, a parameter, a global or a record field compiles as C. It acts only with `ctypes` on, as `auto` at every size, `aggressive` and `fast` run (without it, as under an explicit `--mode reliable`, the upstream `code *` spelling is left alone), and never on Rust output. Set it off to get the upstream spelling of every call target back, for example when diffing against Ghidra."
example = "option calltargettype off"
source_decompiler = "kuna"
inspiration = "GH-869: an indirect call through a table entry prints `(**(void **)p)()`, which no C compiler accepts; the call already states the signature the pointer must have"
change_kind = "type-inference"
tier = "transform"
symptoms = "an indirect call through a table entry prints (**(void **)p)(), which does not compile|a local holding a function pointer is declared void * and called as (*v1)(a1,7)|a parameter, global or struct field holding a function pointer is declared void * and its call does not compile|a DWARF function-pointer parameter or field prints void *|called object is not a function or function pointer when the output is compiled"
live_field = "call_target_type"
live_true = "on"
live_false = "off"
