[[settable]]
option = "globalref"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "constant-address-global"
strength = "HARD"
rewind = "P9"
issue = "castcampaign-globalref"
summary = "Print a pointer-typed constant that addresses program data as the address of the global it names, `&dat_<addr>`, instead of the forced-hex integer behind a cast, `(struct_2 *)0x2b080`. `PrintC::pushConstant`'s pointer arm has no other spelling for a constant `ActionConstantPtr` could not link to an existing global Symbol, and a stripped image has none for most of its data, so every address a declared or recovered pointer type reaches keeps a cast; the type campaign made that commoner, mostly through `protoorder` stating a callee's recovered parameter types to its callers (coreutils `ls` -O0 went from `sub_e4ca(0x2b080)` to `sub_e4ca((struct_2 *)0x2b080)`). When on, the function records the global as an object of the pointed-to type and the `decompile-project` header declares it (`extern struct_2 dat_2b080;`), so `&dat_2b080` has exactly the constant's pointer type and the cast is gone because the object is declared at that type; its value is the address it replaces wherever `dat_2b080` is placed at 0x2b080. The name is the one kuna already prints for an unnamed global it reads directly. Refused, keeping the cast: an address outside every loaded section the loader classifies as program data (code, TLS templates, `.got`/`.plt`/`.eh_frame`/`.dynamic`/`.interp`, the ELF loader tables, import slots, or no section at all -- a pointer-typed `0x1` or `-1` is not an address); an address a global Symbol already covers; a value the same function also reads as a number (an ordering compare, multiply, divide, remainder or shift on a non-pointer, the `inferfuncentry` BUFSIZ shape); an address the function uses at two different pointed-to types; storage the function also reads or writes directly at another start, width or type (a two-, four- or eight-byte `undefinedN` is accepted against the unsigned integer of its size, the C type every surface spells it as); a pointer to code; and a `void *` reader for which C's implicit conversion is not exactly the conversion the cast performed (an argument, a returned value, a copy or store into `void *` storage and an equality test against another `void *` are). An address the function only ever uses through `void *` is declared at the one type the function reads it at directly, or as the unknown byte. The header declares one type per address and never a scalar that disagrees with a direct `dat_<addr>` access anywhere in the program, which would silently change what that access computes: a record some function takes the address of wins (a scalar access of it does not compile), then the one type the direct accesses agree on, then the taken types by size and count; direct accesses at two types declare nothing and a comment says so. Other types are listed in a comment on the line."
use_when = "On by default. Flip off to reproduce upstream Ghidra's (and kuna's pre-existing) `(T *)0x<addr>` spelling, or when a consumer greps the C for raw addresses. Measured over the 45-binary castbench corpus (coreutils fmt/ls/sort/du/cp/tail/wc, grep, gzip, diffutils, tar, find at O0/O2/O2-noinline): every one of the 1,883 changed lines is exactly the `(T *)0x<addr>` -> `&dat_<addr>` substitution, 1,979 casts removed (61% of the constant-address casts), no line added, removed or moved, and the output with the option off is byte-identical to the build without it. On the 4,815 functions kuna and IDA both emit, casts go 45,126 -> 44,001 (236.8 -> 230.9 per 1,000 lines, 1.193x -> 1.163x IDA); 486 functions have fewer casts and none more. Variables and types are untouched, so type_match cannot move (1,609 = 1,609 perfect on the 444-slice sweep). KNOWN LIMIT: a project header can hold one declaration per address. Over the 45 exports it declares 891 globals, 173 of them with another type listed in the comment (a record and the member at its start is the common case), where a body that used the other type now passes a pointer of the declared one -- a diagnosed incompatible-pointer warning, never a changed value; 60 addresses are left undeclared because the program reads them directly at two types. `gcc -fsyntax-only` over the 45 exports: 36,648 -> 36,471 errors, 14,962 -> 15,348 warnings."
example = "option globalref off"
source_decompiler = "ida"
inspiration = "IDA Pro names every referenced static address (`sub_E4CA(qword_2B080)`, `&dword_21148`, `&unk_1AA40`) and prints essentially no cast on a constant address, where kuna printed 1,118 on the functions both emit (the cast census, docs/features/globalref/analysis.md). kuna already had the naming scheme, `dat_<addr>`, for a global it reads directly; this extends it to one whose address is taken, and declares it at the type the function uses it at rather than at the width of the first access."
change_kind = "presentation-default"
tier = "core"
symptoms = "a call argument is a raw address behind a cast, like sub_e4ca((struct_2 *)0x2b080)|(unsigned long *)0x21180 or (void *)0x2b460 where IDA prints qword_21180 or &unk_2B460|getopt_long's option table prints as (option *)0x2a0c0|a loop runs from (int *)0x1a664 to (int *)0x1a690|the same global is dat_2b080 in one statement and (struct_2 *)0x2b080 in the next|a constant address you want to keep as an address (flip off)"
