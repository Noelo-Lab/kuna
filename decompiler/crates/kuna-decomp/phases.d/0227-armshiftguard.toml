[[settable]]
option = "armshiftguard"
values = "always|needed|never"
default = "needed"
destructive = false
phase = "P9"
subphase = "cast-policy"
strength = "HARD"
rewind = "P9"
issue = "arm-register-lsl-guard"
summary = "ARM only (inert on every other target): which register-controlled 32-bit LSLs print the range guard `(unsigned int)n < 32u ? (unsigned int)x << n : 0`. ARM shifts by the low byte of the count register and yields 0 for 32 through 255, where a C shift is undefined, so the guard is what makes the printed C compute the machine's value; it is also a `?:` the source never wrote. `needed` leaves it out when the count's non-zero mask (the bits it can set, from the engine's mask analysis re-derived over its definition at print time) lies below 32: a count masked with `& 0x1f` or narrower, a remainder, a narrow field, or a sum of such. That count cannot reach the guard, and the shift prints as any other C shift. `always` guards every register LSL whose operands can print twice; `never` prints the plain shift `x << (n & 0xff)`, whose C is undefined exactly where the count reaches 32."
use_when = "NEEDED by default: it only drops guards that cannot fire. Flip to never to read firmware bit-manipulation (`1 << pin`, `mask << (idx * 2)`) as the source wrote it, accepting that a count of 32 or more prints as the undefined C shift instead of the machine's 0; to always to see every guard, for example before recompiling the output to compare it with the binary."
example = "option armshiftguard never"
source_decompiler = "kuna"
inspiration = "decbench O2 ARM firmware: 331 functions printed `(unsigned int)(a0 & 0x1f) < 32u ? (int)((unsigned int)1 << (a0 & 0x1f)) : 0` for the source's `1 << (clken & 0x1f)` (libopencm3 rcc_periph_clock_enable), a branch no author wrote"
change_kind = "presentation-default"
tier = "transform"
symptoms = "(unsigned int)n < 32u ? ... << n : 0 around an ARM shift|ternary around a shift whose count is already masked with & 0x1f|firmware 1 << pin prints as a conditional expression|ARM shift by a register prints a range check the source does not have"
