[[settable]]
option = "wrapadd"
values = "on|off"
default = "off"
destructive = false
phase = "P9"
subphase = "cast-policy"
strength = "HARD"
rewind = "P9"
issue = "widened-signed-add"
summary = "Print a four-byte addition whose result a wider sign extension observes, through a return, a store or a comparison, as an addition of its unsigned conversion, `(int)((unsigned int)a + b)`, so the emitted C wraps at 32 bits exactly as the machine word does instead of overflowing a signed int, which is undefined and lets a compiler compute the sum at 64 bits. Applies on every architecture when the printed operands are signed four-byte integers or literals and the output language is C. Each operand prints once and other readers are unchanged; an already unsigned literal, address-only uses and library lengths keep their spelling."
use_when = "Turn on when the emitted C must be free of signed-overflow undefined behavior, e.g. before recompiling it with sanitizers or comparing it against the binary; MIPS `addiu` and RISC-V `addw` results that are sign-extended into 64-bit registers are the usual source. Off by default because the casts land on every widened int sum such as `return a0 + 3;`."
example = "option wrapadd on"
source_decompiler = "kuna"
inspiration = "An original MIPS dispatcher whose `addiu` reached INT32_MAX: the emitted `(long)(v + 1)` overflowed under UBSan, and GCC at -O2 kept the unwrapped 64-bit sum."
change_kind = "correctness-fix"
tier = "core"
symptoms = "UBSan reports a signed integer overflow in a recompiled 32-bit addition|a sign-extended 32-bit sum differs from the binary at INT32_MAX in recompiled output|(long)(a + 1) where the machine wraps at 32 bits"
live_field = "wrap_add"
live_true = "on"
live_false = "off"
