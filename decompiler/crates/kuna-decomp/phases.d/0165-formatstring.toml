[[settable]]
option = "formatstring"
values = "off|static|full|on"
default = "static"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-formatstring"
summary = "Type printf/scanf-family variadic arguments per call site. `static` (default) resolves each call site's format constant AT LOAD — the Listing supplies the call edges, the cspec supplies the format parameter's register, and a bounded constant-fold over the call's own basic block supplies the value — then parks a per-call-site prototype override (fixed types ++ format-derived varargs) the first decompile consumes, so the typing costs nothing per function. The override is installed with an open tail: the call is scored like the untyped call and drops whatever it took past its declared arguments once every call in the function has its arguments, so the calls around it keep what `off` gives them. `static` does this on x86 only; `full` resolves at load on every target the vararg rule below admits, and adds Ghidra's FormatStringAnalyzer half-B loop on top for the sites the static resolver declined: decompile, read the constant off the lifted CALL, install the override, decompile again. `off` types nothing."
use_when = "Static (default; the load-time resolver runs wherever the Listing is built, which is every decompiling CLI surface under `--mode auto`, `aggressive` or `reliable`; only `--mode fast` turns it off). `static` types x86 targets only: a declared argument, now certain, can veto the same value at a neighbouring call. On AArch64 and ARM32 firmware, measured with the prototype closed from the start, the neighbouring calls it moved mostly went wrong (an `x8` of `0` ahead of the real arguments, iproute2 ip's parse_rtattr losing its len); over 350 x86-64 binaries (decbench and Ubuntu /usr/bin) the 8 it moved all lost a phantom. Ask for `full` to type AArch64/ARM32/RISC-V varargs anyway. Both `static` and `full` type a site only where the target passes a vararg as a named argument: every conversion on x86 and standard AArch64, integer and pointer conversions no wider than a pointer on ARM32, RISC-V, MIPS, PowerPC and Windows AArch64, nothing on Apple AArch64 or an unchecked processor; and only from a format string in a read-only section. Use `full` when a site the static resolver declined matters (a statically linked image, a format computed at run time) and the second decompile of every changed caller is affordable; use `off` to restore untyped varargs. `on` is accepted as an alias of `full`, the spelling this option had while it was a toggle."
example = "option formatstring full"
source_decompiler = "kuna"
inspiration = "Ghidra FormatStringAnalyzer (Variadic Function Signature Override, default-off); angr _get_format_string_arg_types (engine_ail.py, the load-time literal read)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "printf/scanf variadic arguments render untyped at the call site|%d and %s arguments carry generic types instead of int/char *|error/warn/syslog format arguments carry generic types"
