[[settable]]
option = "narrowext"
values = "off|abi|compiler"
default = "abi"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "gh-816"
summary = "Extend a declared integer argument or return value narrower than its register as the calling convention does. A compiler spec states one extension per register entry (`zero`, `sign`, `inttype` or none), which cannot express what the RISC-V and LoongArch procedure-call standards say: an integer narrower than 32 bits is widened by the sign of its type, and a 32-bit one is then sign-extended to a 64-bit register whatever its sign. The RISC-V specs state `zero` and the LoongArch ones nothing, so a call to `int fi(int)` read as a 64-bit value printed `(unsigned long)(unsigned int)fi(k)`, and a callee that uses its `int` parameter as a 64-bit value printed `(unsigned long)(unsigned int)x`. The rule replaces the spec's extension at the two places it is applied: after a call whose return value is locked or committed narrower than the register (`ActionFuncLink::funcLinkOutput`, `FuncCallSpecs::commitNewOutputs`), and at the entry of a function whose parameter is locked narrower than its register (`ActionPrototypeTypes::extendInput`). Only a register entry, and only a value whose type states its sign (`int`, `unsigned`, `bool`, an enum) takes it: plain `char`, whose sign is the platform's while kuna's `char` is signed everywhere, an undefined type, a pointer, a float and a structure keep the spec's extension. A typed indirect call whose return value the rule extends is forced as declared instead of being left to recovery. `abi` applies each rule an ABI document states: RISC-V and LoongArch arguments and return values, the arguments of MIPS o32, n32 and n64 (System V MIPS supplement, SGI n32/n64 handbook) and the arguments of Apple arm64, which the caller extends to 32 bits. `compiler` adds what GCC and LLVM do where those documents are silent: a MIPS return value (and an EABI or o64 argument) is widened the same way, and an Apple arm64 return value narrower than 32 bits is widened to 32 bits by the callee, the bits above left unspecified; an x86-64 System V argument narrower than 32 bits is widened to 32 bits by the sign of its type, which GCC and clang callers do and clang callees rely on although the psABI does not say so. `off` keeps the spec's extension everywhere."
use_when = "On by default (`abi`). Set `compiler` for a clang-built x86-64 binary whose functions read a declared `unsigned char`, `short` or `bool` parameter as a 32-bit value, which prints as `CONCAT31(v1,c)` with an unassigned `v1`, or for a MIPS or Apple arm64 binary whose callers read a narrow result as a whole register, which prints as `CONCAT31(v1,fc(k))` with an unassigned `v1` on MIPS or `(unsigned int)(unsigned char)esc(k)` on Apple arm64: every GCC and LLVM callee extends the value and every caller relies on it, but no ABI document says so, so it is not the default. Set `off` to get the compiler spec's extension back, for example when comparing with Ghidra. A narrow value the code compares or computes with as a whole register prints the extension it performs, `(long)k`, where the spec's zero extension folded away."
example = "option narrowext compiler"
source_decompiler = "kuna"
inspiration = "GH-816: a declared narrow return extended wrongly on MIPS (no extension) and RISC-V (zero-extension of a signed value), and on Apple arm64; RISC-V psABI integer calling convention and LoongArch LAPCS integral extension rules"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a call to a function returning int is printed (unsigned long)(unsigned int)f() on RISC-V or LoongArch|a signed char or short result is zero-extended where the callee sign-extends it|a declared int parameter used as a 64-bit value prints (unsigned long)(unsigned int)x|a narrow result or parameter prints as CONCAT31(v1,f()) or CONCAT44(v1,x) with an unassigned v1"
