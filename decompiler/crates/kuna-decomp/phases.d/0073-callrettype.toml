[[settable]]
option = "callrettype"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "kuna-callrettype"
summary = "A call's result takes the return type its callee's own recovery gave it earlier in the same callee-first run. Upstream's `TypeOpCall::getOutputLocal` answers only for a LOCKED output, so a call to a function the same listing declares `char * sub_43ee(unsigned long *a0)` produced an unknown of its width, and every caller that kept the result as a `char *` printed `(char *)sub_43ee(a0)`; the 2026-09-24 cast census counted 1,994 `(char *)<call>` casts on the 4,815 functions kuna and IDA both emit (IDA 1,172), 682 of them on a callee whose own listing already declared `char *`. When on, `decompile-all` records after each function's final decompile its recovered return value (storage, width, type) when that is a pointer, an integer wider than a byte or a float, the function has no declared prototype, and every live RETURN hands back a value the body computed or read out of global memory (`kuna_callrettype::record`); a later call whose output sits in exactly that storage and width takes the type as the CALL output's local type: the def-side vote of `Varnode::getLocalType`, and the type the call produces when `ActionSetCasts` asks whether its result needs converting. Nothing is locked, so no call gains or loses an argument or a result, and a `void` callee states nothing. The vote is refused where the caller holds better evidence: the family refusals `protoorder` applies to an argument vote (an integer operation on a pointer, a float conflict, a record the caller reads past), an integer statement whose signedness an ordered comparison, a shift, a division, an extension, a declared parameter or another declared or stated call result in the same value contradicts, or a widening at the other sign that the p-code no longer spells, of the result or a value computed from it at its width, where it leaves the function: returned (on x86-64 every 32-bit write zero-extends into the whole register, so a -O0 reload or a move back from the register the result was kept in across another call keeps the function's return unsigned) or passed to a parameter whose zero-extension the dead-bit trimming dropped (`mov %eax,%edi` before a callee that reads all of `%rdi`), a pointer statement a declared parameter, or another declared or stated call result in the same value, types as a pointer to a different known pointee, and a pointer statement whose pointee the caller reads or writes at another width, offsets or steps by other than whole elements, or (for `void *`) offsets at all, counting everything else the function returns when it returns the result. Another call result of the other class (an integer beside a pointer) in the same value refuses it, and so does a value loaded through the pointer that flows back into its own variable. A byte (`bool` or character) is not stated. The finished caller is audited (`kuna_callrettype::contradicted`): the merge ties the return register whole-function after types are inferred, so a statement whose variable also holds another call's result of the other class, a number that is not an address, a value loaded through the pointer or a sum of integers, or whose result the function returns beside such a number, is withdrawn for that caller and the caller decompiled again (du -O0 `map_inode_number` otherwise printed `long * sub_6b45`, `(long *)0xffffffffffffffff` and an integer assigned to the pointer); a function over 1,000 p-code ops is not audited. Inert without a callee-first pass (`kuna decompile`, `--addr`, `--functions`, `--jobs N`, `--option protoorder off`). On the 45-binary cast corpus casts on the 4,815 shared functions go 35,588 -> 34,808 (0.941x -> 0.920x IDA): 393 functions fewer, 25 more, each a conversion where two recovered types now meet (a pointer result stored into an integer field, a pointer difference, a callee's pointer in a caller that keeps an integer)."
use_when = "On by default: `decompile-all` and `decompile-project` type a call's result with the return type the same listing prints for the callee, so a caller that keeps a `char *` result prints `v1 = sub_43ee(a0);` instead of `v1 = (char *)sub_43ee(a0);`. Set it off to diff against output from before the option existed, or where a callee's recovered return type is known to be wrong and should not reach its callers. It never changes a call's arguments or whether a result is read, and it does nothing for a single-function `kuna decompile`."
example = "option callrettype off"
source_decompiler = "kuna"
inspiration = "The 2026-09-24 cast census: `(char *)<call>` 1,994 kuna vs 1,172 IDA on the shared functions (castcensus measure.md shape #4); coreutils tail -O0 `v7 = (char *)sub_e8ca(4,(char *)sub_43ee(a0));` beside `char * sub_43ee(unsigned long *a0)` in the same listing. Ghidra's Decompiler Parameter ID commits a recovered signature so later callers see a locked output; this states only the type, never the output's existence"
change_kind = "type-inference"
tier = "transform"
symptoms = "a call to a function the same listing declares char * prints (char *)sub_43ee(a0)|v7 = (char *)sub_e8ca(4,(char *)sub_43ee(a0));|a caller converts a call's result to the type the callee is declared to return|(FILE *)f(a0) under FILE * f(int a0)"
live_field = "call_ret_type"
live_true = "on"
live_false = "off"
