[[settable]]
option = "ptrentry"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-ptrentry"
summary = "On an ARM image, discover function entries that are reachable ONLY through a code-pointer word (a vtable / fops struct / ISR table / literal-pool constant). The shipped Stage-3 code-pointer scan already collects every 4-byte-aligned Thumb pointer in every allocated section, then accepts the target only if it opens with a stack-frame prologue AND disassembles into more than two instructions. Those two shape predicates reject the bulk of the pointer-referenced population on bare-metal firmware: 93 percent of the missed entries establish no frame at all, and 41 percent are leaves of 8 bytes or less (movs r0,#0; bx lr, or a bare bx lr, which is a perfectly valid Cortex-M exception handler). With this on, a target is admitted on CONTAINMENT evidence instead of shape: no word that references it may be the bytes of a decoded instruction (that word is an operand, not a table slot), and none may lie in the same discovered function as the target itself (that is the ldr pc,[pc,r] switch-table shape, whose slots point into their own body); the length floor is replaced by a terminating-routine check, so a one-instruction routine that reaches a clean return is accepted while a data word that merely decodes is not. Measured on the 48-binary decbench Cortex-M corpus: +1613 recovered ground-truth entries, 95.2 percent of the new entries are DWARF function addresses, ZERO split a real function body and ZERO previously-recovered entries are lost. The accepted entries are emitted as an additive fact stream and never re-seed the recursive-descent walk, which is what makes never-removes-an-entry a property of the wiring. ARM-only and Listing-tier, so it is a strict no-op on every other architecture and without --option listing on."
use_when = "On by default, with `listing` (which `kuna decompile`, `decompile-all` and `functions` inject on non-x86-64 and the `aggressive` preset supplies): a stripped ARM firmware image's callback / vtable / ISR-handler functions -- a 4-byte movs r0,#0; bx lr driver stub, an exception handler that is a bare bx lr -- are admitted as functions instead of leaving a hole in the decompilation between two emitted functions with real code in between. Composes with cortexmvectors. Inert on every non-ARM image and without `listing` (so the datatest corpus and a plain console run never see it). Flip off to keep the prologue-plus-three-instruction shape test."
example = "--option ptrentry on"
source_decompiler = "kuna"
inspiration = "decbench:O2-nuttx-nuttx, O2-betaflight-betaflight_STM32F405, O2-cleanflight-cleanflight_DALRCF405, O2-crazyflie-cf2, O2-libopencm3-cdcacm; kuna's own ARM entry-recall measurement (docs/features/ptrentry/analysis.md; step 2 of the arm-entry-granularity proposal, PR #239). Precision model after Ghidra's OperandReferenceAnalyzer / DataOperandReferenceAnalyzer split (create functions from instruction operands, never from a raw data pointer)."
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a small arm callback or isr handler produces no decompiled output at all|kuna emits one function then the next with un-decompiled code in between|bare bx lr exception handlers never discovered as entries|vtable or fops-struct callbacks missing from a stripped arm binary|driver op-struct function pointers left undiscovered"
