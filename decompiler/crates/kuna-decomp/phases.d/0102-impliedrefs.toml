[[settable]]
option = "impliedrefs"
values = "2|3|4|<n>"
default = "2"
destructive = false
phase = "P6"
subphase = "explicit-marking"
rewind = "P6"
strength = "HARD"
issue = "kuna-impliedrefs"
summary = "How many times a computed value may be read and still be inlined at each use instead of being declared as its own local. ActionMarkExplicit::baseExplicit counts a Varnode's descendants and forces the value explicit once the count exceeds this bound, so the bound is exactly the line between `v3 = a + b;` used three times and `a + b` written out three times. It shipped as a hard-coded 2 whose own upstream comment reads `2 is best, in specific cases a higher number might be good`, with no way to reach it from a command. Raising it trades declarations for expression size: measured on coreutils fmt -O2 (decompile-all, 151 functions), the emitted C declares 369 locals at the shipped 2, 366 at 3 and 363 at 4, and in the other direction 384 at 1 and 630 at 0, where nothing stays implied and every computation gets its own statement. The bound is a program-wide tunable, not private to the explicit-marking pass: BlockBasic::isComplex (the `ruleBlockOr` OR-clause absorb test) and `condfold`'s printed-width test read the same field, so raising it also lets a slightly larger block fold into a condition."
use_when = "An ablation lever, and a readability knob for a listing that is either too fragmented or too dense. Raise to 3 or 4 when kuna declares a swarm of single-expression temporaries that each carry no meaning (`v7 = v3 + 8;` read three times); lower to 1 to force every multiply-read value into a named local when you are hand-tracing data flow, or to 0 to see one statement per computation. Leave at the shipped 2 for output that matches every other kuna run and the datatest baselines -- this is a per-run judgement, not a defect fix, so nothing here is more correct than the default."
example = "option impliedrefs 4"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra's own `Architecture::max_implied_ref` comment: `2 is best, in specific cases a higher number might be good` -- a tunable upstream expects to be edited, reachable only by recompiling until now"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "too many single-use temporaries: v7 = v3 + 8 declared and read once|a value read three times is written out three times instead of being declared|want to ablate the implied-expression threshold without rebuilding|expressions are too deeply nested to read and every sub-term should get a name"
