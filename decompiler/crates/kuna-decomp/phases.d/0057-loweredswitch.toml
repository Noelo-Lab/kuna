[[settable]]
option = "loweredswitch"
values = "on|off|auto|linear|tree|all"
default = "auto"
destructive = false
phase = "P2"
subphase = "switch-model"
strength = "HARD"
rewind = "P2"
issue = "angr-LoweredSwitchSimplifier"
summary = "Reconstruct a compiler-lowered comparison cascade over one variable back into a switch with a synthesized BRANCHIND + jump-table (the S2 artifact Ghidra renders switches from): a GCC binary-search if/else tree, or a chain of equality tests one after another. The re-roll carries the cascade's range-comparison signedness onto every label, labels every case value, is installed only when it dispatches on the value the cascade compared (or is withdrawn) and routes every value and keeps every statement as its compare tree does, and is tried behind every head on the switch variable, not only the first. The cascade head may hold other code before its compare; a value loaded from memory into a temporary is read from that load, also through a register copy of it and the zero extension x86-64 applies to a 32-bit register write. When the compiler loaded each case's value inside the compare tree (`mov eax,K ; cmp ; je ret`, one return shared by every case), the switch is installed along the raw paths of the tree: each arm repeats the loads of the compares it passed, so every value runs what it ran before. `on` takes a binary-search cascade of 3 to 16 cases and a linear chain of 3 to 16 equality tests with a body of its own per tested value. `linear` also takes a linear chain of two tests, and one whose tests share a body. `tree` takes a binary-search cascade of 2 to 64 cases. `all` is both. Every linear chain still needs every case body entered only from the chain (or by a loop back edge it heads) and dominated by its head, and labels that print the same signed or unsigned; every cascade needs two distinct case bodies. A switch is withdrawn, and the function prints as with `off`, when with it a loop or `if` condition ends in the switch, the parameter list, a returned value's width or a call's arguments change, or (for anything but the binary-search tree with a compare-only head the recogniser has always taken) the function prints more gotos; the switch reads its selector as the signed integer its equality compares did, and labels over a `char` print as character constants. The value `auto` (the default) keeps all of `on` and lets the binary decide in functions the per-function detector p3_dataflow/kuna_unoptimized.rs calls unoptimized: an unoptimizing compiler lays a small switch out as a run of tests that each jump to their case on a match and fall through to the next test (`cmp x,1 ; je case1 ; cmp x,2 ; je case2 ; jmp default`, gcc and clang alike), while each `if (x == K)` of an if/else-if chain falls through into its own body on a match and jumps to the next test on a mismatch. p2_lift/kuna_o0switch.rs reads every conditional branch at the first heritage pass, before simplification normalizes branch senses, and records by the address of its CBRANCH whether an equality test against a constant is taken on a match and which load or computation produced the compared value. A cascade with an equality test before its last (by address) that falls into its body on a match is the author's if/else-if chain and never re-rolls, whatever its number of tests or bodies; one whose equality tests all jump on their match is a switch of 2 to 16 values, shared bodies included, when its last test jumps too, when it has three or more equality tests, or when one loaded value feeds every test. Every other guard still applies, the retry after a withdrawal decides by the shape rule, and only a tree the shape rule takes is exempt from the goto test; a cascade the record does not decide, and every cascade of an optimized function, keeps the shape rule of `on`, and `linear`, `tree` and `all` widen the shape rule without reading the record."
use_when = "Default `auto` (on since DIV-4; `auto` adds the unoptimized-code record). Outside unoptimized functions the default re-rolls a binary-search tree of three or more cases and a linear chain of three or more equality tests that each lead to their own body: gcc lowers every small switch to such compares, and on the decbench O2 corpus the source has a switch for such a chain more often than an if/else-if (a chain whose tests share one body is an `||` condition and stays an if); measured, 45 more functions match the source's control flow at O2 and 22 more at O0 than with linear chains left alone. Set `off` to restore the compiler's if/else-if rendering, per function, where the source plainly wrote the chain. Set `linear` when a two-case switch (`switch (bus->type) { case SPI: ...; case I2C: ...; default: return false; }`) prints as two nested `if` tests on one variable, or when an `||` group of values (`case 1: case 2:`) should print as switch labels; it is not the default because the author wrote two-value tests as an `if` about as often as a switch. Set `tree` on a gcc -O0 binary whose dense switch of more than 16 cases prints as a deep if/else tree; the 16-case cap is the default because a very wide synthesized switch can leave the structurer with unstructured case edges. A switch installed for a function stays when the value is narrowed later in the same session, so compare `on` before the wider value. The exactness, every-head, signedness and value guards are the only way the re-roll runs and have no switch of their own. In unoptimized code the test layout records the source form and `auto` prints it: measured against `on` on the decbench corpus it makes 92 more O0 functions structurally exact and none fewer (+70 on one half of the projects, +22 on the other), and changes 2 of 35,197 O2-noinline bodies, both gains. Set `on` to get the shape-only rule back in an unoptimized function."
example = "option loweredswitch off"
source_decompiler = "angr"
inspiration = "angr LoweredSwitchSimplifier (angr/analyses/decompiler/optimization_passes); test_decompiler.py switch-lowering cases"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "switch rendered as nested if/else-if compare tree over one variable|a three- or four-case switch renders as a chain of if (v != 3) { if (v != 2) ... } tests on one variable|a lookup function prints if (x == A) return \"a\"; if (x == B) return \"b\"; ... where the source had a switch|a two-case switch prints as two nested if tests on one variable|a deep if/else tree on one variable with an equality test at every leaf where the source had a dense switch of 17 or more cases|binary-search cascade of constant compares where source had a switch|-O0 two-case switch prints as two nested if tests on one variable|-O0 if/else-if chain the author wrote over one variable prints as a switch|flip off to keep the compiler's lowered compare-tree rendering"
