[[settable]]
option = "switchreturn"
values = "on|off"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ReturnDuplicatorHigh-switchphi"
summary = "The direct continuation of `earlyreturn` (the per-edge const narrowing of angr SAILR `ReturnDuplicatorHigh`), extended from the narrow if/else-if diamond to the WIDE multi-way SWITCH const-phi return. An enum/switch dispatch whose every case assigns a constant to a shared temp and breaks to one exit compiles to `v = MULTIEQUAL(#K0, #K1, …); return v` with one `break` per case; kuna keeps the merged `switch (x) { case A: v = K0; break; … } return v;` (~2 CFG nodes/case more than the source's per-case `case A: return K0;`). `earlyreturn` ALREADY recovers per-case returns for a switch whose merge block has <= 16 predecessors (findutils get_fts_info_name, a 14-case switch, hoists to `case 1: return \"FTS_D\"; …`), but its MAX_EARLYRETURN_INEDGES=16 cap leaves the WIDE dispatch table merged: a 17-case switch merges 17 in-edges (> 16) so earlyreturn skips it (libedit tty__getcharindex). switchreturn is the SAME peel with the in-edge cap lifted (256): it splits each constant case in-edge (all but the last, which keeps the block alive) via the SAME `earlyreturn_const_edges` + `node_split` machinery, so every case ends in its own `return K`. Because it still only ever splits a CONSTANT case arm (never a `return <variable>` share), it inherits earlyreturn's safety and CANNOT re-introduce the variable-return over-firing that made broad returndup regress the aggregate GED-perfect count ~976; any non-const body/default/fall-through arm is left merged. Orthogonal to earlyreturn (a separate option): when both are on, the narrower earlyreturn consumes the <= 16-edge cases first, so switchreturn's incremental effect is precisely the wide dispatch tables earlyreturn's cap skips. Bounded: return-only epilogue (the splittable filter rejects calls/stores), never splits the last edge, <= 256 predecessors, <= 256 splits/function; each hoist logged (`switchreturn:`)."
use_when = "A WIDE multi-way const dispatch renders merged — `switch (x) { case A: v = K0; break; … } return v;` — instead of the source's per-case `switch (x) { case A: return K0; … }` (more cases than earlyreturn's 16-in-edge cap; e.g. libedit tty__getcharindex, iproute2 accept_msg, coreutils stat fmt_to_mask). On by default (DIV-25: the incremental wide-switch ablation on top of earlyreturn-on measured NET-POSITIVE, +2 perfect / -107 summed GED / zero regressions); flip OFF to restore the merged rendering. By construction it cannot cause the variable-return over-firing that reverted returndup (it splits only constant case arms)."
example = "option switchreturn on"
source_decompiler = "angr"
inspiration = "decbench:O0-libedit-tty__getcharindex; O0-iproute2-ip-accept_msg; O0-coreutils-stat-fmt_to_mask; ReturnDuplicatorHigh._is_simple_return_graph (angr/analyses/decompiler/optimization_passes/return_duplicator_{high,base}.py)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "wide switch where every case assigns a constant and breaks to one shared return|switch (x) { case A: v = K; break; ... } return v; instead of per-case return K|17-plus-case const dispatch keeps a merged return variable"
