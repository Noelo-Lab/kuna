[[settable]]
option = "noreturn_disc"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-noreturn-disc"
summary = "Run the discovered-no-return consumer (the first Listing/xref consumer): the evidence-tally fixpoint over the Listing — a call target is no-return when at least 3 of its call sites show no valid fall-through (the instruction after the call is not a valid instruction start / fell into data / is another function's entry), iterated to a fixpoint (a function whose last act is a call to an already-discovered-no-return function is itself no-return). The kuna analog of Ghidra's FindNoReturnFunctionsAnalyzer. Requires the Listing (option listing on) — a no-op when the Listing is absent. On by default (DIV-22, matching Ghidra's default-on analyzer), but gated on the Listing (default-off), so every parity gate is byte-identical (real-ELF Listing path only). Only POSITIVE evidence counts at a call site: the successor is data (outside every executable range) or another function's entry, or the call has no fall-through at all; a successor that merely failed to decode is not evidence, because the Listing walk attempts every call's successor and that arm would be a decode-failure detector forging no-return verdicts on kuna's own spec gaps (GH-312, DIV-92, formerly the noreturn_discstrict option)."
use_when = "On by default (DIV-22), but a no-op unless the Listing is built (option listing on) — with the Listing off there is zero behavior change. With listing on it marks heavily-called custom/tail-calling no-return wrappers — that the static name lists do not know — no-return by the >=3-call-site evidence tally, eliminating the post-call dead code on a real-ELF target. Flip OFF (with listing on) to keep the post-call fall-through code."
example = "option listing on --option noreturn_disc on"
source_decompiler = "kuna"
inspiration = "Ghidra FindNoReturnFunctionsAnalyzer (discovered no-return, evidence threshold)"
change_kind = "analysis-enablement"
tier = "transform"
symptoms = "heavily-called custom die()/fatal() wrapper still treated as returning|dead code after a stripped sub_ wrapper that never falls through at 3+ call sites|caller swallows the next function after a wrapper call"
