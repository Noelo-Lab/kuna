[[settable]]
option = "switchmultipred"
values = "on|off"
default = "on"
destructive = true
phase = "P2"
subphase = "switch-model"
strength = "HARD"
rewind = "P2"
issue = "angr-abnormal-switch-case-case3"
summary = "Recover an image-base-relative jump table (target = imagebase + load4(table + idx*4)) whose bound guard is 'unrolled' / duplicated across MULTIPLE predecessors of the dispatch block: the BRANCHIND's parent has sizeIn() > 1, each incoming path ending in its OWN (often semantically different) bound CBRANCH, the per-path switch indices meeting in a MULTIEQUAL. The single-predecessor guard walk short-circuits to checkUnrolledGuard, so no dominating guard bounds the table and the dispatch is truncated to a computed (code *)() call. When on, finds the dispatch MULTIEQUAL, evaluates each predecessor guard as a function of its MULTIEQUAL input, and re-bounds the table to [0, max-over-paths) so the readonly-LOAD table model recovers the switch (angr's 'abnormal switch case'). Also bounds the merged index when the copies of one bound check branch with opposite senses (one 'ja default', the other 'jbe dispatch'): each edge's check is pulled back to its own MULTIEQUAL input and the union of the per-edge ranges guards the MULTIEQUAL output, so a byte index no longer reads past the table into the next one."
use_when = "Set on PER PROGRAM when an image-base-relative switch (e.g. an MSVC memmove/memcpy small-count tail dispatch) reports 'Could not recover jumptable ... Too many branches' and renders as a computed (code *)() call AND the dispatch block has multiple predecessors each with its own bound guard (vs the single-guard form switchguardbound handles); DESTRUCTIVE as a global default (it unions per-path guard prefixes across a MULTIEQUAL and re-binds the table from a heuristic max bound, so it may over-bind an unrelated multi-entry indirect jump)."
example = "option switchmultipred on"
source_decompiler = "angr"
inspiration = "test_decompiling_abnormal_switch_case_case3; JumpTableResolver / abnormal switch case; 0x18003c330"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "image-base-relative switch whose bound guard is duplicated across multiple predecessors renders as a computed call|'Too many branches' where the dispatch block has several guarded incoming paths|msvc memmove small-count tail dispatch truncated to an indirect call"
live_field = "switch_multi_pred"
live_true = "on"
live_false = "off"
