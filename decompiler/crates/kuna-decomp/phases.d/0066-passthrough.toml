[[settable]]
option = "passthrough"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "active-input-trial-scoring"
strength = "HARD"
rewind = "P4"
issue = "typecampaign-passthrough-arity"
summary = "Give a function the parameter it forwards untouched to a callee that reads it, and the return value of a tail call it hands straight back. A call's argument trials come from Heritage::guardCalls (heritage.cc:1444), which registers one per HERITAGED storage range, and a range is heritaged only when some op of the function reads or writes it: a register the function only forwards is named by no op, so the call gets no trial, no argument, and the function's own input never gets a reader or a parameter. gzip -O2 gzip_base_name is `endbr64; jmp last_component` and kuna printed `void sub_d290(void) { sub_dfd0(); }` while recovering the callee as `char *sub_dfd0(char *a0)` in the same run. Where the register IS heritaged, AncestorRealistic::execute (funcdata_varnode.cc:2159) refuses an input Varnode at the call slot outright. The evidence this option acts on is the callee's own RECOVERED prototype, which `protoorder` states for every callee a whole-binary decompile-all decompiled first: a register is an argument when that prototype has a parameter starting at it, the list is one protoorder's locking mode would accept as an arity claim (the callee's body does not read the next argument register -- a variadic's register-save prologue does -- the list does not saturate the register file, and it sits where the convention puts those types), the callee's body takes the register (its bounded entry decode reads it before writing it, or its statement records it handed on to a declared parameter or to a callee that takes it, or -- where that decode cannot finish -- its first heritage saw it read; a list that is not an arity claim qualifies when every register it names is taken that way), and the value at the call is the function's own incoming register -- or, at the call right after another direct call with nothing between, the result that callee's statement returns in the register, so AArch64 `bl h; b g` is `return g(h(a0))`. A function calling itself asks its own body, so a recursive call keeps the register it forwards (grep treenext) even in a single-function decompile. The width is the one the callee's body consumes (`edi` for an int). The rule only adds: every other rule (upstream scoring, then the calleearityfwd, calleearitylive and calleearitybody rescues) settles the call's list first, and at the end of ActionActiveParam a list that is a leading run of the stated one gains the stated registers that follow it, up to the first the function does not forward; an argument supplied while scoring would turn off the sibling rescue that completes tar sysinttostr's first tail call. For a register no op of the function touches, ActionFuncLink gives a call no other call can precede a read of it and a trial; heritage registers the visible range at every other call as usual and keeps only the function's own RETURN off it; and every trial on the range is scored inactive -- where the option-off run's hole-filling trial starts -- never definitely-not-used, which would make forceNoUse drop every later argument (gcc -O2 `noop(); twoarg(p,3)`). When every live RETURN is reached from a direct call with nothing in between, every such callee states a non-void return in the same register or register pair (x86-64 rdx:rax, i386 edx:eax, ARM r1:r0; a callee with no parameters states its return too), and the function never touches those registers, the RETURN reads them and the tail call's result is the function's return value, typed by the callee's recovered return type. A register that carries no argument (x86 eax, MIPS v0) may be written before the call, which overwrites it, as long as nothing between the call and the RETURN reads or writes it; an argument register that is also the return register (ARM r0) may not, since `mov r0,#5; b g` is how a void function calls g(5). The `r0 = r0` (MIPS `v0 = v0`) the ARM and MIPS specs inject as the mode switch of every `bx lr`, `pop {...,pc}` and `jr ra` is not a touch, nor the vector-count access that marks a SysV variadic function or call, so `bl f; pop {r4,pc}`, `jal f; ...; jr ra` and a MIPS `jr $t9` tail call qualify as x86-64 `call f; ret` does; a returned register the body touches itself keeps its call-site argument trials scored as with the option off, so `bl g; bl f; pop {r4,pc}` still passes g's result to f. A pair is kept whole or not at all: a register the call's model does not kill (xmm1 of a struct {double,double} on x86-64 gcc) is not the call's result at the RETURN, and keeping xmm0 alone would return half the value as an integer. And the claim yields to a return value the function computes itself in another storage class: `float f(int x,float y){ g(x); return y*2.0f; }` leaves g's result untouched in r0 (x86-64 rax, MIPS v0) and its own in s0 (xmm0, $f0), and returns the float, as with the option off; a value of the same class (the r1 of `bl g; mov r1,#0`) and a value that is zero at every RETURN (what -fzero-call-used-regs leaves in every call-used register a forwarder does not return in) keep the claim. A callee states a return only where its own body computed one in every byte and on every path: gnulib's `void version_etc_arn` ends its fallthrough on a `__fprintf_chk` and keeps that call's RAX clobber, so kuna recovers it as returning `long`, and without that gate every `version_etc_ar` wrapper inherited the same wrong return (212 of 4,267 gained returns across 444 decbench slices; 6 of 4,088 with the gate). A callee that stated nothing (single-function decompile, a narrowed or sharded run, protoorder off, and under `protoorder types` a callee in a recursive component) is read by its own body: its arguments are the leading run of the model's general-purpose argument registers its complete entry walk reads for a value that reaches something (a register it only spills or pushes ends the run, and a run that reaches the model's last argument register -- a variadic register-save prologue, or a function that reaches one on an error path -- is no list, as for a stated one), or that a direct call it makes takes on the same terms, and the call is extended only when the finished list reaches the end of that run and the caller loaded no value into the register after it, unless the walk proves that register dead; it states no return. An import, whose body the walk cannot read, changes nothing. Two refusals keep a caller off a parameter the callee's own recovery invented. A stated parameter whose value, through value-preserving operations, only reaches an argument slot of a variadic call -- one the callee set up as variadic, or a declared `...` prototype past its named parameters -- is never claimed: openssh xcalloc's third parameter is gcc's `push %rdx` stack-alignment filler at a call to sshfatal, gnulib open_safer's is `open`'s mode, and the ABI lets a caller leave that register unset. And a claim the positional list can only reach across a register this function writes before reading is declined, because that register would become a parameter nothing sets: the protoorder fixture's overrec sets rsi to 16 and forwards rdx, and rendered `void overrec(unsigned long *a0,unsigned long a1,long a2)` with a1 in no statement against the call site `overrec(v1)`. The value at the call may also be the incoming register carried past earlier calls that leave it alone, through copies, phis and the non-creating INDIRECTs of direct calls whose decoded callee body is proven never to write the register (gcc keeps `rdi` across a call it knows does not write it, so bzip2's `add_pair_to_block(s)` in a loop printed `add_pair_to_block()`); such a trial is scored inactive rather than definitely not used when the callee states a parameter there. On AMD64 Go ABIInternal, retry the existing input proof before SSA after a verified stack-growth fold leaves one direct call and a full-width argument register untouched."
use_when = "On by default. Over 574 slices in 25 projects -- the 444-slice decbench corpus AND 130 slices of 17 projects disjoint from it (openssh, e2fsprogs, dpkg, kmod, dash, iproute2, gnutls, zlib, ...) -- 4,107 of 4,346 gained parameters are confirmed by the unstripped twin's DWARF prototype, NONE are contradicted, and the remaining 239 belong to forwarding thunks DWARF does not describe at all; no function and no call site loses an argument (docs/features/passthrough/dwarf-confirmation.md). The return arm is a judgement, not a proof, and is where ON costs something: a source-`void` wrapper that tail-calls a value-returning function compiles to the same `jmp` as a wrapper that returns what it calls, so 5,458 of 5,615 gained returns are DWARF-confirmed and 157 are contradicted -- 6 on the decbench corpus but 151 on the disjoint one, concentrated in projects that write many one-line `void` wrappers (e2fsprogs bitmap accessors, openssh blf_key). A return in a register pair is taken on the same terms, so it shares both limits the bytes cannot resolve: a wrapper repeats a pair its callee's own recovery invented (coreutils strintcmp becomes `undefined16` because numcompare is), and a wrapper that truncates the pair (`return (int)wide(a,b);`) compiles to the same `jmp` and is given the whole pair. On ARM and MIPS the return arm also takes a wrapper that calls and then returns (`bl f; pop {r4,pc}`, `jal f; ...; jr ra`): over 92 debug-stripped ARM firmware binaries (decbench O0, O2 and O2-noinline) 223 functions gain a return that way: 182 DWARF-confirmed, 39 DWARF `void` and 2 with no DWARF entry (82.4% of those DWARF describes); betaflight (49 of 74) and cleanflight (28 of 34) are -Og builds, where no sibling call turns a one-line `void` wrapper into a tail `b f`, and without them it is 105 of 113 (92.9%), against 157 of 164 (95.7%) for tail-jump returns on the same set. No MIPS corpus with DWARF was measured. It acts only where a callee was decompiled BEFORE its caller (serial `decompile-all`, `decompile-project`); a single-function `kuna decompile`, a run narrowed by `--addr` or `--functions`, `--jobs N` and `--option protoorder off` leave every call but a function's call of itself alone, and no argument moves at -O0, where the register is already named by an op (an x86 -O0 wrapper that loads its arguments through rax before `call f; leave; ret` does gain f's return). Reading the callee's body where its entry decode stops (a call, a large body) and a function's calls of itself adds 222 call arguments over 14 binaries (x86-64 gcc -O2/-O0 and clang, Cortex-M firmware, an ARM library); of the 167 whose callee has a DWARF prototype, 156 match it and the other 11 are register-level arguments DWARF does not count (a hidden struct-return pointer, a 64-bit integer in two registers, libgcc's assembly soft-float compares). Set OFF to get upstream's reading back: an input register at a call is not an argument unless the caller moved a value into it, and a tail call's result is not the caller's return value."
example = "option passthrough on"
live_field = "pass_through"
live_true = "on"
live_false = "off"
source_decompiler = "ghidra"
inspiration = "gzip -O2 gzip_base_name 0xd290, coreutils df -O2 dir_name 0x7550 and tar -O2 open_diag/stat_diag (decbench full_run_address_2026-09-11); Ghidra reaches the same place when its Decompiler Parameter ID analyzer commits a callee's prototype first: the locked branch of ActionFuncLink::funcLinkInput (coreaction.cc:1500) materializes every declared parameter at the call, so the forwarded register gets a reader"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a wrapper renders void f(void) { g(); } although g takes an argument in the same output|a call renders with no arguments while the callee's declaration in the same file takes one|a tail-call thunk returns void while the function it jumps to returns a value|decompiling the caller shows a parameter-less function whose only instruction is a jmp to a function with parameters|DWARF gives a forwarding function a parameter kuna does not"
