[[settable]]
option = "infloopstyle"
values = "while|do"
default = "while"
destructive = false
phase = "P9"
subphase = "infinite-loop-style"
strength = "HARD"
rewind = "P9"
issue = "server-infinite-loop-style"
summary = "Spell unconditional C loops as while (true) at the top or do-while (true) at the bottom."
use_when = "While by default: unconditional loops print while (true) at the top. Set do to recover the previous spelling. Conditional do-while loops and Rust loop syntax keep their existing form."
example = "option infloopstyle do"
source_decompiler = "kuna"
inspiration = "User preference for the recovered private/server main loop"
change_kind = "presentation-default"
tier = "core"
symptoms = "unconditional loop prints do-while (true) at the bottom|prefer while (true) at the top|need the previous infinite-loop spelling for comparison"
