[[settable]]
option = "ptrfromuse"
values = "off|byte|void"
default = "void"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "kuna-ptrfromuse"
summary = "Type a function parameter that is only ever used as a memory base as a pointer. `ActionInferTypes` seeds every Varnode from local op semantics and then pushes the seeds along the def-use graph, and neither half can reach a parameter the function dereferences at a constant offset. `TypeOpIntAdd::getInputLocal` votes `int<N>` for each `p + k` reader, so the seed fold has no pointer candidate at all; the pointer that DOES exist -- `TypeOp::propagateToPointer` types the `p + 8` result `undefined8 *` -- never travels back, because `TypeOpIntAdd::propagateType` (typeop.cc:1217) refuses to carry a pointer from an output to an input. coreutils fmt -O2 with `libctypes off` shows both halves at once: `put_word`, which dereferences its argument at offset 0, is `void sub_3000(unsigned long *a0)`, while `get_line`, which dereferences the same kind of argument at +8 and +0x10, is `void sub_3420(long a0, unsigned int a1)`. When on, `kuna_ptrfromuse::pointer_from_use` walks each function input's transitive descendants through COPY/MULTIEQUAL/INDIRECT identity, the base slot of PTRADD/PTRSUB and constant-offset INT_ADD (breadth-first bounded worklist, visited set, ten hops, so the cap is a property of the graph rather than of the pop order) and offers a pointer candidate when at least one terminal use is the address operand of a LOAD or STORE. The candidate is FOLDED into the same `getLocalType` fold by `Datatype::type_order`, not installed as a replacement seed, so a more specific vote still wins: a `FILE *` arriving from a callee's locked prototype is `SUB_PTR_STRUCT` and outranks this rule's `SUB_PTR`. The walk refuses on any use no pointer survives -- INT_MULT, INT_DIV/SDIV/REM/SREM, INT_2COMP/NEGATE, a shift, a PIECE that assembles the value from halves, any float op, a comparison against a non-zero literal, and a CALL whose callee prototype has already committed that argument to a non-pointer -- and a variable-offset addition is neutral, carrying neither acceptance nor refusal, because either operand of `x + y` could be the base. A *literal* addend is the one ambiguous shape: `p->field` and `table[i]` lower to the same INT_ADD of a value and a constant, and only the constant says which operand is the base, so the walk asks `ActionConstantPtr::isPointer`'s own question of it -- the default data space's pointer bounds, `resolveConstant` into that space, then the global scope -- and grades the answer. A constant that resolves to a global object kuna knows about IS the base, so the walked value is a subscript and the candidate is refused. A constant that is address-like but names nothing settles nothing and is neutral, exactly like a variable addend: that is what a stripped image's .bss table looks like, and also what a genuinely large struct looks like (bzip2's 0x13f0-byte bzFile is read at +0x1394). Anything below the bound is an ordinary field offset and the walk carries on. Only inputs whose width is the default data space's address size are considered (eight bytes on the 64-bit images the option is named for, four on a 32-bit image), and only storage the prototype model says could carry a parameter, which keeps a segment-base register such as x86-64's FS_OFFSET out of it. `byte` points at one unknown byte, which `realtypes` renders `char *`; `void` points at nothing and renders `void *`. Only function inputs are considered: a parameter is one declaration per function rather than one per local, and it is the argument-position match that a metric or a reader sees first."
use_when = "On by default (`void`): a pointer-width parameter whose every memory use is `*(T *)(a0 + k)` -- a struct or buffer pointer once the compiler has folded the field offsets in -- is declared `void *a0`, and its field accesses keep their byte arithmetic with a cast on the base (`*(long *)((long)a0 + 0x28)`). With `protoorder` at its default the callee's `void *` also types the matching argument at each call site, which is how a wrapper that only forwards its arguments (the `qsort` comparators and hash-table callbacks whose declared parameters are `void const *`) is declared with `void *` parameters: over the 444-slice decbench sweep the default moves 204 functions onto a perfect type_match and 85 more up, none down. `byte` declares `char *a0` instead and rewrites the arithmetic into indexing (`*(long *)&a0[0x28]`, `RulePtrArith`); it moves 7 functions onto perfect. Turn it off to get upstream's integer declaration and uncast arithmetic back, when a script matches body text an older run printed (the `(long)a0 + k` casts, and the local renumbering where a retyped value merges differently), or when a parameter really is an integer the function also uses as an address -- committing it to a pointer is a claim the width-only integer spelling did not make. Prefer `libctypes` where the argument reaches a libc call: a named `FILE *` outranks this rule's candidate and is kept. KNOWN AMBIGUITY: an index into a global array is the same shape as a base at a constant offset -- both are `INT_ADD(value, constant)` -- so the rule grades the constant. A named global object refuses the candidate (`char table[256]; int lookup(long i){return table[i];}` keeps `long a0` and its named global; typing it would also replace `table` in the body with its raw address). An address-like constant that names nothing is neutral, so a parameter used ONLY that way is still declined, but one that is also dereferenced at an ordinary field offset is typed on the strength of that other use -- which is right for a large struct and wrong for a subscript into an unnamed table that the function also uses as a base. A constant below the space's pointer lower bound is always read as a field offset."
example = "option ptrfromuse off"
source_decompiler = "angr"
inspiration = "angr's pointer-arithmetic type closure (`analyses/typehoon/simple_solver.py`): anything loaded from or stored to is a pointer, and `ptr + const` is the same pointer. angr commits 43.4% of its arguments to a pointer type on coreutils fmt where kuna commits 30.6% and leaves 43.0% at the 8-byte integer default."
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "a parameter is declared long or unsigned long and is only ever dereferenced|every use of an argument is *(T *)(a0 + k) but the argument is not a pointer|one function takes T *a0 and its sibling takes long a0 for the same kind of argument|an argument dereferenced at offset 0 gets a pointer type but one dereferenced at +8 does not"
