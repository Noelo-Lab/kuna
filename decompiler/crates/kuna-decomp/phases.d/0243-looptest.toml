[[settable]]
option = "looptest"
values = "binary|proven|assume"
default = "proven"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P9"
issue = "kuna-looptest"
summary = "Print a bottom-tested loop with its test at the top, `while (c) { body }`, when that is provably the same program, and leave out the guard `if` that the compiler's loop rotation put in front of it. gcc's loop header copying turns `while (c) body` into `if (c) do body while (c);` and drops the `if` when it can prove `c` on entry, so kuna prints `do { } while` for loops the source tests at the top. `kuna_looptest` plans each C `BlockDoWhile` on the final structured tree. The test may move to the top only when every loop-variant leaf of the printed condition is the value carried into the next iteration by a header MULTIEQUAL (or a COPY of it, or an expression that computes it again, either of which then prints as that variable) and the condition calls nothing; a loop whose body prints nothing (`do {} while (f());`) tests at the top whatever its condition reads. `proven` then needs the entry test, the condition with each carried value replaced by its entry value, to fold to true, to equal the condition of an edge that dominates the loop, or to equal the condition of a guard right in front of the loop. When none holds and the latch tests `x != b` (or exits on `x == b`) for a value `x` that steps by a constant toward an invariant bound `b` that is the entry value plus an exact multiple of the step, the test prints as the ordering test `x < b` (`x > b` counting down), which agrees with `!=` on every value `x` takes; its entry test `x_entry < b`, with the signedness both operands print with, must then equal the guard or a dominating condition (`if (n > 0) { i = 0; do ... while (i != n); }` prints `while (i < n)`). That guard is left out when the statements between it and the loop are pure and the program without it is the same on the skip path: the skip path and the loop's exit path meet, and every value they merge, return or pass to the same calls agrees once each carried variable holds its entry value, as after zero iterations (`if (b > 1) { x = a; do ... while (...); return x; } return a;` and an else arm that sets the loop's start value both lose the guard). A guard that has to stay keeps the do-while, and so does a loop whose carried variable lives in the stack frame of a function the unoptimized-code detector flags (a bottom test is then the source's own). `binary` prints every loop where the binary tests it; `assume` also moves the test of a loop with no entry proof. C output only."
use_when = "PROVEN by default. Flip to binary to see each loop where the compiler placed its test (and every rotation guard), for example when matching the output against the disassembly. assume is speculative: it also prints `while (c)` for a loop whose first test the binary skips, which is wrong when the source was a do-while whose test can fail on entry."
example = "option looptest binary"
source_decompiler = "kuna"
inspiration = "decbench O2 corpus: kuna printed 4,015 `do ... while` loops where the source-equivalent output has 306; coreutils ls initialize_ordering_vector, crazyflie uart2GetData, e2fsck jbd2_journal_clear_revoke"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "for or while loop printed as if (c) { do { ... } while (c); }|if (!n) return; followed by a do-while on the same count|do-while loop whose first test always passes|empty do {} while (f()); polling loop|kuna writes do-while where the source and ida write while or for"
