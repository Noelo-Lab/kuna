[[settable]]
option = "callarrayextent"
values = "on|off"
default = "off"
live_field = "call_array_extent"
live_true = "on"
live_false = "off"
destructive = true
phase = "P6"
subphase = "stack-frame-layout"
strength = "HARD"
rewind = "P6"
issue = "kuna-callarrayextent"
summary = "Represent unlocked integer storage passed directly to declared integer-pointer parameters as one array when a later slot is read after being clobbered by the same call. Preserve a compatible multi-element parent that crosses or ends at the output base. Reserve through the next address-taken frame base or the local frame end, never crossing offset zero, and decline regions larger than 4096 bytes. Decline conflicting parameter types, type locks, incompatible hints, and caller-defined values in newly added storage. This preserves aliases across the call but estimates storage capacity, not the source array's exact length."
use_when = "A helper writes through a stack pointer, but the caller declares a short array followed by independent uninitialized scalars for the helper's output, or splits adjacent input and output storage used by one call. Opt in only when the frame region is intended to be shared storage: caller-defined neighboring values are excluded, but a pointer prototype still does not establish the exact array length. Explicit local types remain authoritative."
example = "option callarrayextent on"
source_decompiler = "kuna"
inspiration = "A synthetic SPARC caller passes fp-48 to a ten-word writer and then reads fp-40; the default layout declares a two-word array and returns an independent uninitialized scalar."
change_kind = "feature"
tier = "transform"
symptoms = "a helper's stack output array is shorter than the helper writes|a post-call stack read is emitted as an independent uninitialized scalar|a stack array passed to a helper loses aliases with neighboring frame slots"
