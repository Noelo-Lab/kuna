[[settable]]
option = "varargsave"
values = "on|off"
default = "on"
destructive = true
phase = "P4"
subphase = "own-input-prototype-recovery"
strength = "HARD"
rewind = "P4"
issue = "kuna-varargsave"
summary = "x86-64 System V only (inert on every other target): fold the register-save prologue a variadic function opens with into its prototype. A function that calls `va_start` stores the argument registers past its named parameters into a save area in its frame (`mov %rsi,0x28(%rsp)` .. `mov %r9,0x48(%rsp)`, then `test %al,%al; je 1f; movaps %xmm0,0x50(%rsp)` .. `movaps %xmm7,0xc0(%rsp); 1:`), which printed as an `if (al) { v12 = a0; ... }` the source does not have, with every xmm and every general argument register as a parameter (`mprintf(const char *fmt, ...)` printed with fourteen). Right after the first heritage pass, while the stack is not yet in SSA form, the fold matches the prologue exactly: a jump on `(al & al) == 0` of the incoming `al` over a block holding only stores of the incoming xmm registers m..m+c-1 to the slots R+48+16*j of one save area R, rejoining the jump target, and stores of the incoming general registers n..n+g-1 (rdi..r9 = 0..5, a contiguous run) to R+8*k in the block that tests al or the straight line of blocks before it. It then removes the edge into the xmm block and the general-register stores, so al, the saved xmm registers and the unnamed general registers are no longer parameters, and the recovered prototype ends in `...`. It refuses the whole fold when any load reads a saved slot through the stack pointer plus a constant (gcc folds a `va_arg` whose offset it knows into such a load) or through a stack pointer the walk cannot place; loads through the `va_list`'s own pointers are `va_arg` and do not count. The `va_list` field initialisations stay as assignments."
use_when = "On by default: a variadic function's signature is `f(const char *a0,...)` and its body starts at the first statement of the source. Turn it off to see the save-area stores and the `al` test the machine code performs, for example when auditing a hand-written variadic routine."
example = "option varargsave off"
source_decompiler = "kuna"
inspiration = "the System V AMD64 ABI register save area (section 3.5.7, `va_start`); gcc's ix86_setup_incoming_varargs and clang's x86-64 va_start lowering both emit this prologue"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "a variadic function opens with if (al) { v = a0; ... } storing xmm registers|a printf-style wrapper prints with fourteen parameters including eight unsigned long xmm ones|unnamed rsi..r9 parameters stored to stack slots that nothing reads|char v1; // al declared at the top of a function"
live_field = "vararg_save"
live_true = "on"
live_false = "off"
