[[settable]]
option = "readonlycalls"
values = "off|on|<n>"
default = "65536"
destructive = false
phase = "P3"
subphase = "call-guard"
strength = "HARD"
rewind = "P3"
issue = "gh-1034"
summary = "In a heritage pass that would guard at least N read-only-range and call pairs (default 65,536), give a call no INDIRECT guard over a read-only memory range the function never writes. A callee cannot change memory the image maps without write permission, so every read of such a range sees the value it had at entry and needs no definition per call. Upstream guards the range at every call with an unknown effect anyway: one INDIRECT per read-only global per call, plus the MULTIEQUALs their writes force at every join, and on a persistent range they survive dead-code removal; a large function that reads thousands of constants through thousands of calls builds millions of them. The count is the pass's calls times its new, read, read-only ranges in the default data space; below it every call keeps upstream's guard, whose chain the printer uses as a barrier (it keeps a copy of a read-only literal split per element, and an expression over a constant global from being printed again after a call), so the same function can print differently on either side of N. `on` leaves read-only ranges unguarded in every pass with a call, and `off` keeps every guard. A read-only range the function itself writes keeps its guards, as does any range whose read-only property is unknown."
use_when = "On by default at 65,536 guards, the size at which the guards cost a huge function gigabytes. Set `on` to print every function as one above the threshold prints (no per-element copies of read-only literals, constant globals read again after calls), a smaller N to lower the size at which that starts, a larger N or `off` to keep upstream's guards in larger functions, for example to compare the SSA heritage builds for a large constant table read across calls."
example = "option readonlycalls off"
source_decompiler = "kuna"
inspiration = "GH-1034 APoseFix.dll's two 200 KB functions, shared with serde-hkx 0.7.3's hkxc.exe at 0x1406198f0 and 0x1406491d0: 2,876 read-only globals, each read once, guarded at 1,316 calls in the first jump-table partial alone, 3.8 million INDIRECTs and 14 GB before the first jump table was recovered."
change_kind = "performance"
tier = "core"
symptoms = "a function that reads many constant globals between calls exhausts memory during heritage|decompile of a huge function is killed before the first jump table is recovered|thousands of INDIRECTs over read-only globals survive in a large function's IR|a function prints read-only literals differently once it grows past the readonlycalls threshold"
