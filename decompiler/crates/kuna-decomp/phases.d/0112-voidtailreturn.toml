[[settable]]
option = "voidtailreturn"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "brace-form"
strength = "HARD"
rewind = "P9"
issue = "kuna-voidtailreturn"
use_when = "On by default (DIV-98): a void function no longer ends with the bare `return;` its source does not have. Flip OFF to restore upstream Ghidra's trailing `return;`, for example when diffing against Ghidra output or reading code whose source ends a void function with an explicit `return;` (the 62 regressions below are that shape); the XML datatest and stage scripts that pin the upstream rendering set it off. Measured bidirectionally over the whole O0 decbench slice (32,329 functions / 265 slices, `scripts.decbench.optsweep`): GED-perfect 15,308 -> 15,933 (**+625** for the option in isolation), 687 moved TO perfect against 62 moved OFF (11.08 : 1, McNemar z = +22.84) -- +439 of it on binaries under 500 KiB, where the `aggressive` preset already turned it on, and +186 on binaries >= 500 KiB, which only the default reaches, aggregate GED 259,329 -> 253,985, improved 1,561 / worsened 186, and EVERY architecture net-positive (x86-64 +282, ARM +338, PE-x86 +5) with no net-negative project. Controls: 21,478 unchanged bodies score identically, 0 slug-only diffs, baseline arm agrees with the tree's published verdict on 31,584/32,329. Speed +0.17% (coreutils/ls O0, interleaved min-of-5). The 62 regressions are the shape where the SOURCE itself ends with an explicit `return;` (concentrated in betaflight 24 / cleanflight 21 register-poke helpers), which the binary cannot distinguish. The measured motivation is structural: pyjoern merges FUNCTION_END into its predecessor only when that predecessor's sole successor is FUNCTION_END, so when a function's tail is an `if` or a loop the source CFG has NO node there -- and kuna's printed `return;` re-materialises one (+1 node, +1..2 edges, and an is_exitpoint role flip that alone breaks GED's isomorphism test). 68 of the 250 decbench sample-set outputs carry exactly one bare trailing `return;`."
example = "option voidtailreturn off"
summary = "Elide the trailing bare `return;` of a void function -- the statement the C source it was compiled from does not have, because the source falls off the end of the body. kuna (faithfully to Ghidra) always prints the function's final RETURN, so a void function ends `... }` newline `return;` newline `}`. Four conditions must all hold, checked once per function in `elidable_void_tail_return`: the prototype returns void (a `return <value>;` is never redundant); the op is the tail of the LAST structured leaf, found by descending only the containers that print no construct of their own (Graph/Ls) so a return nested inside an if/loop/switch arm is never touched; that leaf is not an unstructured goto target (bash `rl_echo_signal_char` prints `label_115e79:` directly above its trailing `return;`, and eliding it would leave a label with no statement -- invalid C); and exactly one structured leaf carries that RETURN op, because `returndup`/`gotoreduce` clone a shared epilogue by ALIASING one op across several leaves, so suppressing by identity would also delete genuine mid-body early returns. A BlockCopy mirror is resolved through to the bblocks block it stands for, which is the normal shape of a structured function's trailing block. The same holds for a switch the function ends with: its `default:` arm, when all it does is the bare `return;`, is left out (the source had no `default:` or a `default: break;`, and leaving the switch is returning), provided the switch is the last statement printed, the arm is not in a fall-through chain and carries no label."
source_decompiler = "kuna"
inspiration = "decbench sample set: two independent lenses measured the same lever -- deleting the trailing bare `return;` by text surgery and re-scoring through decbench's own GED moves 8-9 functions to a perfect structural match with 18 improved, 1 worsened and 0 perfects lost"
change_kind = "presentation-default"
tier = "core"
symptoms = "a void function ends with a redundant return; the source does not have|GED counts one extra exit node against an otherwise perfect function|the last statement of a void function is a bare return|a void function ending in a switch prints default: return; that the source does not have"
live_field = "voidtailreturn"
live_true = "on"
live_false = "off"
