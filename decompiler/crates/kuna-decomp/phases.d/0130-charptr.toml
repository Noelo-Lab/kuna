issue = "kuna-charptr"
summary = "Commit a pointer-width parameter or stack local the program only ever uses on characters to `char *`. `ptrfromuse` decides that a value IS a pointer; nothing says what is on the other end, and its shipped `void` says so honestly. The element type is often already on the table -- `strlen`'s declared `char *`, a `%s` conversion `formatstring` resolved, a walk that indexes the object one byte at a time -- and it is lost for the same structural reason the pointer was: `TypeOpCall::getInputLocal` (typeop.cc:689) states the callee's declared parameter type about the Varnode that IS the call's operand, and `propagateTypeEdge` will not carry a pointer back over an INT_ADD, a MULTIEQUAL, or the store/load pair an -O0 spill puts in between. GNU tar -O0 shows it: `void * sub_e680(uint1 *a0)` for `drop_volume_label_suffix(char const *label)`, which passes `label` to `strlen`. When on, `kuna_charptr::char_pointer_from_evidence` collects that evidence with the bounded breadth-first walk `ptrfromuse` uses -- COPY/MULTIEQUAL/INDIRECT/CAST identity, the base slot of PTRADD/PTRSUB, a literal-addend INT_ADD graded by `ActionConstantPtr::isPointer`'s own three-way question, ten hops, visited set -- and asks of every use whether it is about CHARACTERS rather than whether it is a dereference at all. Three uses say yes: the value reaches argument i of a call whose callee DECLARES `char *` there AT THE BASE (declared meaning stated from outside the decompile -- a `libproto`/`libcsigs` signature, a `libctypes` shell, DWARF, a demangled name, `--assert prototype`, or the per-call-site override `formatstring` installs for a resolved `%s` -- read through `declared_input_type_local`, so `protoorder`'s recovered callee vote is deliberately NOT evidence: counting it was measured on the 444-slice sweep and scored lower); every dereference AT THE BASE is one byte wide, or the value is indexed one byte at a time by an index the program COMPUTES (a PTRADD of element size one whose index is not a constant); and the value is defined by or compared against a constant that resolves to a character array in the image. Nothing at a FIXED non-zero offset is evidence, in any of the three -- that is a field, not the object. The walk marks a value offset when it passes a non-zero literal INT_ADD, a non-zero PTRSUB, or a PTRADD whose index is a non-zero constant, and a byte access, a declared parameter and a further one-byte step there are all neutral. A byte read there is a one-byte struct field (coreutils `ginstall`'s `announce_mkdir(char *dir, void *options)` reads the `bool` at `options + 0x3c`); a declared `char *` there is a string FIELD (cronie `crond` -O0 `sub_6715` calls `strcmp(base + 0x13, \".cron.hostname\")` on a `struct dirent *`); and the PTRADD spelling matters because the same displacement is an INT_ADD while the base is an integer and `PTRADD(d, 0x13, 1)` once an earlier fold typed it `void *`, which is how dpkg's `dpkg-trigger` -O2 `sub_58d0` and `dpkg-statoverride` -O0 `sub_9aaf`, walking `d_name` to its NUL, became `char *`. The price is two correct idioms with the shape of a field: skipping a string's first character (`p + 1`), so coreutils `realpath`'s `path_prefix`, `env`'s `scan_varname` and `printf`'s `print_esc` stay `void *`, and writing a number backwards from `buf + 20` (gnulib `umaxtostr`), whose `buf` stays `void *` too. A VARIABLE index is not an offset: `strlen(p + i)` and `p[i]` still count. The candidate is one more vote in the same `getLocalType` fold, folded by `Datatype::type_order`, and it may additionally REFINE a pointer VOTE that points at nothing (`void *`, `undefined1 *`) while a pointer vote at a NAMED, aggregate or WIDER pointee -- `FILE *`, `stat *`, `long *`, a synthesized `struct_3 *` -- is left as it was. The guard reads the vote IN FLIGHT, not the type the function will finally print, so a pointee that would only have arrived by LATER propagation is not there to protect. `unsigned char *` is the common case and is deliberately accepted -- the element width agrees and only its signedness moves, the same call `charbyte` makes one level down (`protoorder_x86_64`: `int callee(unsigned char *a0,int a1)` -> `char *`). It is not only signedness: measured over 8 whole binaries, 3 declarations move from a WIDER pointee, all of them e2fsprogs e2fsck's `ext2fs_bitcount(unsigned int *a0,uint4 a1)` and its two stack copies (upstream declares it `int ext2fs_bitcount(const void *addr, int nbytes)`). No synthesized `struct_N *` declaration moves at all in that run (1,286 in both arms), and wide field reads rendered through an indexed character pointer go 1,202 -> 1,204 -- see `docs/features/charptr/analysis.md`. The refusals are a dereference or element step wider than a byte, a call argument the callee declared as some other pointer or as a scalar, integer multiplication/division/shift/PIECE, a float op, a comparison against a non-zero literal that is not a string, and an INT_ADD whose constant addend resolves to a global object. A refusal withdraws the VARNODE it was collected for and nothing else: the walk runs once per Varnode, the vote is folded per Varnode, and the type a reader sees belongs to the MERGED VARIABLE, so a slot walked with byte evidence in one flow and refused in another prints the commitment (grep -O0 `sub_6fdd`'s stack slot at -0x20: eight `byte` walks, four refusals, visible under `KUNA_CHARPTR_CENSUS=1`). They are about element WIDTH and contradicting declarations, not about arithmetic shape -- a constant-stride walk is never refused, because a literal displacement only marks the value as offset from its base. Only storage a reader sees declared is considered: a function input the prototype model could place a parameter in, or a Varnode in the stack space; a type-locked Varnode and one seeded from a type-locked symbol are never touched."
use_when = "Off by default, and the measurement says to keep it off. Turn it on when a string parameter or stack local reads as `void *` or `unsigned char *` and a callee's declared `char *` or a computed byte index says what it is -- most visibly at -O0, where every value is spilled to the frame and reloaded, which is exactly the hop the ordinary propagation cannot cross. Measured on the 444-slice decbench type sweep (10,748 functions): no function moves onto or off a perfect `type_match`, 2 move up and 4 down, aggregate -0.57. Before the offset rule covered a constant PTRADD index the same sweep read +4 onto perfect, 14 up, 6 down, aggregate +4.93, and nearly all of that gain was the skip-the-first-character idiom that is now declined because it is indistinguishable from a struct field. The reason the ceiling is small is measured and published in `docs/features/charptr/analysis.md`: ground-truth `char *` is the largest class in the corpus (14,645 of 65,715 scored variables) but half of it lives in registers, which kuna does not export at all, kuna's ARGUMENT recovery is already within 6.6 points of Binary Ninja's, and 932 of the 1,648 stack misses are frame slots reported as `undefined8` because the value that lived there was copy-propagated into a register -- a chapter-06 gap, not a chapter-05 one. KNOWN COST: committing a pointer forfeits the width-only free pass an 8-byte scalar gets, and `char *` changes how the body reads -- `*(long *)((long)a0 + 8)` becomes `*(long *)&a0[8]` (`RulePtrArith`), and a byte compared through it prints as a character constant. The four measured regressions are two functions: an `__off_t` the body also uses as an address (coreutils `head::elide_tail_bytes_pipe`), and a GT `_Bool` byte kuna reported as `undefined1` -- credited on width alone -- knocked on to `char` by the pointer it is read through (`tar::check_compressed_archive`, three builds). A byte-sized STORE is evidence too, so a `bool *` out-parameter that is only ever written (tar -O0 `mode_from_header`'s `hbits`) becomes `char *`. The signedness can also move the OTHER way as a knock-on, and a correct `char *` becomes `unsigned char *`. Measured on dash -O0 (not a sweep project): 13 lines in 7 functions, 4 of them signatures (`sub_68c3`, `sub_128e1`, `sub_1295d`, `sub_155e7`), and two of those bodies lose a character literal (`*a0 != '_'` becomes `*a0 != 0x5f`). Against it, 23 lines move forward to `char *` in the same binary and four `strcmp` casts disappear."
example = "option charptr on"
source_decompiler = "binja"
inspiration = "Binary Ninja recovers `char *` for 71.4% of the ground-truth character pointers held in stack locals and 71.5% of those held in arguments, against kuna's 44.8% and 64.9% on the same 444 slices; its advantage comes from reading what the program DOES with a value rather than from what propagation can carry. This rule takes the readable half of that -- the call-site declaration, the byte-wide dereference at the base, the computed one-byte index -- without changing how types propagate."
change_kind = "type-inference"
tier = "transform"
symptoms = "a string parameter is declared unsigned long and every call site passes it to strlen or printf|a buffer indexed one byte at a time is declared void *|two functions take the same string and one says char * and the other unsigned long|a -O0 parameter is an integer although the callee's prototype declares char *|void * sub_e680(uint1 *a0) for a function that passes its argument to strlen"
live_field = "char_ptr"
live_true = "on"
live_false = "off"
