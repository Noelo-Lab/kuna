[[settable]]
option = "signedness"
values = "upstream|auto|prefer-signed|prefer-unsigned"
default = "auto"
destructive = false
phase = "P9"
subphase = "naming-policy"
strength = "HARD"
rewind = "P9"
issue = "kuna-signedness"
summary = "Decide a declared integer local's signedness from the operations the body applies to it, instead of from whichever type-inference vote was most specific. Datatype::type_order ranks SUB_UINT_PLAIN (16) ahead of SUB_INT_PLAIN (17), so in get_local_type's most-specific fold a single uint vote outranks every int vote and nothing downstream re-decides; on -O2 x86-64 those uint votes are structural (INT_AND/INT_RIGHT/INT_XOR from a strength-reduced loop, INT_ZEXT from a 32-bit instruction widening into its 64-bit register), which is why a counter compiled from `int` is declared `unsigned int` and then cast back at every comparison. This pass accumulates, per declared HighVariable, the size-tagged operation set reachable from its printed members -- SLESS/SLESSEQUAL/SDIV/SREM/SRIGHT/SEXT/SCARRY/SBORROW demand signed, LESS/LESSEQUAL/DIV/REM/RIGHT/ZEXT/CARRY demand unsigned, LEFT pulls unsigned as a stated preference rather than a soundness rule (a bit buffer is spelled unsigned in C source, and a signed `<<` is what -fsanitize=undefined reports), `+ - * & | ^ == !=` and the value-moving ops are signedness-independent at a fixed width, and anything else (a pointer index, a dereference, a float, an indirect branch, a cast to anything but a same-width plain integer) vetoes the variable -- and picks TYPE_INT or TYPE_UINT for the declaration only. `At a fixed width` is a precondition: C promotes anything narrower than `int` to `int` before any operator runs and the declaration decides which extension that is, so a narrow local is never re-declared. The width that decides this is the `int` of the compiler reading kuna's output, 4 bytes, and not the target cspec's `integer_size`, which is 2 on avr8gcc/avr8egcc/TI_MSP430/TI_MSP430X/CR16/PIC24/x86-16. The default `auto` re-signs a declaration only when every signedness-sensitive reader of the value agrees and nothing vetoes it, so the only text that can move is the declaration itself and the casts that declaration makes no-ops: 0/675 datatest assertions, PARITY OK on the stage corpus, and over twelve binaries from nine projects at -O0 and -O2 (15,124 functions, x86-64 and ARM32) 377 declaration flips, 443 cast tokens dropped, none added, no flip on a declaration narrower than `int`, and no other hunk of any kind. `prefer-signed` keeps that walk and additionally declares a value no operation settles signed, which is what C source does -- DWARF agreement over 238 unstripped twins goes 93.4% to 98.4% overall and 71.9% to 94.8% at -O2 -- but it stays opt-in rather than default because it moves 7,081 declarations image-wide and the datatest corpus pins the upstream spellings. `prefer-unsigned` is the opposite tie-break, kept as its control and not recommended: 4 of its 40 DWARF-judged flips are right. `upstream` restores the declaration type inference produced, byte for byte. A flip is written only for a high that owns its own declaration line: the printer's candidate list is filtered to sole-named entries before any declaration collapse runs, because every collapse pairs two candidates rendering the same name, so which declarations exist is exactly what upstream produces. No Varnode type changes and no inference re-runs, so the type lattice, the JSON variables surface and the recovered prototypes are untouched -- the decbench type_match metric normalizes signedness away and scores the default flip at exactly zero."
use_when = "Nothing to set for the common case: the default `auto` already declares an -O2 loop counter `int`/`long` when every comparison on it is signed, instead of declaring it `unsigned int`/`unsigned long` and then writing `(int)v`/`(long)v` at each comparison. Set `prefer-signed` when you want the C convention for values no operation settles either -- the most DWARF-faithful arm, and the one to reach for when reading -O2 code -- and `prefer-unsigned` for the opposite tie-break (its own measurement says it is worse than doing nothing; it exists as that control). Set `upstream` to get the declaration type inference produced, byte-identical to not having the option, which is what to do when diffing against Ghidra or against kuna before this option existed. This is a readability/fidelity option: the decbench type_match metric normalizes signedness away, so it scores exactly zero either way."
example = "option signedness prefer-signed"
source_decompiler = "kuna"
inspiration = "TRex (Bosamiya, Woo, Parno, USENIX Security 2025) sections 3.3.5 and 5.1: signedness is decided at type-rounding time from the accumulated operation set rather than during propagation, with a flag that prefers signed for the ambiguous case because C programmers write `int` when it does not matter"
change_kind = "presentation-default"
tier = "transform"
symptoms = "an -O2 counter is declared unsigned int but every comparison on it is written (int)v|unsigned long locals whose only uses are signed compares|the declared signedness contradicts the casts in the body|want C-conventional signed declarations for values no operation settles|want the declaration type inference produced, without any rounding"
