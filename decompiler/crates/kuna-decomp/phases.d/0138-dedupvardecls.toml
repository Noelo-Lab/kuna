[[settable]]
option = "dedupvardecls"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "naming-policy"
strength = "HARD"
rewind = "P9"
issue = "angr-duplicate-decls"
summary = "Collapse local-variable declarations onto one line per mapped ScopeLocal symbol (same containing symbol + same identifier, declaring the symbol's own type when the highs disagree about it) and then onto one line per fully-rendered signature (type + name + array adornment + storage comment) of one object -- the same bound or referenced Symbol, since two distinct variables that print alike are still two variables -- so a stack slot mapped onto many scalar HighVariables is declared once instead of one line per high (the scalar analogue of the existing composite-symbol declaration collapse)."
use_when = "On by default (DIV-7): a stack slot is declared once even when many same-named scalar HighVariables share it (e.g. x86_64/cvs main, where the per-high rendering repeats `int4 option_index; // stack - 0x3c` ~200x), including when two live ranges of the slot recovered different types and so rendered two differently-typed declarations of one name -- invalid C (DIV-52). Set OFF to restore the one-declaration-per-high rendering."
example = "option dedupvardecls off"
source_decompiler = "angr"
inspiration = "test_decompiling_x8664_cvs; angr variable recovery (one variable per storage location, declared once); main"
change_kind = "presentation-default"
tier = "core"
symptoms = "the same local declared once although many HighVariables share the stack slot|flip off to see one declaration line per high (e.g. int4 option_index repeated hundreds of times)"
live_field = "dedup_var_decls"
live_true = "on"
live_false = "off"
