[[settable]]
option = "gotoreduce"
values = "off|return|on"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ReturnDuplicator"
summary = "After structuring, rewrite `if (cond) goto T` into `if (cond) { <tail> }` when T is a small single-successor basic-block chain ending in `return`, by duplicating that return tail inline (a print-tree copy of the same ops -- no p-code cloned), so the cross-edge becomes a structured early return instead of the goto/label Ghidra's CollapseStructure must emit for a shared multi-predecessor return tail. The value picks which tails qualify. `return`: a tail with no call and no STORE (<=3 blocks / <=8 ops; angr ReturnDuplicator). `on`, the default: `return`, then a tail that contains a call, such as a `free(p); return;` epilogue, reached from a bare `if (cond) goto T` or from the end of a `{ stmts; goto T }` arm (<=3 blocks / <=12 printed ops / <=2 calls, no STORE; angr ReturnDuplicatorLow, whose budget counts calls, max_calls_in_regions=2, rather than rejecting them); each of these is logged (`taildup:`). Duplicating a call is safe because the tail ends in `return`: the copy is reached on exactly one structured path. `off`: neither, the upstream goto/label rendering."
use_when = "kuna emits 1+ gotos to a shared return tail that angr renders goto-free (`if (x) goto label; ... label: return 0;`, or a `... free(p); return;` epilogue, e.g. morton my_message_callback: 1 goto -> 0). On by default. Set `return` when many early-exit error checks share ONE cleanup epilogue (the C `goto out;` idiom, e.g. openssh kex_choose_conf): `on` forks that cleanup call into source-absent copies, while `return` keeps it behind its label and still duplicates the call-free return tails. Set `off` to restore the upstream goto/label rendering for every return tail."
example = "option gotoreduce return"
source_decompiler = "angr"
inspiration = "test_decompiling_dd_argmatch_to_argument_noeagerreturns; test_decompiling_morton_my_message_callback; SAILR/Phoenix goto-reduction (ReturnDuplicator; ReturnDuplicatorLow / ReturnDuplicatorBase max_calls_in_regions, angr/analyses/decompiler/optimization_passes/return_duplicator_{base,low}.py); argmatch_to_argument; my_message_callback free();return; epilogue"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "goto to a label that only returns|label_N: return; shared tail after an if|more gotos than angr for the same function|goto to a shared free(p); return; style epilogue|cleanup-call return tail reached via label instead of duplicated inline|many error checks share one cleanup block (the goto out; idiom) and it is printed once per check"
