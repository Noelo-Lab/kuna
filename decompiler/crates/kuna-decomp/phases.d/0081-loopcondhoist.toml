[[settable]]
option = "loopcondhoist"
values = "off|auto|on"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "decbench-ifnoexit-loopcondhoist"
summary = "Make the test that is a loop's condition the loop's exit. A loop written `while (C) { ... if (X) break; ... }` has one natural exit, C failing; three places can lose it: LoopBody::findExit takes the first exit it meets (tails first), CollapseStructure's DEFERRED ruleBlockIfNoExit scan folds the first block whose terminal arm qualifies and the loop head sits ahead of its own body (so a head whose exit arm is a return folds to `if (!C) return X;` and ruleBlockWhileDo can never match it), and ActionReturnSplit copies the return block for every goto into it (so a break to the return after the loop becomes a second return the head no longer shares). The loop is then printed as `while( true ) { if (!C) return X; ... }` with the code written before a break after the loop. p8_structure/kuna_loopcond.rs names the condition block: in a function p3_dataflow/kuna_unoptimized.rs calls unoptimized it reads the layout (a while/for loop is entered by a jump to its condition, placed after the body, so a head laid out after every latch is the condition; a head laid out first with one conditional latch is a do-while; with no conditional latch a for(;;)); in an optimized function a single conditional latch, else a head test. An arm into a block ending in a no-return call is not an exit. With a condition block known, findExit takes its exit first, the deferred IfNoExit scan skips it while other blocks can fold (and entirely while its loop still holds an unstructured inner loop, so select_goto resolves the inner loop first), the region structurer keeps its exit edge, and in unoptimized functions ActionReturnSplit leaves a break edge alone when the returndup-auto record says it enters the same return statement as another edge. A different nesting of the same blocks: nothing is copied or reordered on any path. A structuring that prints more gotos than the structurers' own choice is not kept: when the rule changed a choice and the result holds a goto, ActionBlockStructure structures again without it and keeps the version with fewer."
use_when = "`on` is the default. Turn it OFF when a loop's real condition comes out as an inner `if`/`break` and some other test became the `while` header, or to compare against upstream's exit choice; `auto` keeps the structurers' choice in optimized functions and applies the layout rule only to unoptimized ones. Witnesses (gcc -O0): coreutils od read_char becomes `while (in_stream) { *c = fgetc(); if (*c != -1) break; ... } return ok;`, crazyflie logGetGroupAndName `for (...; i < logsLen; ...) { ... if (i == varid) { *group = ...; *name = ...; break; } }`, openssh addr_is_all0s `for (i = 0; i <= 3; ...) if (a[i]) return -1; return 0;`; (gcc -O2) openssh ssh-add lookup_env_in_list `while (n != i) { ... if (match) return ...; }`. MEASURED on decbench against main a3351f838: `on` O0 +140 (142 gained / 2 lost; FIT +77, CHECK +63), O2-noinline +63 (64/1; FIT +39, CHECK +24); `auto` leaves O2-noinline unchanged. Losses read: a source with `continue`s that the old form happened to match, a returndup copy of an inner `return 0`, and an equivalent guard nesting; no wrong output. The old `on` (skip every loop head in the scan) measured O0 +71 and O2 -162."
example = "option loopcondhoist auto"
source_decompiler = "kuna"
inspiration = "decbench O0 triage round 4, cluster `ifnoexit` symptom B (docs/decbench/features-round4.md Rank 2); the scan-order predicate replaces the refuted `region_structurer.rs cb.size_out() != 1` diagnosis and the `form A first` plan recorded in the same file as Killed K7 and K8"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "loop emitted as while( true ) with the head test as a guarded exit on the first statement|a for/while header condition is left inside the loop body|kuna writes while(true) where ida writes while (cond)|a loop's early-exit return is the loop's first statement instead of its condition|code written before a loop's break is printed after the loop|a do-while's bottom test is printed as an if-return inside while(true)"
