[[settable]]
option = "noreturn_propagate"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-noreturn-propagate"
summary = "REMOVES CODE: propagates no-return through the call graph, dropping unreachable code after no-return calls. Runs the structural no-return propagation consumer (the second Listing/xref consumer): the kuna analog of angr's CFGFast call-graph no-return propagation. Seed the terminal set from the Known no-return list and conclude a function no-return when its last real instruction (skipping trailing NOP alignment padding) is a CALL (or tail JMP) to an already-no-return callee, with no RETURN path, no computed jump, and no branch escaping the reachable body — iterated to a fixpoint, with NO evidence threshold (unlike noreturn_disc's >=3 call sites). Catches a custom no-return wrapper (e.g. coreutils xalloc_die, which ends in `call abort` followed by padding) that the static name list does not know and the >=3-evidence rule does not reach, so a caller (e.g. tee_O2 x2nrealloc) no longer grows a spurious while(true)/goto from the dead fall-through. Emits the existing NoReturnFact -> the existing set_function_no_return commit seam (no new commit arm, no S7 work). Requires the Listing (option listing on) — a no-op when the Listing is absent. On by default (DIV-14), but gated on the Listing (default-off), so every parity gate is byte-identical (real-ELF Listing path only). On an x86 real-mode raw or MZ image it runs over the raw discovery's own Listing instead, seeded from the DOS exit interrupts (INT 20h, INT 27h, INT 21h with AH 00h/31h/4Ch) rather than the Known list, so a function whose every path exits (Turbo C's exit and _exit) is no-return to its callers."
use_when = "On by default (DIV-14), but a no-op unless the Listing is built (option listing on) — with the Listing off there is zero behavior change. With listing on it concludes a custom no-return wrapper (a die()/fatal()/xalloc_die() that unconditionally ends in abort/exit) is no-return where it would otherwise be treated as returning — angr renders the caller cleanly but kuna would emit a spurious while(true) loop + goto + dead stack spills from the post-call fall-through (e.g. tee_O2 x2nrealloc). Broader than noreturn_disc: no >=3 call-site threshold and it seeds from the Known list. Flip OFF (with listing on) to keep the post-call fall-through code in the output."
example = "option listing on --option noreturn_propagate on"
source_decompiler = "angr"
inspiration = "test_decompiling_tee_O2_x2nrealloc; angr CFGFast no-return propagation (returning / _iteratively_analyze_function_features); x2nrealloc"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "unreachable code after a call to an exit/fatal wrapper|function truncated after calling a cold wrapper|spurious while(true) around a call that never returns|stripped binary's unnamed exit wrapper swallows the functions after it"
