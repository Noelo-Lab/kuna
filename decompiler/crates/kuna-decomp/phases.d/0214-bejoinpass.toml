[[settable]]
option = "bejoinpass"
values = "off|whole|high"
default = "whole"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "bejoin"
summary = "Join a big-endian register pair that a call hands back and the function returns untouched as one value. `bejoin` decides a function's returned pair by that function's own proof and a call's output pair by its callee's, so a pair passing from one to the other unchanged was judged twice and could join in both orders at once: a wrapper with no proof of its own of a proven 64-bit callee (`jal add64; nop; lw $31,..; jr $31` on MIPS o32, `bl add64; ..; blr` on PowerPC, which `passthrough`'s tail-return claim gives the callee's two registers) joined its RETURN first register low while the call read the pair high word first, and printed `CONCAT44((int)v1,(int)(v1 >> 0x20))`, the callee's value with its halves swapped; a function proven by its callers or declared 8 bytes that returns what an unknown callee left in the pair (a MIPS PIC call through the GOT, a call through a function pointer, a PowerPC tail call into an unproven callee) printed the same swap the other way round. A side with a proof now fixes the order of both: a call whose two registers reach, untouched through moves and phis, the high and low words of a RETURN joined high word first joins high word first too, which changes only how the same bits print (`v1 = (*hook)(); ext(); return v1;`, kuna_bejoinpass::call_order). A function with no proof of its own whose every live RETURN hands back the pair a call to a proven callee left there untouched (kuna_bejoinpass::settle_return) has the bytes of both `u64 w(){return add64(..);}` and `u32 hi(){return add64(..) >> 32;}`, and nothing in it tells the two apart: `whole` (the default) returns the callee's whole value high word first, `return add64(..);`, right for the wrapper and too wide for `hi`; `high` returns its first register alone, the callee's high word, `return (int)((unsigned long long)add64(..) >> 0x20);`, right for `hi` and too narrow for the wrapper; under `whole` too, a RETURN whose first register went through more moves than its second (gcc -O0's `(u32)(v >> 32)`, `mov r3,r0; mov r0,r3` after the pair is moved back) keeps the first register alone. A caller reading the second register (`bejoin callers`) or a declared, DWARF or `--assert prototype` 8-byte return proves the function and keeps the pair whole in either mode. Under `whole` such a function is proven for its callers too, once one of its direct callers reads its first register (`void f() { g(); }` has the same bytes, and a caller of it reads nothing), so a caller that reads only that register (a sign test, `if (w() < 0)`) reads the value's high word, `(long long)w() <= -1`, not `(int)w()`, which C reads as the low word; and a proven function whose RETURN hands back a proven callee's pair keeps both registers even where they reach it as the call's indirect creations (an -O0 wrapper that reloads its arguments printed `void w(..)`). Changing the option mid-session drops the verdicts taken. `off` leaves each side to its own verdict. Only pairs of two 4-byte registers (PowerPC r3:r4, MIPS o32 v0:v1, SPARC o0:o1, ARM big-endian r0:r1) under `bejoin evidence` or `callers` are judged; every other target and mode is unchanged."
use_when = "Leave at `whole` (the default): a pair handed back untouched prints as one value, and a function with no proof of its own that returns a proven 64-bit callee's pair returns the callee's value. Set `high` when such a function's source returns only the high word (`u32 hi(){return add64(..) >> 32;}`, or the first member of a struct a PowerPC `-msvr4-struct-return` callee returns in r3:r4), or when a caller in the image tests only its first register and prints `(int)w()` for what is the high word; better still, `--assert prototype` its true return, which every caller then reads. `off` restores the two separate verdicts and the swapped `CONCAT44((int)v1,(int)(v1 >> 0x20))`. Measured against `off` over 359 MIPS images (gcc and clang, -O0 to -O3 and -Os; zlib, Lua, SQLite and authored shapes; big- and little-endian PIC shared objects and big-endian objects) and 250 PowerPC images (gcc 13 and clang 14, the same sources, PIC and non-PIC) with their DWARF stripped: functions printing the swapped `CONCAT44((int)v,(int)(v >> 0x20))` fall from 22 to 4 on MIPS (the rest join a 64-bit temporary of the function's own, or a call's pair the function keeps rather than returns) and from 16 to 0 on PowerPC. Every function `whole` and `high` print differently is a wrapper with no proof of its own and an 8-byte DWARF return: 22 there (`i64 p8(int x){return fw(x);}`, `u64 ret_g(u64 a){return add64(a,3);}`) and 13 in compiler-rt's builtins and 64 SDL3 sources built for MIPS and PowerPC (clang 14, gcc 12 and 13, -O0 to -Os, PIC and non-PIC, soft-float; `SDL_TellIO`, the `SDL_IOStream` size and seek callbacks, soft-float `__floatdidf`). `whole` prints all 35 at their DWARF width, `high` none, and no `u32 hi()` shape occurs in any of these images; over big-endian MIPS and PowerPC glibc, libm, libgcc_s, libatomic, libgomp, libstdc++ and ld.so (Debian 12, Ubuntu 24.04) and angr's MIPS and PowerPC test binaries, 59 images and 30,677 functions, the two print byte-identically. Every other change prints a proven function's call pair high word first. x86-64, i386, little-endian ARM and MIPS, AArch64 and PowerPC64 LE output is byte-identical, as are 51 ARM big-endian objects."
example = "option bejoinpass whole"
source_decompiler = "kuna"
inspiration = "GH-904: a MIPS or PowerPC wrapper that returns a proven 64-bit callee's register pair printed CONCAT44((int)v1,(int)(v1 >> 0x20)), the callee's value with its halves swapped"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a big-endian function that returns a call's long long prints CONCAT44((int)v1,(int)(v1 >> 0x20))|a wrapper of a 64-bit callee on PowerPC or MIPS returns the callee's value with its halves swapped|a u32 that returns the high word of a 64-bit call result prints as unsigned long long"
