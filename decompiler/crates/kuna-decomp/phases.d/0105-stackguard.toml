[[settable]]
option = "stackguard"
values = "on|off"
default = "on"
destructive = true
phase = "P7"
subphase = "edge-virtualization"
strength = "HARD"
rewind = "P7"
issue = "angr-StackCanarySimplifier"
summary = "REMOVES CODE: strips the -fstack-protector canary epilogue (the `if (canary != *(fs:0x28)) __stack_chk_fail()` check) from the output. Strips the glibc -fstack-protector canary epilogue (the check + its no-return call block) AND the entry-side canary init (`slot = *(fs:0x28)` and its TLS-base residue, released to dead-code once the last check is stripped), collapsing the shared single-return point so each path returns directly (no goto/label, no dead canary store)."
use_when = "On by default (DIV-14): removes compiler-inserted stack-protector boilerplate and the shared-return goto it forces. Flip OFF to keep the real canary-check instructions in the output (e.g. to audit the protector itself, or if an unusual non-glibc `ptr+0x28` compare guarding a call is being matched). It is marked destructive because it deletes those real instructions, but it is byte-identical over the 675 datatests (the `Partial splitting` cases opt out via `option stackguard off`)."
example = "option stackguard on"
source_decompiler = "angr"
inspiration = "test_ite_region_converter_missing_break_statement; angr StackCanarySimplifier (angr/analyses/decompiler/optimization_passes/stack_canary_simplifier.py); authenticate"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "stack-protector canary compare against fs:0x28 and a __stack_chk_fail branch cluttering the epilogue|shared-return goto forced by the canary check block|flip off to keep the real canary instructions for auditing the protector"
