[[settable]]
option = "castsign"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "cast-policy"
strength = "HARD"
rewind = "P9"
issue = "kuna-castsign"
summary = "Extend the `signedness` declaration rounding to the three places it leaves alone, so a variable the program only compares signed is declared signed there too. `signedness` skips every high mapped onto a Symbol (and a stack local is mapped onto its frame Symbol at offset 0), vetoes a variable used as a PTRADD index or converted to a pointer, and skips a body local one of whose members is an input; the 2026-09-23 cast census found `unsigned long v15; // stack - 0x60` with `if (0 <= (long)v15)` at every comparison as a result. When on, `kuna_castsign` admits a frame local that covers its Symbol whole (offset 0, a Symbol type that is a plain integer of the declaration's width, and no other high in the function printing the same name, which keeps an address-taken or split slot out), takes a pointer-width PTRADD index and a same-width conversion to a pointer as neutral readers (both compute the same bits under either declaration, and the signed index is the defined one), and admits a body local with an input member (the printer declares only body locals and retain_sole_named drops every other plan entry). Three conditions keep every value the C computes: a high only this option admits is left alone when `+ - * << ` or unary `-` reads it, directly or through the expression its value is printed into (that arithmetic wraps over the unsigned declaration and would overflow over the signed one, which gcc folds on even at -O0 and clang at -O2: `0 <= (long)(v1 - 1)` and `v1 = v1 - 1, 0 <= v1` both go wrong at v1 == LONG_MIN); it is left alone when a `==`, `!=`, `&`, `|` or `^` meets it, or that expression, with a constant whose top bit is set, alone or inside the other operand (kuna may print that constant as an unsuffixed decimal, `3000000000` or `10000000000000000000`, whose C type is wider than the declaration, and C sign-extends a signed variable to it: `v == 3000000000` is false for every `int v`); and it is re-declared only when a cast the new declaration makes a no-op prints today (its value is not only a call argument, the right side of an assignment or a return, where `castimplied` may already leave it out). A high bound to a type-locked Symbol is never re-declared: a `--assert type`, a DWARF local and a type committed from Ghidra keep the declared type and its casts (the lock is read on the Symbol, since the member varnodes do not carry it). A decision any of these relaxations made may only declare the value signed; a value some reader needs unsigned (an unsigned comparison, a logical shift right, unsigned / or %, a zero-extension) keeps its declaration. A type-locked unsigned parameter and a store through an unsigned pointer are NOT unsigned evidence: gnulib passes its signed idx_t to size_t parameters everywhere, and counting them cost 46 casts over the census corpus while typing xpalloc's nbytes wrong. Because re-declaring an assignment's left side would lose a widening `castimplied` dropped by matching spellings, `castimplied` also accepts a re-signed declaration as wide as the cast (a conversion to an N-bit integer depends only on the value modulo 2^N). The frame Symbol's type is not changed, so the JSON variables[] surface and every prototype are byte-identical; only C declarations and the casts they make no-ops move. C output only: Rust has no implicit integer conversions, so a re-declared local would not accept its unsigned definition. On the 45-binary cast corpus casts on the 4,815 functions kuna and IDA both emit go 38,703 -> 38,602 (1.023x -> 1.021x IDA), 41 functions fewer, 0 more; 0/675 datatest assertions and the 444-slice typesweep do not move."
use_when = "On by default: a stack local or a pointer index the body only compares signed is declared `long`/`int` rather than `unsigned long`/`unsigned int` with `(long)v` at each comparison. Set it off to get exactly what `signedness` alone declares (the frame locals keep the type inference chose), for example when diffing against output from before the option existed. It never declares anything unsigned, and it only acts when `signedness` is not `upstream`. A readability option: decbench type_match normalizes signedness away and scores it zero either way."
example = "option castsign off"
source_decompiler = "kuna"
inspiration = "The 2026-09-23 cast census: 596 of kuna's casts on the functions it shares with IDA convert a variable declared unsigned to the signed type the program compares it at, `if (0 <= (long)v15)` over `unsigned long v15;`, 526 of them on locals (census measure.md 4b, engine.md 4.5)"
change_kind = "presentation-default"
tier = "transform"
symptoms = "a stack local is declared unsigned long and every comparison on it is written (long)v|if (0 <= (long)v15) with unsigned long v15; // stack - 0x60|the declared signedness of a frame local contradicts the casts in the body"
live_field = "cast_sign"
live_true = "on"
live_false = "off"
