[[settable]]
option = "mixedtailret"
values = "on|off"
default = "off"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "gh-881"
summary = "Return the value a function tested to choose between returning it and tail-calling a value-returning function. `int keep(int *p) { int x = *p; if (x > 5) return x; return getv(); }` compiles to `mov (%rdi),%eax; cmp $5,%eax; jle L; ret; L: jmp getv` (clang -O2), and kuna prints `void keep(int *a0)` and drops the value: the `ret` path's eax is also compared, so upstream's ancestorOpUse (funcdata_varnode.cc) refuses it as a return value, and passthrough's tail-call arm takes a tail call's result only when EVERY live RETURN hands one back. With the option on, when at least one RETURN hands back a call whose callee's recovered prototype (protoorder, decompile-all) returns a value in one register, a RETURN reached from no call is taken as returning that register too when, read from the raw p-code before the first heritage: the function itself wrote the register last on every path into the RETURN, no wider than the callee states it (no call in between, no path from the entry that leaves the incoming register); the nearest conditional branch above the RETURN on its single-predecessor chain whose other side reaches the claimed tail call tests that value, in the register or in the one it was copied from (gcc's `cmp $5,%edi; jg L; jmp getk; L: mov %edi,%eax; ret`), and the RETURN is not on the side where that test found it equal to a constant (read for x86 `test`/`cmp $K` with je/jne, also on a 32-bit register copy, a sete/setne byte tested with `test`, and AArch64 cbz/cbnz and `cmp w0,#K` with b.eq/b.ne); and from where it is computed the value only decides branches, moves between registers and reaches the claimed tail calls -- no load or store through it, no store of it, no arithmetic kept in a register, no other call while it sits in an argument register. Where the return register also passes the first argument (ARM, AArch64, RISC-V, PowerPC) the claimed callee must take no parameter there. The claim then runs as passthrough's tail claim does, except that it does not yield to a value of another storage class (the xmm0 gcc's -fzero-call-used-regs scrub zeroes before one ret and a tail callee leaves alone before the other). Off by default because the bytes cannot tell the function that returns the value from a void guard that leaves it in the return register: clang's ARM `ldr r0,[r0]; cmp r0,#5; bxgt lr; b work` is both `void thr(int *p) { if (*p > 5) return; work(); }` and `int keep(..)`."
use_when = "Off by default. Set it ON for a function printed `void` (or with a bare `return;` on one path) beside a `return f(..); // tail-call` on another, when you know the function returns a value: its callers read the return register after calling it (look at them, or at `kuna xrefs --to`), its name or the source says so, or DWARF from another build does. It acts only in decompile-all, where protoorder states each callee's recovered return before its callers; a single-function `kuna decompile` states nothing and leaves the function as before. Known misfires with it on, all functions that are void in the source and leave the value they tested in the return register, which then get a return value they do not have (the value printed is the one the register holds, so no value is wrong, but the return type is made up): lazy initializers (`if (inited) return; init();`), reference-count puts and once-guards whose tested counter or flag stays in eax, range checks that return early on a value they loaded, and on ARM and PowerPC any `void` guard of the `if (*p > 5) return; work();` shape. In a test file of 18 such void guards, 9 gain a return, 37 times over their gcc and clang -O1, -O2, -O3 and -Os builds. A void guard whose equality test kuna does not read as one gets `return 7;` or `return 0;`: a truth byte compared with `cmp` (`sete %dl; cmpb $1,%dl; je`), a value tested after movzbl/movsbl, a constant held in a register (`movl $7,%ecx; cmpl %ecx,%eax`), and PowerPC condition-register tests. Over 54 decbench x86-64 binaries (O2, O2-noinline, O0), 10 ARM firmware images and 813 objects clang -O2 -g builds for AArch64, ARM, RISC-V, MIPS, i386 and PPC64LE, decompile-all with the option on changes no function, so on real code it neither helps nor hurts there; it fixes the shape of #881."
example = "option mixedtailret on"
source_decompiler = "kuna"
inspiration = "GH-881 part A: clang and gcc -O2 `keep`/`fwd` (mixret2.c), and gcc -O2 -fzero-call-used-regs=all `keep`, which printed void or returned xmm0; upstream ActionReturnRecovery (coreaction.cc:1954) and Funcdata::ancestorOpUse (funcdata_varnode.cc)"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a function that returns a value on one path and tail-calls a function on the other is printed void|if (6 <= *a0) return; getv(); // tail-call where the source returns *a0 on that path|a function returns xmm0 although its callee and its other path return an int in eax|the return value a function tests before returning it is lost beside a tail call"
