[[settable]]
option = "calleefilledarg"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "active-input-trial-scoring"
strength = "HARD"
rewind = "P4"
issue = "kuna-callee-filled-argument-slot"
summary = "Mach-O Objective-C: at a call to an `objc_msgSend$<sel>` selector stub, score the argument slots after the selector register on their own evidence. Every register convention's positional rule says the first argument register nobody fills ends the list, and `ParamListStandard::forceNoUse` (fspec.cc:1623) applies it at each call: a trial scored definitely-not-used -- the register was killed by the previous call and the caller never wrote it -- turns every actively staged register after it inactive. That is right for a C callee and wrong for a selector stub. An Objective-C image linked with -objc_stubs_fast sends every message through a `__objc_stubs` entry that loads the selector into x1 (`adrp x1; ldr x1,[x1,#off]; … br x16`) and the caller stages the real arguments in x2, x3, x4 with x1 untouched, so `[snapshot countByEnumeratingWithState:&state objects:buf count:16]` printed `objc_msgSend$countByEnumeratingWithState:objects:count:(v3)` at every `for (x in …)` loop of the image: with the address of the enumeration state gone from the call, the state struct never escaped, its zero-initialised slots folded through the call, and the loop read `*(objc_object **)(v6 * 8)` and compared a global at address 0. The callee must be named as a selector stub (the linker's name for the stub, which the objc analyzer also gives it in a stripped image), and its body, read by the entry-liveness walk `calleedeadarg` already caches for every direct call, must agree: every path leaves through an indirect jump, none returns, calls or runs a user op, it reads no register on entry, and it writes the register on every path before anything could read it. The name is what keeps a C callee out: `void tramp2(void) { g_fp(g_x, 1); }` also fills rdi and rsi and jumps through a register, but at clang -O0 a caller's idiv remainder left in rdx is no argument of it, and the positional cascade is what keeps it off the call. The pass acts only on a trial the caller's own evidence has already scored definitely-not-used: `forceNoUse` steps over it as it steps over a trial with no entry, and the slots after it are scored on their own. A hole `buildTrialMap` backfills on such a register is the same kind of slot, and `forceInactiveChain` never materialises either as an argument; the chain rule is untouched. Any other trial state, a stack trial, an indirect call, any other callee, and a stub the walk could not cover keep the positional rule. Inert outside Objective-C images. 0/675 on the datatest corpus."
use_when = "On by default for Mach-O Objective-C: a call to an `objc_msgSend$<sel>` selector stub, which loads the selector into x1 (rsi) itself, keeps the arguments the caller staged after that register, so a passed `&local` reaches the call and the local's later loads are not folded to its initialiser. Every other callee keeps the positional rule. Flip off to restore it at selector stubs too."
example = "option calleefilledarg off"
source_decompiler = "kuna"
inspiration = "Perplexity iOS 26.46 (72 MB arm64 Mach-O, -objc_stubs_fast): 39 of the 91 sampled Objective-C methods print the NSFastEnumeration send with one argument and read the enumeration state through address 0"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a call to an objc_msgSend$ selector stub prints with only its receiver|a for-in loop reads *(objc_object **)(v * 8) and compares a global at address 0|a &local passed to an objc_msgSend$ selector stub is missing from the call and the local's later loads fold to its initialiser"
live_field = "callee_filled_arg"
live_true = "on"
live_false = "off"
