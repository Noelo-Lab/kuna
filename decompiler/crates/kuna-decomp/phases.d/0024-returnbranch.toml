[[settable]]
option = "returnbranch"
values = "on|off"
default = "on"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "mips-ra-jump"
summary = "Keep a computed jump that the instruction spec classified as a return. SLEIGH marks `jr $ra` (and similar return-register jumps) as RETURN whatever the register holds, so a function that loads a constant code address into the return register and jumps through it ends at that jump: the code it reaches, and every store there, is dropped. On, a RETURN whose target a bounded straight-line prefix from the function entry proves constant (at most 256 raw operations, stopping at any call, branch or unknown user operation; an unproven write invalidates the storage it overlaps, a store forgets the values in the space it writes, and the incoming return address is never treated as known) becomes an indirect branch; ordinary jump recovery then follows it. A proven zero is not a target: `move ra, zero` ends a backtrace, so a function start placed on such a delay slot keeps its real return. Instructions that emit no p-code, such as a MIPS `nop`, may precede the prefix. An ISA-mode marker selecting the ordinary ISA does not stop it, recognized by the user-op name the language declares rather than by the architecture id, so the standalone and Ghidra front ends decide alike. A flow override at the return keeps its classification. Off restores the spec's RETURN."
use_when = "On by default: 0/675 datatest assertions move. Flip off to compare with upstream's return classification, or when the proven constant is not code this function continues at: a target that is another function's entry shows that function's body inside this one, and a target in a segment's zero fill can fail the whole function."
example = "option returnbranch off"
source_decompiler = "kuna"
inspiration = "hand-written MIPS assembly that sets $ra to a local continuation and jumps through it (jr $ra) before storing"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "a function ends at jr $ra right after loading $ra with a constant address|stores and calls after a computed jump through the return register are missing|a MIPS function that reuses $ra as a jump register decompiles to an empty body"
live_field = "return_branch"
live_true = "on"
live_false = "off"
