[[settable]]
option = "gotypeglobals"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-multilang-gotypeglobals"
summary = "Name and type a Go image's `_type` descriptors as data globals - the first consumer of the gotypes runtime-type harvest. A Go binary's runtime metadata types two families of data objects outright: its own `_type` descriptors and the interface-dispatch tables (itabs) that bind them. A descriptor is a global of layout internal/abi.Type that Go's linker names `type:main.Point` / `type:*main.Point` / `type:[]uint8`. Stripping deletes those symtab names but the records stay reachable through the moduledata, so every allocation and interface-conversion site - `runtime.newobject(&type:main.Point)`, convT*, assertE, mapiterinit - decompiles as a call on a bare `&DAT_...` constant and the recovered named types never appear in the C. With the option on, every descriptor reachable from the gotypes walk (the typelinks or the go1.26+ descriptor region, then the type graph those records span: elements, keys, fields, parameters, methods, ptrToThis) is committed as a data symbol at the record's VMA: the linker's own `type:<name>` spelling - a named type qualified by its full import path from uncommontype.pkgPath (`type:internal/poll.FD`, `type:*internal/poll.FD`), so a stripped image's names equal an unstripped build's symbols - the `go.typedesc` shell (the 48/32-byte abi.Type base record, so runtime code walking a descriptor renders named field reads like `t->Kind_`), typelock|namelock at the engine's typed-data seam. The same walk names each static itab the moduledata lists - the go1.18..1.25 `itablinks` pointer slice or the go1.26+ `[types + itaboffset, + itabsize)` region walked by each record's `ITab.Size()` - as a name-only `go:itab.<concrete>,<interface>` data symbol, its two type names built from the two descriptor ADDRESSES the itab record points at (offsets 0 and 8), never a spelled name, each in the same import-path spelling; so an interface conversion renders `go:itab.main.Point,fmt.Stringer` instead of a bare `&DAT_...`. The itab symbol is a NAME, not a typed object (an itab address is used polymorphically - passed to getitab, compared, stored into an interface word - so locking its global to a struct type would demote those uses and hide the very symbol a reference renders, exactly how Go's own symtab names an itab untyped), and an itab the image already names (an unstripped binary's symbol table) is left to that name, so the pass only ever ADDS the itabs stripping removed. Names that cannot print safely (anonymous `struct { ... }` literals, `func(int) bool` - anything with interior whitespace) are dropped; unnamed composite spellings (`[]uint8`, `map[string]int`) are kept, they are what an analyst searches for. The facts are produced at load and the COMMIT is gated, so `off` renders exactly what the gotypes provider alone renders; non-Go images produce no facts and never see the option. Covers go1.16 on (the build-info version selects the pre-go1.17 u16 name length)."
use_when = "On by default: on a Go binary every runtime.newobject/convT/assertE call site names the type it manipulates instead of a bare &DAT_ constant, which is how the harvested named types become visible in decompiled C at all. Flip off to compare against the bare-metadata rendering (triaging whether a wrong name came from the descriptor walk) or to keep the symbol table minimal on a huge Go image. Non-Go binaries are byte-identical either way."
example = "option gotypeglobals off"
source_decompiler = "kuna"
inspiration = "Ghidra's Golang type analyzer labels descriptor addresses with their recovered type names (GoTypeManager); the Go linker's own `type:` and `go:itab.` symbol spellings, which an unstripped build's symbol table and DWARF carry"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "go decompile shows runtime.newobject(&DAT_...) or convT(&DAT_...) with no hint which type is allocated|interface conversion call sites in go output pass anonymous dat_ globals|go:itab interface-dispatch tables render as bare &DAT_ addresses instead of go:itab.<concrete>,<interface>|runtime functions walking type descriptors render raw offset arithmetic instead of named fields|harvested go struct names exist in the type catalog but never appear in any function's C"
