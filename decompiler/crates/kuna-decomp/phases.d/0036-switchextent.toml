[[settable]]
option = "switchextent"
values = "on|off"
default = "on"
destructive = false
phase = "P2"
subphase = "switch-model"
strength = "HARD"
rewind = "P2"
issue = "kuna-switchextent"
summary = "End a jump table that no range check bounds at the next jump table of the same function. A compiler that knows its selector is in range checks nothing before the dispatch: Swift's `switch` over a multi-payload enum indexes a halfword offset table straight with the case `swift_getEnumCaseMultiPayload` returned, and clang does the same for a C `switch` whose `default` is `__builtin_unreachable()`. The basic model then has no guard, the selector's whole width exceeds `jumptablemax`, and the dispatch prints as a computed call that ends the function's flow. The entries of such a table are offsets and say nothing about where it ends; the table after it does: a function's jump tables are emitted together, back to back in one read-only section, so a table runs exactly to the lowest table of the same function above it. A Swift enum's table is bounded exactly instead, also when it is its function's last: when the index is the case `swift_getEnumCaseMultiPayload` returned for metadata from a local enum's accessor, the table has the enum's case count (payload plus empty cases, from the descriptor `swiftmetadata` reads). Before it recovers any table the flow decodes the function's extent once (its entry to the next known entry), folds every register through the lattice the dispatch shapes need, and names the table of each computed jump the fold proves reads one; a table the guard analysis could not bound is then re-bounded to the entries that fit before the next one, and the run-on cut (`switchrunon`) still trims rows that leave the function. A function's last table has no such bound and is left as it was: an object the function merely reads may sit anywhere in the section, and a bound taken from one could run the table on into another function's. One exception: an unguarded table whose rows leave the function and survive the run-on cut (a byte-masked Swift enum switch reads 256 rows, the rows past its cases being the next functions' tables) ends at the lowest jump table above it, of this function or of the next ones, which the flow decodes function by function (at most 32) until one dispatches through a table above it. The discovery Listing applies the same rule when it reads an AArch64 compact table (`adr` base, `ldrb`/`ldrh`/`ldrsw` entry scaled by `lsl #2`) with no range check, so the case bodies are the dispatcher's own code there too and the aggressive instruction finder plants no entry on them; a range-checked AArch64 table is read there whatever this option says."
use_when = "Leave on: a Swift enum dispatch recovers as a switch with exactly its enum's cases, and an unreachable-default C switch when another table of the function follows it. Flip off to see the computed call the model gives up with, or if a function's tables are not laid out back to back (hand-written assembly)."
example = "option switchextent off"
source_decompiler = "kuna"
inspiration = "Perplexity iOS 26.46: 1,077 unchecked compact tables in 640 Swift functions, each ending the function at `(*(code *)(v * 4 + base))(); // jump-as-call`; cmark-gfm's re2c scanner cut into six functions by gap entries on its case bodies"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "a swift function ends in (*(code *)(v * 4 + 0x...))(); // jump-as-call after swift_getEnumCaseMultiPayload|a byte-selector switch with hundreds of phantom cases whose bodies are other functions' code|'Could not recover jumptable' on a dispatch with no cmp before it|an arm64 switch's case bodies listed as sub_ functions and the dispatcher truncated at the first one|a 13 KB function decompiles to its first few hundred lines"
live_field = "switch_extent"
live_true = "on"
live_false = "off"
