[[settable]]
option = "importdata"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "naming-policy"
strength = "HARD"
rewind = "P9"
issue = "kuna-importdata"
summary = "Render a data read through a loader-marked import slot as the import itself. A data import (Mach-O __got / __auth_got, a dyld-cache coalesced GOT slot, a PE IAT entry) is reached through a slot the dynamic loader fills with the import's address: `ldr x8,[slot]; ldr w8,[x8]`. The slot is already named for the import and painted `externref` (peimportcall), which is what lets ActionDeindirect resolve a CALL through it to the import; a DATA read is not a call, so it printed as a dereference of the anonymous slot, `*dat_<slot>`. On: a LOAD whose pointer is such a slot renders as the import (`imported_counter`, `__stack_chk_guard`), resolved exactly as ActionDeindirect resolves a call through the same slot (query_function on the externref persist address). Calls are unaffected (deindirect consumes them first), and a read through anything that is not an externref import slot is untouched. Needs the slot painted externref: on PE/Mach-O that is peimportcall, and on ELF the elfgotimports pass, committed under this same gate, which names each GLOB_DAT GOT slot of an undefined symbol (x86-64, AArch64, i386, ARM) for its import and paints it externref. On ELF that painting also lets ActionDeindirect bind a call through such a slot (`(*dat_e9f30)()` becomes `__cxa_finalize()`), the binding peimportcall gives PE and Mach-O. A GLOB_DAT slot of a symbol the image defines is never painted: dynrelocs already folds it to the object (`exported_value`, `&exported_value`). The slot's own value, used without a dereference (a Swift witness table or type metadata passed to the runtime, an Objective-C class object passed as a receiver), is the import's address: on, for a Mach-O slot machodataslots marks as a data import, a read of the value the loader put in the slot, carried only across calls and joins, renders `&<import>` (`swift_getWitnessTable(&<SwiftUI.ModifiedContent<A,B>:SwiftUI.View>.protocol_conformance_descriptor,...)`, `objc_msgSend$numberWithLongLong:(&OBJC_CLASS_$_NSNumber,...)`) instead of `dat_<slot>`; a value the function itself stored into the slot keeps the slot name."
use_when = "On by default: a data read through a GOT/IAT import slot names the import -- the stack-protector guard, XPC type objects, global counters -- so `if (*dat_1041cc6c8 == ...)` reads `if (__stack_chk_guard == ...)`, and on an ELF shared object `return *dat_3fe8;` reads `return imported_counter;` and `*stdout_ptr` reads `stdout`. Flip off to keep the slot dereference `*dat_<slot>`, for example to see which slot a read goes through or to diff against Ghidra output."
example = "option importdata off"
source_decompiler = "kuna"
inspiration = "Ghidra ActionDeindirect / ExternRefSymbol (the call side kuna already models with peimportcall)"
change_kind = "presentation-default"
tier = "core"
live_field = "import_data"
live_true = "on"
live_false = "off"
symptoms = "a data import read through __got renders *dat_<slot>|a witness table, type metadata or class object passed to a call prints as dat_<slot>|__stack_chk_guard shows as a dereferenced dat_ address|imported globals are anonymous even though their GOT slot is named|an ELF shared object reads stdout or environ as *dat_<slot> or *stdout_ptr"
