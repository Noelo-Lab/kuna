[[settable]]
option = "truthycond"
values = "on|off|ptrchain"
default = "ptrchain"
destructive = false
phase = "P9"
subphase = "condition-form"
strength = "HARD"
rewind = "P9"
issue = "kuna-cnorm-fmt"
summary = "Render a boolean-context zero comparison in truthy form (if (x) / if (!p)) vs the explicit comparison (if (x != 0) / if (p == NULL)); ptrchain keeps the comparison for a pointer variable that is an operand of && / ||."
use_when = "ptrchain by default: idiomatic C for if/while/for/ternary conditions and &&/||/! operands (DIV-36), except that a plain pointer variable (parameter or local) tested as an operand of && / || outside a loop's condition prints p != NULL / p == NULL, the spelling source code uses more often there. on makes every boolean-context test truthy (p && n); off reproduces upstream Ghidra's explicit comparisons for diffing. Float compares, enum-typed zeros, and equate-named zeros always keep the explicit form; value uses (v = (x != 0)) are never rewritten."
example = "option truthycond on"
source_decompiler = "kuna"
inspiration = "user-reported readability issue on the angr fmt corpus binary (if (v8 != (char *)0x0) vs if (v8))"
change_kind = "presentation-default"
tier = "core"
symptoms = "if (x != 0) where idiomatic C reads if (x)|if (p == NULL) where if (!p) is wanted|explicit zero comparison in conditions unwanted|p != NULL && n where p && n is wanted|truthy condition rendering needs to match upstream ghidra for diffing"
