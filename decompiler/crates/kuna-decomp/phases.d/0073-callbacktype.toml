[[settable]]
option = "callbacktype"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "prototype-source"
strength = "HARD"
rewind = "P4"
issue = "typecampaign-callback-slot"
summary = "Give a function whose address is handed to a library callback slot the prototype that slot declares. kuna already resolves the library's own prototype at the call site, so `qsort(dat_d148,dat_d150,0x10,sub_3a72)` renders with the name; nothing was ever said about `sub_3a72`, which is reached only through the pointer and so has no call site of its own to recover from. Its body is all it has, and that leaves a comparator `int sub_3a72(unsigned long *a0,unsigned long *a1)` and a signal handler that ignores its argument `void sub_1100(void)`. The library declares both: `qsort`'s fourth parameter is `int (*)(const void *,const void *)` and `signal`'s second is `void (*)(int)`. On a whole-binary `decompile-all` this records, at every call to one of 23 entry points that declare a function-pointer parameter (`qsort`, `bsearch`, `lfind`, `lsearch`, `signal`, `__sysv_signal`, `bsd_signal`, `sigset`, `atexit`, `on_exit`, `pthread_create`, `pthread_once`, `pthread_key_create`, `pthread_atfork`, `scandir`, `scandirat`, `ftw`, `nftw`, `tsearch`, `tfind`, `tdelete`, `tdestroy`, `glob`), the constant the callback slot carries -- the slot's argument register read from the prototype model's own assignment for that entry point's declared parameters, so the register comes from the program's convention -- and then, after every other decompile of the run, parks the slot's declared prototype on that function and decompiles that function once more -- and nothing else: every other function, a direct caller of the callback included, prints exactly what it prints with the option off. A declaration that is exactly the signature the body already printed -- the same parameter types in the same order, the same return, no `...`, as a `pthread_once` routine recovered `void f(void)` is -- is not parked. The park is the same seam `protoorder lock` uses (`Architecture::set_function_prototype_pieces_at`, read back by `ActionDefaultParams`), so it moves the callback's ARITY: 16 of the 50 scored callbacks in the decbench corpus are handlers that never read `edi`, where the parameter has to appear. On a successful park the statements the run made about that function (`protoorder`'s recovered types, `calleevote`'s decision) are dropped so its own redo reads the declaration alone. Fourteen things refuse it: a declared prototype already covers the function (DWARF, a user `--assert`, the libc tables, and under `--option protoorder lock` the callee's own recovered prototype, parked in the same place) and outranks this one; two callback slots disagree about the same address; a direct call its caller already printed contradicts the declaration -- it passes another number of arguments (clang -O0 passing an `idiv` remainder left in `rdx` to a comparator, clang -O2 forwarding its own registers untouched and printing the call with none) or uses a result the declaration does not return -- or sits in code the run did not decompile, since no caller is ever decompiled again; a direct call site reads more of the return register than the declared return holds (a `long` comparator returning a zero-extended comparison writes only `eax`, but the call that hands the whole `rax` to `printf(\"%ld\")` would print `CONCAT44(dat_4,zcmp(..))` once `int` is declared, and a comparator whose result another comparator returns straight through its own `ret` would leave that outer one returning a register half of which nothing set); the address reaches somewhere the callback arguments do not explain -- the function is exported, is the entry point, is stored as a pointer-width word of a loaded section, is a Mach-O chained-fixup or dynamic-relocation target, has a cross-reference materializing its address in a function that handed it to no slot, has more such cross-references than there were callback arguments (a function in a dispatch table that is also passed to `qsort` is not declared by the `qsort` call), or was USED by a registering body somewhere no slot accounts for -- the cross-reference walk counts address-taking instructions, and one hoisted `lea` feeds `signal(SIG,f); atexit(f);` from a single instruction, so the bodies answer for the uses, following the value through copies, phis and the INDIRECTs calls leave, and counting a write of it into a global or an address-taken local as a use even when nothing reads it back; the function's own recovery found MORE inputs than the declaration passes (the parked list is closed, so a three-argument function cast into `qsort`'s slot would lose its third argument at every direct call site and read it uninitialized); it found FEWER and anything calls or tail-jumps to the function directly (the closed list would materialize the missing argument at each such site out of whatever the register last held: `signal(SIGALRM,(void (*)(int))cleanup); ... cleanup();` on a `void cleanup(void)` would print `cleanup(v2)` after an invented `v2 = 0x2006;`) -- with NO direct call site the shorter list is parked by design, since the slot is then the only caller and the binary cannot tell `void h(int unused)` from a cast, and the unread parameter is exported to `--json` as an `arg` with empty `line_numbers` and `addresses`; an input its own recovery found is not inside the storage the declaration gives that position, with or without a direct caller (a `struct ctx *` routine cast into `signal`'s `void (*)(int)` reads all eight bytes of the register the slot declares a four-byte `int` in, so the declaration would rebuild the pointer as `CONCAT44` of half a register and an unset one and print a direct call as `cleanup((int)G)`); the body reads the argument register one past the declared list before writing it (the one-sided entry walk `calleedeadarg` caches -- it sees reads, not liveness, so a body that forwards its arguments in a tail call states nothing and is held by the recovered-arity refusal instead); the signature says `void` and every live RETURN hands back a value the body computed; the signature returns a value and the body computes none (the register's leftover would print as an invented return, e.g. `(void *)CONCAT44(dat_4,puts(a0))` for a `void` start routine in `pthread_create`'s slot) -- a body whose every live RETURN is reached from a direct call along a straight line of machine code (fall-through and unconditional jumps, read from the image) that writes no byte of the callee's DECLARED output, where that output covers every byte of the declared return, does compute it, so `return strcmp(a,b);`, which recovers `void` on its own because nothing reads its result, is declared `int` whether the call is a `jmp` or `call; leave; ret`, while a value that reaches the RETURN through a join or past a conditional branch is not proved and is refused; the value handed back -- computed by the body, or the declared output of the call the proof traced it to -- is wider than the storage of the declared return (a `long` comparator cast into `qsort`'s `int` slot would subtract in the low half, and a direct caller printing the whole result would read its high half back as `CONCAT44(dat_4,...)`) -- measured by the bits the value can set, so an `int` comparator whose 32-bit result x86-64 zero-extends into an 8-byte `rax` output is parked when nothing calls it directly; the value the body computes is NARROWER than the declared return and the machine code, walked from the entry over every path, does not leave the bytes above it zero at every RETURN (a `signed char` comparator that clang compiles to `mov (%rdi),%al; sub (%rsi),%al; ret`, or a `bool` start routine that is `setg %al; ret`, leaves the rest of the register as its caller left it, and declared it printed `CONCAT31`/`CONCAT71` of a variable nothing sets; gcc's `movzbl` then `sub %al`, an `xor %eax,%eax` before the `setg`, and any 32-bit write leave zero there and are parked); or the prototype model cannot place the declared parameters (or this run never decompiled the function, so there are no body facts to check). `__cxa_atexit` is deliberately NOT one of the 23: glibc's `<stdlib.h>` rewrites `atexit(f)` into `__cxa_atexit(f,0,__dso_handle)` with `f` cast from `void (*)(void)`, so the slot's declared `void (*)(void *)` would give every `atexit` handler in a glibc program a parameter its source never wrote; `sigaction` is absent because its handler is a structure member, not an argument; `qsort_r` is absent because glibc and musl pass its comparator fourth while macOS and FreeBSD before 14 pass an opaque data pointer there, and the imported name does not say which library the image links. On an architecture whose code builds an address from two instructions (AArch64 `adrp`+`add`, MIPS `lui`+`addiu`, ARM `movw`+`movt`, i386 PIC) the cross-reference walk cannot see the address taken, so the escape question has no answer and nothing is parked."
use_when = "On by default, and inert unless a whole-binary `kuna decompile-all` or `decompile-project` decompiles the caller that registers the callback. It fires on a program that registers one -- a `qsort` comparator, a `signal` handler, a `pthread_create` start routine -- where the tell is a comparator whose parameters print as `unsigned long *` or `int *` instead of `void *`, or a handler declared `void sub_1100(void)` whose ground truth takes the signal number. Measured over the 444-slice decbench corpus (coreutils, grep, gzip, diffutils, bzip2, findutils, tar, shadow, x at O0/O2/O2-noinline): 294 callback arguments name 114 distinct functions, 50 of which decbench scores, and all 50 DWARF declarations are exactly the slot's signature -- none contradicted, none reached through two disagreeing slots. 67 ground-truth parameters move, of which 16 are a parameter kuna recovers no trace of. Inert outside a callee-first whole-binary pass: `kuna decompile` forks one `decomp_dbg` per function, and a `--jobs N` run, `decompile-project --stream` and `--option protoorder off` have no pass to hang it on (a `--jobs N` run parks nothing unless the option is named, and naming it alongside `--jobs N` is refused). The flip evidence -- datatests, stages, the 444-slice typesweep with every worse row read, gained and lost parameters checked against DWARF, whole-binary hunks, speed and casts -- is docs/features/callbacktype/default-on-evaluation.md. Flip it off if a program passes the same function to two different libraries' callbacks through one slot the table names, or if the declared `void *` of a comparator is less useful to you than the `struct_N *` `structsynth` synthesizes for the same pointee -- the declared type wins, which is the one place the two options disagree. Set `KUNA_CALLBACKTYPE_TRACE=1` for each decision and its reason on stderr."
example = "option callbacktype on"
source_decompiler = "ida"
inspiration = "IDA's Hex-Rays applies the prototype of a known callback parameter to the function whose address is passed there (its type libraries carry `qsort`'s `int (__cdecl *)(const void *, const void *)` and the decompiler propagates it through the argument), which is how a stripped comparator gets `const void *` parameters in IDA and an integer in kuna."
change_kind = "type-inference"
tier = "transform"
symptoms = "a qsort comparator's parameters print as unsigned long * or int * where the program declares const void *|a signal handler renders void sub_1100(void) and its ground truth takes the signal number|a pthread start routine takes a pointer-width integer instead of void *|a function reached only through a function pointer keeps whatever its own body recovered, with no prototype anywhere"
