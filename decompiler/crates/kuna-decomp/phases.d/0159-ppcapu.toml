[[settable]]
option = "ppcapu"
values = "isel|on|off"
default = "isel"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "PowerPC APU language selection"
summary = "Select a PowerPC32 ELF model from its .PPC.EMB.apuinfo requirements and embedded ABI flag. Under the default isel, an ISEL, SPE or embedded scalar floating-point requirement, or the embedded ABI flag alone, selects the generic PowerPC32 model extended with ISEL. on also selects e500 for an SPE or embedded scalar floating-point requirement. Unknown or malformed APU notes retain the generic target and produce a diagnostic. An explicit --target takes precedence. Loader-tier: read via the kuna_ppcapu env var (the language is chosen at load file)."
use_when = "Set on when SPE instructions such as evaddw decode as AltiVec operations (vectorAddUnsignedByteSaturate) under the default model. It stays explicit because the e500 model does not yet recover every scalar call argument held in its 64-bit registers: a callee that divides its 32-bit argument by a constant loses that argument. Set off to use the generic PowerPC32 decoder regardless of APU notes and the embedded ABI flag."
example = "option ppcapu on"
source_decompiler = "kuna"
inspiration = "Power Architecture embedded ABI APU information note (.PPC.EMB.apuinfo)"
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "SPE instructions in a PowerPC ELF decode as AltiVec vector operations|an e500 function that adds two 64-bit SPE registers renders vectorAddUnsignedByteSaturate on 16-byte locals"
