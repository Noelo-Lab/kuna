[[settable]]
option = "calleeargs"
values = "on|off"
default = "on"
destructive = true
phase = "P4"
subphase = "active-input-trial-scoring"
strength = "HARD"
rewind = "P4"
issue = "GH-1562"
summary = "On x86-32 under a model that leaves the callee's pop unknown (the x86 Windows models), bound each direct call's stack arguments by what the callee's own code touches. The walk that proves a callee's pop (kuna_calleepurge) also records the highest stack-argument byte any load or store touches, through the stack pointer or a register holding a stack address it placed exactly, rounded up to a 4-byte slot; a nested call whose own extent is known touches its arguments. It is stated only when every path was seen and every access placed: an indirect jump, a budget overrun, an access through the caller's frame pointer or one a helper such as __SEH_prolog4 set, a stack pointer a call left unplaced, an argument indexed at run time, an argument's address stored, returned or live at a call (va_start), or a read through a stack address the walk lost (one a call returns, one loaded back from a stack slot, one parked outside the general registers) states nothing. The bound a call site uses widens the extent to what the callee's returns pop and to what the caller removes right after the call (pop ecx, add esp,8), so an unread parameter that was pushed and taken off for this call stays an argument. A stack trial past the bound is no argument, which tells an outer call's pushes from an inner call's; a trial within the touched extent skips checkInputTrialUse's flow-insensitive local-alias refusal, because the callee reads that slot. Calls whose extent is not stated (imports, indirect calls, SEH-framed callees) keep the upstream test, and so does every call in a function that calls a stack-moving helper (_chkstk, __SEH_prolog4), whose stack offsets the solver can only guess. A trial past the bound is kept where a direct call with no stated extent would otherwise take its value from past what that call's callee pops or its caller removes (a pushed cookie, a pushed local); an indirect call or one whose window covers the slot takes the freed push as its argument. Inert on every other target."
use_when = "On by default on x86-32 Windows. Flip off to see every value the call site pushes: an unread trailing parameter of a __cdecl callee whose cleanup the compiler deferred past a later call is dropped together with an outer call's pushes, and the off value prints it. Also flip off when an indirect or import call (one whose callee states no extent) shows a trailing argument that is a local of the caller, such as the /GS cookie or a zero-initialised buffer: a store an earlier call no longer takes can still attach to it."
example = "option calleeargs off"
live_field = "kuna_calleeargs"
live_true = "on"
live_false = "off"
source_decompiler = "ghidra"
inspiration = "MSVC8 /O2 PE32 by-value struct arguments (sub esp,N; mov edi,esp; rep movsd) and pushes for a virtual call outliving an inner __thiscall call; upstream AliasChecker::hasLocalAlias (varmap.cc:711) and FuncCallSpecs::checkInputTrialUse (fspec.cc:5616)"
change_kind = "new-analysis"
tier = "transform"
symptoms = "a call before a by-value struct copy prints with no arguments and the pushed values appear as stray local stores|a pushed return address appears as a local store before a call|an inner this-only call takes an argument pushed for the outer virtual call after it|the outer call after an inner call is missing its last stack argument|an indirect or import call takes a trailing argument that is a local of its caller (the /GS cookie, a zero-initialised buffer)"
