[[settable]]
option = "tailcallentry"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-tailcallentry"
summary = "On an ARM image, recover the function entries the recursive-descent Listing walk absorbs at a tail call. walk.rs makes a new function only at a CALL target and treats every other flow target as a same-function successor, so a routine reached only by a tail `B` is swallowed by whichever function branched to it and never becomes a function of its own — 17.4% of the ARM Cortex-M entry-recall gap. This reads the COMPLETED walk (splitting at a tail call provably cannot change which instructions the walk decodes, because a function entry is walked and therefore decoded either way) and admits an unconditional-branch target as a NEW function entry when four containment guards hold: every predecessor of the target is an unconditional branch (no fall-through and no conditional-branch predecessor, which would make it ordinary intra-function flow); the branch leaves the caller's entry-ordered function region, so at least one other discovered entry lies between the branch and its target; the target's flow region reaches a RETURN or computed jump (terminating-routine validity, with no length floor, so a one-instruction `bx lr` handler qualifies); and the target does not open with a stack restore (a function does not begin by tearing down a frame it never built — that is the caller's shared epilogue). Emits the accepted targets as the existing entries fact and never rebuilds the Listing, so no already-discovered entry can be removed. ARM-only; requires the Listing (option listing on) — a no-op when the Listing is absent, so every parity gate is byte-identical."
use_when = "On by default, with `listing` (which `kuna decompile`, `decompile-all` and `functions` inject on non-x86-64 and the `aggressive` preset supplies): on stripped ARM firmware a routine reached only by a tail `B` -- a shared ISR stub's handler, a `pop {r4,lr} ; b helper` tail call, a jump-thunk target -- becomes a function of its own instead of being absorbed into an earlier function and producing no output. Measured on 96 Cortex-M images: +561 ground-truth functions, 94.6% of the new entries are real function starts, zero real bodies split, zero entries lost. Inert on every non-ARM image and without `listing`. Flip off to leave the walk's absorption in place."
example = "option listing on --option tailcallentry on"
source_decompiler = "kuna"
inspiration = "decbench: kuna's own ARM entry-recall measurement (docs/features/arm-entry-granularity/); angr CFGFast's job model, where a branch to an address outside the current function's block set starts a new function"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "routine reached only by a tail B produces no decompiled output at all|a shared ISR handler is swallowed by the two-instruction stub that branches to it|function entry missing where the previous function ends in an unconditional branch|kuna emits one oversized function where the ground truth has two"
