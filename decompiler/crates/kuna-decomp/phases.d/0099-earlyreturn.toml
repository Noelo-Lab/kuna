[[settable]]
option = "earlyreturn"
values = "on|off"
default = "on"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ReturnDuplicatorHigh-peredge"
summary = "Hoist a leading const-guard into an early return (`if (c) return K;`) by peeling only the CONSTANT arm of a MIXED return phi, so a function that opens with an argument-validity check recovers the source's early-return + de-indented body instead of kuna's inverted diamond (`if (guard) { entire body } else { v = default; } return v;`). This is the PER-EDGE narrowing of angr SAILR `ReturnDuplicatorHigh` that the whole-block `returndup` gate structurally cannot reach: the shared RETURN block is `v = MULTIEQUAL(#K /*guard-false arm, constant*/, <var> /*body arm, variable*/); return v`, and `returndup`'s `returndup_is_const_ret` requires the WHOLE return value const, so it rejects this mixed diamond outright. earlyreturn instead computes the per-in-edge const set (the phi input slots that resolve to constants) and splits ONLY those edges via the SAME `node_split` machinery, leaving the variable body return merged. Each peeled const arm becomes its own `return K` predecessor; `branchflip` then orients it as the `if`-true and `ifelseflatten` drops the else and de-indents the body -- yielding angr's exact `if (c) return K; ...body...; return <var>;` (coreutils realpath::relpath: kuna 73 loc diamond -> angr's 52 loc early-return). Because it only ever peels a CONSTANT arm (never a `return <variable>` share), it CANNOT re-introduce the variable-return over-firing that made broad returndup regress the aggregate GED-perfect count ~976; it targets the mixed const/variable diamond that whole-block returndup skips. Bounded: return-only epilogue (the splittable filter rejects calls/stores), never splits the last edge (body keeps its return), <= 16 predecessors, <= 32 splits/function; each hoist logged (`earlyreturn:`)."
use_when = "A function whose first action is an argument-validity check (`if (!p) return 0;`) renders as the inverted diamond `if (p != 0) { whole body } else { v = 0 } return v;`. On by default (DIV-23: the decbench ablation measured it NET-POSITIVE, +47 perfect / -576 summed GED / 158:54 improved:regressed); flip OFF to restore the upstream merged-diamond rendering. It is MORE permissive than the whole-block `returndup` gate (it fires on mixed const/variable diamonds returndup skips), but by construction it cannot cause the variable-return over-firing that reverted returndup (it splits only constant arms)."
example = "option earlyreturn on"
source_decompiler = "angr"
inspiration = "decbench:O0-coreutils-realpath-relpath; O0-tar-tar-from_header; ReturnDuplicatorHigh._is_simple_return_graph (angr/analyses/decompiler/optimization_passes/return_duplicator_{high,base}.py)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "inverted diamond: if (guard) { entire body } else { v = 0; } return v;|leading argument-validity check wraps the whole body instead of an early return|function opens with if (p != 0) { everything } where source wrote if (!p) return 0;"
