[[settable]]
option = "returnpair"
values = "pair|single"
default = "pair"
destructive = true
phase = "P4"
subphase = "trial-budget"
strength = "HARD"
rewind = "P4"
issue = "GH-6990"
summary = "Whether a passively-active second return register may be joined into a wide return (pair) or dropped (single)."
use_when = "Set single PER FUNCTION when a void/single-register function shows a spurious CONCAT44 return (e.g. SPARC); DESTRUCTIVE as a global default (truncates real multi-register returns)."
example = "option returnpair single"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra GH-6990 (wide return-register joining)"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "spurious CONCAT44 return value in a void or single-register function|two return registers joined into one double-width return (e.g. sparc o0/o1)|return type twice the natural width built from a register concat"
live_field = "return_single"
live_true = "single"
live_false = "pair"
