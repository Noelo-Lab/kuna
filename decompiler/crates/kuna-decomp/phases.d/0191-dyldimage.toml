[[settable]]
option = "dyldimage"
values = "none|<install-name>[+<install-name>...]"
default = "none"
destructive = false
phase = "P1"
subphase = "environment-binding"
strength = "HARD"
rewind = "P1"
issue = "kuna-apple-dyldcache"
summary = "Choose which image of a dyld shared cache to load. A cache (dyld_shared_cache_arm64e and its sub-caches .01, .27.dylddata, .44.dyldlinkedit, ... and .symbols beside it) holds every system library of an iOS or macOS release; kuna rebuilds the chosen image as a standalone thin Mach-O before anything parses it, so the loader, the analysis passes and every surface see an ordinary Mach-O. The rebuild keeps each segment at its cache address, applies the cache's slide info (v2, v3 with arm64e auth pointers, v5) at slide zero so every rebased pointer reads as its unslid target, and gives the image a private __LINKEDIT with its own symbol table, the local symbols the cache moved to its .symbols file in place of the <redacted> placeholders, the renumbered indirect-symbol table, and copies of the export trie, function starts and data-in-code. The name matches a full install name (/usr/lib/libobjc.A.dylib), else a unique basename (libobjc.A.dylib, CoreFoundation), else a unique basename without its last extension (libobjc.A). `none` (default) loads the image of a one-image cache and refuses a larger one with the image count. The image is rebuilt inside `load file`, so the choice travels as the KUNA_DYLD_IMAGE environment variable; the CLI's global `--image NAME` sets it for every subcommand, and the console sets it with `option dyldimage NAME` before `load file`, accepted before any image is loaded. `kuna unpack <cache> --list` lists the images and `kuna unpack <cache> --image NAME` writes the rebuilt Mach-O. Several names joined by `+` (Foundation+CoreFoundation) load several images as one program: each is rebuilt on its own and the results are joined into one thin Mach-O, every segment at its cache address, images in address order, with one symbol table (section ordinals renumbered), one indirect-symbol table, one function-starts table and one cross-image reference note, so a function of either image decompiles in the same run and the analysis passes read the ObjC, Swift and CFString sections of every image. The identity commands (LC_ID_DYLIB, the dylib list) are those of the image named first. The joined images may hold at most 255 sections together, the most a Mach-O symbol can index. The CLI also widens the selection on demand: `decompile`, `disassemble` and `xrefs` look each 0x address of the request up in the cache's image ranges and add the image that holds it, up to `--follow-images N` images (default 2, 0 turns it off), and `decompile` and `disassemble` first follow a stub-island address to the function the stub jumps to."
use_when = "Set it (or pass --image) whenever the input is a dyld shared cache: kuna decompile dyld_shared_cache_arm64e --image CoreFoundation CFStringCreateCopy. Join names with + to follow calls from one image into another without a second run: --image Foundation+CoreFoundation. Not used for any other input."
example = "option dyldimage /usr/lib/libobjc.A.dylib"
source_decompiler = "kuna"
inspiration = "Apple's public dyld_cache_format.h; Ghidra's DyldCacheFileSystem / DyldCacheExtractor, which packs one dylib out of a cache, and ipsw's dyld extract"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a dyld_shared_cache file is rejected as an unrecognized input format|cannot decompile an ios or macos system library because it only exists inside the dyld shared cache|dyld shared cache holds N images; choose one with --image|address is not mapped in this input for a callee in another image of the dyld shared cache|following a call from one cache image into another needs a second run"
