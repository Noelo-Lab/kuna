[[settable]]
option = "callerptr"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "prototype-source"
strength = "HARD"
rewind = "P4"
issue = "ty17-ptrargs"
summary = "Declare a pointer-width parameter a pointer when every caller passes it one. `calleevote` states a parameter's type only where every direct call passes the same committed pointer (a laid-out record, a `char *`, a `char **`), so a callee whose callers hold a pointer to nothing in particular -- a `void *` from an allocator, the address of a frame object, two different records, a string beside a null -- keeps the integer its own body recovered: gnulib's `hash_insert(Hash_table *, void const *entry)` prints `unsigned long sub_8514(void *a0,unsigned long a1)` while its two callers pass a `struct_12 *` and a `struct_5 *`. On a whole-binary `decompile-all` or `decompile-project` this states a pointer for a parameter its own recovery typed only as a pointer-width integer when every recorded call passes, in exactly that storage, either the constant zero or a value its caller holds as an address for a reason of its own -- read or written through, the address of a frame object or a string literal, the result of or an argument to a declared pointer (`malloc`, `free`), or a parameter the caller's own callers stated a pointer for, judged over the value and its copies but never through a merge with other values -- and at least one passes a pointer: the callers' type where every pointer they pass is the same committed type, `void *` otherwise. A HighVariable's type alone is not enough, since a register the caller reuses for a size and a pointer is one variable typed as the pointer. The statement rides `calleevote`'s closed caller set, rounds and vote, and is refused by the same uses of the callee (an integer operation on the value, a member the pointee does not cover, a family member that is declared or global), with two differences: a call the callee hands the value to speaks only through a declared prototype, not another recovery's integer for that slot, and a pointer-width value in the frame slot at an address the function takes but never indexes (the `&matched_ent` out-parameter `hash_insert` passes on) does not refuse it; an address the callee derives from the value by a literal offset and then masks, shifts, divides or multiplies refuses it (`(p + 7) & ~7` over a `uintptr_t`), and, as for every statement the input fold takes (a strict fix in `calleevote`'s vote), a character pointer is refused for a value the callee merges with a constant, or that it or an address it derives from it compares with, adds to or subtracts from an address constant that is not a recovered string literal, which would otherwise print as a string literal ending at the table's first zero byte (`return a0 == \"\\x01\\x02\";`). A function whose statement adds nothing but these votes (any committed type in it repeats one the function already has) is decompiled again within its own budget, 2% of the lines the first pass printed (functions of at most 32 lines are always admitted), apart from `calleevote`'s 5%, so it never takes a redo from a new committed type."
use_when = "On by default, and inert unless a whole-binary `kuna decompile-all` or `decompile-project` runs its callee-first pass on an x86-64 image with `calleevote` on: `kuna decompile`, `--addr`, `--functions`, `--jobs N`, `decompile-project --stream`, a raw image and `--option protoorder off` decide nothing. The tell it fixes is a parameter declared `long` or `unsigned long` in a function that only stores, compares, forwards or hands to an indirect call a value every caller holds as a pointer -- a hash-table entry, a list item, a callback's data. Measured on the 444-slice decbench sweep (published address-correspondence `type_match`, decbench 14e14b8) against main 0e35a1ff5: 244 decisions move onto the DWARF type and 1 off (a register loop counter in diffutils -O2 `diff3`'s `dotlines` that address overlap stops matching once an address temporary folds into its uses), 181 functions score better and 1 worse, perfect functions 1869 -> 1871, and the mean per-function score rises 0.4292 -> 0.4340; on the 96-binary optimized nightly sample 15 functions score better and none worse. Turn it off to keep the integer a function's own body recovered, when a script matches body text an older run printed: the retyped value prints with `(long)` casts at its integer uses and field arithmetic over it is spelled as indexing (`((unsigned long *)a0)[v2]` for `*(unsigned long *)(a0 + v2 * 8)`)."
example = "option callerptr on"
source_decompiler = "kuna"
inspiration = "ty17 census of the 2,179 DWARF pointer parameters kuna declared as integers on the 444-slice decbench sweep: 439 of them are passed a pointer by every direct caller in the printed C of the same binary, and `calleevote` stated nothing because the callers' pointers were not one committed type."
change_kind = "type-inference"
tier = "transform"
symptoms = "a parameter is long or unsigned long while every call to it passes a struct_N *, a void * or a string|unsigned long sub_8514(void *a0,unsigned long a1) for a hash_insert whose callers pass two different records|a list or table insert keeps an integer item parameter although its callers pass malloc results|a wrapper that only forwards a pointer to a function pointer keeps an integer parameter"
live_field = "caller_ptr"
live_true = "on"
live_false = "off"
