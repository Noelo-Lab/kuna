[[settable]]
option = "calltable"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-calltable"
summary = "Read the table a computed transfer indexes and decide whether it is a switch or a table of functions. An indexed CALL through a pointer table calls every entry. A computed JUMP through a range-checked table whose distinct targets are 40% or more other functions' entries is a call table of tail calls, not a switch; a JUMP through a table with no range check is one only when every target is already another function's entry, because an unchecked switch or a computed goto reads the same way. Call-table targets become function entries and, in the reference walk behind `kuna xrefs`, call references of the dispatcher instead of its switch cases. The other way round, a discovered entry (not a symbol) that sits on a case of a switch and that no call reaches is dropped from the function list. The tables are read with the register-chain fold the switch reader uses; a pointer table with no range check is read up to 256 entries and stops at the first word that is not code of the section the transfer is in, or before the first target that is a case of a range-checked switch or code already inside a function, where the read ran into the next table. Reads the Listing, so it is inert where `listing` is off."
use_when = "On (default). Flip off if a hand-written dispatcher's table is misread as functions, or to see a prologue-shaped switch case listed as a function again."
example = "--option calltable off"
source_decompiler = "kuna"
inspiration = "stripped dispatchers: functions reached only through `ops[i](x)` were missing from the function list"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a function reached only through a table of function pointers is missing|kuna xrefs shows no caller for a function called through ops[i](x)|a switch case that opens with push rbp is listed as a function|a dispatcher's table of tail calls is printed as a switch"
