[[settable]]
option = "msvcstackguard"
values = "on|off"
default = "on"
destructive = true
phase = "P7"
subphase = "edge-virtualization"
strength = "HARD"
rewind = "P7"
issue = "GH-468"
summary = "On a Windows PE built with MSVC `/GS`, REMOVE the frame-cookie boilerplate -- the epilogue `__security_check_cookie((cookie ^ SP) ^ SP)` call and the entry-side `cookie = __security_cookie ^ SP` scramble with its frame slot. The sibling `stackguard` pins the glibc canary by its compare (`slot != *(fs:0x28)` guarding a `__stack_chk_fail` branch); MSVC keeps the compare inside the checker, so a `/GS` function contains no CBRANCH, no `fs:0x28` load and no failure edge, and `stackguard` is a no-op on it. The trigger here is the arithmetic instead: a CALL argument computed as `(K ^ SP) ^ SP` with BOTH stack-pointer references resolving to the same frame offset, which is what makes the two XORs cancel. The call is dropped with the stock `delete_call_specs`/`opDestroy` pair and the cookie slot released to dead-code, so the two `/GS` lines and the slot declaration leave the function."
use_when = "On by default: every `/GS`-protected function in a Windows PE loses its two lines of compiler boilerplate (`v8 = dat_140074040 ^ (unsigned long long)v1;` at entry, `sub_1400015b0(v8 ^ (unsigned long long)v1);` before return) and the slot declaration. It deletes a real call and a real computation, so flip off to audit the protector itself, the same way you would turn `stackguard` off. Recognition is shape-only and does not depend on the callee being named `__security_check_cookie`, so a stripped PE is covered; it also does not depend on the compiler spec, so a raw MSVC `.text` blob loaded under any x86 cspec is covered. GCC/Clang read the canary from `%fs:0x28` and never mix the stack pointer into it, so the pattern cannot occur in `-fstack-protector` output and the option is byte-identical (0/675) on the datatest corpus. Composes with `cookiescramble`, which fixes a different defect (argument loss) on the same instruction."
example = "option msvcstackguard on"
source_decompiler = "kuna"
inspiration = "GH-468 finding 3: MSVC 18 /Od /GS testbed and a Win64 crackme, where `--option stackguard on` and `off` are byte-identical"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "a Windows PE function opens with `v8 = dat_140074040 ^ (unsigned long long)v1;` and ends with a one-argument call taking `v8 ^ (unsigned long long)v1`|an unnamed one-argument callee (`__security_check_cookie`) called just before every return|`--option stackguard on` and `off` give byte-identical output on a Windows binary|an otherwise unused 8-byte stack slot declared in every function of an MSVC binary"
