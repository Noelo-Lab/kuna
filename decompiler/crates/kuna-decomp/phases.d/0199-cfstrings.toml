[[settable]]
option = "cfstrings"
values = "on|off|annotate"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-cfstrings"
summary = "Run the Mach-O Core Foundation constant-string recovery pass: when the binary is a Mach-O, read each __cfstring entry (the four-word CFString struct isa/flags/data-pointer/length), resolve its data pointer through the LC_DYLD_CHAINED_FIXUPS overlay on an arm64(e) image (a raw word on a classic LC_DYLD_INFO image), read the string (8-bit when the flags unicode bit 0x10 is clear, UTF-16 decoded to UTF-8 when set), and render a reference to the entry as the string literal. The commit seam types each entry a typelocked opaque struct __CFString symbol, whose pointer the type factory spells CFStringRef (so a function returning or passing the entry is typed CFStringRef), and pre-seeds the StringManager at the entry address with the resolved bytes, so a CFSTR argument renders as CFSTR(\"text\") instead of dat_<addr> (the C printer wraps the literal in CFSTR(...) because the value is the CFStringRef entry, not its characters; annotate also follows it with a /* cfstring@0x<entry> */ comment naming the entry address a listing or hex view shows) -- the same route that renders a __cstring literal, carried across the CFString struct indirection the printer cannot follow on its own. The entry structs are marked read-only (a CFString constant is immutable), which the constant-string route requires on the historical writable __DATA,__cfstring layout (__DATA_CONST is already read-only). Registered ONLY for a Mach-O binary, so it is a structural no-op on every non-Mach-O target. ENABLED by default: Mach-O-only and real-binary-path only, so the XML datatest corpus never runs it (0/675 assertions moved); on an 80 MB third-party arm64 iOS app a decompile is within noise of off (min 2.324 s off vs 2.359 s on, medians 2.442 / 2.372 s over 6 interleaved runs)."
use_when = "On (default): a Mach-O (Core Foundation / Objective-C / Swift) binary renders its CFString constants -- a call that passed dat_<addr> renders CFSTR(\"cfstring hello\"). Flip off to see each reference as the __cfstring entry itself (its symbol, or its address on a stripped image). Use annotate when cross-checking against a disassembler or hex view: the entry address stays in the output as a comment."
example = "option cfstrings annotate"
source_decompiler = "kuna"
inspiration = "Apple CoreFoundation CFString constant layout (__builtin_CFString / ___CFConstantStringClassReference, CFRuntimeBase); Ghidra MachO __cfstring markup"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "core-foundation / objc string constants render as dat_<addr> instead of their text|a CFSTR(...) argument shows an address in a mach-o"
