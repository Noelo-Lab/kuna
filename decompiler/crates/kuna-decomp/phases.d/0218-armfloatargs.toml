[[settable]]
option = "armfloatargs"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "input-prototype"
strength = "HARD"
rewind = "P4"
issue = "arm-mixed-vfp-arguments"
summary = "On an ARM ELF whose container states the VFP procedure-call standard, recover scalar hard-float inputs with their full floating widths and consistent caller/callee storage, on top of armfloatreturn. Uses positive VFP ABI evidence, preserves declared prototypes, keeps input widths independent of overlapping return storage, leaves the AAPCS-VFP back-fill slot out of recovered parameter lists, and gives a call the VFP inputs its callee's arity-sound contract states, a stated double held as two words passed whole; an unused trailing float an -O0 callee only spills is still passed though the callee's list omits it. Unknown cross-bank source order uses the model order; floating aggregates and vectors are recovered only as the scalar words or doubles their reads show, never as the source grouping."
use_when = "On by default together with armfloatreturn (alone it changes nothing): scalar ARM VFP inputs keep their widths instead of disappearing, splitting into word parameters, or disagreeing with their callers. Unknown calls need a proven callee contract. Declared prototypes outrank recovery. Variadic format calls use base AAPCS storage. A double a callee reads only as integer words, as on single-precision FPUs, keeps what armfloatreturn recovers. Inert on every image without hard-float ABI evidence. Flip off to keep the base-standard word parameters."
example = "option armfloatargs on"
live_field = "arm_float_args"
live_true = "on"
live_false = "off"
source_decompiler = "kuna"
inspiration = "Synthetic mixed ARM integer/VFP contracts, narrowing inputs, and AAPCS32 scalar parameter passing."
change_kind = "correctness-fix"
tier = "core"
symptoms = "missing floating argument|double input split into two words|caller and callee disagree on mixed argument contract"
