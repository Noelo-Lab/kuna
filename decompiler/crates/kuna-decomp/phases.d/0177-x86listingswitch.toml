[[settable]]
option = "x86listingswitch"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "GH-299"
summary = "Read a locally proved absolute-pointer switch table in the discovery Listing on linked i386 ELF and PE images. The unsigned range check must constrain the same whole-width index used by the jump, with no bypass, clobber, invalid slot, unproved address wrap, or established function conflict. Read exactly the proved count up to jumptablemax, then walk the cases as instruction successors and recover their direct callees. Independent functions and undefined gaps between case blocks are not claimed as a case span. Reconciliation runs after serial or parallel decoding over isolated shared snapshots for at most sixteen rounds; a late invalidated proof, extra round, or candidate memory-budget refusal retains the ordinary Listing. Resuming an expanded Listing rebuilds ordinary coverage from the new seed set before proving switches again."
use_when = "Enable to decode return-terminated i386 switch cases before AIF can mistake them for functions, especially with listing on and fast_funcdisc off. Default off: newly reached ordinary tail jumps can hide independent function starts from the gap walk (seven real starts lost in the measured Wine corpus). Already-established entries are preserved; fast_funcdisc can independently name table cases, so those conflicts are refused rather than withdrawn. Missing or ambiguous proof leaves the switch unresolved. This option changes only the discovery Listing; the independent xrefs table policy is unchanged."
example = "--option listing on --option fast_funcdisc off --option aif on --option x86listingswitch on"
source_decompiler = "kuna"
inspiration = "GH-299: the discovery Listing omits i386 cases already reached by the reference walk; guarded table reads must prevent an adjacent callback array from becoming extra switch successors"
change_kind = "new-analysis"
tier = "analysis"
symptoms = "aif lists return-terminated i386 switch cases as functions|a direct callee reached only through an i386 switch case is missing from discovery|the discovery Listing stops at an absolute-pointer jump table|independent reference queries see case bodies absent from the initial instruction partition"
