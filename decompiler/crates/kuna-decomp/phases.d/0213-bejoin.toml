[[settable]]
option = "bejoin"
values = "off|evidence|callers|on"
default = "callers"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "bejoin"
summary = "Join a value returned in two registers in the order the ABI returns it. PowerPC (r3:r4), MIPS o32 big-endian (v0:v1), SPARC (o0:o1), ARM big-endian (r0:r1), AArch64 big-endian (x0:x1, a 16-byte value) and AVR's gcc ABI (R25:R24) put the most significant half in the first return register, and their output rule says so (`join_reverse`), but return recovery and the two-register CALL output arm joined every pair first register low, so a `long long` came back with its halves swapped: `(long long)a * b` on PowerPC printed `CONCAT44(a1 * a0,(int)(... >> 0x20))`. `evidence` decides once per function, from that function's own instructions, and both the function's RETURN and every call to it read the verdict, so the two agree in any decompile order and any run (`--functions`, `--jobs`, one `kuna decompile`, a front-end session): before any pipeline runs the driver walks the raw p-code of the function and of each direct callee, once per image (kuna_bejoin::evidence::seed), and a call the pipeline resolves only mid-pass (a `-mlong-calls` call, a constant function pointer) to a proven callee sends the function through the pass again with that verdict. A function is proven when every path's RETURN holds, both registers written and not read again, a sign extension (the first register is the second shifted right arithmetically by all but one bit, `mr 4,3; srawi 3,3,31`), a zero extension (a literal zero beside a value), or the two halves of one product whose low half an instruction of its own made (PowerPC `mullw` beside `mulhw`, MIPS `mflo` beside `mfhi`, ARMv4/v6 `umull r2,r3` then `mov r1,r2`) -- the extended value computed or another register's argument, never the second register's own entry value, a load, a call's result or a by-product, and read by nothing else on any path (a reload of a frame slot the path stored is the value stored there, so the -O0 forms prove too: an argument spilled across a call and reloaded into the second register, clang's `lwz r4,8(r31); srawi r3,r4,31` whose shift may read it, and a `long long` local both of whose words are reloaded to return it), a path ending in a call that does not return included (gcc -Os computes an `exit` argument in a branch delay slot). It is also proven when every RETURN holds, the low word read by nothing but moves and stack spills, the two words of one object read from memory (two loads of adjacent words, the high word's at the lower address: `lwz 4,4(3); lwz 3,0(3)`, `ldmia r0,{r0,r1}`, SPARC's `ldd`, also reloaded from the stack frame), or the pair a direct call to a proven callee handed back with its low word moved back into place by the function (`mr 31,4; bl ext; mr 4,31`), when it branches straight into a proven callee (a tail call), and when the remaining RETURNs hold two literals or a proven callee's pair left where the call put it; a callee chain that loops back is not proven. An `int` returning one word of a 64-bit object loads only that word, unless the object is volatile: `(int)(*(volatile long long *)p >> 32)` compiles to the bytes of `*p` and reads as the `long long`. A proven callee's pair is read high word first, and a call reading only its first register reads the high piece. Everything else keeps the first-register-low join, which C's truncation reads as the right `int`: an `int` worked out from the high half of a 64-bit temporary can compile to the same bytes as the `long long` (`umull r1,r0` is both `((u64)a * b) >> 32` and `(u64)a * b`; `addc 4,4,6; addze 3,3; add 3,3,5` is both `(a + b) >> 32` and `a + b`). `callers` (the default) adds the callers' reads: a function is also proven when one of its direct callers reads the second register after the call, before writing it or making another call (a move, a store, an operation, a compare, or a call or tail branch to a compiler-runtime routine whose first parameter is a 64-bit integer, libgcc's `__floatundidf`, `__udivdi3`, `__ashldi3` and their kin or ARM's `__aeabi_ul2d` and `__aeabi_uldivmod`, which PowerPC, SPARC and ARM pass in the two return registers, so `bl add64; bl __floatundidf` reads the pair; not any other call, a RETURN, a branch, a register window's bulk copy, a register XORed with itself, an instruction nothing of which depends on the register's value (PowerPC's `subfe 4,4,4`), or, past a branch, a store of several registers or a register pair, which gcc merges into SPARC's `std %o0` or ARM's `stm` with a dead second word, or the delay slot of a conditional branch, which the delay slot filler may take from the branch target; a site whose fall-through reaches, before any branch, an instruction another branch of the caller targets or the target of a direct call, whose walk reaches a word the caller loads as data, after which a branch tests a flag nothing set since the call, in a caller that jumps through a register, or in gcc's `f.cold` part gives no evidence, because a call kuna does not know never returns is followed by unrelated code: `bl f; __builtin_unreachable()` by the block a `bne` reaches, an ARM or Thumb literal pool, a jump table's case, a static function whose symbol `strip -x` removed, or a rare block the hot part enters, and a function's extent ends at the size its symbol states, so a walk does not leave it; and no site whose walk reaches a C++ landing pad, which the unwinder enters with the selector in the second register: the pads come from the `.eh_frame` LSDAs and the `.ARM.exidx`/`.ARM.extab` data, a caller whose LSDA does not decode gives none, and so does every caller of an image whose C++ exception tables cannot be placed), or when a caller that hands its pair back untouched to its own RETURN is proven, because a caller compiled against `int f()` never reads a register the call clobbered: a 64-bit sum (`addc`/`adde`, `addu`+`sltu`, `addcc`/`addx`, `adds`/`adc`), ARM's single `umull`/`smull`/`umlal` and `return g();` without a tail call then join high word first wherever a caller stores, compares or adds both words. The callee must write that register itself or through what it calls (gcc's IPA-RA lets a caller keep its own value there across a callee that never touches it, so such a read proves nothing), must start a symbol of the image's own symbol table and reach a RETURN; a register-window function counts only writes of the register its `restore` moves into the second one, and one whose first instruction stores the second register (`push {r0-r3,lr}`) proves nothing. The call sites come from one scan of the executable bytes for direct-call encodings (PowerPC `bl`, MIPS `jal`/`bal`, SPARC `call`, ARM and Thumb `bl`/`blx`) whose target starts a symbol, and MIPS PIC `jalr $25` calls whose `$25` a GOT load gave (the entry read at the GOT pointer the caller's prologue computes), each decoded again before it is read; a MIPS `lwl`/`lwr` pair into the second register writes it without reading it; and the walk after a call keeps on each path what its branches decided about the flags (ARM's `ldrne r1,..; orrnes r2,r1,r0` reads no stale `r1`); the verdict is the least fixed point over the functions it reaches (up to 32 functions and 48 call sites; a caller reached only by handing the pair back is judged by its own callers), from facts cached per image, so every run mode prints the same, and an image without symbols proves nothing this way. A declared, DWARF or `--assert prototype` 8-byte return is placed by the model in the ABI's order in every mode. `on` is the instruction-shape guess: the ABI's order when the second register's value looks returned on purpose at every live RETURN (kuna_bejoin::join_order), which also reads such an `int` as the `long long` it matches. `off` joins every pair first register low, as upstream does."
use_when = "Leave at `callers` (the default): it changes a big-endian or AVR pair only on proof, from the function's own instructions or from how its callers read it, so an `int` keeps its first-register reading, and a function and its callers agree however they are decompiled. Set `evidence` to judge each function from its own instructions alone. Set `on` when a big-endian function's 64-bit return or call result still prints with its halves swapped (`CONCAT44(low,high)`) and its disassembly shows a genuine 64-bit value (a 64-bit sum or difference, an ARM `umull` or SPARC `umul` product, a value an unproven callee returns): `on` reads those in the ABI's order too, and also reads an `int` worked out from the high half of a 64-bit temporary as that `long long` -- `int sum_hi(u64 a,u64 b){return (a+b)>>32;}` on PowerPC -O2, `((u64)a*b)>>32` and `a / 641` on ARM big-endian, MIPS gcc -O0's `>> 32` -- so check such a function against the disassembly. Better still, `--assert prototype` the 8-byte return, which joins it right in every mode. `off` gives upstream's first-register-low join everywhere. Little-endian targets other than AVR never reach the option. Measured with the default against off: over 698 big-endian objects (bash, cronie, diffutils, dpkg, findutils, grep, kmod, libbsd, libedit, Lua, openssh, shadow and sysvinit for PowerPC, SPARC and ARM big-endian with clang and MIPS with gcc at -O0 and -O2), SQLite and zlib for the same four targets, and every shape GH-904 lists built at -O0 to -O3 and -Os with callers before and after their callees, decompiled whole, narrowed, with `--jobs 2` and one at a time, no function whose DWARF or source return type is narrower than 8 bytes changes (the memory and call-pair shapes added later change 37 64-bit returns and 6 of their callers among 20,759 functions of that corpus and none narrower; of the authored shapes only a volatile 64-bit read's high word moves); compiling the printed C of those shapes against their source, functions go from wrong to right and none from right to wrong. Little-endian x86-64, i386, ARM, AArch64, MIPSel, PowerPC LE and RISC-V output is byte-identical. `callers` against `evidence`: every function it newly proves over those 813 objects, the four SQLite builds and 1,428 authored objects (1,570) returns eight bytes by its DWARF or source type, as do the 75 it proves in two static PowerPC SQLite shells linked with glibc (by DWARF, or libgcc's and glibc's 64-bit routines), and no function's return changes width; 250 functions of the corpus and those of SQLite now return or read a 64-bit value high word first; over 16 gcc MIPS PIC shared objects (SQLite, Lua, zlib, authored shapes) the 47 functions the GOT calls newly prove return eight bytes by DWARF, and three `int`/`void` SQLite functions an unaligned `lwl`/`lwr` load had proven no longer are. A pair a caller passes straight on as the next call's arguments (`bl f; bl use64`), or that no caller reads the second word of, stays as `evidence` prints it."
example = "option bejoin callers"
source_decompiler = "kuna"
inspiration = "big-endian decompiles of SQLite, Lua, zlib and e2fsprogs: every 64-bit return on PowerPC, MIPS, SPARC and ARM big-endian printed with its halves swapped"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a long long return on a big-endian 32-bit target prints CONCAT44 with the low word first|a long long read from memory on PowerPC, MIPS, SPARC or ARM big-endian returns CONCAT44(p[1],p[0])|a 64-bit product, sum or shift returned on PowerPC, MIPS, SPARC or ARM big-endian comes back with its halves swapped|an AVR function returning a 16-bit int prints a read of R25R24 nothing assigns"
