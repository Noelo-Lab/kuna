[[settable]]
option = "argclobber"
values = "on|off"
default = "on"
destructive = true
phase = "P4"
subphase = "active-input-trial-scoring"
strength = "HARD"
rewind = "P4"
issue = "typecampaign-phantom-argument"
summary = "Drop the TRAILING register argument of a call when nothing on the caller's side put a value in that register. Heritage::guardCalls (heritage.cc:1444) plants an INDIRECT *creation* for every killed-by-call register that is also a possible OUTPUT location of the callee's model -- rdx is one on x86-64, because a 16-byte value returns in rax:rdx -- and AncestorRealistic::enterNode (funcdata_varnode.cc:2043) answers pop_success for exactly that op, recording ParamTrial::setIndCreateFormed on the way. With onlyOpUse satisfied the trial is active and ParamListStandard::fillinMap marks it used, so a register the caller never wrote for this call becomes its last argument, and the local it reads is assigned nowhere: coreutils fmt -O2 renders `v12 = sub_3700(stdin,\"-\",v10);` with `unsigned long v9; // rdx` and `unsigned long v11; // rdx` never written, against a DWARF prototype of two parameters, while the other two sites of the same callee render one and two arguments. Upstream reads the same bit back on the RETURN side only -- ParamListStandardOut::fillinMap (fspec.cc:1721) scores a remainder-formed or indirect-creation-formed trial no-use when its ParamEntry is not first in its class -- and the input list has no such test, so the evidence that disqualifies a return value is ignored for an argument (stock Ghidra emits the same three-argument call and names the phantom extraout_RDX). This option applies that sentence to the input list, bounded by eight clauses. The trial must be a REGISTER trial carrying isIndCreateFormed, which is the upstream return-side test applied to the input list. The clobber must reach the call DIRECTLY: the trial's defining op is the indirect creation, or a MULTIEQUAL one of whose immediate inputs is one -- tar's str_days(pc,buffer,n) is called with n live from a dominating block and a clobber merging in behind a second phi, and that argument is real. Every one of those creations must be a creation of THE ARGUMENT REGISTER ITSELF: the first return register of every ABI is also killed-by-call and a possible output location, so a preceding call's result is an indirect creation too until the output seam resolves it, and a value the caller MOVED into an argument register is a value the caller is passing -- u-boot -O2 sub_60827fa4 carries ofnode_read_u32_default(dev->node,\"bus-width\",1) from r0 into r3 through a pair of predicated movs and prints it with %u. EVERY OTHER INPUT OF THAT JOIN must be a division by-product: the value an idiv leaves in the remainder register while the caller uses only the quotient, reached through a SUBPIECE of the low half, a zero or sign extension or a constant mask and nothing else. One clobber among a phi's inputs says nothing about the other paths, so each has to be positively classified as a value nobody placed either, and upstream scores a remainder-formed piece exactly like an indirect-creation-formed one on the return side. Without this clause a caller that forwards its own second parameter on the non-clobber path (`mov %r12,%rdx`) loses both the argument and the parameter, and `void caller(long,unsigned long)` renders as `void caller(long)`. The CALLEE's own RECOVERED PROTOTYPE must exist and must have no parameter overlapping those bytes. This is the clause the rule rests on and the reason it can be a default: nothing on the caller's side can say whether the callee wanted the register, and the parameter list kuna gets from decompiling that function can. protoorder states it for every callee it decompiles before the caller, and states nothing for a callee inside a recursive component, one with no recovered body such as a PLT import, one that recovered no parameters at all, and one whose prototype is already declared -- so \"nothing stated\" and \"cannot tell\" are the same answer and both decline. The recovered list must also ACCOUNT for every argument the drop leaves behind, storage for storage: a recovery short of what the call passes is not a statement that the tail is unwanted but a statement that the recovery did not reach the tail, and a forwarding thunk (mov (%rdi),%rax; jmp *%rax) is exactly that shape -- it recovers one parameter while the function it tail calls consumes three. protoorder does NOT decline a variadic callee: its under-recovery and register-file guards belong to the lock mode, the declared-... decline cannot fire on a stripped image, and a stripped SysV variadic is STATED (long vlog(int,long,...) built with gcc -O2 states three parameters). What declines the drop there is the recovered list itself, because a register-save prologue reads every argument register the convention has and the list therefore carries the one the drop would take. A callee that was never decompiled first states nothing, which makes the rule inert on a single-function kuna decompile, a narrowed decompile-all, a --jobs N run and under --option protoorder off. The callee's BODY is read twice more, and both are required. A bounded entry walk that positively sees those bytes READ before they are written declines the drop (the proves_input half of the per-image entry-liveness summary calleedeadarg builds), and it is what answers for a callee kuna never recovered as variadic -- u-boot's printf is called from 1,924 sites and its va_list prologue speaks for all of them. And the callee must not be able to FORWARD the register to a read no recovery saw. The entry walk ends every path at the callee's first call, so what the register meets past one is asked of that call's TARGET: a declared, non-variadic prototype answers it, and so does the target's own body with the same question put to it recursively; everywhere else -- an indirect call or tail call, a CALLOTHER, an indexed register-file access, an undecodable instruction, a recursive component, an import whose PLT stub jumps through its GOT slot -- the register has to be written already. Naming a target is not accounting for it. That second reading is what a prototype cannot give: `long fwd(struct box *o,long a,long b) { if (!a) return 0; return o->fn(o,a,b); }` compiles under gcc -O2 to `test %rsi,%rsi; je; jmp *(%rdi)`, and `long wrap(void *o,long a,long b) { if (!a) return 0; return ext3(o,a,b); }` with ext3 an unsignatured import has no pointer at all; both recover exactly the TWO parameters a drop would leave behind and forward the third to a function no recovery read. Neither reading can admit a drop, only refuse one. The trial must be TRAILING, so the list keeps its positional shape and no other argument moves. At least one argument must remain, since an empty list is calleearityfwd's failure shape. And no already-final call to the same callee entry in this function may have passed an argument in that storage -- the subtractive twin of calleearity's witness rule, which is also what orders this pass against the additive arity family: it runs immediately after calleearity in buildInputFromTrials, and a slot the sibling rule promoted outranks the clobber evidence. The drop is markNoUse, which calleearitylive/fwd/body all read as definitely-not-used, so none of them puts the argument back. Dropping the argument also NARROWS THE PRECEDING CALL'S RETURN VALUE where that call was the register's only writer: the `SUB168(v,8)` that extracted the rdx half of a 16-byte return loses its only reader and goes with the argument. No drop in the 770-binary corpus does that under this rule -- the one that did, bash expand_prompt's `xrealloc`, is declined now that the import its callee reaches has to answer for rdx -- but docs/features/argclobber/ce-forward-thunk-2param.c shows it happening the moment the rule is wrong, and it is the same mechanism that would delete a real struct half at a callee whose own prototype is under-recovered."
use_when = "On by default -- but only where a callee was decompiled BEFORE its caller, because the evidence the drop needs is the callee's own recovered prototype and `protoorder` is what parks it. A serial whole-binary `kuna decompile-all` is that surface. A single-function `kuna decompile` (it forks one `decomp_dbg` per function), a run narrowed by `--addr` or `--functions`, `--jobs N`, `decompile-project`, `decompile-graph` and `--option protoorder off` all state nothing, and there the option is inert: a serial run and a `--jobs` run of the same binary can therefore differ by exactly these dropped arguments. The tell it fixes is a call that renders with one more argument than the callee takes, where that last argument is a local nothing ever assigns -- a `// rdx` (or other caller-saved register) declaration with no write anywhere in the function, read only at that one call, with sibling calls to the same callee passing fewer. Measured over the 770 stripped ELFs of decbench `full_run_address_2026-09-11` (O0, O2 and O2-noinline; no run exited non-zero), 19 functions change, one per binary, and each loses exactly one trailing argument at exactly one call site. Every one lands on the callee's TRUE arity, checked against the unstripped twin: `__addvsi3(int,int)` and `__mulvsi3(int,int)` from libgcc at 15 of them, `fmt(FILE *, char const *)` at the two coreutils `fmt` mains, `ext2fs_dblist_sort2(dblist, sortfunc)` at `e2fsck_pass2`, and `efi_create_handle(efi_handle_t *)` at u-boot. The two `fmt` mains also GAIN the second argument at their under-recovered sibling site, so all three calls render `sub_3700(stdin,...)` with two. Twenty register-storage locals disappear and none appears; 34 declarations go net. Hunks outside the argument itself: the dead remainder that fed it and its copies, declarations reordering once one is gone, one folded single-use divisor, and a `while` re-rendered as a `for` (the 11 O0 openssh `permute_args`, whose dead loop-tail copy went with the argument). Over the 444-slice campaign corpus (10,748 scored functions) `type_match` does not move at all: 1,147 perfect in both arms, aggregate identical, 0 improved and 0 worse, and the decompiled-variable count decbench scores is the same for every one of the 10,748 -- the metric cannot see this change, because register locals are never exported and a call's argument is not a variable of the caller. Flip to `off` if a call LOSES an argument the callee really consumes. The one shape that can still do that is a callee whose own parameter list kuna UNDER-recovers by exactly one slot, at exactly the register the clobber wrote, with every other argument still accounted for; the eight programs in `docs/features/argclobber/` are the classes this rule declines, and the forwarding ones among them are declined for different reasons -- `ce-forward-thunk.s` recovers one parameter where two arguments would remain, so the prototype accounting refuses it, while `ce-forward-thunk-2param.c` (through a pointer), `ce-import-forward.c` (through an unsignatured import, no pointer anywhere) and `ce-forward-thunk-2frame.c` (an ordinary direct call in front of the first) each recover exactly the two that would remain and are refused only because `rdx` is unwritten where the callee forwards it and the target cannot answer for it. Note that `protoorder` does NOT decline a variadic callee -- its variadic guards live in the `lock` mode and the declared-`...` decline cannot fire on a stripped image -- so a stripped SysV variadic is stated; what declines the drop there is that its register-save prologue reads every argument register, leaving the recovered list carrying the one the drop would take."
example = "option argclobber on"
live_field = "arg_clobber"
live_true = "on"
live_false = "off"
source_decompiler = "ghidra"
inspiration = "coreutils fmt -O2 (decbench full_run_address_2026-09-11) main 0x26a0 -> fmt 0x3700 at 0x2ac1; upstream ParamListStandardOut::fillinMap (fspec.cc:1721) and AncestorRealistic::enterNode (funcdata_varnode.cc:2043)"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a call passes one more argument than the callee's own recovered prototype takes|the last argument of a call is a local that is never assigned anywhere in the function|a declaration carries a // rdx storage comment and no write|two calls to the same callee in one function render with different arities and the longer one reads an undefined value|Ghidra names the same value extraout_RDX and kuna renders it as an ordinary local"
