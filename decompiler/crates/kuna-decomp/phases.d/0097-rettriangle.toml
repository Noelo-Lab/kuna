[[settable]]
option = "rettriangle"
values = "on|off"
default = "off"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "kuna-rettriangle"
summary = "Decline a `returndup` split at the join of a one-block `if`. `returndup` gives every predecessor of a shared constant-return block its own return, which recovers a source's early-return guards; but when the two predecessors are the two arms of a one-block `if` -- a two-way condition that goes straight to the return or through one block that runs into it -- the split prints `if (c) f(); return 0;` as `if (!c) return 0; f(); return 0;`, one statement more with the return written twice, where IDA and Ghidra print the `if`. When on, `kuna_rettriangle::is_triangle_join` drops such a return block from `returndup`'s candidates: exactly two predecessors, one a two-way block whose other successor is the second, which is entered only from it and leaves only to the return. Other candidates of the same function still split; the option can only make `returndup` fire less and is inert with `returndup off`. The same shape is also a source guard clause (`if (!ok) return 0; ...; return 0;`), which this prints as `if (ok) { ... } return 0;`, so it is a judgment call: over a decbench sample (12 projects, 126 slices; `scripts.decbench.optsweep`) it moves O0 GED 31,382 -> 31,219 and GED-perfect +56 (64 to, 8 off, McNemar z = +6.6), and O2 GED 69,032 -> 69,092 with GED-perfect +1, mostly tar's pax decoders whose source is the one-block `if` it prints. Shipped off; on in the `aggressive` preset. Over 8 stripped decbench binaries under `--mode aggressive`, 80 of 3,225 functions change, 160 fewer `return` statements."
use_when = "Turn ON when a short `if` before a constant return comes out as an early return plus a duplicated return, `if (!c) return 0; f(); return 0;`, where IDA prints `if (c) f(); return 0;`. The `aggressive` preset (what `--mode auto` picks under 500 KiB) already turns it on. Leave it off to keep `returndup`'s guard-clause form for every shared constant return."
example = "option rettriangle on"
source_decompiler = "ida"
inspiration = "An authored gcc -O0 function `if (ok) celebrate(); return 0;` with a stack-protected buffer: the stripped canary check leaves a shared constant return, `returndup` split it into `if (!ok) return 0; celebrate(); return 0;`, and IDA 9.2 prints the one-block `if`."
change_kind = "structure-recovery"
tier = "transform"
symptoms = "if (!c) return 0; f(); return 0; where the source has if (c) f(); return 0;|a duplicated constant return right after a one-statement body|// return-dupe on a function whose only split is a short if before its return"
