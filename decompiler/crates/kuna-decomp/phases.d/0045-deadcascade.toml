[[settable]]
option = "deadcascade"
values = "off|on|<n>"
default = "32"
destructive = false
phase = "P3"
subphase = "simplification-quiescence"
strength = "HARD"
rewind = "P3"
issue = "GH-1034"
summary = "Once one run of a rule pool has made N passes (default 32), when dead-op removal (`RuleEarlyRemoval`) takes out a join (MULTIEQUAL) or a guard (INDIRECT), also take out at once the joins and guards behind the pool's cursor that defined what it read and that nothing reads any more, and theirs in turn. The cursor has usually passed the op defining what a removed op read, so without this a chain of call guards and joins nothing reads dies one link per pool pass, and each pass sweeps the whole function (or, with `deadwaves`, walks it). The chain goes in the order the later passes would have removed it: one batch per pass, each in sequence order. Definitions at or ahead of the cursor, and dead ops of other kinds, are left to the passes as before. A run that has gone N passes is almost always taking such chains apart; a shorter run, which is nearly every run, removes as upstream does. Removing earlier than upstream changes when the other rules see a value lose a reader, which can change how variables merge, so the cascade waits for the long runs. `on` cascades from the first pass, `off` never."
use_when = "Leave at the default. Set `off` to get upstream's one-link-per-pass removal everywhere, `on` or a smaller N to speed up functions whose pools run tens of passes, at the price of variable assignment that can differ from upstream's."
example = "option deadcascade off"
source_decompiler = "kuna"
inspiration = "serde-hkx 0.7.3 hkxc.exe 0x1406491d0: in the main pipeline 1,048 of oppool1's 1,061 passes removed one to three links of three dead XMM-register call-guard chains; with the default the pool runs 176 passes, with the same C."
change_kind = "speed"
tier = "transform"
symptoms = "a huge function spends most of its time in oppool1|rule pool sweep count in the thousands for one function|each pool sweep removes only a handful of dead INDIRECT or MULTIEQUAL ops"
