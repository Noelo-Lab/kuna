[[settable]]
option = "poolentry"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-poolentry"
summary = "On an ARM image, reconstruct the PC-relative literal pools that kuna's Listing never defines as data, and use them to fix the two defects that follow. `run_aif` slides its gap cursor ONE BYTE at a time with no instruction-alignment filter, because `first_undefined_after` is byte-granular by construction. A literal pool is data, so it is an undefined gap; the cursor probes every byte of it and accepts the first one whose 2-mnemonic fingerprint clears the histogram threshold. On STM32 Thumb the pool words are SRAM addresses 0x2000xxxx whose HIGH halfword decodes as movs r0,#0, so the accepted entry lands at pool_word+2, one halfword before the real function, and on accept the cursor jumps past the body so the true entry is never probed. In A32 the whole word decodes, so the phantom lands on the word itself. Upstream Ghidra does not have this: its reference analyzer defines pc-relative literal targets as DATA before AIF runs. This pass recovers the missing definition from the references that are there - every resolved [0xADDR] operand and every [pc,#imm] literal load, including the second word of a 64-bit vldr/ldrd - and takes maximal stride-4 runs of referenced words as the pools, which is strictly more conservative than an ELF $d mapping-symbol oracle. Two consumers. RECALL: emit an entry fact at the first address after a pool that abuts a return-class terminal, when it is undefined and passes AIF's own fingerprint and valid-subroutine tests; purely additive, so never-removes-an-entry is a property of the wiring as in ptrentry and tailcallentry. PRECISION: drop an AIF accept that lies inside an inferred pool, but ONLY when the pool end carries a replacement entry, which makes the removal a MOVE rather than a delete - unpaired it destroys 531 real bodies, paired it destroys zero. Measured on 98 stripped ARM images (48,553 DWARF addresses): 191 new entries, 188 ground truth (98.4 percent), ZERO ground-truth entries lost, ONE real body split, and 4,220 phantom entries retired of which zero are ground truth and 4,218 were strictly inside a real function body, with ZERO real bodies made unreachable. Cortex-M recall 97.25 to 97.43 percent, u-boot A32 58.35 to 60.65 percent, and the share of reported functions that are real DWARF entries 76.4 to 82.3 percent. ARM-only in effect: on 20 x86-64 ELFs and 8 i386 PE images it adds and removes exactly zero entries, because x86-64 RIP-relative loads target .rodata rather than .text interstices and i386 has no PC-relative addressing at all. Inert without --option listing on and without aif."
use_when = "On by default, with `listing` and `aif` (which `kuna decompile`, `decompile-all` and `functions` inject on non-x86-64 and the `aggressive` preset supplies): a stripped ARM firmware image no longer lists sub_<addr> entries two bytes below a real function, or the same function twice at addresses two bytes apart -- the tell-tale in the C was a leading dead movs r0,#imm that kuna then constant-folded through the body, so a function lost a parameter or returned a constant. Also the only thing in the ARM entry sequence that moves an A32 image such as u-boot. Inert off ARM (its pools are inferred from the `[pc` operand form no other vendored ISA prints) and without `listing` + `aif`. Flip off to keep the raw AIF accept list exactly."
example = "--option poolentry on"
source_decompiler = "kuna"
inspiration = "Ghidra's reference analyzer defines pc-relative literal targets as DATA before AIF runs, so the pool is never an undefined gap there; decbench O0/O2 betaflight, cleanflight, crazyflie, u-boot; step 5 of the arm-entry-granularity sequence, PR #239"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a stripped arm function list carries sub_<addr> entries two bytes below the real function|the same arm function appears twice at addresses two bytes apart|a decompiled arm function returns a constant or drops its first parameter because of a dead leading movs|kuna reports far more functions than the binary has on bare-metal arm|an arm function entry lands one halfword before the real prologue|a32 u-boot recall is far below the cortex-m images"
