[[settable]]
option = "condfold"
values = "off|noreturn|on|wide"
default = "noreturn"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-tr-build-spec-list"
summary = "Relax the ONE gate that makes Ghidra decline a short-circuit fold: the is_complex(orblock) check inside ruleBlockOr (and its verbatim twin try_block_or in the region structurer). The default `noreturn` (which `on` and `wide` include) relaxes it for one shape only: a chain of tests that all branch to one block ending in a call that does not return, `if ((r = put(b, x)) != 0 || (r = put(b, y)) != 0) fatal(r, ..); rest;`. The function is structured inside the main loop while each call block still holds its stack bookkeeping (on x86 the push of the return address), so isComplex counts the call, a store and the branch and declines every later test: the chain prints as a ladder of nested ifs with the continuation innermost and the call after all of them. Under `noreturn` the later tests of such a chain -- each entered only from the test before it, the call block entered only from the chain and its call carrying the no-return note (a flow cut at the next function's entry does not count) -- are structured as not complex, unless the block carries a comment; a test that then prints more statements before its comparison than `condstmts` allows is caught by that option's own reanalysis, which keeps it complex, and a structuring that relaxed and prints a goto is replaced by the one that did not. Once the tree is final, `if (chain) { R } f();` where f does not return and R does not fall through prints as `if (!chain) f(); R`, at any depth, so the call is the body of one `if` over the `||` chain and the rest of the function follows it. Neither form reaches past the call, so both run the same tests in the same order with the same short-circuit and the call sees the same values. Measured on decbench (gcc O2 without inlining / O0): 66 / 89 more functions match the source's control flow exactly, none lost; 0/675 datatest assertions change. `off` prints the ladder. The values `on` and `wide` go further, for every fold: BlockBasic::isComplex is a >2-statement readability budget, so a single spill, address computation or extra call parked in front of the second test costs a crossing goto back into the first arm's clause (coreutils tr build_spec_list: `result_idx = &v9; if (es_match(es_00,v11,'=')) goto label_40242e;`) or a goto+label into a guard cascade's shared body (lighttpd server.c::main in the angr corpus binary newbury: 1 goto / 1 label where angr emits 0 / 0). a complex sibling is accepted when it fits the level's PRINTED-WIDTH BUDGET -- the operand renders at most 5 comma elements at `on` / 9 at `wide`, counted with the printer's own skip rules (not_printed, markers, implied outputs, the bare BRANCH), the terminal CBRANCH included -- AND either of two admission rules takes it. Rule A (bounded prefix): a BlockCopy of ONE basic block, branch-free, comment-free, with at most 1 statement-root call. Rule B (statement shape): every op is a marker, an op with an output, a void CALL/CALLIND, a STORE, or the single terminal CBRANCH (RETURN, a second branch, BRANCHIND, CALLOTHER and no-return calls all decline), with <=2 conservatively-scored statements and <=2 calls per block, no comment, and -- because Rule B also admits a NESTED BlockCondition so a guard cascade can fold -- <=4 condition leaves and <=4 total scored statements at the fold site. The absorbed statements render inside the &&/|| operand as a C comma expression, which the printer already supports (comma_separate). The fold moves no p-code: it re-parents two existing structuring nodes, and C short-circuit plus comma sequencing preserves the original execution paths and order, so predicates that call functions need no purity analysis. Applied at BOTH structuring paths. Port of the angr Phoenix MultiStatementExpression relaxation (_should_use_multistmtexprs / _build_multistatementexpr_statements) under its default MAX_ONE_CALL policy; `on` uses angr's statement threshold (5) and `wide` raises the budget to 9 for BOTH rules, because kuna's printed-statement granularity is finer than angr's AIL for the same block (argument recovery and address-tied copy shadows split one AIL statement into several printed ones). THREE ACCURACY NOTES. (1) Rule A's call cap counts only calls printed as their own comma-chain element: the eligibility walk mirrors the printer, whose implied-output skip necessarily runs before the call test, so a call inlined into the sibling's own condition is not charged and a folded operand can render more than one call (measured: mv -O2 copy_internal at `wide` renders cached_umask(...) counted and fchmod(...) not counted). This is deliberate and is a readability bound, not a soundness bound; Rule B counts every call. (2) Rule B's <=2 SCORED statements is a calc_explicit approximation, NOT a width: a block can score 2 and render 7 comma elements, which is exactly why the printed-width budget above is enforced on top of it. The scored count survives only because the <=4 leaf / <=4 statement cross-leaf caps are expressed in it, so those caps bound the relaxation at each site where it is exercised but do NOT bound the summed printed width of a folded cascade, nor the final condition's global width -- a purely upstream-legal fold (both operands non-complex) can still extend a cascade on the left without consulting them, exactly as it can with the option off. (3) The width is measured on the op list as it stands at structuring time: later passes can add or drop an op, and where a call's stack-effect ops are still live (unprototyped callee) it over-counts, which only ever declines a fold."
use_when = "kuna emits a crossing `if (cond) goto label_X;` from the else arm back into the then arm's clause, or a goto+label into the shared body of a permission/validation guard cascade, or a nested if where angr short-circuits into `A || B` / `A && B` -- because the second condition block also assigns something (a spill, a pointer setup, a call whose result is the test). The default `noreturn` only folds a chain of tests into one call that does not return; `off` is byte-identical to upstream (the eligibility precompute is skipped and every gate disjunct is dead) and prints such a chain as a ladder of nested ifs with the call last. Try `on` first for the other shapes: it is the angr-parity width and it closes the guard-cascade case (newbury main reaches 0 gotos / 0 labels there). Go to `wide` when the sibling is a kuna-noisy block (copy shadows, unrecovered call arguments) that `on` still declines -- that is what tr build_spec_list needs to reach angr goto parity, and what true_ubuntu1804 usage needs for its ifs 9 -> 7 fold. THIS IS NOT A MONOTONE GOTO REDUCER: folding changes which edges the structurer can subsequently match, so individual functions can GAIN a goto even though the aggregate is a clear net win (measured on 2827 functions over 7 real binaries: gotos 2294 -> 2219 at `on` and -> 2191 at `wide` overall; 2 functions gain one -- clientloop.o process_escapes 26 -> 28 at both levels, true_ubuntu1804 usage 1 -> 2 at `wide` only). Flip back off when you prefer a nested if to a comma expression in the condition, when the folded operand reads as too dense (an operand can render two calls when one is inlined into the test), or when you need a kuna advisory comment that the fold can drop: the comment guard declines on any comment buffered at structuring time, but comma_separate suppresses emitCommentGroup, so an advisory produced by a LATER pass can vanish (newbury main emits 4 WARNING lines at off and 3 at on, losing its `WARNING: branchflip:` line). The emitted C is unaffected by that loss."
example = "option condfold wide"
source_decompiler = "angr"
inspiration = "angr PhoenixStructurer._match_acyclic_short_circuit_conditions types a-d (phoenix.py:2578) + MultiStatementExpression wrap at phoenix.py:2688 gated by _should_use_multistmtexprs (MultiStmtExprMode.MAX_ONE_CALL, _multistmtexpr_stmt_threshold=5) and _build_multistatementexpr_statements; coreutils tr build_spec_list (proposal #39) and lighttpd server.c::main in the angr corpus binary newbury (proposal #56)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "a ladder of nested ifs each assigning a call result, with a call that does not return after the ladder|crossing goto from the else arm back into the then arm's shared clause|goto plus label into the shared body of a guard cascade whose arms reconverge|nested if where angr emits one compound short-circuit condition|second condition block assigns one value or calls something before its test and the fold is declined"
