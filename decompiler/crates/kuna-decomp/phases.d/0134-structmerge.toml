[[settable]]
option = "structmerge"
values = "off|siblings"
default = "off"
destructive = false
phase = "P5"
subphase = "aggregate-union"
strength = "HARD"
rewind = "P5"
issue = "typecampaign-layout-recall"
summary = "Give a synthesized record the fields a sibling reader of the same record proved. `structsynth` measures one function's accesses at a time and the layout ledger shares one `struct_N` between two functions only when one reader's claims are a SUBSET of the other's. Two readers that measured overlapping-but-different parts of one object -- the common case -- therefore get a name each, and each is declared to have only the fields its own function happened to touch: two readers of a `{char *name; long n; int flags; long tail;}` that each skip one member are given a record with a hole where `flags` is and a record that stops before `tail`. Over the eight layout builds 23 of the 77 ground-truth records kuna types at all are given more than one name this way. With the option on, a layout that nothing held answers for is merged with a held structure it was measured to agree with, and the UNION is minted in its place; the union strictly contains the held structure, so the convergence sweep (`decompile-all` and a serial `decompile-project`) decompiles that structure's readers again and moves them onto it. Two layouts are merged only where neither contradicts the other -- every offset both claim carries the same field, width, type and pointee spelled exactly as the ledger spells them, and no claim of one covers bytes the other claims at a different offset -- and only where the agreement is itself evidence: three shared claims, or two of which one is a pointer with a pointee, since two integer words at 0 and 8 are what `struct stat`, a `timespec` and a list node all begin with. The union is then held to the containment rule against each side separately, so a reader is still never declared to hold more than twice the fields it measured or four times its bytes, a table of opaque slots is still answered only by its own shape, no member lands in the alignment padding a reader's own claims leave, and the union still lays the reader's own members over every byte it dereferenced without claiming. Measured against DWARF on the eight layout builds (`fmt`/`ls`/`sort`/`du` at -O0 and -O2, 835 pointer-to-struct parameters, 9,443 fields): per-parameter claimed-field precision 0.8713 -> 0.8730 and recall 0.0932 -> 0.0960, F1 0.1684 -> 0.1731, with seven fewer `struct_N` names for the same records; no ground-truth record is newly given two names either, but that counts how many names a record has and says nothing about the opposite error. The agreement floor does fuse two records: two readers of two DIFFERENT objects that begin alike -- `{char *name; long n;}` is a job record and a connection record both -- clear the floor, are answered by one union, and each then declares a field its own object does not have. 19 of the 63 merges traced over sixteen builds sit exactly at that floor, and over 177 builds 189 of the 1,105 fields the merge adds are not fields of the DWARF record (916 are), so pooled claimed-field precision over those builds falls 0.9330 -> 0.9312 while it rises on the eight layout builds. That trade is why the option ships off."
use_when = "Default OFF, and only ever acts where `structsynth` already synthesized something. Flip it on when a whole-binary run gives one object two or more `struct_N` names -- the give-away is two functions whose parameters have different record types that agree field for field as far as both go -- or when a record's declaration is visibly shorter than the program's own use of it. A parameter's type name can change (`struct_2 *` to `struct_7 *`) and its record gains the fields a second function measured, which moves the exported header's definitions and can change how address arithmetic past the reader's own last field is spelled. It can also leave a function WORSE typed than `off` does. The union is minted under a fresh name and supersedes the thinner record it contains, so the convergence sweep decompiles that record's readers again; the containment bounds that keep a thin reader off a record far larger than it measured can put the union out of its reach, and the redo's answer is not always as good as the one it replaces. On e2fsprogs `e2fsck` -O0 (1,908 functions, outside the layout set) three variables fall from `struct_35 */struct_87 *` to `void *` and two `char *` parameters of `reconfigure_bool` become `unsigned long`, costing that function type_match 0.67 -> 0.33, while one function gains a five-field record; with the sweep disabled (`--option protoorder lock`) not one variable on that binary changes type. Leave it off when a field that is not there costs more than a field that is missing: the merge can fuse two records. The agreement floor -- three shared claims, or two of which one is a typed pointer -- is cleared by two readers of two different objects that merely begin alike, and the union then gives each reader a field its object does not have; 19 of the 63 merges traced over sixteen builds clear the bar exactly there, 189 of the 1,105 fields the merge adds over 177 builds are not fields of the DWARF record, and pooled claimed-field precision over those builds falls 0.9330 -> 0.9312 (it rises, 0.8713 -> 0.8730, on the eight builds the layout instrument is published on). Leave it off too when you want each function's record to state exactly what THAT function proved, which is the more conservative reading and what every earlier round measured. The merge is a property of one process's ledger, so it needs a whole-program surface: `kuna decompile` spawns one `decomp_dbg` per function and a `--jobs N` worker answers from the parent's replay, so neither merges and both behave as `off` -- the same divergence `structsynth` already has. The convergence sweep runs one pass, so a union that supersedes a structure whose readers would themselves merge again can still leave two names, which is `structsynth`'s own non-transitivity rather than a new limit."
example = "option structmerge siblings"
source_decompiler = "kuna"
inspiration = "RecStruct (ASE 2021) section 4.2 merges the access patterns of every function that reaches one allocation site before deciding a layout; kuna had the per-function measurement and the program-wide ledger but no rule for combining two readers that merely overlap."
change_kind = "structure-recovery"
tier = "transform"
symptoms = "one object has two or more struct_N names whose fields agree as far as both go|a synthesized record declares fewer fields than the program's own accesses show|two functions take a pointer to the same thing and their parameter types differ|the exported header defines struct_2 and struct_7 with the same first members"
