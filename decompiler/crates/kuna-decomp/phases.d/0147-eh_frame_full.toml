[[settable]]
option = "eh_frame_full"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-ehframe-lsda"
summary = "Extend the always-on entry-discovery pass with full .eh_frame + .gcc_except_table (LSDA) markup (GccExceptionAnalyzer): for each FDE, follow the CIE 'L' augmentation to its LSDA pointer in .gcc_except_table, decode the call-site table, and emit each exception landing-pad PC (lpStart + non-zero cs_landing_pad) as a discovered function entry. A landing pad is a real code target reached only by the unwinder, so a stripped C++ binary's entry-disc otherwise misses it. The DW_CFA_* call-frame instructions are NOT recovered at the decompiler tier (kuna's own S5/S7 frame analysis already recovers the stack frame from the code) — CFI is inherited, not rebuilt. Output-changing (adds entries), so default-OFF: a default run is byte-identical to before."
use_when = "Off (default) limits .eh_frame use to FDE pcBegin function starts. Flip on to also discover exception-handler landing pads (catch/cleanup blocks) from the .gcc_except_table LSDA in a C++ try/catch binary."
example = "--option eh_frame_full on"
source_decompiler = "kuna"
inspiration = "Ghidra GccExceptionAnalyzer + ghidra.app.plugin.exceptionhandlers.gcc.* (Cie/Fde 'L' augmentation -> LSDAHeader/LSDACallSiteTable landing pads)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "c++ catch/cleanup landing pads missing from a stripped binary's function list|exception-handler code never discovered as entries|gcc_except_table call-site targets left unexplored"
