[[settable]]
option = "narrowret"
values = "on|off"
default = "on"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "ty17-narrow-call-results"
summary = "A call reads the narrow value its callee returns. A function that returns a `uint8_t`, a `uint16_t`, a `bool` or (x86-64, AArch64) an `unsigned int` hands it back in a whole register, and a caller that relies on the callee having zero-extended it -- AAPCS requires it, and an x86-64 callee's own `movzbl` or 32-bit write performs it -- reads the register at full width, so the CALL's output is register-wide and every local holding the result is declared `unsigned int` or `unsigned long`, however narrow the callee's own listing prints its return. The callee's decompile already narrows a returned value whose upper bits the nonzero-bit analysis proves clear: `SubvariableFlow`'s RETURN pull trims the RETURN to the narrow value. When on, each such trim records on the RETURN whether every trim from the whole return register on dropped only known-zero bits, and in the callee-first `decompile-all` run a function whose every live RETURN carries that record, or hands back unchanged the result of a call to a callee that states the same storage (a wrapper), states it (`kuna_narrowret::record`) with the type its listing declares, when that is a `bool` for a truth value (one byte that every RETURN computes as a comparison or a constant 0 or 1) or an unsigned integer of the width for a value that can set its top bit (an enum of small numbers is as often an `int`); the proof shows a zero extension and no sign, so a callee declared signed states nothing. At a later call to it whose recovered output is a wider part of that register holding the narrow storage as its low part, and whose variable takes no value but such calls' results and constants of the width (a result merged with other values, or returned beside them, keeps the register), `ActionActiveReturn` makes the CALL write the narrow value and zero-extends it back into the old output (`narrow_call_output`): every reader sees the bits it read before, now as the zero extension the callee performed, and the sub-variable and type passes can declare the value at its own width. A one-byte call then produces the type the callee declares (the def-side vote of `TypeOpCall::getOutputLocal`, so `ActionSetCasts` converts it where the caller keeps it otherwise), and a stated truth value marks the CALL a calculated boolean, which `boolbyte` counts as a truth-valued definition beside every other value the byte takes. A declared prototype, an indirect call, a sign-extended or signed return and a return any trim narrowed from bits not known to be zero state nothing. Inert without a callee-first pass (`kuna decompile`, `--addr`, `--functions`, `--jobs N`, `--option protoorder off`): a function decompiled alone narrows its own return exactly as with the option off."
use_when = "On by default. The tell it fixes is a `uint8_t`, `uint16_t` or `bool` returned by a function the same listing declares `unsigned char`, `unsigned short` or `bool`, held by its callers in an `unsigned int` local (ARM firmware), or an `unsigned int` result held in an `unsigned long` on x86-64. Set it off to get the register-wide call results back, or when an `int` or enum local that holds a narrow callee's result should keep its source width; the C computes the same values either way. A caller may print an explicit widening of the narrow result (`(unsigned int)v1 * 3`) where it computes with it at register width."
example = "option narrowret off"
source_decompiler = "kuna"
inspiration = "decbench type_match census of ARM firmware call-result locals (betaflight, cleanflight, crazyflie): about 470 char, 160 short and 350 bool register locals hold the result of a callee whose own listing returns `unsigned char`, `unsigned short` or `bool`; upstream's locked-output path (`ActionFuncLink::funcLinkOutput`, `FuncCallSpecs::commitNewOutputs`) already writes a narrow call result and extends it for a DECLARED narrow return"
change_kind = "type-inference"
tier = "transform"
symptoms = "a function declared unsigned char sub_x(...) whose callers hold the result in an unsigned int|v1 = sub_8017ac6(a0); with unsigned int v1 beside unsigned char sub_8017ac6|a bool-returning callee's result kept in an int and only tested|an x86-64 unsigned-int-returning callee's result held in an unsigned long"
live_field = "narrow_ret"
live_true = "on"
live_false = "off"
