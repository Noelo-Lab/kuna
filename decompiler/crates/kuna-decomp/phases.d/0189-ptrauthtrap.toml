[[settable]]
option = "ptrauthtrap"
values = "on|off"
default = "on"
destructive = true
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "kuna-apple-ptrauthtrap"
summary = "Drop the pointer-authentication failure checks an arm64e compiler plants after an aut* instruction. Without FEAT_FPAC a failed aut* does not trap; it leaves an error code in the pointer's top bits, so Apple's clang checks the result inline and branches to brk #0xc470+key when it is bad: before a tail call it tests that bits 62 and 61 of the authenticated x30 agree (eor x16, x30, x30, lsl #1; tbz x16, #62), after a data aut* it compares the result with its xpac-stripped copy. SLEIGH hides the aut* itself (ShowPAC is off), so statically every pointer authenticates and the check is noise; the xpac form folds away on its own, but the bit test reads the incoming return address and renders as if ((x30 ^ x30 << 1) >> 0x3e & 1) SoftwareBreakpoint(0xc471,..); before nearly every tail call of an Apple binary. The trap block is the anchor: a block lifted entirely from one brk whose SoftwareBreakpoint immediate is 0xc470-0xc473, the codes LLVM reserves for this trap. A CBRANCH edge into it is removed pre-SSA (the gomorestack window) only when the guard's condition is that bit test of the return address, ((x30 ^ x30 << 1) >> 62) & 1, the edge is the arm taken when the two bits disagree, and x30 was reloaded from the frame (an sp- or x29-based load) or is unwritten anywhere in the function: the brk immediate alone is not evidence, since any AArch64 code can branch to a brk #0xc470 on a condition of its own, and a value the code put in x30 (mov x30, x0; ldr x30, [x0]) is not the authenticated return address. The condition then dies to dead-code elimination."
use_when = "Leave on: an arm64e function's tail call reads as the call alone. Flip off to audit where the compiler checks an authenticated pointer. Inert on any guard other than the return-address bit test before a brk #0xc470-0xc473 trap, whatever the image format."
example = "option ptrauthtrap off"
source_decompiler = "kuna"
inspiration = "An arm64e iOS system daemon: 205 of its brk traps guard a tail call; LLVM AArch64 pointer-auth lowering (the brk #0xc470 | key check emitted when the target lacks FEAT_FPAC)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "if ((v ^ v << 1) >> 0x3e & 1) before a tail call in an arm64e function|SoftwareBreakpoint(0xc471,..); behind a bit test of the return address|a stack - 0x8 | x30 variable declared only for a pointer-auth check"
live_field = "ptrauth_trap"
live_true = "on"
live_false = "off"
