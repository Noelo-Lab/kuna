[[settable]]
option = "fpuemu"
values = "off|auto|on"
default = "auto"
destructive = false
phase = "P2"
subphase = "decode-context"
strength = "HARD"
rewind = "P2"
issue = "kuna-1288-fpuemu"
summary = "Decode the 8087 emulator's software interrupts as the x87 instructions they stand for. A DOS program built by Microsoft's or Borland's compilers for the emulator carries no x87 opcodes: the linker's emulator fixups (FIDRQQ, FIWRQQ, FIERQQ and friends) turn each WAIT+ESC pair into INT 34h+n (ESC D8h+n) followed by the instruction's ModR/M and displacement, INT 3Ch followed by a byte holding the segment override (bits 6-7: DS, SS, CS, ES) and the ESC opcode, or INT 3Dh for FWAIT, and the emulator services them at run time. Read as plain x86 the operand bytes become garbage: CD 35 E8 (FLD1) is INT 35h and a near CALL that mints a phantom function, an FILD [bp-16h] swallows the following FWAIT into a far JMP, and the function ends in bad instruction data. x86-16.sla now keeps the ESC instructions in a table that also reads their emulated encodings wherever its context bit fpuEmu is 1, emitting the same p-code as the real instruction, so the C shows the float arithmetic. `auto` (the default) sets the bit on an MS-DOS executable whose load module holds emulator code: at least two emulated instructions that run straight into an emulated FWAIT or follow one, a pair a compiler emits at the end of every float sequence and data almost never holds (a table of INT n; RET thunks holds none). `on` sets it on any 16-bit x86 image, including a raw one; `off` keeps the interrupts."
use_when = "Leave auto: a DOS program linked with the 8087 emulator decompiles its float code, and every other input (no fpuEmu bit outside x86-16.sla, no emulator code in the image) is byte-identical. Use on for a raw-image or .COM program that uses the emulator but has too little float code for the evidence, off to read the interrupts as the bytes encode them."
example = "kuna decompile-all dazzle.exe --option fpuemu off"
source_decompiler = "kuna"
inspiration = "Microsoft's 8087 emulator fixups (FIARQQ..FIWRQQ: the linker rewrites WAIT+ESC into INT 34h-3Dh, Borland's TLINK the same); kuna #1288 (DOS program Dazzle) decoded them as interrupts followed by garbage"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a DOS program's float code decompiles as calls through swi(0x35) and other INT 34h-3Dh vectors|Control flow encountered bad instruction data in a DOS function that does float math|a phantom function starts inside an INT 35h instruction's operand bytes|swi(0x3d) calls where the program waits for the coprocessor"
