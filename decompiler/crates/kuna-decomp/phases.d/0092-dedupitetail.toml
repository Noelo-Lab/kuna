[[settable]]
option = "dedupitetail"
values = "off|on|latch"
default = "latch"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ITE-region-dedup"
summary = "After structuring, deduplicate a cloned `if/else` tail: when both arms of a 3-component `if` begin (prefix) or end (suffix) with one or more *leaf* blocks that emit identical C — same printed-op sequence, matching constants by value, named storage by location, and call targets by resolved callee — hoist that shared run out of the `if` (prefix before it, suffix after) so it is emitted ONCE instead of twice (a print-tree edit — no p-code cloned). The inverse of the SAILR duplication passes (gotoreduce/crossjumprevert, which DUPLICATE a shared tail to drop a goto); here kuna's collapse-based structurer over-duplicated a shared continuation and the readability win is to merge the copies. Mirrors angr's structurer ITE region deduplication (converging two predecessors onto one copy instead of cloning). Bounded (<=8 leaves, <=64 ops/leaf), exact-or-decline, and suffix-sound only when each arm's divergent middle falls through to the suffix. The value `latch` (the default) also joins a loop latch the compiler copied into each path through the body (p8_structure/kuna_latchjoin.rs, on the p-code graph before structuring): when a loop header has exactly two back edges, from blocks that end in the same conditional branch to the same two targets, their ops are paired from the branch backwards and the longest run that is operation-for-operation identical (same opcode, equal constants, the same output storage where storage matters; inputs that are the same value, corresponding outputs of the run, or values from before it, which meet in a new MULTIEQUAL; a test with the opposite sense and swapped targets is the same test; up to two side-effect-free ops only one copy has are stepped over; loads from two different addresses stay in their copies) becomes one block both copies fall into. The run must hold the op computing the branch condition; calls, stores, user ops, unconditional latches, self-loop latches and unoptimized functions are refused. The join is exact: every path runs the same operations in the same order. A function of at most 1000 ops that then prints a goto within a joined loop is decompiled again without the join and keeps the result with fewer gotos."
use_when = "kuna emits the SAME leaf statement(s) at the head or tail of BOTH arms of an if/else (a compiler-duplicated shared prefix/suffix the structurer cloned into each arm), e.g. a shared cleanup epilogue or a `--help`-style shared call repeated in both branches, or prints a loop directly inside another loop where the source has one loop with an `if` in it (gcc copied the step and test into both paths: `do { while (c) { ...; p = p->next; if (!p) return; } p = p->next; } while (p);`). Default `latch`: both merges, and such a loop prints once, `while (p) { if (c) ...; p = p->next; }`; on the decbench O2-noinline corpus it makes 33 more functions structurally exact and none fewer (+25 on one half of the projects, +8 on the other), changes no O0 body and adds no goto. `on` keeps only the if/else merge (the old output, two loops); `off` restores the upstream duplicated-arm rendering as well. Conservative: only flat C-equivalent leaf blocks are merged by the if/else half (never a nested if/loop or a labelled/goto block), and a suffix is hoisted only when both arms provably reach it; latch copies that differ in a call or a store stay two loops. Deeply entangled duplication where the shared code shares a basic block with divergent code (e.g. true_1804 usage's online-help printf folded into the setlocale condition block) is out of scope."
example = "option dedupitetail on"
source_decompiler = "angr"
inspiration = "test_decompiling_true_1804_x86_64::usage; angr structurer condition-processing / ITE region deduplication (RegionSimplifier; structuring/structurer_base.py _merge_nodes); inverse of SAILR ReturnDuplicator/CrossJumpReverter"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "both arms of an if/else begin or end with the same duplicated statements|shared cleanup or help call repeated verbatim in the two branches|compiler-duplicated tail emitted twice instead of hoisted out of the if|a loop printed as the first statement of another loop where the source has one loop with an if|the step and test of a loop printed twice, once in an inner while and once in the outer do-while"
