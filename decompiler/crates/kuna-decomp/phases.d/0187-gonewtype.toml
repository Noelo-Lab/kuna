[[settable]]
option = "gonewtype"
values = "on|off"
default = "on"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "kuna-multilang-gonewtype"
summary = "Type a Go allocation result from the descriptor it allocates - the first client of the per-call-site output TYPE LOCK. Go's allocators take the runtime descriptor of the type they allocate: `runtime.newobject(typ *_type) unsafe.Pointer` returns a fresh zeroed object OF that type, and go1.26+ compilers inline the same call into the size-class `runtime.mallocgc*` entries (`mallocgcSmallScanNoHeaderSC4(size, typ, needzero)`, ...), descriptor second. At a site whose descriptor argument resolves to a `type:<name>` data symbol (gotypeglobals) whose `<name>` the gotypes harvest interned as a complete named record, the result's type is a fact stated by the binary's own metadata. A plain vote at the type-inference seam cannot deliver it: `typeOrder` folding and structsynth override the voted type before the declaration prints, and parking a prototype locks EVERY site of the callee to one output (`void *`). The option therefore asserts the fact through the sitetypelock primitive: the lock is recorded in the P0 override store keyed by the CALL op's address (surviving restarts like every per-site override), and `ActionSiteTypeLock` pins it onto the call's output Varnode (`update_type_locked(lock=true, over=false)`) directly before the first `buildLocaltypes`, riding the same Varnode-typelock chain a type-locked Database symbol rides - propagation refuses to enter a locked Varnode, `writeBack` refuses to replace it, structsynth installs with `over=false`, and the HighVariable's type representative prefers the locked member. Refusals leave the site untouched: no output Varnode, output already type-locked (mapped-symbol/DWARF evidence outranks the client), descriptor argument not a constant address (or one COPY away), constant not at the START of a `type:` symbol, `<name>` not held as a complete named record (pointer/array/primitive spellings and empty shells refuse, so the lock never blocks a later structsynth recovery), a mallocgc-family size argument that is not a constant equal to the record's size, or an output-width mismatch. The lock changes downstream pointer-arithmetic restructuring (field reads render as `->field`), which is why the whole-corpus two-leg diff ships with the feature; a wrong descriptor decode would mis-NAME fields but never moves or deletes a statement. Structurally inert off Go images: the callee name, the `type:` symbol and the interned record only exist where the Go harvest ran."
use_when = "On by default: every escaping Go allocation declares its result as a pointer to the program's own named record (`main.Point *p = runtime.newobject(&type:main.Point)`) and downstream field accesses render by name instead of offset arithmetic. Flip off to compare against the untyped rendering (triaging a suspect field layout back to the descriptor walk) or to let structsynth re-derive the layout from accesses alone. Non-Go binaries are byte-identical either way."
example = "option gonewtype off"
source_decompiler = "kuna"
inspiration = "Ghidra's Golang analyzer propagates allocation types from newobject descriptor references (GoRttiMapper); IDA's golang support types alloc results from the type: argument"
change_kind = "type-inference"
tier = "transform"
symptoms = "go newobject results declared long or undefined8 while the call names its type: descriptor|field stores into a fresh go allocation render as offset arithmetic on an integer local|harvested go record types visible at interface conversions but never on allocations|go allocation sites cast their result at every use instead of declaring the named pointer"
