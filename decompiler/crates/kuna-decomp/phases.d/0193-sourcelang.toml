[[settable]]
option = "sourcelang"
values = "auto|c|rust|go|swift"
default = "auto"
destructive = false
phase = "P1"
subphase = "environment-binding"
strength = "HARD"
rewind = "P1"
issue = "kuna-multilang-sourcelang"
summary = "Override the detected source language of the image. kuna detects what produced a binary once at load (the port of Ghidra's SourceLanguageAnalyzer: Go build-info sections - on a Windows PE, which has none, a build-info blob that validates at the head of .data together with a pclntab in read-only data - rustc .comment records / mangled symbols / .rodata signatures, Swift metadata sections / mangled symbols / runtime imports, else the C toolchain conveniences) and that verdict is a single stored fact consumed everywhere language matters: analysis-pass selection inside `load file` (the Go pclntab pass, the Rust/Go no-return widening), the engine-plane Architecture::source_lang that per-function rules gate on (`rustabi auto`, `reloadarg`'s Go stand-down), and the output-language auto policy. `auto` (default) trusts detection; `c`, `rust`, `go` and `swift` force the verdict for all of those consumers at once. Because pass selection happens inside `load file`, upstream of every per-function option command, the forced value travels as the KUNA_SOURCELANG environment variable set by the CLI before loading (the rexthunk/relocobjects loadtime pattern); the console `option sourcelang` arm updates the engine fact for the already-loaded program and bridges the env for a later `load file` in the same process. Forcing a language never invents facts a binary lacks (forcing `go` on a non-Go image enables the pclntab pass, which then simply finds no table); what it reliably changes is which language-gated rules may act. A `cpp` value is deliberately absent until something consumes a C-vs-C++ distinction."
use_when = "Force `c` when detection claims the wrong language (a C image embedding Rust-looking strings or a `$s`-prefixed symbol) and language-gated rules are misfiring; force `rust`/`go`/`swift` on a stripped or post-processed binary whose language signals were removed (no .comment record, sections renamed) so the language passes act anyway. Leave `auto` otherwise - detection is high-precision by construction."
example = "option sourcelang rust"
source_decompiler = "kuna"
inspiration = "Ghidra SourceLanguageAnalyzer / SourceLanguageService.find (detection), plus the kuna loadtime env-bridge pattern (rexthunk, relocobjects)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "rust binary renders with c output and no rust abi handling because a stripped image lost its language signals|a c binary is detected as another language and language-gated rules misfire|go runtime passes do not run on a go binary whose buildinfo section was stripped"
