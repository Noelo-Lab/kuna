[[settable]]
option = "persistcalls"
values = "off|on|<n>"
default = "65536"
destructive = false
phase = "P3"
subphase = "call-guard"
strength = "HARD"
rewind = "P3"
issue = "gh-1034"
summary = "In a heritage pass that would guard at least N persistent-RAM-range and call pairs (default 65,536), give a call an INDIRECT guard over a writable persistent global only where skipping it could show: a write reaches the call with no call in between; a read follows it, or reaches it, with no call or full write in between (reads are free reads, partial writes, returns, and every LOAD and STORE in the space, which can fold into direct accesses later); some path after it meets a full write, a STORE or the end before a read or kept guard, so the global stays live over the same code for merging; or a join of the global would otherwise take, on an edge in, the value from before it. Upstream guards every persistent global at every call whose effect on it is unknown, and the guards survive dead-code removal, so a function that touches thousands of globals across thousands of calls builds millions of them. A skipped call leaves the value from before it standing for the value after it, which these rules confine to the inputs of kept guards; a system call that guards memory counts as a STORE. A range a pass revisits keeps every guard; a later read or partial write that would cross a call left unguarded, a Varnode reaching past such a range, a join that still takes a stale value once every guard is built, the removal of a guard a read depends on, or a merge copy or removal of a guard whose input crosses a call left unguarded (it would store the value from before that call after it) restarts the function with every guard built, and the pass run once the re-flow budget is spent keeps every guard. A skipped guard, and a join only skipped guards needed, keep their op and Varnode numbers. Below N every call keeps upstream's guard, and jump-table recovery partials always do. The count is the pass's calls times its new ranges in the default data space."
use_when = "On by default at 65,536 guards, the size at which the guards cost a huge function gigabytes and minutes. Set `on` to place the sparse guards in every pass with a call, a larger N or `off` to keep upstream's guard on every persistent global at every call, for example to compare heritage's IR with upstream."
example = "option persistcalls off"
source_decompiler = "kuna"
inspiration = "GH-1034 libpython3.11 0x3b72c0 (Debian 3.11, an 83 KB finalizer): 1,725 writable globals guarded at 4,060 calls, 7.0 million INDIRECTs, 9.5 GB and 8 minutes; 11,700 of the guards are needed."
change_kind = "performance"
tier = "core"
symptoms = "a function that touches thousands of globals between thousands of calls takes gigabytes and minutes to decompile|heritage builds millions of INDIRECTs over writable globals that survive dead-code removal|a huge initializer or finalizer exhausts memory in assignhigh or merging"
