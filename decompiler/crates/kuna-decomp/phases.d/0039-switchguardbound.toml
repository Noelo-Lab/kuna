[[settable]]
option = "switchguardbound"
values = "on|off"
default = "off"
destructive = true
phase = "P2"
subphase = "switch-model"
strength = "HARD"
rewind = "P2"
issue = "angr-missing-function-call"
summary = "Bound a LOAD-table jumptable by an out-of-band CBRANCH range guard (idx LEu N) when the basic model's guard analysis could not (e.g. a GCC `sub LOW; ja DEFAULT` dispatch with the index spilled to the stack and the flag idiom not yet simplified)."
use_when = "Set on PER PROGRAM when a switch reports 'Could not recover jumptable ... Too many branches' and renders as a computed (code *)() call AND the dispatch is range-guarded (vs the modulo form switchmodbound handles); DESTRUCTIVE as a global default (the guard-to-index correspondence is asserted across a stack spill it cannot prove in dataflow, so it may over-bound an unrelated indirect jump)."
example = "option switchguardbound on"
source_decompiler = "angr"
inspiration = "test_decompiling_missing_function_call; angr jump-table / VSA guard bounding; main"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "'Too many branches' jumptable failure where a cbranch range guard bounds the index|computed (code *)() call at a gcc sub/ja guarded dispatch with the index spilled to the stack"
live_field = "switch_guard_bound"
live_true = "on"
live_false = "off"
