[[settable]]
option = "linuxsyscall"
values = "off|auto|on"
default = "auto"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "kuna-linux-int80-syscall"
summary = "On an x86 Linux ELF, render a 32-bit `int 0x80` as the syscall it is instead of an indirect call through the `swi` userop. x86 SLEIGH lowers `INT imm8` to `intloc = swi(imm8); call [intloc]` (ia.sinc:3671) - the honest lifting of a general software interrupt, since SLEIGH cannot know which operating system is behind the vector - and the decompiler renders that as `(*(void *)swi(0x80))();`: a call through a pointer nothing assigns, with the syscall number and every argument erased, because the register writes that set them up have no reader left and the dead-code fixpoint collects them. On 32-bit Linux the vector is fixed and so is the ABI: the number is in EAX and the arguments are EBX, ECX, EDX, ESI, EDI, EBP, with the result back in EAX. This pass recognizes the lowering structurally (a two-input CALLOTHER whose second input is the one-byte vector constant 0x80, feeding a CALLIND at the same instruction address), reads the number from a backward walk of the basic block that accepts only a full-width `EAX = <constant>`, and retargets the CALLIND in place onto a call spec named `sys_<name>` whose input prototype is LOCKED to the first N argument registers - so the later ActionFuncLink materializes the argument Varnodes itself and the `mov $1,%ebx` that feeds the call keeps a reader. The synthesized spec also sets extrapop = 0: `int 0x80` pushes no return address, where the default __cdecl extrapop of 4 (what the indirect call gets today) hands ESP back four bytes it never lost and shifts every later ESP-relative reference in the function. Three refusals leave the old rendering untouched rather than guess: a number that is not a locally-resolvable constant, a number with no vetted entry in the syscall table (332 of the 438 `__NR_` names - the arity has to be known, because printing a name with the wrong argument count is a false statement about the call, not a partial one), and any language that is not x86. `auto` (the default) adds a fourth: the loaded image must be an ELF whose EI_OSABI is System V or GNU/Linux and that carries no other system's ABI-tag note - never a BSD or Solaris OSABI, never a PE, Mach-O or raw image - because the vector alone does not prove the operating system behind it; `on` drops that test for shellcode and raw images."
use_when = "On (`auto`) by default: a 32-bit Linux ELF - typically hand-written assembly, a static `_start` or a packer stub - whose output would otherwise contain `(*(void *)swi(0x80))();` with the syscall arguments vanished renders `sys_write(1,&buf,n)`, with the prototype locked to the registers the table says the call reads. Inert on every non-x86 language, on any image that is not a Linux ELF (a BSD or Solaris OSABI, a PE, a Mach-O, raw bytes), and on any int 0x80 site whose number it cannot resolve. Set `on` for shellcode or a raw image whose OS the container cannot state; `off` keeps the `swi` rendering."
example = "option linuxsyscall on"
source_decompiler = "kuna"
inspiration = "x86 ia.sinc:3671 INT imm8 lowering vs the i386 Linux syscall ABI (asm/unistd_32.h + the section-2 manual pages); crackmes.one 66fd63059b533b4c22bd0b91 `_start`"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "a syscall renders as (*(void *)swi(0x80))() - a call through a pointer nothing assigns|the mov $N,%eax before an int 0x80 has vanished from the output|an int 0x80 site shows no arguments even though the disassembly loads ebx/ecx/edx|32-bit linux _start or shellcode where every system call is an unnamed indirect call|esp-relative locals shift by four bytes after an int 0x80"
