[[settable]]
option = "stackstruct"
values = "on|off"
default = "off"
live_field = "stack_struct"
live_true = "on"
live_false = "off"
destructive = false
phase = "P6"
subphase = "stack-frame-layout"
strength = "HARD"
rewind = "P6"
issue = "kuna-stackstruct"
summary = "Lay out an address-taken frame object that the function accesses at several offsets with different widths as one synthesized `struct_N`. A local record whose address is handed to a callee (`read(fd,&hdr,8)`) keeps no type in a stripped binary, so the frame layout makes one scalar per slot it finds: the byte and short members inside a slot print as partial accesses of an `unsigned long` (`v1._4_2_`) and the slots after the first become unrelated locals. With the option on, `restructure_varnode` recognizes the object before it merges the hints: it starts at a frame address that reaches a call as an argument with no index added; it extends over what single accesses prove belongs to it -- an access that starts inside and ends past the current end, the contiguous writes one instruction made (a vector zero store the lane split cut into words), and the byte count a buffer call states for that address (`memset`, `memcpy`, `memmove`, `memcmp`, `bzero`, `read`, `write`, `recv`, `send`, `fread`, `fwrite` and the `_chk` object size); and its members are the accesses inside that extent, an access that strictly contains another being an initializer that claims nothing. Slots that merely sit next to the object stay separate locals, and no single access joins two addresses that each reach a call at their own start: a compiler zeroes or reloads two adjacent locals with one access (an AArch64 `stp` of `xzr`). The object is a record only when at least two members of different widths remain, each naturally aligned and 1, 2, 4 or 8 bytes wide, and its size is a multiple of the widest. It declines when an access crosses its start, a hint over it is type-locked, shared storage, indexed or already a composite some other evidence typed, a write stores the bytes of text (a string built in place), a wide access copies a non-constant value over its members, or a whole-object read uses the bytes as one value (a register-shared slot). A member's type is the one every access of it agrees on, else the unknown of its width (a float when an access carries one); alignment padding becomes unknown members of the widest width each offset allows and a longer gap one `undefined1[N]`. The structure is minted through the `structsynth` layout ledger and is used only when the answer is exactly the object's size; the object's hints are replaced by one fixed hint of it, and the existing member rendering prints `v1.field_0x4`, splits an initializer into member stores, and `structdefs` prints the definition. The first layout waits until type propagation has settled; later passes keep it while no access crosses its bounds. Flipping it on in default mode moves 0/675 datatest assertions and no other stage file's assertion."
use_when = "ON in the `aggressive` preset (which `auto` picks under 500 KiB, and which the web decompiler uses). Shipped OFF: the structure is a layout hypothesis over a frame object, and a program-wide `struct_N` minted for one function renumbers the synthesized structures of every later function in a `decompile-all` run. Flip ON when a function reads byte or short fields out of a local it passed to a callee by address, or a local filled by `memset`/`memcpy` prints as several unrelated scalars; flip OFF to get one variable per slot back."
example = "option stackstruct on"
source_decompiler = "kuna"
inspiration = "a local header record read through `read(fd,&hdr,8)` and then passed to a setup call printed its byte and short fields as partial members of an `unsigned long` (`v1._4_2_`) and the record's later slots as unrelated locals; no record type was declared"
change_kind = "type-inference"
tier = "transform"
symptoms = "a local passed by address to a callee is declared unsigned long and read as v1._4_2_ or v1._6_1_|byte and short fields of a local header print as partial accesses|a struct the source zero-initializes or memsets prints as several unrelated stack scalars|memcpy copies 0x40 bytes into a local declared char v13[12]"
