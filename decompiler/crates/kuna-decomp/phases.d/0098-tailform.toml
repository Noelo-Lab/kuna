[[settable]]
option = "tailform"
values = "off|on|wrap|guard|model|<n>|<void>,<value>"
default = "model"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "kuna-tailform"
summary = "Re-spell the `if` at the end of a function by its conditional part -- saved logistic weights over its features by default, its printed size under `on` -- instead of the form the binary's return layout produced. `if (c) { S } return K;` and `if (!c) return K; S; return K;` are the same program; whether the compiler shared the epilogue or gave a path its own `ret` or tail call decides which one structuring recovers, and that layout runs against the author's habit of wrapping a short tail and guarding a long one. After the tree is final, `kuna_tailform` works on the function's top-level statements: a guard `if (c) return K;` whose remaining tail prints at most <n> lines (statements, headers, labels; not lone braces) and returns the same K (void, an equal constant, or one SSA value) becomes `if (!c) { tail } return K;`; a one-arm `if` right before the final bare return whose body prints more than <n> lines becomes a guard clause (void or constant K); and an arm of that last `if` (in a void function, also of an `if` that ends the function) that ends in the function's own final `return K;` (or `return;`) drops it. When the top-level statements end in a call that does not return (the `// no-return` halt), the last one-armed `if (c) { X }` before it whose arm leaves (`return E` of any value, statements and a return, a jump) becomes `if (!c) { rest; f(); } X` whatever the size: neither path reaches the end, and authors write the fatal arm as the `if` body (`if (n < 0) xalloc_die(); return n;`). Print-tree edits only: the condition is negated in place (FlowBlock::negateCondition), statements move in order, no op is cloned, reordered or removed, and a return that shares a basic block with the last statement prints after the `if` from a return-only copy of the leaf. The size rule wraps a conditional part of at most <n> lines and guards a longer one; `on` is 4 lines; `<void>,<value>` sets the two thresholds separately; `wrap` and `guard` force one form at every site; `model` (the default) decides each site with saved logistic weights (`kuna_tailform_weights.rs`, a dot product) over its features: printed lines, top-level statements, statements, calls, assignments, returns, `if`s and loops of the conditional part, how it ends (call, assignment, `if`, loop, ...) and whether its last call shares a block with a return, the condition's kind (`x`, `!x`, `==`, `!=`, ordering, `&&`, `||`, bit test, call) and operation count, whether it reads a call result or tests a parameter, the returned value (void, constant, variable), the statements, returns, loops and guard clauses before the site, and the form the binary laid out; in a function `kuna_unoptimized` flags the threshold decides. `kuna_tailform::decide` is the whole policy."
use_when = "`model` by default (the 4-line size rule `on` was the default before). Against `on` on the decbench corpus (main bd07ce279) it moves 100 more functions to a CFG that matches the source exactly at O2 without inlining (gained 190, lost 90; +38 on one half of the projects, +62 on the other) and 41 more at O0 (gained 94, lost 53; +14 and +27); a table fitted on one half of the projects only gains 27 and 26 functions at O2 and 32 and 9 at O0 on the half it never saw. The losses are sources that wrote the other form, mostly a function whose whole body is one short `if (c) { ... }` that the model prints as a guard clause, or a guard late in a chain of guards whose remaining tail it wraps; it never changes what a function computes. The size rule itself moved 549 more functions to an exact match at O2 than `off` (gained 755, lost 206) and 461 at O0, and the no-return form adds 266 at O2 and 236 at O0 under every value but `off`. Set `on` for the size rule (`option tailform 2` when a code base writes early returns even for one-statement tails, a larger <n> when long bodies stay wrapped); `off` prints the binary's own return layout, which is what Ghidra and IDA print. In a function `kuna_unoptimized` flags the model defers to the size rule, which was right more often there. `wrap`/`guard` print every decided tail one way (and, with `KUNA_TAILFORM_DUMP=<dir>` set, dump the sites the model trains on)."
example = "option tailform on"
source_decompiler = "kuna"
inspiration = "decbench void-tail study: for 868 functions whose whole structure is a void tail `if`, the source wraps 86% of one-line bodies and 29% of bodies over eight lines, while kuna picked the source's form 32-40% of the time at every size because it copied the binary's return topology; bash `initialize_aliases` (`if (aliases == 0) aliases = hash_create(..);`) printed as `if (aliases) return; aliases = hash_create(0x40);`."
change_kind = "structure-recovery"
tier = "transform"
symptoms = "if (ok) return v; fatal(); where the source has if (!ok) fatal(); return v;|if (!c) return; f(); where the source has if (c) f();|if (!c) return 0; f(); g(); return 0; where the source has if (c) { f(); g(); } return 0;|a long body nested in if (c) { ... } at the end of a function whose source returns early|if (c) { f(); return 0; } return 0; with the return written twice"
