[[settable]]
option = "boolbyte"
values = "on|off"
default = "on"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "kuna-boolbyte"
summary = "Declare a byte whose every read is a truth test as `bool` instead of `char`. `TYPE_BOOL` is only ever minted as the OUTPUT of a comparison -- `TypeOpEqual` and the other `booloutput` ops return `getBase(size, TYPE_BOOL)` -- and nothing in `ActionInferTypes` mints it for the value being compared: `TypeOpEqual::getInputLocal` votes `getBase(1, TYPE_INT)` for that, and the cached one-byte `TYPE_INT` is the ASCII `char` (\"Char is preferred over other int types\", `TypeFactory::cacheCoreTypes`). So a flag byte comes out `char`, as coreutils basename -O0 shows: `void sub_2b45(unsigned long a0, long a1, char a2)` whose only use of `a2` is `v1 = (a2) ? 0 : 10`, where the program declared `_Bool use_nuls`. When on, `kuna_boolbyte::truth_value_type` walks the byte's transitive readers through value-preserving identity -- COPY, MULTIEQUAL and INT_ZEXT, breadth-first with a visited set and a ten-hop cap, so the cap is a property of the graph rather than of the pop order, and running out of hops refuses -- and offers a `bool` candidate when every terminal read is a truth test and at least one of them is a real one: a CBRANCH condition, a BOOL_NEGATE/AND/OR/XOR operand, or an INT_EQUAL/INT_NOTEQUAL against zero. CPUI_INDIRECT is NOT value-preserving and refuses on both sides of the walk: an INDIRECT output is the value after the op it annotates, so a call whose callee may have written the storage breaks the chain in both directions -- crossing it would declare `bool` for a byte a callee fills with 200. A RETURN of the value is neutral, carrying neither acceptance nor refusal, because a `_Bool`-returning function is indistinguishable from a `char`-returning one from inside the callee. Everything else refuses, the call argument most deliberately: `putchar(c)` must not make `c` a bool just because something else also tests it. A Varnode the function itself writes must additionally carry a non-zero mask of at most 1, which is `ActionNonzeroMask`'s transitive \"every def writes 0 or 1, or copies something that does\" fact, computed in the pass that runs immediately before this one -- and it is what lets `x == 1` and `x & 1` count as truth tests for a proven flag while refusing them on an unproven byte, where they distinguish 1 from 2 and test parity respectively. A function INPUT has no def and always carries the full mask, so for a parameter the use shape is the whole of the evidence: a byte the function only ever branches on is what a `_Bool` parameter looks like from the inside. The candidate is FOLDED into the same `getLocalType` fold by `Datatype::type_order` rather than installed as a replacement seed, so a more specific vote still wins -- `SUB_BOOL` is 10, which beats `SUB_INT_CHAR` 19 and `SUB_UINT_PLAIN` 16 but loses to a callee's locked parameter type. Nothing else in the type system moves: the `TYPE_BOOL` propagation gate that refuses to carry bool into a Varnode whose mask exceeds 1 is left exactly as upstream wrote it, so the seed cannot travel along a copy chain into a value that can hold more than 0 or 1. One printer arm comes with the declaration: `CastStrategyC::isSubpieceCast` (cast.cc:411-432) lists the destination metatypes a SUBPIECE may print as a cast and TYPE_BOOL is not among them, because upstream never puts one there, so without the arm a truncation into the new `bool` falls to the functional form and prints the raw `SUB41(x,0)` p-code intrinsic -- an undeclared identifier, the class `subright` exists to keep out of the emitted C. With the option on such a truncation prints as a cast, and whole-binary counts of the intrinsic go DOWN rather than up (tar -O2 4 -> 1, ls -O2 1 -> 0, du -O0 1 -> 0). The cast is `(bool)x` only when every bit of `x` above the byte is proven zero, and `(bool)(unsigned char)x` otherwise: a C conversion to bool tests the whole operand, and a bool can reach a truncated byte through a sibling copy (`unsigned char c = x & 0x201, d = c; ... d = 0;`), where `(bool)(x & 0x201)` would be 1 for x = 0x200."
use_when = "On by default: a one-byte parameter or stack local whose every use in the body is `if (v)`, `!v`, `v == 0`, `v ^ 1` or `v ? a : b` -- the shape a `_Bool` takes once the compiler has erased the type -- is declared `bool`, so a flag argument reads as a switch (`hash_find_entry(..., bool delete)`, gnulib's `bool ok` chains, option parsing) instead of as a character. Turn it off when you need kuna's declarations to stay in the upstream Ghidra vocabulary, when you are looking at code that really does pack flags into character data, or when a script addresses locals by the generated `vN` names an older run printed: §6 merges by type, so a `bool` and a `char` in one storage stop being merge candidates and two `bool`s start -- over eight whole binaries 10 of the 105 functions the default changes gain or lose a declaration, or have an expression come to name the other half of a split, and the remaining `vN` locals renumber. The flag constants re-render with the type (`v = '\\x01'` becomes `v = 1`). Off is the upstream fold exactly: the candidate is never offered and the printer's truncation arm is not consulted."
example = "option boolbyte off"
source_decompiler = "ida"
inspiration = "IDA's Hex-Rays declares a byte whose only uses are conditions as `bool`, and its microcode carries a `mop_b` boolean kind for the same values; this rule reaches the same declaration from Ghidra's own lattice, by supplying the `TYPE_BOOL` candidate the `getLocalType` fold never has. Measured over the 444-slice decbench type sweep: 866 one-byte variables kuna commits to `char`/`unsigned char` have DWARF `_Bool` ground truth, and 538 of them are read only as truth values."
change_kind = "type-inference"
tier = "core"
symptoms = "a parameter is declared char and every use of it is if (a0) or !a0|a one-byte local is char but only ever assigned 0 and 1|a flag argument reads as a character, so a call site looks like it passes text|char v1; followed by v1 = 0; v1 = 1; if (v1)|DWARF says _Bool and kuna says char or unsigned char"
live_field = "bool_byte"
live_true = "on"
live_false = "off"
