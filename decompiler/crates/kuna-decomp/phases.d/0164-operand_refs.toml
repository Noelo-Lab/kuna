[[settable]]
option = "operand_refs"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-operand-refs"
summary = "Run the scalar/operand reference-markup pass (ScalarOperandAnalyzer/ElfScalarOperandAnalyzer): linear-decode the executable sections and, for each scalar immediate operand that points into allocated read-only data (passing the <4096/byte-mask value filter and the .got/.plt exclusion), plant a typed char[N]+readonly fact so the printer renders the reference as a string literal. DISABLED by default (Ghidra ScalarOperandAnalyzer.getDefaultEnablement = !isElf, i.e. off for every ELF; the ELF subclass only removes bad .got/.plt refs kuna never creates; the useful product is already delivered by s1_strings + libproto typing; a per-instruction immediate scan over-accepts)."
use_when = "Off (default; net-negative for an ELF decompiler per docs/history/analysis-port-buildplan.md §1.2 — ELF-default-off upstream, covered-elsewhere, over-acceptance-prone). Flip on to type residual short / s1_strings-missed read-only string operands pointed at by a no-prototype call."
example = "option operand_refs on"
source_decompiler = "kuna"
inspiration = "Ghidra ScalarOperandAnalyzer / ElfScalarOperandAnalyzer (!isElf default-off)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "an immediate operand pointing at a rodata string renders as a bare number|string argument of a no-prototype call not typed as char[N]"
