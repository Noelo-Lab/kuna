[[settable]]
option = "overlapbranch"
values = "on|off"
default = "on"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "overlapping-anti-disassembly-sequence"
summary = "REMOVES CODE: when a conditional branch's own target lies STRICTLY INSIDE the encoding of the instruction at its fall-through, the fall-through decode has swallowed the branch target -- the classic anti-disassembly junk-lead-byte overlap (`75 01 e8` : a `JNZ +1` over an `e8` byte that turns the real stream into a bogus 5-byte CALL). kuna's flow follower pops the fall-through before the branch target, so the bogus decode wins by arrival order and desynchronises everything downstream; `set_fallthru_bound` only notices afterwards, when the losing stream is already built. This option makes the explicitly encoded branch target win: the ops of the overlapping fall-through decode are dropped, an artificial halt is planted at its own address (the conditional and its fall-through EDGE both survive), and the target is decoded on its own boundary. Two real instruction starts cannot sit at `next` and strictly inside `next`, so whenever it fires at least one of the two decodes was already wrong. ONE legitimate overlap is excluded first, and it is compiler-generated: glibc's conditional-`LOCK` idiom (`74 01` hopping over an `f0` prefix byte, as in a statically linked `_int_free`/`_int_malloc`) is the SAME instruction with its prefix taken or skipped, so the two decodes END AT THE SAME ADDRESS and both streams are real. The branch target's own instruction length is therefore decoded and the rule declines whenever `target + target_len == curaddr + step`, and likewise whenever the target does not decode at all. Ablating that one exclusion deletes the atomic store on a live path, so it is not decoration."
use_when = "A hand-written / obfuscated / anti-disassembly binary decompiles with a call to an address outside the image, stores through never-assigned pointers, or bogus `dat_<hex>` globals right after a short conditional jump. Off restores the upstream fall-through-wins decode. Inert on ordinary compiler output: the trigger needs a branch target strictly inside its own fall-through instruction, and the one compiler idiom that produces that (a conditional jump over a `LOCK` prefix) is excluded because both decodes end at the same address."
example = "option overlapbranch off"
source_decompiler = "ida"
inspiration = "round-2 RE-friction crackme pcme0: JNZ 0x8048838 followed by a linear CALL at 0x8048837 whose target 0xb10cdc7 is outside the image; IDA follows the branch target and recovers the real checker"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "a call to a sub_<hex> address that is not in the binary|writes through pointers that are never assigned right after a short conditional jump|a bogus dat_<hex> global incremented once and never read|a comparison whose operands are unreadable CONCAT/subpiece salad in hand-written or obfuscated code"
live_field = "overlap_branch"
live_true = "on"
live_false = "off"
