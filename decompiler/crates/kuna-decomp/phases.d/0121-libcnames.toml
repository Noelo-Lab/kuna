[[settable]]
option = "libcnames"
values = "on|off"
default = "on"
destructive = false
phase = "P6"
subphase = "naming-policy"
strength = "HARD"
rewind = "P6"
issue = "kuna-libcnames"
summary = "Give a numbered local the name the C library gives it, as a second name for its number. The built-in libc tables (`libproto`, `libcsigs`, `libctypes`) carry glibc's declared parameter names, leading underscores stripped (`read (int __fd, void *__buf, size_t __nbytes)` gives `fd, buf, nbytes`), and, where the result is one kind of thing whatever the arguments, a conventional name for it (`fd` for `open`, `n` for `read`, `len` for `strlen`, `p` for `malloc`, `fp` for `fopen`, `tp` for `localtime`). The `win32sigs` table carries the Windows SDK names the same way (`ReadFile(hFile, lpBuffer, nNumberOfBytesToRead, ...)`, `hModule` for `LoadLibraryW`, `hHeap` for `GetProcessHeap`, `lpMem` for `HeapAlloc`), so a PE reads `hFile = CreateFileW(a0,...); ReadFile(hFile,...)`. They ride on the prototype a table parks, so only a call a table prototype reaches counts, and they are kept out of the callee's parameter names, so its printed signature and name locks do not change. `kuna_libcnames` reads each local's evidence before the naming walk: the value a library call returns (`fd = open(a0,0);`), counted only when every library result the local holds agrees; then a library argument it is passed whole as when the name says what the value is (`read(fd,...)`, `write(a0,a1,n)`); then a name that only says which side of one call a value is on (`dest`/`src`, `s1`/`s2`), counted only when every such name agrees. A stack array, structure or scalar whose own address a library call takes has the same evidence under the name of the object the parameter points at, and prints it at every reference: glibc's name as it is (`read(a0,buf,0x100)`, `stat(a0,&buf)`, `waitpid(pid,&stat_loc,0)`), a Windows SDK name less its `lp`/`p` pointer prefix (`ReadFile(hFile,Buffer,0x200,&NumberOfBytesRead,NULL)`), nothing for a name that only says the argument is a pointer (`fread`'s `ptr`) unless the object is one (`strtol(a0,&endptr,10)`), and no evidence from a call that only fills it (`memset`, `bzero`, `explicit_bzero`), a member's address, or a DWARF, user or directive name. A scalar object that two calls name differently (`read(fd,&v,4)` then `waitpid(v,&v,0)`) holds two values in turn and keeps its number. The function's own parameters keep their `aN` names. A name equal to a type the code can print (`tm`, `FILE`) or a C or Rust keyword is passed over. The walk numbers every local exactly as with the option off and records that numbering, and only then does a numbered candidate print its library name, so `v4` is the same variable in every mode. A clash takes `_2`, `_3`, ... in call order, and no spelling repeats a name any variable of the function prints (a global's included), the scope holds, or a callee has. A directive reaches the local by either name, and a replay records the number: after `name fd src` the second descriptor stays `fd_2` and no local becomes `fd`, and a local whose library name a rename took prints its number. Over 14 stripped decbench binaries under `--mode aggressive` (O0 gzip, crontab, wc, bzip2, cat, dash; O2 bzip2, init, login, gzip, crond, tail, kmod, grep), 968 of 10,106 numbered locals print a library name in 546 of 3,297 functions, and every changed function differs from the option-off output only in those names, every other local keeping its number; against the source of the `compiled/` twins at the same call and slot, 415 of them could be located: 91 carry the source's own name and 324 another spelling of the same meaning (`fp` for `inStr`, `len` for `namelen`, `tp` for `tm`), none a misleading one. Over 70 native PE crackmes (MSVC and clang, i386 and x86-64), 615 numbered locals print a Win32 name in 478 of 17,166 functions; against the DWARF twins of the four decbench Windows projects (mydoom, dexter, x0r-usb, minipig at O0 and O2), the Win32-named locals located at the same call and slot carry the twin's own name or another name for the same thing (`hFile` for `HostFD`, `lpMem` for `output_buffer`, `hModule` for `kernel32_dll`), none a misleading one. Over 117 stripped decbench images (39 programs at O0, O2 and O2-noinline), 1,529 stack objects print a library name and every changed function differs only in names; in a random sample of 220 matched to the DWARF variable at the same frame offset of the unstripped twin, all but 4 carry the source's name or a name for the same kind of object (`buf` for `struct stat st`, `stat_loc` for `status`, `NumberOfBytesRead` for `readbytes`), and those 4 name a stack slot the compiler reuses for several variables, or a scalar the program also assigns an unrelated value, after only one of them. 0/675 datatest assertions move. No stage assertion of another feature moves with it on."
use_when = "On by default: a local reads `fd = open(a0,0); n = read(fd,buf,0x200);` where it would read `v1 = open(a0,0); v3 = read(v1,v4,0x200);` (on a PE, `hModule = LoadLibraryW(a0);` where it would read `v1 = LoadLibraryW(a0);`), and every other local keeps its number. A directive may name such a local `fd` or `v1` in either setting. Set it off for `vN` names only, for example to diff against Ghidra output or to keep the numbering a script expects."
example = "option libcnames off"
source_decompiler = "ida"
inspiration = "Issue #1076: IDA and Ghidra name a local after the parameter of the library call it is handed to, and kuna left `open()`'s result and `read()`'s count as `v1` and `v3` although its own libc tables type both calls."
change_kind = "presentation-default"
tier = "core"
symptoms = "a local holding open()'s result named v1|read's byte count kept as a vN|a stack buffer passed to read() or ReadFile() named vN|a struct stat or a DWORD whose address a library call takes named vN|a buffer length from strlen named vN|a local passed to a libc function keeps a vN name|a handle from CreateFileW or LoadLibraryW named vN|kuna names fewer locals than IDA on libc-heavy code"
live_field = "libc_names"
live_true = "on"
live_false = "off"
