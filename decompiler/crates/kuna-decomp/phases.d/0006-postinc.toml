[[settable]]
option = "postinc"
values = "on|off"
default = "on"
live_field = "post_increment"
live_true = "on"
live_false = "off"
destructive = false
phase = "P9"
subphase = "pointer-notation"
strength = "HARD"
rewind = "P9"
issue = "kuna-postinc"
summary = "Fold a pointer step that follows the statement dereferencing the pointer into a post-increment: `v = *p; p = &p[1];` prints `v = *p++;` and `*d = c; d = &d[1];` prints `*d++ = c;`. The step (INT_ADD or PTRADD of a constant c, output and input the same variable) folds only when the stepped value is read by exactly one other op, a LOAD or STORE of c bytes through it, the pointer's element is c bytes, and the statement holding that LOAD or STORE is printed right before the step in the same block. C output only."
use_when = "On (default). Flip off to see each pointer step as its own statement."
example = "option postinc off"
source_decompiler = "kuna"
inspiration = "the `*p++` idiom of C string and buffer loops, which compilers lower to a load or store followed by a pointer add"
change_kind = "presentation-default"
tier = "transform"
symptoms = "a string or buffer loop prints v = *p; p = &p[1]; instead of v = *p++;"
