[[settable]]
option = "partialaccess"
values = "on|off"
default = "on"
live_field = "partialaccess"
live_true = "on"
live_false = "off"
destructive = false
phase = "P9"
subphase = "pointer-notation"
strength = "HARD"
rewind = "P9"
issue = "kuna-partialaccess"
summary = "Print a partial access of a variable that no member names as C instead of Ghidra's artificial `name._<off>_<size>_` member. `PrintC::pushPartialSymbol` (printc.cc:2106-2117) spells the bytes of a variable no field covers as `v1._4_2_` for the two bytes at offset 4 -- not C, so the text does not compile and a reader has to know the convention. With the option on, an access of a width C has a scalar for prints the way kuna already prints those bytes reached through a pointer: `((T *)&v1)[k]` when the offset is a multiple of the width (`k` is the offset divided by the width, IDA's `WORDn`/`BYTEn` reading), `*(T *)&v1` at offset 0, `*(T *)((char *)&v1 + off)` for an unaligned offset, `*(T *)&buf[off]` (and `*(T *)buf` at offset 0) for bytes taken out of a byte array, whose subscripts already count bytes, and `((char *)&v1)[off]` where the caller takes the address of a position inside the variable. `T` is the accessed value's own type when that is a scalar of exactly the access width, else the unknown type of that width (the float of that width when the access carries a float, which an integer `T` would convert); a 16-byte access on a 64-bit target reads through `unsigned __int128`, the GCC and Clang 16-byte integer. A view of a volatile access keeps the qualifier on its pointee (`*(volatile unsigned int *)cursor`), so it stays one access of its width. A sixteen-byte temporary whose type is only an inferred array of unknown bytes, which nothing but truncations, copies, merges and bitwise operations read and no load or array copy defines, is declared `unsigned __int128` instead of `char[16]`, so a whole-width value can be assigned to it. A member path in front of the token is kept (`((unsigned int *)&v1.flagfield)[1]`). Every form is an lvalue, so a partial store prints the same way, and the offset is the byte offset into the variable's storage exactly as in the token it replaces, so the reading is the target's memory order on every architecture. C has no scalar of 3, 5, 6, 7 or 9 to 15 bytes: a plain store or copy of such a width, or of 16 bytes, prints as `memset`/`memcpy` of exactly its bytes (`memset(&v11,0,0x10)`, `memcpy((char *)&v1 + 0x10,(char *)&d + 0x10,0x38)`), a whole array variable taking a copy out of such bytes the same way; a read of 3, 5, 6 or 7 bytes out of a scalar prints as the `SUB<in><out>(v,k)` intrinsic the output already uses for a truncation (`k` counted from the value's low end); any other access of such a width keeps Ghidra's token, which no compiler accepts, rather than a spelling that would compile to another value. No form is an array-typed value. C output only; the Rust printer keeps its own spelling. The forms reinterpret a variable through another type, as IDA's macros do, so recompiling the text wants `-fno-strict-aliasing` like any decompiler output that does."
use_when = "On by default: the emitted C should be C, so a partial access no member names prints as a typed pointer access (`((short *)&v1)[2]`) instead of Ghidra's `v1._4_2_`. The XML datatest scripts that pin Ghidra's `._<off>_<size>_` spelling set it off (`Enum Reading #2`, `Stack Return #5`). Flip OFF to read Ghidra's notation, which is shorter and is what a Ghidra user expects, or to diff against Ghidra output."
example = "option partialaccess off"
source_decompiler = "kuna"
inspiration = "a local record read through `read(fd,&hdr,8)` printed its byte and short fields as `v1._4_2_` and `v1._6_1_`, which is not C; over 36 stripped decbench binaries (O0 and O2) `--mode aggressive` printed 4,964 such tokens in 805 functions"
change_kind = "presentation-default"
tier = "core"
symptoms = "the emitted C contains a member named like `._4_2_` or `._0_8_`|a variable is read as `v1._6_1_` and the text does not compile|a 16-byte register pair returns as `v1._0_16_`|a libc record such as `stat` is read as `v3._24_4_`"
