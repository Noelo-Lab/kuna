[[settable]]
option = "pebnames"
values = "off|auto|on"
default = "auto"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "GH-468"
summary = "Type the Windows thread-environment segment base as `TEB *teb`, so reads through it render as the TEB and PEB fields a reverser recognises. A Windows user-mode thread keeps its Thread Environment Block at the base of `GS` (x86-64) or `FS` (x86), and x86 SLEIGH lowers a segment-prefixed operand to `GS_OFFSET + disp` / `FS_OFFSET + disp` over a register input nothing in the function writes. With no type on that register the anti-debug probe `MOV RAX,GS:[0x60]; MOVZX ECX,byte [RAX+2]; MOV EAX,[RAX+0xBC]` renders as `long long v1; // gs_offset` and `*(char *)(*(long long *)(v1 + 0x60) + 2)`: magic offsets into nothing, with `gs_offset` being only the lowercased register name. Before heritage, when the raw p-code reads the segment-base register and never stores through it, a type-locked and name-locked local Symbol `TEB *teb` is mapped over its input storage, and ordinary pointer-arithmetic and field rendering does the rest: `teb->ProcessEnvironmentBlock->BeingDebugged`, `teb->ProcessEnvironmentBlock->NtGlobalFlag`, `teb->Self->ProcessEnvironmentBlock`, `teb->ThreadLocalStoragePointer`, `teb->StackLimit`. A field is named only when its offset, name and size agree in every PDB-derived layout the Vergilius Project publishes (x64 XP SP2 to Windows 11 25H2; x86 XP SP3 to Windows 10 22H2 plus every WOW64 TEB32/PEB32), so a release-dependent name such as `ApiSetMap` or `CrossProcessFlags` stays `field_0x<off>`. Both structures are variable-length at the largest published size, so an offset past the end stays an integer addition instead of naming a field of a phantom neighbouring TEB. A function that writes through the base (on x86, every function linking an SEH registration record through `fs:[0]`) is left untyped, because that record's stack layout is inferred from how the untyped base is used. The base is only a TEB in user mode -- kernel code keeps its KPCR there and firmware nothing -- so `auto` acts only on an image the loader proved is a Windows GUI or console PE (optional-header subsystem 2 or 3); `on` trusts a Windows compiler spec alone. The register is GS on x86-64 and FS on x86, so the x86-64 ELF canary at `fs:0x28` and the x86 one at `gs:0x14` never reach the pass; both modes also require a Windows compiler spec, which keeps a non-Windows image that does read that register untyped."
use_when = "On (`auto`) by default: a Windows PE whose C reads a `// gs_offset` or `// fs_offset` local through constant offsets -- anti-debug `BeingDebugged`/`NtGlobalFlag` probes, MSVC `thread_local` access through `gs:[0x58]`, `__chkstk` stack-limit checks -- gets the field names. Besides the names, a reader's types can move: a stub that returns the TEB or PEB pointer is declared `_TEB *` or `PEB *`, a `BeingDebugged` read is `uint1` rather than `char`, a local that keeps the PEB pointer is declared `PEB *`, and an opaque field compared with a pointer gains a cast. A variable that holds `teb->Self` or `teb->ProcessEnvironmentBlock` on one path and an unrelated value on another takes the pointer type, so the unrelated value gains a cast (seen once, in an obfuscated binary); a parameter merged with such a value can take it too. Set `on` for code with no PE container that still runs as a Windows user-mode thread: shellcode or a raw `.text` blob loaded under a `windows` compiler spec, a stage bytechunk, or the Ghidra front-end, which never supplies the loader fact `auto` needs. Set `off` to restore the untyped register. It never fires on a kernel driver, an EFI image, a COFF object or anything loaded under a non-Windows compiler spec; a Symbol the user already mapped over the register, a program type already named `TEB`/`PEB` with a different layout, or a function whose segment-override instructions store through the base (an x86 SEH frame) makes it decline. A store through a pointer loaded from the TEB (`mov eax,fs:[0x18]; mov [eax],esp`) is not seen by that check and is typed. Measured in DIV-175: every function that changes is a segment-base reader, no call is added or removed, and 0/675 datatests move even with `on` forced as the default."
example = "option pebnames on"
source_decompiler = "kuna"
inspiration = "GH-468 finding 6: an MSVC anti-debug crackme reads the PEB through GS:[0x60] and probes BeingDebugged ([PEB+2]) and NtGlobalFlag ([PEB+0xBC]); kuna rendered `long long v15; // gs_offset` followed by `*(long long *)(v15 + 0x60) + 0xbc` compares"
change_kind = "type-inference"
tier = "transform"
symptoms = "a local commented // gs_offset or // fs_offset is read through constant offsets|an anti-debug check reads *(char *)(*(long long *)(v1 + 0x60) + 2)|PEB fields such as BeingDebugged or NtGlobalFlag render as magic offsets|a thread-local or stack-limit read renders as *(long long *)(v1 + 0x58) or (v1 + 0x10)"
