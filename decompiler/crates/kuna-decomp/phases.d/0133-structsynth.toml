[[settable]]
option = "structsynth"
values = "off|param|locals|nest|all"
default = "locals"
destructive = false
phase = "P5"
subphase = "aggregate-union"
strength = "HARD"
rewind = "P5"
issue = "kuna-structsynth"
summary = "Synthesize a structure type from the constant-offset dereferences of a pointer parameter, or of a pointer a call returned, so the reads render as named fields instead of raw offset arithmetic. A stripped binary keeps no record of the aggregate a pointer points at, so `put_word` in a `-O2` coreutils `fmt` renders as `void sub_3000(unsigned long *a0)` with `v2 = *(unsigned int *)&a0[1]` and `v3 = (unsigned char *)*a0` -- the reader carries `offset 0 is a character pointer, offset 8 is a 4-byte count` in their head across every function that touches the same object. With `param`, once type propagation has reached its fixpoint, every live LOAD/STORE whose address peels to `(parameter, constant)` is bucketed by offset, a `struct_N` is completed with one field per observed offset, and the parameter varnode is type-locked to `struct_N *`; the existing pointer-arithmetic and field rendering does the rest, giving `void sub_3000(struct_0 *a0)` with `v2 = a0->field_0x8` and `v3 = a0->field_0x0` over `struct struct_0 { unsigned char *field_0x0; int field_0x8; }` -- offsets 0 and 8 of the real `WORD { char const *text; int length; ... }`. The pass invents a layout, never pointer-ness: the base must ALREADY carry a pointer type, so `fmt`'s `get_line`, whose first parameter is the real `FILE *` but is still typed `long`, is left alone, and a pointee that is a named composite (DWARF, a parsed declaration, a libc shell, an earlier synthesized structure) always wins. The evidence is deliberately narrow. Only `COPY`/`CAST` and constant pointer arithmetic are peeled, never a phi, because chasing a loop-carried MULTIEQUAL to its root turns `while (*p) p = &p[1]` into offsets `{0,1}` and would synthesize a two-field structure over a string; a base that reaches a phi at all declines, as does one used as an integer, one with a non-constant offset term (that is an array, not a structure) whether or not this function dereferences the result, one with fewer than two distinct offsets or no access at offset 0, a negative or >= 0x8000 offset, a run of equal-width offsets on a regular grid, which reads as an array rather than a layout (Howard NDSS 2011 section 4.5: three or more outright, two when the element is narrower than a pointer, so `int pipefds[2]` and `arg[0]`/`arg[1]` over a `char *` decline while a pair of pointer-sized fields does not; a gap does not break the run below pointer width, because a function that writes ten of a buffer's twelve bytes is ordinary, but it does break it at pointer width, where a record with an untouched member between two observed ones is the common case; an optimized `int fd[2]` that is also saved and restored as one 8-byte word has mixed widths and reaches the same decline through the layout rule instead, because both elements sit inside the wide access and nothing but a single field is left), a stack- or spacebase-rooted base, a type-locked base, and a function whose lattice never settled. At a conflicting offset the WIDEST access wins: a field wider than an access renders as a cast of the field, while a narrower one loses the field name entirely. A field commits to a signedness only when every access of its width does; a signed read and an unsigned or undefined one leave it `undefined<N>`, because a signed field makes C sign-extend a read the binary zero-extends into a call argument. The layout is then pruned so that a C compiler reading the exported header back puts `field_0xK` at offset K: an access whose width the header cannot spell at that width (`undefined3` is a 4-byte `unsigned int` there), one at an offset its own alignment does not divide, and one inside the bytes a wider access already claimed each become a hole instead of a field. What survives is naturally aligned and 1, 2, 4 or 8 bytes wide, and two such ranges either nest or are disjoint, so the declaration cannot overlap at all. The layout is then made dense and C-sized, which is about the body rather than the declaration: every byte from 0 to the end belongs to a member, a gap becoming an `undefined1 field_0x<hex>[N]` of alignment 1 at its own offset, because the printer names an in-range offset no field covers `field_0x<hex>` anyway while the exported header would render that gap as `undefined1 _pad<hex>[N]`, and address arithmetic reaches those offsets without a dereference; and the size is the end of the last surviving field rounded up to the widest surviving field's width, with that rounding covered by `undefined1` filler like any other gap, because a structure the decompiler sizes 0x15 and a compiler sizes 0x18 puts `a0[1]` at two different addresses. Past that end there is no member and no invented name: the printer spells the address as an element of the structure array plus a byte offset, which is still the address the access meant. Names are program-wide `struct_N`, handed out by a layout ledger that reads back every `struct_N` the program's type factory already holds. A measured layout is answered with a minted structure that CONTAINS it -- every claimed field at the same offset, the same width and the same type, and the structure at least as large -- and not only with one whose signature matches exactly, so two functions that read overlapping but unequal subsets of one record share a definition instead of getting a name each (`ls`'s two `fileinfo` comparators, and a stage test's `{0, 8}` and `{0, 8, 0xc}` readers; over twelve binaries it is 471 names where exact-signature dedup minted 515). Agreement on a shared field is exact: two types at one offset are a conflict rather than a refinement, and a field a reader could not type is its own answer, not a wildcard the other may fill in -- a wildcard rule was measured and it unifies records that merely share a shape. Containment stops being evidence once the container dwarfs the measurement or the measurement is too generic to name a record, so a structure that says strictly MORE than the reader measured must also claim at most twice as many fields and be at most four times its size, and the reader must claim two fields of which one is a typed pointer, or three without one: unbounded, an `ls` reader that measured the two words of a `hash_entry` is declared to hold a 200-byte record, and two integer words are how `struct stat`, gnulib's `cycle_check_state` and a list node all begin, so without the pointer rule `cycle_check`'s `struct stat *` is declared as its `cycle_check_state`. A pointer to code, `void` or an undefined type is not a typed pointer. A reader whose every claim past offset 0 is such a pointer is a table (an interface, an ops vector, a vtable) and is answered only by its own shape, since distinct tables differ only in how many slots they have: without that, `rsyslogd`'s seven `*_if_s` interface records all took one 144-byte layout. A reader with no typed pointer is answered only by a structure of its own size that claims nothing past the reader's last field, which may fill in the holes between its fields but not the bytes after them, because records that begin alike part ways after the last field a reader touched (every `ip` netlink reader measures the same `nlmsghdr` words ahead of a payload of its own, and dpkg's `pkg_queue` ends in the padding where `pkg_spec` keeps two flag bytes). No structure answers with a member inside the alignment padding a reader's claims leave between two of them, because records part ways in their first words too: every `bash` command record begins with an `int flags`, and `for_com` puts an `int line` at 4 where `if_com` pads before its first pointer. And a structure answers for a reader only if it lays exactly the reader's own members over every byte range the reader accessed without claiming a field (an unaligned word, a 16-byte copy): the engine's load/store ordering test compares two addresses without their widths, so a container that started a member inside such an access printed a four-byte load at offset 7 after the byte store at 8 that overwrites part of it. When containment runs the other way the minted structure cannot be widened -- `find_add` refuses a second definition of a held name and the completed structure is already shared by every function that took a pointer to it -- so the larger layout mints beside it and the smaller is SUPERSEDED: still defined, and handed out again only to a layout no live structure answers for. Because `decompile-all` decompiles in address order, the function that minted the smaller layout still names it, so after the batch exactly the results that spell a superseded name are decompiled again and each moves to the survivor where the survivor is in its reach; a redo that fails where the first pass succeeded keeps the first body. The bounds are not transitive, so a record can keep two names, but the sweep never mints a third, and the exported header declares one definition per name still in use. None of that happens under `kuna decompile`, which spawns one engine per function, and the streaming project export (`--stream`) has written a body before a name can be superseded, so it converges only as far as its write order allows. With `nest` the values loaded from one pointer-sized field of an accepted record are measured as one base under the same conditions -- already pointers, not type-locked, no phi, index or integer use, two offsets including 0, not an array run -- and the field becomes a pointer to the completed record the ledger answers for them; at most two records below the parameter. When a loaded record claims nothing the enclosing record does not hold at the same offset, width and type, the field points at the enclosing record itself: the structure is minted around its incomplete shell, its self pointer is keyed `SELF` in the ledger, and a LOAD or STORE value typed as a pointer to that shell takes the pointer to the completed structure, so `v3->field_0x18` prints three links down. Under `nest` the convergence sweep can mint (a redone reader's outer layout names the surviving inner record), and a `--jobs` run names a structure with a nested or self field in its one ordered worker. With `locals` the value a CALL or CALLIND returns is a base too: single assignment makes it the local's only definition, so an allocation a function fills in (`v1 = (unsigned long *)xmalloc(0x18); *(char *)((long)v1 + 0x14) = 0x6e`) or a pointer a lookup returns is measured under every condition a parameter is, and five more about the value. A callee declared to return a pointer to something (`char *`, `struct stat *`) has said what it is, so only a `void *` or unlocked return is measured. The value must not share a variable with anything else: a copy is merged with what it copies, a phi input with the other inputs and a value in address-tied storage with everything stored there, so it declines when it or a COPY/CAST of it reaches a MULTIEQUAL or INDIRECT, lands in tied storage, or overlaps the storage any RETURN reads where a phi writes that return register (tied as a whole-function local once merging starts; `kmod` kept a name, its length and a `calloc` record in the one `rax` its `int` function returns through `eax`) -- a locked member decides the merged variable's type. A function has one return type, so a record returned on one path while another RETURN returns a different value (a name, a count, an error code) declines; a constant zero may be returned beside it. A base whose every access stores text is a string buffer: a constant whose bytes are characters (`tar` builds `SCHILY.xattr.` in a fresh allocation as an 8-, a 4- and a 1-byte store) or bytes loaded from a read-only string literal (`cp` fills a `mempcpy` tail from `CuXXXXXX`). And a base declines when a copy of it forms an address at or past the end of every access, because the record is wider than this function shows (`sortlines` passes `&node->lock` just past the fields it reads, and typed on those fields the mutex would print as `&v1[1]` and take the record's type). `all` is `locals` and `nest` together. Globals are not bases: over eight builds each of the thirteen global pointers dereferenced at two or more offsets reaches a phi or an INDIRECT, and a global record is not one base in the IR at all."
use_when = "On (`locals`) by default: any stripped function that reads the same object at fixed offsets -- a linked-list or record walker, a parser state block, a callback context, a record it has just allocated and fills in, anything whose listing would be a wall of `*(int *)(p + 0x18)` -- gets a `struct_N *` parameter or local whose accesses render as `p->field_0x18`. It acts only on a parameter or a call's returned value the engine already believes is a pointer, never on a stack slot, a global, or anything a declared, DWARF or libc type already names. `locals` was made the default on measured evidence against `param` on the same build: 0 of 675 datatest assertions and no stage assertion of another feature move, `make test-cli` is unchanged, the 444-slice typesweep is 1,472 perfect in both arms with every function's scored variable count unchanged, and of its 65,377 scored decisions 95 change type, each a -O0 stack slot a returned record is stored to (`slotptr` types it from the stored value) going from `undefined8`, `long *` or `int8 *` to `struct_N *` where DWARF names a struct pointer (`hash_entry *`, `predicate *`, `group *`, `passwd *`, ...), none replacing a correct pointer, and the rest the same type up to `struct_N` numbering (at -O2 a returned pointer lives in a register, which `variables[]` never exports); over 29 binaries and 12,939 functions 872 change, 769 only in `struct_N` numbering, 83 the same statements respelled through the returned record with clean declarations and casts (checked by a declaration- and cast-aware classifier), and 20 read by hand (15 where the record gets a register variable of its own instead of sharing one with an unrelated value of the same primitive type, 4 `find` predicate records whose name field holds a string literal, 1 local typed `void *` from the record's field), with no control-flow, call or arity change, and 24 of the 27 return types that move are struct pointers in DWARF (the other three return a record behind a `void *` handle or through an inlined constructor); over 14 builds the call-defined locals declared a record pointer go from 40 to 116, 103 of them struct pointers in DWARF and none anything else, with the new records' claimed fields 0.852 exact and parameter layouts unchanged; serial whole-binary `decompile-all` time on fmt/ls/sort/bash O2 stays inside the +5% budget (interleaved min-of-15, `docs/features/structlocals/record.json`), and a `--jobs` run renames the returned records in place with output identical to the serial `protoorder off` run. Set `param` to measure parameters only, the first default: 0 of 675 datatest assertions move; over a 14-binary, 5,610-function `decompile-all` sweep (x86-64 coreutils/findutils/grep/gzip/bzip2/diffutils/tar at O0/O2 plus two ARM32 firmwares) 483 functions change: 350 are verified mechanically as the same statements with each parameter access respelled from its byte offset to a field, and the other 133 were read by hand as the same memory accesses spelled through the new pointee (an index rescaled to the structure's size, a filler array decaying to its address, constant byte stores merged into one store of the field, a load folded into its use, one more duplicated return block); no function in either arm has a `goto` whose label is missing, and every exported `offsetof(struct_N, field_0xK)` equals K. The known cost is decbench `type_match`, which compares pointee spellings by name and so cannot credit an anonymous `struct_0 *` against a ground-truth `WORD *`: over 444 slices the flip is worth -1 perfect function (959 -> 958, aggregate -0.05%). Its measured false positives are buffers of primitive elements that the array rule does not recognise -- a GMP limb array read at offsets 0 and 8 (coreutils `factor` `powm2`/`millerrabin2`), and character buffers whose writes are not all one width (`ls` `strmode`, `shred` `passname`). Functions that read overlapping parts of one record share one `struct_N`: the smallest minted structure that contains every field a function measured, under growth bounds and evidence rules. Against DWARF that is a trade rather than a free win: pooled claimed-field precision over 169 held-out builds is 0.8908 against 0.8902 for naming every reader's subset separately (0.8852 against 0.8855 on the last 34, chosen before any result under the padding rule was seen), recall is higher on every set, 6 of 177 builds lose precision (`kmod` and `grep` O2 under a point each), and 4 of the 258 parameters answered by a larger structure are given one measured from a different record (all `e2fsck` readers without a typed pointer, filled in between their own fields; two take `ext2_inode_large` for `ext2_inode`, the same record for its first 128 bytes). Set `off` for anything that depends on the exact spelling of a parameter type (a type-name matcher, a diff against another decompiler) or to restore the raw offset arithmetic. `struct_N` names are program-wide only where one process decompiles the whole program (`decompile-all`, a serial `decompile-project`); a sharded `decompile-project --jobs N` runs its workers with `structsynth off` because per-process numbering cannot give one header one layout per name. The layouts themselves are printed above each function by `structdefs` and live in the `decompile-project` header. Set `nest` to go one step further: a pointer field whose loaded values are already pointers and are themselves read at two or more constant offsets including 0 is declared `struct_M *`, so `v1 = a0->field_0x0; ... *(int *)((long)v1 + 0xc)` reads `v1->field_0xc`, and a tree or list node whose link reads the same fields as the node itself points at its own `struct_N`. Measured against `param` on the same build: no datatest assertion (675/675) and no stage assertion of another feature moves; over 15 binaries and 7,819 functions (x86-64 coreutils/findutils/grep/gzip/bzip2/diffutils/tar and three ARM32 firmwares) 93 functions change, 86 of them only in `struct_N` numbering and 7 in reads respelled through the nested record, with no control flow moved; the 444-slice typesweep is 1,349 perfect in both arms with no function better or worse; against DWARF it adds 2 nested fields on 10 builds, both real struct pointers, and every exported `offsetof` stays exact. `nest` is not the default because a sharded run pays for it: a structure with a nested or self field has no portable recipe, so `--jobs` decompiles every function with a synthesized structure in its one ordered worker, and `decompile-all --jobs 8` on tar O2 takes 26.0 s against 15.9 s under `param` (the output is identical to the serial run either way)."
example = "option structsynth param"
source_decompiler = "angr"
inspiration = "angr `simple_solver.py` `_determine`'s struct branch (bucket every `*(p + k)` access by `k` with `map_offsets_to_bases`, emit `struct_N { field_0; field_8; }` and declare `p` as `struct_N *`), with TRex USENIX Security 2025 section 3.3.3's dynamic-offset-is-an-array rule, SecondWrite PLDI 2013 section 5.1's running-max structure size, and Howard NDSS 2011 section 4.5's memset defense; `nest` takes angr's and TRex's step of typing a loaded pointer by its own dereferences, including a recursive record where the loaded value is the same record; `locals` measures a returned pointer the way angr's solver measures every type variable, not only a parameter's"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "a parameter is declared `unsigned long *` or `void *` and read at two or more fixed offsets|a local assigned from `xmalloc` or another call is written as `*(char *)((long)v1 + 0x14) = 0x6e`|the body is a wall of `*(int *)(p + 0x18)` casts over one pointer|`*(unsigned int *)&a0[1]` appears where a record field is meant|two functions read the same object and neither names its fields|a local loaded from a `struct_N` field is read as `*(int *)((long)v1 + 0xc)`|a synthesized struct's link fields are `long *` or `unsigned long` where the nodes they point at are the same record"
