[[settable]]
option = "indexaliasguard"
values = "off|load|global|full"
default = "global"
destructive = false
phase = "P3"
subphase = "heritage-guard"
strength = "HARD"
rewind = "P3"
issue = "re-quadratic-transform-loses-four"
summary = "Restore the index-alias arm of upstream Heritage::guard (heritage.cc:1194), which kuna shipped stubbed out behind a hard-coded `highPtrPossible == false`. Where a pointer can reach the range being heritaged, upstream adds two kinds of guard op, and this option selects how much of them runs. `load` runs Heritage::guardLoads (heritage.cc:1570): an addrforce CPUI_COPY read of the range in front of every indexed-stack LOAD whose discovered guard range covers it, so a slot that is only ever READ through a computed pointer still has a reader at the point the pointer is dereferenced. The COPY is artificial -- Heritage::handleNewLoadCopies propagates it away once heritage has finished, keeping only the addrforce marks it earned. `global` (the default) adds the global half of Heritage::guardStores (heritage.cc:1538): an indirect_store CPUI_INDIRECT on a global range in front of every STORE into the global's own space, skipping a read-only range and a STORE through the stack pointer, and stopping once a function has 1024 of them (a range past that point keeps the `load` output), and RulePropagateCopy does not move a stored value into one of these INDIRECTs, so the global's store stays where the binary makes it. Without it a pointer STORE has no effect on a global, so a load of the global after `gi = a; *p = k;` prints `a`, and a value read from the global before such a STORE and used after it prints as a read of the global after it. `global` also adds the LOAD guard for a global, which upstream never builds: an addrforce CPUI_COPY read of a persistent, writable range written at least twice in front of every LOAD from its space that may read it (not a constant address outside the range, not the stack pointer or an x86 segment base plus a constant), so a store to a global that a pointer load may read is kept when the global is stored again after the load; RulePropagateCopy and RuleMultiCollapse leave such a kept store's joins alone so it prints once, and ActionMarkImplied keeps a LOAD explicit when its value is live across a store to a global in its space, so the load prints ahead of the store as the binary makes it. `full` adds the INDIRECT in front of every STORE that can reach any range, the stack included, which is what upstream always does; on a frame slot its INDIRECT chain survives into the output as write-backs of values the slot already held. `off` is the pre-port state: neither arm runs, so a frame slot written by a direct `MOV [ESP+k],REG` and read only through a `LEA`-derived pointer has no reader at all and ActionDeadCode deletes the store. kuna::highPtrPossible is the upstream inline (architecture.hh:408) minus the cspec <nohighptr> range list, which only the PIC families set."
use_when = "`global` by default (DIV-147 restored `load`; `global` moves 0/675 datatest assertions). The `load` symptom is a global read back after a store through a pointer that may point at it, printed as the value stored before that store (`gi = a0; *a1 = a2; return a0 >> 4;` where the binary reloads `gi` after `*a1 = a2`), or a global read before such a store printed after it (`*a0 = a1; return gi;` where the binary returns what it read first). The `off` symptom is an array that is used before it is set: a stack buffer initialised by a run of direct frame stores, then walked by a pointer loop, prints with its declaration and all of its reads but none of its initialisation -- the analyst sees `unsigned int v11 [4];` followed by `*v6 = *v6 ^ ...` and concludes the buffer starts as garbage, when the binary loaded four constants into it. The `load` symptom is also a store to a global that vanishes when the global is stored again after a load through a pointer: `gi = gi + 1; s += *p; gi = gi - 1;` in a loop prints with no store to gi, and `gi = a; x = *p; gi = b; return x;` prints `gi = a2; return *a1;`. Flip `load` to reproduce kuna's output before the global guards, `off` to reproduce kuna's pre-indexaliasguard output or to bisect whether a new addrforce mark on a frame slot came from the load arm; `off` also leaves two frame copies as loops, a short frame byte-copy loop and an x86-32 by-value `rep movs` with a known count (chapter 03). Flip `full` to reproduce upstream Ghidra exactly, or when a value written through a pointer looks like it is not reaching the frame slot it aliases; expect noisier output (measured +5 lines on the 1.9% of functions the arm touches at all)."
example = "option indexaliasguard full"
source_decompiler = "ghidra-upstream"
inspiration = "RE-friction round 12, need quadratic-transform-loses-four (sddecoder decoder.exe sub_401330, PE i386: four MOV [ESP+k] stores of a 128-bit constant accumulator dropped); GitHub issue #792 (a load of a global after a pointer store printed the value stored before it); upstream Heritage::guardStores (heritage.cc:1538), Heritage::guardLoads (heritage.cc:1570), Architecture::highPtrPossible (architecture.hh:408)"
change_kind = "correctness-fix"
tier = "core"
symptoms = "stack array declared and read but never initialised in the emitted C|a run of direct frame stores vanishes when the same slots are later read through a pointer|constants loaded from .rdata into a local buffer do not appear in the decompilation|accumulator or key schedule buffer looks uninitialised before an XOR loop walks it|value stored through a pointer does not appear to reach the frame slot it aliases|a global read back after a store through a pointer prints the value stored before that store|a global read before a store through a pointer is printed after it|a store to a global before a pointer load is missing when the global is stored again later|a loop that bumps a global around a pointer load prints with no store to the global"
