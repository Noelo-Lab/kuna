# ---------------------------------------------------------------------------
# indirectonly: the upstream markIndirectOnly body kuna shipped as an inert stub.
# ---------------------------------------------------------------------------
[[settable]]
option = "indirectonly"
values = "on|off"
default = "off"
destructive = false
phase = "P6"
subphase = "merge-aggressiveness"
strength = "HARD"
rewind = "P6"
issue = "kuna-indirectonly"
summary = "Set the `indirectonly` Varnode flag on a function input whose value is never really read, so the two merge-phalanx tests that carry an exception for that case can take it. An ILLEGAL INPUT is an input Varnode that ActionDirectWrite never reached -- nothing a formal parameter feeds can be responsible for its value -- which on a normal frame means the leftover contents of a stack slot the function overwrites before it reads. Merge::mergeTestAdjacent refuses every speculative merge involving such a variable, so an uninitialized value is not printed as a real one, and HighVariable::hasName refuses to name an unaffected input whose members are all of that kind. Both refusals end 'unless the illegal input is only used indirectly', and that exception needs a flag that nothing in kuna set: Funcdata::markIndirectOnly and Funcdata::checkIndirectUse (funcdata_varnode.cc:801-858) were unported and ActionMarkIndirectOnly was a documented no-op, so is_indirect_only() answered false everywhere and both tests rejected strictly more than upstream. checkIndirectUse is a worklist over the def-set: a reader that is a plain CPUI_INDIRECT is the accepting case and the walk stops there (an INDIRECT records that some other op MAY have overwritten the storage, it is not a use of the value); an INDIRECT caused by a STORE is accepted but the walk continues through its output, since the value survives the store; a CPUI_MULTIEQUAL is transparent and the walk continues through its output; ANY OTHER READER fails the whole test, so one arithmetic use, one compare or one call argument anywhere in the def-set leaves the input isolated exactly as before. ON runs that scan in the scheduled slot, one action ahead of ActionMergeAdjacent and well ahead of ActionNameVars, which is stock Ghidra behaviour; OFF, the default, restores the inert stub byte-for-byte."
use_when = "OFF by default, although the body is upstream verbatim, because the merge it unlocks can fabricate a store. When the illegal input is the SOURCE of the copy -- the machine loads an escaped frame slot into a register and then mutates the register -- the merge makes the emitted C mutate the slot, and a later call that was handed the enclosing object reads a value the machine never wrote there. The heritage pass cannot catch it: an INDIRECT is only attached where the storage is still live in the SSA, so a slot whose last read is before the loop gets no INDIRECT at any call after it and the cover-intersection test has nothing to intersect. Stock Ghidra 12.1.2 emits the same fabricated store on the same input (docs/features/indirectonly/counterexample.md), so this is an upstream defect the port inherits rather than a porting error; kuna declines to inherit it by default. Turn it ON to reproduce Ghidra variable partitioning exactly, or for the merges that are sound: where the illegal input is the DESTINATION -- the machine really does store to the slot -- the value is computed into the slot instead of into a temporary that is assigned across, and the assignment, now a COPY inside one variable, is hidden by markInternalCopies; on coreutils `ls` -O2 `main` the two 8-byte loads that fill a 16-byte `struct dev_ino` on the frame stop being printed into two register locals that the following `hash_delete(..., &di)` never sees. The blast radius is small and was measured over 34 whole-binary `decompile-all` slices (ls, sort, grep, gzip, diff, bzip2, find, tar at -O0 and -O2, plus kmod, e2fsck, dpkg, dpkg-query, dash and bash at -O0, -O2 and -O2-noinline): 27 functions change and the corpus loses 19 declarations net, but 24 of the 27 write a frame slot inside an object whose address reaches a later call, so nothing in the emitted C certifies a safe subset -- of the six settled against the disassembly, four restore a store the machine really makes (`ls` -O2 `main`, `tar` -O0 `sub_429c6`, `dpkg` -O0 `sub_2019c`, `e2fsck` -O0 `sub_1680a`, three of them -O0 frames where the variable really does live in memory) while two fabricate one (`bzip2` -O2 `sub_3890`, `kmod` -O2-noinline `sub_97b0`, both -O2 where the value lives in a register for its whole lifetime)."
example = "option indirectonly on"
source_decompiler = "ghidra"
inspiration = "Funcdata::markIndirectOnly / Funcdata::checkIndirectUse (funcdata_varnode.cc:801-858); HighVariable::hasName (variable.cc:731-760); Merge::mergeTestAdjacent (merge.cc:192-196)"
change_kind = "presentation-default"
tier = "transform"
symptoms = "a value stored into a stack slot is printed into a register local and the slot is never assigned|a struct filled on the frame is passed by address to a call although the emitted C never wrote it|a declared local is never written and never read anywhere in the function|a `vN = slot;` ... `slot = vN;` round-trip copy pair around a loop that only reads the slot|a call result assigned to a temporary that is immediately assigned to a stack slot"
