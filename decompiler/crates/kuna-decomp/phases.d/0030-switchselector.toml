[[settable]]
option = "switchselector"
values = "on|off"
default = "off"
destructive = false
phase = "P2"
subphase = "switch-model"
strength = "HARD"
rewind = "P2"
issue = "kuna-loweredswitch-parameter-selector"
summary = "Record a lowered-switch cascade only when the switch value is computed inside the function; a cascade that dispatches on a parameter is left exactly as the compiler lowered it. `loweredswitch` re-rolls a compiler-lowered comparison cascade into a `switch`, and both renderings read the same value, so which one is better is a judgement call, not a correctness question. On a callback shape - a Win32 window or dialog procedure dispatching on its message parameter - the chain is often the more faithful rendering: it names the parameter at every arm and keeps the compiler's own ordering, where the re-rolled `switch` presents the dispatch as if the function had derived the selector itself. With this on, only a cascade whose switch variable has a defining op here - a call return, a load, a computed value - is re-rolled. Detection runs on the fully simplified, SSA'd graph, so `computed here` is exactly `the Varnode is written`. `loweredswitch off` remains the whole-pass escape hatch."
use_when = "You want the compiler's own if/else-if chain back for a cascade that dispatches on a parameter, without turning `loweredswitch` off for the whole binary - typically a callback, window procedure or dialog procedure whose message parameter is the switch value. A declined cascade renders exactly as `option loweredswitch off` renders it, and every cascade over a value the function computes (a getopt return, a table load) still re-rolls. MEASURED: byte-identical on the 675-assertion datatest corpus with the guard forced on."
example = "option switchselector on"
source_decompiler = "kuna"
inspiration = "crackmes.one 5ab77f5433c5d40ad448c14f SCORPiON.exe sub_401350 (Win32 DialogProc): the message-parameter dispatch reads as the compiler's chain"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "a re-rolled switch dispatches on a function parameter and the compiler's if/else-if chain would read better|a callback or window/dialog procedure's message dispatch reads better as the chain the compiler emitted|option loweredswitch off gives the rendering you want, but you want it for one cascade and not for the whole binary"
live_field = "switch_selector_guard"
live_true = "on"
live_false = "off"
