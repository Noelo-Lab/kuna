[[settable]]
option = "castnarrow"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "cast-policy"
strength = "HARD"
rewind = "P9"
issue = "kuna-castnarrow"
summary = "Leave out a narrowing cast that C's own conversion performs where the value lands. `castimplied` leaves out widenings and keeps every truncation and sign change, so kuna prints `v1 = (unsigned int)a0;` into an `unsigned int v1` from a `long a0`, `*a1 = (char)a0;` through a `char *a1`, `toupper((int)a0)`, and `return (int)x;` from a function declared `int`. C converts the right operand of `=` to the type of the left (C11 6.5.16.1p2), an argument to its parameter's type under a prototype (6.5.2.2p7) and a returned value to the return type (6.8.6.4p3), and an integer conversion depends only on the value converted and the type converted to (6.3.1.3), so `T v = (T)e;` stores what `T v = e;` stores for any integer `e`. When on, `kuna_castnarrow` decides at print time, with the IR unchanged, for a low `SUBPIECE` printed as a cast, a `CPUI_CAST` between integer types, and the `(T)name` the printer writes for the low piece of a wider variable: the cast goes when its value lands whole in a plain `lhs = (T)e;` statement whose local or parameter is declared with exactly `T`'s spelling (not an arm of `c ? a : b`, not a stack-view compound literal), a store through a pointer printed with pointee `T` (a declared `T *`, a cast, a field or an element; not a bitfield or stack-view store), a direct call argument whose type-locked parameter is spelled `T` (never a trial prototype, a varargs position, a per-call-site override or an argument `truncarg` narrowed), or `return` from a function declared `T`; and `T` is a plain integer while the operand prints as an integer: a declared variable (an unknown type the printer spells as an integer counts), a cast, a load through a typed pointer, integer arithmetic over those, or a shift of one; a piece of a variable needs that variable declared with exactly its own type. A constant, a call, `bool`, an enum, a float or a pointer on either side keeps the cast, and so does a narrowing read by arithmetic, by a comparison, under another conversion, or into a destination of another spelling (`*a1 = (int)a0;` through an `unsigned int *a1` stays). Only where `int` is 4 bytes, and C output only: Rust has no implicit integer conversions. Over 10 stripped decbench binaries (O0 ls, bzip2, dash, gzip, xmlwf; O2 sort, grep, diff, find, kmod) under `--mode aggressive`, 218 casts go (19,784 -> 19,566, 169.3 -> 167.4 per 1,000 lines) in 115 of 3,809 functions and no function gains one; every changed line is the old line with integer casts removed, each into an assignment, a store or a call argument of exactly its type; 0/675 datatest assertions move."
use_when = "On by default: a narrowing C performs at an assignment, a store, a prototyped argument or a return prints no cast -- `v1 = a0;` into an `unsigned int v1`, `*a1 = a0;` through a `char *`, `toupper(a0)`, `return x;` from an `int` function. Set it off to see every truncation and sign change ActionSetCasts and the partial-variable printer write, as upstream prints them."
example = "option castnarrow on"
source_decompiler = "ida"
inspiration = "The 2026-10 cast review: a truncation assigned to a variable already declared its type, `v1 = (unsigned int)a0;` into an `unsigned int v1`, kept a cast that IDA leaves to C's assignment conversion (IDA 9.2 prints `v2 = a1;` for the same gcc -O2 function), while `castimplied` already dropped the matching widening `v2 = (long)v1;`"
change_kind = "presentation-default"
tier = "transform"
symptoms = "a truncation assigned to a variable already declared that type, v1 = (unsigned int)a0; with unsigned int v1|return (int)x; from a function declared int|a long passed to a declared int parameter as toupper((int)a0)|a byte store through a char pointer written *a1 = (char)a0;|kuna prints a narrowing cast IDA leaves to C's assignment conversion"
live_field = "cast_narrow"
live_true = "on"
live_false = "off"
