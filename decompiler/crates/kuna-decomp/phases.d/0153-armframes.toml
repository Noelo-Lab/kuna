[[settable]]
option = "armframes"
values = "inventory|on|off"
default = "inventory"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-arm-frame-recovery"
summary = "Recover validated LR-saving A32 frame entries in undefined executable code for the function inventory by default. Frame recovery requires listing and funcstart_patterns and retains the prior inventory unless the expanded partition refutes an entry; it also withdraws a frame root the expanded Listing enters by straight-line flow, so shrink-wrapped prologues stay inside their functions. Inventory and on also follow guarded A32 jump tables with no other prerequisite, in the reference walk and in the Listing walk when it runs, recognising the dispatch's predicated skip without changing its flow, so switch cases stay inside their functions and are referenced from their dispatch; off restores the walks without them. On additionally validates Thumb frames and expands independent ARM reference queries; off retains the existing Thumb-only inventory scan and reference discovery. Frame-prefix reconciliation applies aifpoolslide literal evidence from the original Listing and validated frames, preserving the incoming value flow after a loaded pool word. Full recovery remains explicit because disconnected Thumb code can change gap discovery and independent query expansion can substantially increase work."
use_when = "Use inventory (default) to recover stripped A32 routines reachable only from disconnected frames or new fingerprint evidence. Use --option funcstart_patterns on --option armframes on for full ARM/Thumb and reference-query recovery. Full reference recovery historically expanded a 400 KB ARM BusyBox query from about 2,000 to 74,000 instructions and roughly doubled its time; use off to restore the prior inventory."
example = "--option armframes inventory"
source_decompiler = "kuna"
inspiration = "Authored stripped ARM and Thumb ELF callers omitted by recursive descent or attributed to interior frames"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a stripped a32 firmware omits disconnected functions|stripped arm xref queries omit calls from disconnected stack frames|an arm caller is assigned to an interior prologue|arm interworking frame discovery leaves stale call references"
