[[settable]]
option = "acleintrinsics"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "naming-policy"
strength = "HARD"
rewind = "P2"
issue = "kuna-acleintrinsics"
summary = "On AArch64, lift the memory-tagging (MTE) instructions with their tag effect and print the barrier, hint and memory-tagging user ops as the ACLE intrinsics of <arm_acle.h>. The vendored AARCH64.pspec leaves the ShowMemTag context at 0, under which irg, addg, subg, gmi and ldg lift as a plain pointer copy or add and the stg family as nothing or a plain store, so __arm_mte_create_random_tag(p, 0) decompiled to return p. On sets ShowMemTag to 1 over the code space before a function is lifted; only the memory-tagging constructors read that context, so code without those instructions lifts exactly as before. Each tag instruction is then one user op whose result is the tagged pointer: irg prints __arm_mte_create_random_tag(p, mask), addg and subg __arm_mte_increment_tag(p + n, k), gmi __arm_mte_exclude_tag(p, mask), ldg x, [x] __arm_mte_get_tag(p), and stg x, [x] (and each granule st2g, stzg, stz2g and stgp tag) __arm_mte_set_tag(p). A tag load or store whose pointer and granule address differ has no ACLE spelling and keeps its user-op name, LoadPtrTag(p, addr) or StorePtrTag(addr, p). The alignment fault stg raises on a misaligned address is not modelled as a branch. Independently of MTE, DataMemoryBarrier(domain, types) prints __dmb(CRm) with the two operands recombined into the 4-bit CRm the intrinsic takes, DataSynchronizationBarrier likewise __dsb(CRm) (the nXS forms keep their name), InstructionSynchronizationBarrier() prints __isb(CRm) with CRm read from the instruction, and WaitForInterrupt, WaitForEvent, Yield, SendEvent and SendEventLocally print __wfi(), __wfe(), __yield(), __sev() and __sevl(). The rewrite is keyed on the user-op name and changes only the spelling of the call."
use_when = "On by default on AArch64 and inert on every other target: the output names the intrinsic the source called, and a pointer that was tagged is the result of a call instead of an unchanged copy. Flip off to read barriers and hints under their SLEIGH instruction names with the domain and type operands separate, or to read MTE-hardened code (for example a stack-tagging build, which tags every address-taken local) as if the core had no tags."
example = "option acleintrinsics off"
source_decompiler = "kuna"
inspiration = "clang -march=armv8.5-a+memtag: void *tag(void *p) { return __arm_mte_create_random_tag(p, 0); } is irg x0, x0; ret and decompiled to return a0; __dmb(11) printed DataMemoryBarrier(2,3)"
change_kind = "correctness-fix"
tier = "core"
symptoms = "an AArch64 function that tags a pointer (irg, addg) decompiles to return a0|stg, st2g or stzg leave no trace in the output of MTE-hardened AArch64 code|DataMemoryBarrier(2,3) or DataSynchronizationBarrier(3,3,0) where the source called __dmb or __dsb|WaitForInterrupt() or Yield() where the source called __wfi or __yield"
live_field = "acle_intrinsics"
live_true = "on"
live_false = "off"
