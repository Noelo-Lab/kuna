[[settable]]
option = "fast_funcdisc"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-fast-function-discovery"
summary = "Discover real function bodies for latency-sensitive whole-project exports without the exhaustive prologue and AIF gap scans. Starting from loader-backed entries, build one recursive Listing walk that promotes every direct CALL target. Then recover indirect-only callbacks from absolute code pointers in non-executable initialized data. On non-ARM objects, admit a target only when its first two decoded mnemonics match a fingerprint shared by at least four already-reached functions and a bounded control-flow probe validates a >2-instruction subroutine with a terminating path or informative call/edge into known code; ignore tables above 256 slots, require two distinct eligible tables when the image has more than 512 unique candidates, and validate at most 4096 candidates. ARM instead reuses the established Thumb-pointer prologue oracle. Pointer-derived roots are emitted without recursively walking their disconnected callees. Default-off as an output-changing analysis; the fast preset enables it while keeping listing, full prologue patterns, and exhaustive AIF off."
use_when = "Enabled by fast mode for unfiltered or name-selected decompile-all/decompile-project/functions so a stripped binary does not collapse to imports plus its entry point. Flip off to restore the old metadata-only fast inventory, or when even the rooted whole-image recursive decode is too costly. Explicit --addr selections skip the preset's discovery work unless this option is explicitly turned on."
example = "--mode fast --option fast_funcdisc on"
source_decompiler = "kuna"
inspiration = "Ghidra recursive disassembly/CreateFunctionCmd + AddressTableAnalyzer; AIF fingerprint histogram and PseudoDisassembler.checkValidSubroutine"
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "fast decompile-project emits only import veneers and the binary entry|internal direct callees have no project bodies|function reachable through a callback or vtable pointer is absent while explicit --addr decompiles it"
