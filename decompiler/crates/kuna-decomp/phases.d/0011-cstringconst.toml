[[settable]]
option = "cstringconst"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "string-literal-section-constant"
strength = "HARD"
rewind = "P9"
issue = "kuna-cstringconst"
summary = "Print a pointer-wide constant that lies inside a string-literal section as the string literal at that address, whatever type it reaches the printer with. `PrintC::pushConstant` renders a constant as a quoted string only when its type is a pointer to a character type, and `ActionConstantPtr` gives it that type only when a global symbol covers the address; the string pass plants `char[N]` at literals of four characters or more, so a short literal in the middle of a `__cstring` section -- `\" (\"`, `\".SH\"`, `\")\"` -- has none, and a constant that reaches the printer as an argument of a call through an untyped function pointer, or as a `void *` chosen between a literal and what an untyped callee returns, prints as the integer `0x28abe` or the address `&dat_28a62`. The linker says what those bytes are: a Mach-O `__cstring` section (type `S_CSTRING_LITERALS`) holds nothing but NUL-terminated string literals. When on, a pointer-typed constant whose pointee is not a character type, and an integer-typed constant that is an argument of a call, read through the same literal path a `char *` constant takes when they fall inside such a section; the bytes are read and escaped as always, and declined when they are not a string. Only a call argument takes the integer arm, and only one that lands on the first byte of a literal and that the callee's prototype does not lock to a scalar type: a value compared, added or stored may be a plain integer that equals an address, and in a dylib at base 0 a `size_t` such as the `0x4000` of `setvbuf(fp, NULL, 0, 0x4000)` can fall inside `__cstring`. An ELF `SHF_STRINGS|SHF_MERGE` section is not taken: rustc gives a whole `.rodata` those flags with records inside it, and a `core::panic::Location` would print as the three bytes before its first NUL. Inert on every image without a `__cstring` section, so 0/675 datatest assertions and 0/4916 stage assertions move; on cmark-gfm (a 300 KB arm64 dylib with 2,027 literals) 82 constants in 14 of 412 functions become their literals, and the whole-image decompile is within noise (122.0 s on and 122.1 s off)."
use_when = "On by default. Flip off to see the integer or address a constant into a string-literal section prints as upstream, or when a consumer greps for raw addresses."
example = "option cstringconst off"
source_decompiler = "kuna"
inspiration = "The Mach-O S_CSTRING_LITERALS section type: the linker already states that every byte of __cstring belongs to a NUL-terminated string literal, so a constant that lands in it is that literal whatever the expression's type."
change_kind = "presentation-default"
tier = "core"
symptoms = "a short string literal argument prints as a hex integer like 0x28abe|a void * chosen between two string literals prints as &dat_<addr>|an argument of a call through an untyped function pointer is an address into __cstring|a call argument prints as the integer value of a string's address in a dylib"
live_field = "cstring_const"
live_true = "on"
live_false = "off"
