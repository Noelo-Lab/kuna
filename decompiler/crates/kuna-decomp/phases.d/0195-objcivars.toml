[[settable]]
option = "objcivars"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-objc"
summary = "Give every Objective-C class of the image an instance struct built from its ivar list and type each of its methods' `self` with it. `class_ro_t.ivars` names each ivar with its type encoding, its size and a pointer to its OFFSET VARIABLE in `__objc_ivar` — the word a compiled method loads and adds to `self` (`ldrsw x8,[x8,#off]; ldr d0,[x19,x8]`), because under the non-fragile ABI the runtime may slide that offset when a superclass from another image grows. Statically the word holds the compile-time layout, so this builds `struct <Class>` with each ivar at that offset (a local superclass embedded as `super` at 0, an imported one left as an anonymous prefix; field types from the encoding, `@\"NSString\"` an opaque `NSString *`), types `self` as `<Class> *` in the class's instance methods and its categories' instance methods, and reports the offset variables constant (the `dynrelocs` RELRO fold path), so `*(double *)((long)self + Foo::ratio)` renders `self->ratio` and `objc_storeStrong((long)self + Foo::_name, x)` renders `objc_storeStrong(&self->_name, x)`. A class of another image, or one with no field of its own, still types `self` as a pointer to its declared (opaque) record. An ivar, a property getter/setter (its attribute string names the class: `T@\"Base\"`) and a stub whose declaration names a class of this image are typed with that class's struct too, so `self->inner->count` and `Base * -[Holder inner]` render. Off: no class struct is interned, `self` stays `objc_object *`, the offset variable keeps its `<Class>::<ivar>` name and the load through it stays a load. A class whose name already denotes a complete struct (DWARF) is that struct. Inert unless `objc` is on; a structural no-op on every non-Mach-O image. Load-time, env-bridged (KUNA_OBJCIVARS) as well as commit-time: set it before the `load file` it should apply to."
use_when = "On by default: the layout is the one the compiler emitted and IDA renders the same `self->_ivar`. Flip off when a superclass from another image may have grown since the binary was built (then the runtime slides the offsets and the static layout is stale) or to read the offset-variable loads themselves. Inert unless `objc` is on; `objc` is on for a Mach-O image under 500 KiB, where `auto` selects the `aggressive` preset."
example = "option objcivars off"
source_decompiler = "kuna"
inspiration = "Ghidra ObjectiveC2_ClassAnalyzer (Objc2InstanceVariable, the per-class struct it creates); IDA's ObjC ivar struct synthesis"
change_kind = "analysis-enablement"
tier = "transform"
symptoms = "an objective-c method reads *(long *)((long)self + dat_<addr>) instead of self->_ivar|self is objc_object * in every -[Class sel] although the class declares ivars|objc_storeStrong((long)self + <Class>::_ivar, x) instead of &self->_ivar"
