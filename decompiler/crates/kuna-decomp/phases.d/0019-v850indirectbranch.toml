[[settable]]
option = "v850indirectbranch"
values = "on|off"
default = "on"
destructive = false
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "GH-8817"
summary = "On V850, reclassify a `jmp [reg]` CALLIND to BRANCHIND so switch-table recovery runs."
use_when = "On by default: a V850 compiler switch dispatch through `jmp [reg]` recovers as a jump-table switch instead of a computed call. Gated on the V850 language id, so a register-indirect call on any other processor is left alone. Flip off to keep the SLEIGH lifting as a call."
example = "option v850indirectbranch on"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra GH-8817 (V850 jmp[reg] flow classification)"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "v850 jmp [reg] rendered as an indirect call instead of a recovered switch|jump table on v850 never recovered because the dispatch decodes as a computed call"
live_field = "v850_indirect_branch"
live_true = "on"
live_false = "off"
