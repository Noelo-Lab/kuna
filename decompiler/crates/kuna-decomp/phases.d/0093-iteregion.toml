[[settable]]
option = "iteregion"
values = "on|off|auto"
default = "auto"
destructive = false
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "angr-ITE-region-converter"
summary = "After structuring, rewrite a narrow two-arm assignment *diamond* — a 3-component `if` whose condition block is a single `CBRANCH`, whose true- and else-clauses are each a single `COPY` to the SAME variable (`if (c) v = A; else v = B;`), converging on one tail — into a single `?:` ternary statement `v = ( c ) ? A : B;`. A **print-only** mark on the condition `CBRANCH` (no p-code cloned/mutated); the two arm COPYs and the condition stay live so the merged variable's later uses render unchanged, only the `if`'s layout differs. The S9 emit hook is the one genuinely new piece (Ghidra's printc has no ternary operator). Mirrors angr's `ITERegionConverter` / `_find_ite_assignment_regions` (a conditional-jump region with two single-assignment children on one tail). Halves the branch count of format/print/flag code full of `flags ? \"%s,\" : \"%s\"` diamonds (iproute2 print_link_flags: 41 ifs/0 ternaries -> 21 ifs/20 ternaries, GED 140 -> small). The matcher also sees through a multi-component `BlockList` in the condition position, descending to its last component, so a run of N identical diamonds folds N rather than ceil(N/2). The value `auto` (the default) keeps all of `on` and lets the binary decide in functions the per-function detector p3_dataflow/kuna_unoptimized.rs calls unoptimized: an unoptimizing compiler finishes every statement with a store to the variable it assigns and computes an expression in registers, so `x = c ? a : b;` loads a register in each arm and stores once after the join, while `if (c) x = a; else x = b;` stores in each arm. p8_structure/kuna_o0select.rs reads that at the first heritage pass, before simplification merges the two, and records each two-way branch by the address of its CBRANCH: arms that each define a temporary register that the join merges and reads (stored, computed with, tested, or passed to a call) are a conditional value, whatever else they do; otherwise arms that each write memory are a statement. A temporary is a register calls do not preserve, or a preserved one read only by one copy (an argument carried across another call); a `register` variable in a preserved register is not one. A recorded statement never folds (nor under `iteexpr` or `iteboolean`); a recorded conditional value folds with computed arms, with an arm that is a call whose result is the value, with arms that write the same variable through different storage, and as an `if` without an `else` (`v = c ? A : v;`, the form the merge leaves when the variable shares storage with one arm). A value that is only returned is left to `returndup auto`; optimized functions are untouched, and so is an image whose container says clang built it (an ELF `.comment` naming clang, or Mach-O): clang -O0 stores a conditional value in each arm like the statement."
use_when = "Default `auto` (on since DIV-17; `auto` adds the unoptimized-code record). The diamond->ternary form matches the common format/print/flag source where the ternary dominates (compilers turn `cond ? \"%s,\" : \"%s\"` into exactly this diamond; iproute2 print_link_flags, coreutils output helpers), so kuna emits `v = c ? A : B;` matching source/angr. In optimized code the SAME object code is emitted for a ternary and an explicit if/else, so it stays a RUNTIME CHOICE an agent can flip OFF (`option iteregion off`, byte-identical to upstream) per function when explicit `if/else` is the likely source. In unoptimized code the binary records the source form and `auto` prints it: measured against `on` on the decbench corpus it makes 421 more O0 functions structurally exact and 36 fewer (+385; +197 on one half of the projects, +188 on the other), changes 1 of 35,197 O2-noinline bodies (no score change), and on functions with one recorded select where exactly one spelling matches the source it prints that one 94% of the time (460 of 492). Most of what it loses are ternaries with a NULL arm, which the preprocessed source spells as the cast `((void *)0)`. Set `on` to get the shape-only rule back in an unoptimized function. A print-only mark; each rewrite is logged (`iteregion:`)."
example = "option iteregion on"
source_decompiler = "angr"
inspiration = "decbench:O0-iproute2-ip-print_link_flags; angr ITERegionConverter (angr/analyses/decompiler/optimization_passes/ite_region_converter.py); _find_ite_assignment_regions"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "if (c) v = A; else v = B; assignment diamond where a ternary v = c ? A : B is expected|format/flag builder full of two-arm constant assignments to the same variable|flip off when the source likely wrote an explicit if/else|-O0 function prints if (c) v = a; where the source wrote v = c ? a : b;|-O0 function folds an if/else whose arms each store into a ?: the source does not have"
