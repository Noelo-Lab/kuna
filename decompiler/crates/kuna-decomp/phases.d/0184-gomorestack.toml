[[settable]]
option = "gomorestack"
values = "off|auto|always"
default = "auto"
destructive = true
phase = "P2"
subphase = "flow-classification"
strength = "HARD"
rewind = "P2"
issue = "kuna-multilang-gomorestack"
summary = "Fold the Go stack-growth prologue. Every non-leaf function the Go compiler emits opens with a guard - compare SP against the goroutine's stackguard, and on failure call runtime.morestack(_noctxt) and LOOP BACK TO THE FUNCTION ENTRY to re-run the prologue on the grown stack. The check is pure runtime machinery (the function's own semantics are the fall-through path), but the back-edge makes the entry a loop head, so every live argument register joins its incoming value with its after-growth value and parameter recovery sees phi-fed arguments on every non-leaf Go function. The fold matches the tight guard/grow two-block cycle sitting on the inserted entry block (the shared entry-guard-loop shape, infra/idiom.rs) with the cold arm calling a runtime.morestack* routine - the name is only accepted IN the shape, so a coincidental name in straight-line flow cuts nothing - and removes the guard edge pre-SSA (the cleanupcode window), so the entry phi never forms and the guard's compare and stackguard load die to ordinary dead-code elimination. At auto (default) the fold acts only when the image's source language is Go (the sourcelang fact), making it a structural no-op on every non-Go binary; always drops the language test for corpora with no detection signal (a stage-test bytechunk); off keeps the guard for auditing."
use_when = "Leave auto: on a Go binary the fold turns every function's entry-loop + runtime.morestack_noctxt() noise into straight-line flow and un-breaks parameter recovery; off only to audit the real prologue instructions (e.g. verifying a hand-patched stackguard). Use always on a Go function carved into a bytechunk or a raw image where detection has no buildinfo section to find."
example = "option gomorestack off"
source_decompiler = "kuna"
inspiration = "The Go compiler's stack-growth prologue (cmd/compile, runtime.morestack_noctxt); the removal primitives are the securitycheck/stackguard pair (removeBranch + removeUnreachableBlocks) moved to the pre-SSA window"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "every function of a Go binary opens with if (condition) { runtime_morestack_noctxt(); } inside a loop to the entry|go function parameters recovered as phi-fed locals or missing because the entry is a loop head|do-while wrapping an entire go function body with a morestack call in its latch"
