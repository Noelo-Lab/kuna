[[settable]]
option = "calleevote"
values = "off|types|fields"
default = "fields"
destructive = false
phase = "P4"
subphase = "prototype-source"
strength = "HARD"
rewind = "P4"
issue = "typecampaign-callee-vote"
summary = "Let the complete caller set of a function decide what its parameters are. `protoorder` carries a callee's recovered types to its callers; nothing flowed the other way, so a callee that only forwards, compares or stores a pointer kept `void *` or `long` while every one of its callers held a named record or a `char *` for the same value. A whole-binary `decompile-all` already decompiles every caller, so `types` records, after each function, the type the caller gave every argument of every direct call and the callee's own recovered parameters. After the pass a parameter the callee typed only as `void *`, `undefined1 *` or a pointer-width integer takes the type every call passes when all of these hold: the callee has no declared prototype and is not variadic; its recorded calls are exactly the direct calls and tail jumps the cross-reference walk finds (a failed or skipped caller states nothing); the image is x86-64, where code takes a function's address in one instruction the cross-reference walk reads (on AArch64, ARM, MIPS, PowerPC, RISC-V and i386 PIC an address is built from two instructions the walk does not join, so no function there qualifies, and neither does one of a relocatable object or of an image without section headers); its address is taken nowhere the image shows it -- not in code, not as a pointer-width word at an aligned offset of any section the image loads (by `SHF_ALLOC` on ELF, whatever the address, code sections included), not as a Mach-O chained-fixup rebase, a dynamic relocation, an exported symbol or the entry point -- since such a function has callers nobody can list; every call passes the argument in the storage the callee recovered it in; and every call passes the SAME committed pointer -- a named record or union that carries its layout (a synthesized `struct_N` the ledger shares, a record a program declares), a `char *` or a `char **`; a name with no layout behind it, the `FILE` shell `libctypes` interns, says no more about the object than `void *` does and is not one, so a `FILE *` is voted only where the shell carries its fields (`--option libctypes glibc`). A self-recursive call is not a vote. The callee is then decompiled again with that type as one more vote in `Varnode::getLocalType`'s fold for its input, and the vote is refused wherever the callee's own uses disagree, with the refusals `protoorder` applies to its own votes: an integer operation on the value (a pointer difference included), a family member that is type-locked, a global or frame memory, a class conflict at another call, or a load or store that does not land on exactly one member of the record (an access into a caller's filler bytes included); a `char *` is also refused where the callee stores a constant wider than a byte through the value, which would print as one character store per byte, and a `char **` where it does so through any pointer it loads through the value or stores through it (a node written into a caller's record); a pointer to a pointer some caller passes as the address of one of its own frame objects (`&cfg` of a frame record whose first member is a `char *`) types that one object, so it is refused where the callee reaches through the value anywhere but that one pointer; and any vote is refused for a value the callee adds to an address as an index (`((char *)0x1018)[a0]`). Redone functions record their calls again and the decision repeats up to three rounds, so a wrapper passes on what its own callers gave it; every round decides against the parameters the function's first decompile recovered, so a statement keeps every vote an earlier round made, and a first statement that only repeats the types a function already has is not made. The second decompile is the option's whole cost and costs what the first decompile of that function cost, so a function's printed length is what redoing it charges: the pass may reprint 5% of the lines the first pass printed, one budget for all three rounds, admitted shortest first, and a function printing at most 32 lines -- the shapes the vote exists for, a forwarder, a getter, a comparator -- is admitted even once that is spent. A function the budget cannot reach is declined for the run: the statement just decided is withdrawn, no later round proposes it, and its parameters keep what its own body found. The redo pass therefore costs a share of the binary's own decompile instead of an unbounded number of long bodies -- unbudgeted it is 10.5% of a `kmod -O2-noinline` run and 30.1% of an `mv -O0` one, over the project's +5% -- while a binary with room, `fmt -O2` at 0.2%, redoes every candidate it has. `fields` adds one more reading of the same closed caller set: a pointer parameter of a function every caller of which is a known direct call, whose pointee no declared prototype it is handed to (`pipe (int *)`) gave it, nor a callers' vote the field fits (a record, or a `char **` read as whole aligned pointers), read at exactly one constant offset other than zero with an access of four bytes or more, and not stepped through a loop from there (an address at a constant offset from it reaching a phi walks an array), is synthesized a one-field record by `structsynth` (which otherwise demands two offsets including 0), and such a function is given one more propagation pass when its main loop would end before the type lattice was ever seen settled, which is the only reason a short getter was never offered to the synthesizer. A one-field record gives way to the record every caller passes. A function whose address the image stores or code takes is never given one: a `qsort` comparator or a hash-table callback reads one field of what it was handed exactly the way a getter does, and its contract declares `void *`. An address stored other than as an aligned pointer-width word -- a function pointer at an unaligned offset of a packed struct in an image with no dynamic relocation for it, or an offset added to another address at run time (a 32-bit offset table, a relative vtable, a self-relative pointer) -- is not seen, so a callback reached only that way and also called directly can still be voted on."
use_when = "On by default (`fields`) on a whole-binary `kuna decompile-all` or `decompile-project` of an x86-64 image, and inert everywhere else: on other architectures a function's address is built from two instructions the call graph does not join, so no caller set is known; `kuna decompile` forks one `decomp_dbg` per function, and a run narrowed by `--addr`, `--functions` or a triage filter, a `--jobs N` run, `decompile-project --stream`, a raw image and `--option protoorder off` have no callee-first pass to hang it on. The tell it fixes is a parameter declared `void *` or `long` in a function whose every caller passes a `struct_N *` or a string, and a one-field getter printed as `*(unsigned long *)((long)a0 + 0x10)`. Measured against `off` on the 444-slice decbench typesweep (10,748 functions, pinned metric) when the option landed, on a main scoring 1,522: 1,522 -> 1,567 perfect, mean .3553 -> .3597, 144 functions up and 3 down (all three gnulib `xmemdup`); O0 1,065 -> 1,090, O2 74 -> 80, O2-noinline 383 -> 397; `ptr_char` +143 and `ptr_ptr` +16 matched variables; under decbench#93 crediting 1,781 -> 2,133 perfect. What the redo pass may cost is a budget rather than a flat refusal: it may reprint 5% of the lines the first pass printed, one allowance for all three rounds spent shortest first, and a function printing at most 32 lines is decompiled again even once that is gone. Measured on the same tree against that budget set to zero, which is the flat 32-line bound it replaces, on a main scoring 1,609: 1,609 -> 1,615 perfect, mean .3688 -> .3697, 69 functions up and none down in that single sweep (per-row movement in one sweep is not stable; the perfect count is). With no bound at all the same tree scores 1,618. No function's exported variable count moves. Over 31 whole binaries (16,843 functions: coreutils, grep, gzip, diffutils, findutils, bzip2, tar, bash, dash, libexpat, mirai, kmod, dpkg-divert, ssh-add, crontab, init, setfacl, libedit, zlib and ARM Thumb crazyflie firmware) 1,894 functions change, none in the ARM image: 1,213 only by a `struct_N` number (a new one-field record takes a ledger slot), 677 a parameter's type and how accesses through it print, and 4 the spelling of the same memory through a record whose first field is an array (`*(unsigned long *)v1->field_0x0` for `*v1`) or a `char *` return's `NULL`. No call, argument count, parameter count or exported variable count moves, and no store is split into characters. Following a new parameter type, 23 functions declare a different number of register locals (which same-typed locals merge changes), and 24 declare as a plain integer a local that held `void *` only because a callee declared one before (dash `sub_eb30`). An array read at one constant index and nothing else reads like a getter and becomes a one-field record; its C is still exact. Speed: the option's whole cost is the second decompile, so what the redo pass reprints is what it charges, and the budget is that in the binary's own units. It reprints 96 of `fmt -O2`'s 3,718 printed lines (2.6%), 362 of `ls -O2`'s 12,833 (2.8%), 419 of `sort -O2`'s 10,708 (3.9%), 185 of `cmp -O0`'s 3,840 (4.8%), 569 of `dpkg-divert -O2`'s 11,965 (4.8%), 708 of `kmod -O2-noinline`'s 13,366 (5.3%, the 32-line floor taking it past the share) and nothing at all on `crontab -O2-noinline`, whose one candidate is 189 lines. Unbudgeted the same pass takes 10.5% of a `kmod -O2-noinline` run and 30.1% of an `mv -O0` one in wall clock, over the project's +5%. Against the flat bound it replaces, whole-run interleaved min-of-15 at both defaults: +1.6% on `kmod -O2-noinline`, `dpkg-divert -O2` and `cmp -O0`, and within noise on `crontab`, `fmt`, `ls`, `sort` and `bash -O2`. Flip to `types` if a one-field record is wrong for a program -- a buffer read at one fixed word offset declared as a record -- and to `off` if a callee takes a caller's type that its own body contradicts in a way the refusals miss; the known losing shape is a `void *` parameter (gnulib `xmemdup`) whose callers all happen to pass strings. Set `KUNA_CALLEEVOTE_TRACE=1` for each decision and its reason on stderr."
example = "option calleevote fields"
source_decompiler = "angr"
inspiration = "angr's variable recovery joins the types of the actual arguments at every call site into the parameters of a callee whose prototype is guessed rather than declared (`Clinic`'s callsite prototype pass and `SimpleSolver`'s argument type variables), which is how angr types a forwarding wrapper's parameter from what its callers pass."
change_kind = "type-inference"
tier = "transform"
symptoms = "a callee's parameter is void * or long while every call to it passes a struct_N * or a string|a one-field getter reads *(unsigned long *)((long)a0 + 0x10) and its caller's own parameter is a synthesized record|the same record is struct_N * in the caller and void * in the function it passes it to|a wrapper that only compares or forwards a pointer keeps an integer parameter"
