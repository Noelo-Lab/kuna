[[settable]]
option = "noreturn_known"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-noreturn"
summary = "Run the known-no-return analysis pass: mark exit/abort/_Unwind_Resume/std::terminate-style functions no-return (the kuna analog of Ghidra's NoReturnFunctionAnalyzer, plus the Rust panic/handle_alloc_error list). The same flag covers the flow-time name matches that reach the externs the address-keyed scan cannot (`kuna_noreturn_externmatch.rs`, `kuna_noreturnextern.rs`: an undefined extern of an ET_REL object whose name is on the list) and the error(nonzero,...) value rule inside the no-return propagation (an error(status,...) wrapper whose status is a nonzero literal is no-return). It also ends a call to a `<prefix>__<entry>` proxy stub (`stub___stack_chk_fail`, an empty `__wrap___assert_fail`: a sized one-instruction return or jump named for a multi-word list entry) when that call is the last instruction of its sized caller, so the caller was compiled for the no-return original. On a Go binary the same vendored Go list is also applied to the pclntab-recovered function list (the gonoreturn pass, formerly its own option), so a stripped Go binary whose symbol tables are gone still gets its runtime.panic*/throw/goexit facts."
use_when = "On (default) suppresses dead fall-through after a no-return call; off leaves the call rendering as if it returns (dead code reappears)."
example = "option noreturn_known off"
source_decompiler = "kuna"
inspiration = "Ghidra NoReturnFunctionAnalyzer (Known) + the analyzer default-on/off model"
change_kind = "analysis-enablement"
tier = "transform"
symptoms = "dead code kept after calls to exit/abort/panic when off|call to a known no-return libc function still shows a fall-through path|unreachable epilogue after std::terminate or a rust panic call"
