[[settable]]
option = "charbyte"
values = "on|off"
default = "on"
destructive = false
phase = "P5"
subphase = "type-propagation"
strength = "HARD"
rewind = "P5"
issue = "kuna-charbyte"
summary = "Keep `char` for a byte loaded through a `char *` when the only unsigned vote on it is the zero-extension x86 uses to load every byte. `movzx` loads a byte whether the program meant it signed or not, so `*p` is a LOAD followed by INT_ZEXT, and `TypeOpIntZext::getInputLocal` votes `getBase(1, TYPE_UINT)` for the byte; in `getLocalType`'s fold `SUB_UINT_PLAIN` (16) outranks `SUB_INT_CHAR` (19), so the byte starts propagation as `uint1`. The `char *` that later reaches the LOAD's address cannot displace it -- `propagateTypeEdge` only moves a Varnode to a MORE specific type -- and the byte then pushes `unsigned char *` back over the pointer, which it does win. A string walk comes out in the wrong vocabulary, as coreutils fmt -O2 get_line shows: `v1 = (unsigned char *)*dat_c100; v7 = strchr(\"([\\'`\\\"\",(int)(char)*v1);`, and every mbrtowc wrapper takes `unsigned char *a1` and passes `(char *)a1`. When on, `kuna_charbyte::note_edge` watches the LOAD edges while `ActionInferTypes` propagates and records each byte whose pointer carries `char *` while the byte holds `uint1` only because of the zero-extension -- seen from whichever end the propagation order reaches first. If anything was recorded, the pass starts over: the local types are rebuilt, `kuna_charbyte::seed_char` seeds those bytes `char` (the fold they would have had without the zero-extension's vote), and propagation runs again by the unchanged rules. No edge is overridden: overriding the pointer edge instead would leave everything the byte had already typed `uint1` behind, and `char v1; ... v1 == 0xe9` is never true in C, whereas re-seeding lets the constant take `char` with the byte (`v1 == '\\xe9'`). \"Only because of the zero-extension\" is checked on the readers: an INT_ZEXT must read the byte and no other reader may vote TYPE_UINT, so a byte that is masked, compared unsigned, shifted right, divided unsigned or passed as an `unsigned char` argument keeps `uint1`. The widened value is never claimed -- the INT_ZEXT output keeps its type and the printer shows the zero-extension of a `char` as the `(unsigned char)` cast it is -- and a byte read through an `unsigned char *` never meets a `char *`, so a byte from an `unsigned char` table stays `unsigned char`. The second propagation is kept only if every Varnode ends at the first propagation's type or the same type with `uint1` read as `char`, through pointers and arrays (`kuna_charbyte::keep_or_restore`); otherwise the first propagation's types are put back, because a fresh propagation can tip a contest the rule has no stake in (bash -O2 param_expand: a string pointer joined with an `int *` parameter came out `int *`). Two kinds of byte are never retyped, recorded or not (`kuna_charbyte::read_without_cast`, `kuna_charbyte::is_counter`): a byte that reaches a CALL, CALLIND or CALLOTHER argument, a RETURN or a BRANCHIND switch, directly or through copies, joins and one-byte arithmetic -- kuna shrinks a call argument to the byte when the `movzx` that widened it folds away, and C would sign-extend a `char` argument with no cast to show it (`logit(\"%d\",c)` passes -128 for 0x80 where the binary passes 128), and a `char` switch variable never reaches `case 0x80:` -- and a counter, whose own one-byte sum or difference is stored back through the address it was loaded from (`*p = c + 1`), because the only `char` it meets is that sum's default signed vote. Either one in the second propagation, including a sibling byte read through the retyped pointer (`logit(\"%d\",a0[1])`), puts the first propagation's types back, and so does a byte that took `char` while the pointer it is loaded through did not, which would print as a cast of its own load (`(uint4)(uint1)(char)v2[1]`), or a pointer that took `char *` while one it copies into or out of stayed `unsigned char *`, which would print as two variables joined by a cast (`v5 = (unsigned char *)&a0[1]`). The second propagation runs only in a function where something was recorded."
use_when = "On by default: a byte read through a `char *` whose only unsigned vote is the `movzx` that loaded it is declared `char`, so a string walk reads in C's own vocabulary (`char *a1`, `if (v3 != '\\t')`, `*v4 == '-'`) instead of `unsigned char *a1` with `(char)` casts and numeric constants (`if (v3 != 9)`, `*v4 == 0x2d`, `strchr(\"...\",(int)(char)*v1)`, `mbrtowc(a0,(char *)a1,...)`). It retypes a byte only where C shows how each read of it is widened: the zero-extension prints as the `(unsigned char)` cast it is (`__ctype_b_loc()[(unsigned char)c]`) and constants compared with it become character literals; on 34 binaries every distinct value-bearing form that reads a retyped byte, on changed and unchanged lines alike, evaluates the same as the off arm's for all 256 byte values. A byte that reaches a call argument, a return or a switch, where C would sign-extend a `char` silently, and a counter whose own sum is stored back keep `unsigned char`, and so does every byte read through the same pointer. Turn it off when you need kuna's byte types in upstream Ghidra's vocabulary, or when diffing against output from before it was on: because the speculative merge only joins variables of one type, a `char` byte and an unrelated `unsigned char` value that used to share a declaration can split into two (or two `char *` join), renumbering the `vN` locals after them, and a constant added to such a byte prints the way kuna prints arithmetic on any `char` (`c + '\\xd0'` for `c - 0x30`). With `structsynth` on, a synthesized struct whose pointer field moves from `unsigned char *` to `char *` can become identical to one already synthesized and share its name, which shifts the `struct_N` numbers of the functions decompiled after it."
example = "option charbyte on"
source_decompiler = "ida"
inspiration = "Hex-Rays declares a byte read through a `char *` as `char` and prints the `movzx` that widens it as `(unsigned __int8)c`; this rule reaches the same declaration from Ghidra's own lattice without overriding any edge: it re-seeds the byte `char` -- the fold it would have had without the zero-extension's vote -- and lets the unchanged propagation rules run again from there."
change_kind = "type-inference"
tier = "core"
symptoms = "a string pointer is declared unsigned char * and its bytes print as (char)*p|a comparison against a character constant prints as a number: v3 != 9, *p == 0x2d|a wrapper takes unsigned char *a1 and passes (char *)a1 to mbrtowc or strlen|strchr(\"...\",(int)(char)*v1)|a loop variable that walks text is unsigned char"
live_field = "char_byte"
live_true = "on"
live_false = "off"
