issue = "oxidizer-SecurityCheckRemover"
summary = "REMOVES CODE: strips rustc's bounds / slice / divide-by-zero panic branches from Rust output. Every checked slice index, string slice and non-constant `/`/`%` compiles to a conditional branch to a tiny diverging block that calls one of seven `core::panicking` / `core::slice::index` / `core::str` helpers; the branch doubles the CFG of ordinary Rust code and carries nothing a reader wants. The edge is severed and the orphaned handler collected, so the guarded access becomes a plain statement."
use_when = "On by default (DIV-82): a Rust binary reads with half the branches and none of the `panic_bounds_check()` noise. Flip OFF to keep the real check instructions (auditing whether a particular access is actually bounds-checked, or reviewing a panic path). The trigger is the callee NAME, and all seven names are Rust-only, so the pass is structurally inert on a C binary -- it is byte-identical over the 675 datatests and over the C regression fixtures. It is marked destructive because it deletes real instructions, and there is one visible second-order effect: a length argument whose only reader was the removed compare becomes genuinely unused, so parameter recovery may trim it from the signature (the same trade `stackguard` makes with the canary slot). It cannot fire on a call whose callee name kuna did not recover: in a default (PIE, dynamically linked) Rust binary the helper is reached through an unrelocated GOT slot and has no name, so the pass is currently a no-op there."
