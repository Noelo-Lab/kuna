# phases.toml -- the kuna phase registry (ADR 0006): the SINGLE SOURCE OF TRUTH
# for the four static tables transcribed from decompiler/cpp/kuna_stages.cc
# (groupTable, substageTable, surfaceTable, settableTable). build.rs reads this
# file and generates the static tables, the typed OptionValues struct, and the
# live-value match. Editing a row here is the one edit point; the codegen makes
# any drift a build failure. DO NOT hand-edit the generated Rust.
#
# Counts (asserted in tests): group=39, subphase=40, surface=98, settable=75
# (tiers: 16 core / 35 transform / 24 analysis).

