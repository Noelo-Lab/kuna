use_when = "kuna emits the SAME leaf statement(s) at the head or tail of BOTH arms of an if/else (a compiler-duplicated shared prefix/suffix the structurer cloned into each arm), e.g. a shared cleanup epilogue or a `--help`-style shared call repeated in both branches. On by default (DIV-14); flip OFF to restore the upstream duplicated-arm rendering. On, the shared leaf run is hoisted out of the `if` (one copy), each merge logged (`dedupitetail:`). Conservative: only flat C-equivalent leaf blocks are merged (never a nested if/loop or a labelled/goto block), and a suffix is hoisted only when both arms provably reach it. Deeply entangled duplication where the shared code shares a basic block with divergent code (e.g. true_1804 usage's online-help printf folded into the setlocale condition block) is out of scope — that needs the full label-convergence transform."
example = "option dedupitetail on"
source_decompiler = "angr"
inspiration = "test_decompiling_true_1804_x86_64::usage; angr structurer condition-processing / ITE region deduplication (RegionSimplifier; structuring/structurer_base.py _merge_nodes); inverse of SAILR ReturnDuplicator/CrossJumpReverter"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "both arms of an if/else begin or end with the same duplicated statements|shared cleanup or help call repeated verbatim in the two branches|compiler-duplicated tail emitted twice instead of hoisted out of the if"

