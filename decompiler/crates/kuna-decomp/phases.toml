summary = "Rebase the load-time analysis facts of a relocatable object (ELF ET_REL .o, COFF .obj) into the loaded image's address space. The loader lays such an object out synthetically above RELOC_BASE (relocobjects), but the analysis passes re-parse the same file and compute PRE-LINK, section-relative addresses, so two address spaces mix in one inventory. This re-presents the object to the analyzer tier before any pass reads it: each laid-out section carries the loader's relocated bytes and its load VMA, each unlaid .debug_* section has its relocations applied, and every ELF symbol is shifted by its own section's delta (sections are laid out non-contiguously, so there is no single global offset). A fact that still lands in no laid-out section is dropped rather than passed through unrebased. Loader-tier: read via the kuna_relocrebase env var (the analyzer tier runs inside load file)."
