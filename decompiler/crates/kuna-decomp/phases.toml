# phases.toml -- the kuna phase registry (ADR 0006): the SINGLE SOURCE OF TRUTH
# for the four static tables transcribed from decompiler/cpp/kuna_stages.cc
# (groupTable, substageTable, surfaceTable, settableTable). This file holds the
# first three; settableTable is one file per option under phases.d/ (see
# phases.d/README.md). build.rs reads both and generates the static tables, the
# typed OptionValues struct, and the live-value match; the codegen makes any
# drift a build failure. DO NOT hand-edit the generated Rust.

