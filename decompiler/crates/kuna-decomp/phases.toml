strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-noreturn-error"
summary = "REMOVES CODE: concludes an error(nonzero,...) wrapper is no-return, dropping the dead fall-through at every caller. The value-conditional slice of Ghidra's discovered-no-return analyzer, folded into the noreturn_propagate consumer: glibc error(int status, int errnum, const char *fmt, ...) and error_at_line(int status, ...) call exit(status) and NEVER return when status != 0 — but DO return for status == 0 — so `error` cannot be a Known no-return. Yet an internal wrapper whose tail is `call error(2,...)` (GNU pfatal_with_name, and every die()-via-error helper) is unconditionally no-return. When on, the propagation treats such a tail call as terminal by checking the call site's first int-arg register (x86-64 SysV EDI/RDI = the `int status`) is a nonzero literal (MOV EDI,0x2), concludes the wrapper no-return, and the existing fixpoint propagates that to every caller — which then truncates at the wrapper call instead of decoding the cold fall-through / next-function bytes as live code (e.g. diffutils diff `sip` collapses from 99 lines to ghidra's ~43, GED 347 -> 0). A zero status (XOR EDI,EDI / MOV EDI,0x0 — error() returns) or any non-constant/unprovable status is rejected (conservative: a false positive would drop live caller code). Emits the existing NoReturnFact -> the existing set_function_no_return commit seam (no new commit arm, no S7 work). Requires the Listing (option listing on) AND noreturn_propagate on — a no-op otherwise. On by default (DIV-16), but gated on the Listing (default-off), so every parity gate is byte-identical (real-ELF Listing path only)."
use_when = "On by default (DIV-16), but a no-op unless the Listing is built (option listing on) and noreturn_propagate is on — with the Listing off there is zero behavior change. With listing on it concludes an internal wrapper that tail-calls error(nonzero,...) (e.g. GNU pfatal_with_name) is no-return where kuna would otherwise treat `error` as returning (since error(0,...) returns) and keep decoding the cold error path / adjacent function's bytes as live code past every wrapper call, ballooning the caller (diffutils diff `sip`: 99 lines / GED 347 vs ghidra 43). Ghidra's discovered-no-return analyzer catches exactly this; angr's callgraph returning-fixpoint (CFGBase._determine_function_returning) is the analog. Flip OFF (with listing on) to keep the post-call fall-through code (the wrapper is treated as returning again)."
example = "option listing on --option noreturn_error on"
source_decompiler = "ghidra"
inspiration = "decbench:O2-noinline-diffutils-diff-sip; CFGBase._determine_function_returning / Ghidra discovered-no-return; error(nonzero,...)"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "caller keeps decoding the cold path after error(2, ...) into the next function|function balloons past a wrapper that tail-calls error with nonzero status|dead fall-through after a gnu error(nonzero, ...) call"
[[settable]]
option = "noreturn_reach"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-noreturn-reach"
summary = "REMOVES CODE: the CFG-reachability no-return rule — the port of Ghidra's FindNoReturnFunctionsAnalyzer.targetOnlyCallsNoReturn ('Non-Returning Functions - Discovered' analyzer). kuna's noreturn_propagate concludes a wrapper no-return only when its LAST real instruction is a terminal call to an already-no-return callee (a tail-call subset). That misses three shapes Ghidra catches by walking the CFG: (1) a no-return call MID-body with a dead tail after it (e.g. openssh sshpkt_fatal, whose FIRST statement is `call sshpkt_vfatal` and whose write()/return tail is unreachable); (2) a RETURN that is present but UNREACHABLE (the path to it dies at a no-return call); (3) a SWITCH (indirect jump) whose every arm ends in a no-return call (openssh sshpkt_vfatal). When on, for each candidate the rule walks the instruction-level reachable CFG from entry, treats a call/jump to an already-no-return callee as terminal (its fall-through is dead), and concludes no-return iff NO RETURN is reachable and at least one path ends at a no-return transfer — iterated to a call-graph fixpoint by the same propagate loop, emitting the same NoReturnFact -> set_function_no_return seam. Conservative: a reachable RETURN, an unresolved indirect jump, a branch escaping the body to a possibly-returning neighbour, or a call with no modelled fall-through that is not itself terminal all reject (a false positive would drop live caller code). Requires the Listing (option listing on) AND noreturn_propagate on — a no-op otherwise. On by default (DIV-19), gated on the Listing (default-off), so every parity gate is byte-identical (real-ELF Listing path only)."
use_when = "On by default (DIV-19), a no-op unless the Listing is built (option listing on) and noreturn_propagate is on. With listing on it concludes internal fatal wrappers that kuna's tail-call rule (noreturn_propagate/noreturn_error) misses because the no-return call is mid-body, the return is dead, or the function routes through a switch — where kuna would otherwise decode the cold error path / adjacent function's bytes as live code past the wrapper call, ballooning the caller and inflating GED vs ghidra (openssh sshpkt_fatal/ssh_tun_confirm, shadow oom). This is the general 'Non-Returning Functions - Discovered' reachability that ghidra runs by default. Flip OFF (with listing on) to fall back to the strict tail-call rule (keeps the post-call fall-through code)."
example = "option listing on --option noreturn_reach on"
source_decompiler = "ghidra"
inspiration = "decbench:O2-openssh-portable-sshpkt_fatal, O2-openssh-portable-ssh_tun_confirm, O2-shadow-oom; Ghidra FindNoReturnFunctionsAnalyzer.targetOnlyCallsNoReturn (Non-Returning Functions - Discovered)"
change_kind = "correctness-fix"
tier = "transform"
symptoms = "wrapper with a mid-body fatal call still treated as returning|unreachable write()/return tail keeps a fatal wrapper looking like it returns|switch whose every arm ends in a no-return call not concluded no-return|caller decodes garbage past an sshpkt_fatal-style wrapper"
[[settable]]
option = "aif"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
