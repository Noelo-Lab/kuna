[[settable]]
option = "calloverlap"
values = "off|in|full"
default = "off"
destructive = false
phase = "P3"
subphase = "call-guard"
strength = "HARD"
rewind = "P3"
issue = "GH-275"
summary = "Complete the two upstream call-overlap guards kuna shipped as comment-only stubs: Heritage::guardCallOverlappingInput (heritage.cc:1210) and Heritage::tryOutputOverlapGuard / guardOutputOverlap (heritage.cc:1249/1293). Heritage characterizes each heritaged range against every call site's prototype; when the range is strictly LARGER than the ABI storage inside it the characterization is ContainedBy, and the whole-range guards see nothing. That is routine on x86-64 because SLEIGH models PXOR, MOVDQA, MOVDQU, POR, PAND, MOVQ-to-xmm and ORPD as ONE 128-bit write to the whole XmmReg, so Heritage::refinement's `size > 4 && maxw < size` gate never partitions the range and the 8-byte SysV parameter and return entries inside it stay invisible. At `in` the input guard locates the biggest contained input entry, translates its address from the callee's to the caller's perspective, inserts a SUBPIECE before the CALL that truncates a fresh whole-range Varnode down to that entry, registers the truncated Varnode as an input trial and appends it to the CALL - the guard PROPOSES storage, the P4 trial machinery still judges it. At `full` the output guard additionally turns the biggest contained return entry into an INDIRECT creation at the call and PIECEs the surrounding bytes of the range back around it, so the range still has a definition at the call while the return entry alone carries the output trial, and the range's effect is downgraded to unaffected. The two levels exist because they are separable: `in` alone recovers the dropped argument but leaves the call's return value read from a stale pre-call definition."
use_when = "Turn ON (`full`, which is upstream Ghidra's behavior) when a call is rendered with missing arguments and/or its result is read from a variable that is never assigned -- the classic rendering is `u(); sink = v1; return v1 + 1.0;` where `v1` has no definition, from the canonical gcc -O2 int-to-double idiom `movapd xmm1,xmm0; pxor xmm0,xmm0; cvtsi2sd xmm0,rdi; call u`. The whole enclosing function can also lose its own signature (`void mix(void)` for a `double mix(int,double)`), and a printf-family call can lose every floating-point vararg its format string asks for. PREFER `full` OVER `in`: measured over 268 decbench O2 binaries / 77,014 functions, `full` changes 283 functions (0.37%) with 94 that stop reading a never-assigned local against 6 that start, while input-only changes 209 with only 10 fixed against 12 newly introduced -- recovering the argument without recovering the return value leaves the call result stale. Use `in` only to bisect which half of the guard moved an output. DEFAULT OFF even though the flip is clean on both gate corpora (0/675 datatests, 0/411 stage assertions with the option forced on) and adds no decompile errors (4,024 error-marked functions before and after): the guards make the whole over-wide range live at the call, which EXPOSES two pre-existing kuna defects on the functions they touch. (1) 54 of the 283 changed functions (19%) render an XMM range that used to be a clean `float4 v9` as a 16-byte `char v9 [16]` with `v9[0] = ...; SUB164(v9,0)` lane traffic -- faithful, but noisier C. (2) At 6 call sites the recovered floating-point argument is emitted in slot 0, ahead of the format string (`log_out((float8)x,(float8)y,a0,\"time: %5.2f/%5.2f\")`), because `build_input_from_trials` does not interleave the integer and float ParamEntry groups back into source order for an unprototyped mixed call. Both are worth fixing before the default flips. Flip back off if a call gains an argument the disassembly does not support, or if a 16-byte lane rendering appears where a scalar read better."
example = "option calloverlap full"
source_decompiler = "ghidra-upstream"
inspiration = "upstream Heritage::guardCallOverlappingInput (heritage.cc:1210, called at :1508), Heritage::tryOutputOverlapGuard (heritage.cc:1249) and Heritage::guardOutputOverlap (heritage.cc:1293); GH-275 (packed-double atan2 call arguments) and the plain gcc -O2 pxor reproducer behind it"
change_kind = "correctness-fix"
tier = "core"
symptoms = "call emitted with no arguments or fewer arguments than the disassembly passes|call result read from a local that is never assigned|enclosing function loses its own parameter list and return type (void f(void))|argument register written whole-width by pxor movdqa movdqu por pand orpd or movq before the call|second call binds a stale pre-call value where the first call should have defined it"

[[settable]]
option = "spillargtrial"
values = "off|reload|spill"
default = "off"
destructive = false
phase = "P4"
subphase = "active-input-trial-scoring"
strength = "HARD"
rewind = "P4"
issue = "GH-275"
summary = "Tolerate the caller's own caller-save spill of an argument when scoring an active input trial. Funcdata::onlyOpUse (funcdata_varnode.cc:1891) answers whether the Varnode reaching a CALL in a candidate parameter register is used ONLY as that call's argument, and it rejects on ANY CPUI_STORE among the Varnode's descendants; checkInputTrialUse then calls markInactive, which also sets CHECKED, so the trial is never re-scored and the argument-producing chain dies to dead-code elimination. That blanket rejection also rejects the opposite idiom: on x86-64 SysV NO xmm register is callee-saved, so a floating-point value that is both an argument and live across the call MUST be spilled by the caller, and the spill is a second descendant of the very Varnode the trial is scoring. At `reload` the STORE stops rejecting only when it writes the walked Varnode's own value (operand 2, never the pointer) into a caller-frame slot AND a later LOAD reads that slot back at the same width, i.e. a genuine caller-save spill/reload pair. Since ActionActiveParam runs before ActionStackPtrFlow, the frame reference is still the raw INT_ADD(stack pointer, #const) and the reload straddles the call that re-defines the stack pointer, so the search walks forward from the store's own base Varnode carrying the running offset delta rather than matching raw constants. At `spill` the reload requirement is dropped and any caller-frame store of the value is tolerated. This is a deliberate DIVERGENCE from upstream, not a port fix: the rule it relaxes exists precisely to stop a value the caller writes to its frame before a call from becoming a bogus extra argument."
use_when = "Turn ON (`reload`) when a call is rendered with FEWER arguments than the disassembly passes and the missing argument's register is spilled to the frame just before the call -- the canonical rendering is `atan2(SUB168(v1,0));` from clang -O2 packed-double code that calls atan2 more than once, where `movapd XMMWORD PTR [rsp+0x20],xmm1` is the caller-save spill and `movaps xmm1,XMMWORD PTR [rsp+0x20]` after the call is its reload. The dropped argument often leaves a spurious 4-byte stack local in its place (`unsigned int v5; // stack - 0x18`). PREFER `reload` OVER `spill`: `spill` admits any frame store of the value, which fabricates arguments out of ordinary local writes -- measured on a clang -O2 inlined 64-byte memcpy, `spill` turns `sptr2(&v1,a0)` into `sptr2(v1,v5,v9,v13,&v1,a0)`, four arguments invented from the four `movaps` stores that fill the local buffer, while `reload` correctly declines because nothing reads those slots back. Use `spill` only to bisect whether the reload requirement is what is blocking a recovery. DEFAULT OFF: the failure mode of relaxing upstream's rule is a SPURIOUS TRAILING ARGUMENT, and no gate can see one -- the datatest corpus is prototype-declared and GED is blind to arity -- so the option ships as an opt-in with its evidence rather than as a default. Flip back off if a call gains an argument the disassembly does not pass, or if an argument appears whose value is a stale pre-call definition (that second shape is calloverlap's territory: the two options compose, and on the GH-275 copysign variant only `calloverlap full` plus `spillargtrial reload` gives both the right arity and the right values)."
example = "option spillargtrial reload"
source_decompiler = "kuna"
inspiration = "GH-275 (packed-double atan2 call arguments) defect (A), scoped in PR #284; upstream Funcdata::onlyOpUse (funcdata_varnode.cc:1891) and FuncCallSpecs::checkInputTrialUse (fspec.cc:5592)"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "call rendered with fewer arguments than the disassembly passes when the missing argument register is spilled to the frame before the call|floating-point argument dropped at the FIRST of several calls that reuse the same value|a spurious 4-byte stack local appears where a call argument should be|clang -O2 packed-double code calls atan2 with one argument instead of two|argument register stored to a caller-frame slot and reloaded after the call is not recognized as an argument"

