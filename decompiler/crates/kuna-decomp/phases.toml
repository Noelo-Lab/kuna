# ---------------------------------------------------------------------------
# settableTable: one row per kuna ArchOption -- the LLM control surface (26).
# live_field/live_true/live_false give build.rs the typed OptionValues field +
# the live-value reader mapping (the literal `flag ? live_true : live_false`
# ternary of kuna_console.cc kunaLiveValue); the three options with no live
# reader (loweredswitch/stackguard/namestyle) omit all three live_* keys.
# ---------------------------------------------------------------------------
[[settable]]
option = "compareform"
values = "canonical|original"
default = "original"
destructive = false
phase = "P3"
subphase = "comparison-canonicalization"
strength = "HARD"
rewind = "P3"
issue = "GH-558"
summary = "Whether comparisons keep their source form (V <= c) or the analysis-canonical rewrite (V < c+1)."
use_when = "Flip to canonical only to reproduce upstream Ghidra output; original (default) is more faithful to source."
example = "option compareform canonical"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra upstream comparison rendering (GH-558 prototype)"
change_kind = "presentation-default"
tier = "core"
symptoms = "comparison constant off by one versus upstream ghidra (x <= 9 vs x < 10)|need the analysis-canonical compare form to diff against upstream ghidra output"
live_field = "present_lessequal"
live_true = "original"
live_false = "canonical"

[[settable]]
option = "arraynotation"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "pointer-notation"
strength = "HARD"
rewind = "P9"
issue = "GH-558"
summary = "Render standalone pointer arithmetic as &base[index] (on) vs base + index (off)."
use_when = "Flip off if the consumer expects raw pointer-arithmetic rendering; on (default) is more readable."
example = "option arraynotation off"
source_decompiler = "ghidra-upstream"
inspiration = "Ghidra upstream pointer-arithmetic rendering"
change_kind = "presentation-default"
tier = "core"
symptoms = "&base[index] rendering unwanted; consumer expects raw pointer arithmetic|indexed array form where base + offset arithmetic is desired for diffing"
live_field = "__print_arraynotation"
live_true = "on"
live_false = "off"

[[settable]]
option = "truthycond"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "condition-form"
strength = "HARD"
rewind = "P9"
issue = "kuna-cnorm-fmt"
summary = "Render a boolean-context zero comparison in truthy form (if (x) / if (!p)) vs the explicit comparison (if (x != 0) / if (p == NULL))."
use_when = "On by default (DIV-36): idiomatic C for if/while/for/ternary conditions and &&/||/! operands. Flip off to reproduce upstream Ghidra's explicit comparisons or to diff against Ghidra output. Float compares, enum-typed zeros, and equate-named zeros always keep the explicit form; value uses (v = (x != 0)) are never rewritten."
example = "option truthycond off"
source_decompiler = "kuna"
inspiration = "user-reported readability issue on the angr fmt corpus binary (if (v8 != (char *)0x0) vs if (v8))"
change_kind = "presentation-default"
tier = "core"
symptoms = "if (x != 0) where idiomatic C reads if (x)|if (p == NULL) where if (!p) is wanted|explicit zero comparison in conditions unwanted|truthy condition rendering needs to match upstream ghidra for diffing"

[[settable]]
option = "braceelide"
values = "on|off"
default = "on"
destructive = false
phase = "P9"
subphase = "brace-form"
strength = "HARD"
rewind = "P9"
issue = "kuna-cnorm-fmt"
summary = "Render a single-statement if body braceless with the statement indented on the next line (on) vs always braced (off)."
use_when = "On by default (DIV-37): idiomatic C for one-statement then-bodies. Flip off to reproduce upstream Ghidra's braced form or to diff against Ghidra output. Only plain single-statement bodies elide: labels, comments, and multi-statement bodies keep their braces; the if (cond) goto L; one-liner and else-if collapse are unaffected."
example = "option braceelide off"
source_decompiler = "kuna"
inspiration = "user-reported readability issue on the angr fmt corpus binary (if (expr) { single-statement; })"
change_kind = "presentation-default"
tier = "core"
symptoms = "if (x) { stmt; } where braceless if (x) stmt; is wanted|single-statement if body keeps braces|braced one-liner bodies unwanted|brace style needs to match upstream ghidra for diffing"

[[settable]]
option = "warnstyle"
values = "inline|banner"
default = "inline"
destructive = false
phase = "P9"
subphase = "warning-style"
strength = "HARD"
rewind = "P9"
issue = "kuna-cnorm-fmt"
summary = "Render analysis warnings as terse end-of-line // slugs on the line they describe (inline) vs full /* WARNING: ... */ banner lines (banner)."
use_when = "Inline by default (DIV-38): usage(1); // no-return, if (v8) { // branch-flip, prototype-line // early-return x3. Flip to banner to reproduce upstream Ghidra's full warning text or to grep for the long-form messages. Unknown warning texts keep their full text behind a warn: marker; user/dwarf_lines comments always keep banner lines."
example = "option warnstyle banner"
source_decompiler = "kuna"
inspiration = "user-reported readability issue on the angr fmt corpus binary (obtrusive full-line WARNING banners)"
change_kind = "presentation-default"
tier = "core"
symptoms = "full-line WARNING banner comments clutter the output|warning text wanted inline at the end of the statement it describes|terse warning slugs unwanted; full upstream warning text needed|warning style needs to match upstream ghidra for diffing"

