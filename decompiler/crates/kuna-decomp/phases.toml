summary = "Run the Itanium (GCC/Clang) RTTI + vtable recovery pass -- a capability Ghidra does NOT have (its RttiAnalyzer is a Microsoft-PE analyzer, and its GCC class recovery is script-tier: RecoverClassesFromRTTIScript / RTTIGccClassRecoverer, never auto-analysis), so on a stripped g++ binary Ghidra leaves the Shape vtable as DAT_00107a80. IDA Pro does reconstruct it, and this is kuna's analog, built against the Itanium C++ ABI. On an ELF, discovery is EXACT rather than a byte-pattern scan: the three __cxxabiv1 typeinfo vtables live in libstdc++, so every _ZTI... typeinfo object's leading vptr word is an UND dynamic relocation naming __class_type_info / __si_class_type_info / __vmi_class_type_info with addend 2*ptr -- the relocation's r_offset IS the typeinfo address and its symbol IS the flavour, and `.rela.dyn` is a loader input that `strip --strip-all` cannot remove from a shared object. A defined _ZTI... OBJECT symbol is a second discovery source (unstripped / static link), its flavour sniffed from the object's shape. Each typeinfo's _ZTS... type-name string is demangled to the class name by wrapping it back into the _ZTS symbol form and reusing the existing cpp_demangle Itanium arm (the exact analog of the MSVC ??_R0...@8 wrap; ZERO new demangler code), and its base list gives the inheritance DISPLACEMENTS. Vtables are then reached from the typeinfo, not guessed: one scan finds every pointer slot holding a discovered typeinfo address (a sub-vtable's second header word), and two exact ABI constraints reject the coincidental hits -- offset-to-top is always <= 0, and a real sub-vtable has >= 1 slot pointing into an executable section. A slot whose file word is 0 but which carries a dynamic relocation is an IMPORTED virtual method (__cxa_pure_virtual, a base method in another image); the walk steps over it instead of terminating, so an abstract interface keeps its true extent. Emits Data symbols `<C>::typeinfo`, `<C>::typeinfo_name`, `<C>::vtable`, and for a secondary sub-vtable the base subobject its displacement identifies (`Widget::vtable_for_Drawable`); a Function symbol `<C>::vtable_<i>` per virtual slot, with an inherited slot attributed to the class that DEFINES it rather than to whichever vtable the scan reached first (so Shape::perimeter, repeated in Circle's and Square's tables, is named once for Shape); and the slot arrays as read-only ranges. ELF-only (registered in passes_for only for BinaryFormat::Elf, and the pass self-gates on ELF in run). DISABLED by default (real-ELF path only, output-changing: it adds named data and function symbols, so every XML parity gate is byte-identical)."
use_when = "Off (default; no Itanium RTTI pass runs and there is zero behavior change). Flip on for a GCC/Clang-built C++ ELF carrying polymorphic classes -- especially a STRIPPED one, where the relocation anchor is the only surviving type information -- to recover the class names, the inheritance graph and the vtables (an unnamed DAT_* vtable slot becomes `Shape::vtable_2`, the raw .data.rel.ro bytes become `Shape::typeinfo` / `Shape::vtable`). It recovers NOTHING from a binary built -fno-rtti (google/leveldb is such a build: 18 _ZTV symbols, zero _ZTI/_ZTS, zero __cxxabiv1 relocations), and nothing from plain C."
example = "option itaniumrtti on"
source_decompiler = "kuna"
inspiration = "Itanium C++ ABI 2.9.5 / 2.5.2 (type_info + vtable layout); IDA Pro's GCC RTTI reconstruction. Ghidra has no equivalent analyzer."
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "gcc/clang c++ class names missing and vtables left as unnamed DAT_ data|no Class::vtable or typeinfo labels in a stripped elf with polymorphic classes|virtual dispatch slot resolves to sub_<addr> with no class"
[[settable]]
option = "noreturn_propagate"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "external-refinement"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-noreturn-propagate"
summary = "REMOVES CODE: propagates no-return through the call graph, dropping unreachable code after no-return calls. Runs the structural no-return propagation consumer (the second Listing/xref consumer): the kuna analog of angr's CFGFast call-graph no-return propagation. Seed the terminal set from the Known no-return list and conclude a function no-return when its last real instruction (skipping trailing NOP alignment padding) is a CALL (or tail JMP) to an already-no-return callee, with no RETURN path, no computed jump, and no branch escaping the reachable body — iterated to a fixpoint, with NO evidence threshold (unlike noreturn_disc's >=3 call sites). Catches a custom no-return wrapper (e.g. coreutils xalloc_die, which ends in `call abort` followed by padding) that the static name list does not know and the >=3-evidence rule does not reach, so a caller (e.g. tee_O2 x2nrealloc) no longer grows a spurious while(true)/goto from the dead fall-through. Emits the existing NoReturnFact -> the existing set_function_no_return commit seam (no new commit arm, no S7 work). Requires the Listing (option listing on) — a no-op when the Listing is absent. On by default (DIV-14), but gated on the Listing (default-off), so every parity gate is byte-identical (real-ELF Listing path only)."
use_when = "On by default (DIV-14), but a no-op unless the Listing is built (option listing on) — with the Listing off there is zero behavior change. With listing on it concludes a custom no-return wrapper (a die()/fatal()/xalloc_die() that unconditionally ends in abort/exit) is no-return where it would otherwise be treated as returning — angr renders the caller cleanly but kuna would emit a spurious while(true) loop + goto + dead stack spills from the post-call fall-through (e.g. tee_O2 x2nrealloc). Broader than noreturn_disc: no >=3 call-site threshold and it seeds from the Known list. Flip OFF (with listing on) to keep the post-call fall-through code in the output."
example = "option listing on --option noreturn_propagate on"
source_decompiler = "angr"
inspiration = "test_decompiling_tee_O2_x2nrealloc; angr CFGFast no-return propagation (returning / _iteratively_analyze_function_features); x2nrealloc"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "unreachable code after a call to an exit/fatal wrapper|function truncated after calling a cold wrapper|spurious while(true) around a call that never returns|stripped binary's unnamed exit wrapper swallows the functions after it"
[[settable]]
