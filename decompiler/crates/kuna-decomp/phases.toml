[[settable]]
option = "cortexmvectors"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-cortexmvectors"
summary = "Widen the ARM Cortex-M hardware vector-table signature (entry discovery oracle 6). The shipped signature confirms a table only when (a) it starts a section the loader maps executable, (b) its word 0 is in the architectural SRAM block 0x20000000-0x3FFFFFFF, and (c) its word 1 equals e_entry. All three over-constrain real firmware: the table is DATA the CPU reads, so a bare-metal link script normally emits .isr_vector as an A-only section in a read-only PT_LOAD; STM32F4 and -M7 parts put the initial stack in CCM/TCM at 0x10000000; and e_entry is the ELF start symbol, which a link script is free to point somewhere other than the reset vector. With this on, a candidate is any allocated section whose word 0 lands in 0x10000000-0x3FFFFFFF and whose slots from word 1 yield at least three Thumb handler pointers (odd, inside an executable section) — the run of handlers replaces the e_entry equality, and three consecutive conforming slots is a shape a .data structure does not reach by accident. Confirming a table arms the reset/exception handler seeds AND the whole-image Thumb (TMode=1) region paint, so a stripped Cortex-M image goes from a handful of functions to the whole firmware. The widened scan runs ONLY where the shipped signature found nothing, so an image that resolved a table before resolves the same section with the same harvest: the option can add discovered entries, never remove one. ARM-only and real-object-path only, so every XML datatest is structurally untouched. Output-changing (it discovers more functions) => default-OFF."
use_when = "Flip on for a stripped bare-metal ARM Cortex-M firmware image (STM32/nRF/SAM/...) that decompiles to only a few functions, or whose code decodes as A32 garbage, because kuna never confirmed its vector table. The tell-tales: the .isr_vector section is flagged A (not AX) and sits in a read-only PT_LOAD, the first word is a 0x1000xxxx CCM/TCM stack pointer rather than 0x2000xxxx, or the second word does not match the ELF e_entry. Stands alone (it needs no other option), and composes with the listing + funcstart_patterns + aif set the decompile-all/functions drivers already inject on non-x86-64. Off (default) keeps the strict e_entry-matching signature, so any image that already worked is byte-identical either way."
example = "--option cortexmvectors on"
source_decompiler = "kuna"
inspiration = "decbench:O2-cleanflight-cleanflight_DALRCF405, O2-betaflight-betaflight_STM32F405, O2-crazyflie-cf2, O2-nuttx-nuttx; kuna's own ARM entry-recall measurement (docs/features/cortexmvectors/analysis.md; step 1 of the arm-entry-granularity proposal)"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "stripped cortex-m firmware yields only a handful of functions|arm firmware body decodes as a32 garbage instead of thumb|nmi/hardfault/systick exception handlers never discovered as entries|isr_vector table present but no vector-derived function starts"
[[settable]]
option = "ptrentry"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-ptrentry"
summary = "Discover ARM function entries that are reachable ONLY through a code-pointer word (a vtable / fops struct / ISR table / literal-pool constant). The shipped Stage-3 code-pointer scan already collects every 4-byte-aligned Thumb pointer in every allocated section, then accepts the target only if it opens with a stack-frame prologue AND disassembles into more than two instructions. Those two shape predicates reject the bulk of the pointer-referenced population on bare-metal firmware: 93 percent of the missed entries establish no frame at all, and 41 percent are leaves of 8 bytes or less (movs r0,#0; bx lr, or a bare bx lr, which is a perfectly valid Cortex-M exception handler). With this on, a target is admitted on CONTAINMENT evidence instead of shape: no word that references it may be the bytes of a decoded instruction (that word is an operand, not a table slot), and none may lie in the same discovered function as the target itself (that is the ldr pc,[pc,r] switch-table shape, whose slots point into their own body); the length floor is replaced by a terminating-routine check, so a one-instruction routine that reaches a clean return is accepted while a data word that merely decodes is not. Measured on the 48-binary decbench Cortex-M corpus: +1613 recovered ground-truth entries, 95.2 percent of the new entries are DWARF function addresses, ZERO split a real function body and ZERO previously-recovered entries are lost. The accepted entries are emitted as an additive fact stream and never re-seed the recursive-descent walk, which is what makes never-removes-an-entry a property of the wiring. ARM-only and Listing-tier, so it is a strict no-op on every other architecture and without --option listing on. Output-changing (it discovers more functions) => default-OFF."
use_when = "Flip on for a stripped ARM firmware image whose callback / vtable / ISR-handler functions produce no output at all: the tell-tale is a hole in the decompilation, where kuna emits a function at one address and the next at a higher one with real code in between (a 4-byte movs r0,#0; bx lr driver stub, an exception handler that is a bare bx lr). Composes with the listing + funcstart_patterns + aif set the decompile-all/functions drivers already inject on non-x86-64, and with cortexmvectors; needs --option listing on to do anything. Off (default) keeps the prologue-plus-three-instruction shape test, so any binary that already worked is byte-identical either way."
example = "--option ptrentry on"
source_decompiler = "kuna"
inspiration = "decbench:O2-nuttx-nuttx, O2-betaflight-betaflight_STM32F405, O2-cleanflight-cleanflight_DALRCF405, O2-crazyflie-cf2, O2-libopencm3-cdcacm; kuna's own ARM entry-recall measurement (docs/features/ptrentry/analysis.md; step 2 of the arm-entry-granularity proposal, PR #239). Precision model after Ghidra's OperandReferenceAnalyzer / DataOperandReferenceAnalyzer split (create functions from instruction operands, never from a raw data pointer)."
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a small arm callback or isr handler produces no decompiled output at all|kuna emits one function then the next with un-decompiled code in between|bare bx lr exception handlers never discovered as entries|vtable or fops-struct callbacks missing from a stripped arm binary|driver op-struct function pointers left undiscovered"
[[settable]]
option = "poolentry"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-poolentry"
summary = "Reconstruct the ARM PC-relative literal pools that kuna's Listing never defines as data, and use them to fix the two defects that follow. `run_aif` slides its gap cursor ONE BYTE at a time with no instruction-alignment filter, because `first_undefined_after` is byte-granular by construction. A literal pool is data, so it is an undefined gap; the cursor probes every byte of it and accepts the first one whose 2-mnemonic fingerprint clears the histogram threshold. On STM32 Thumb the pool words are SRAM addresses 0x2000xxxx whose HIGH halfword decodes as movs r0,#0, so the accepted entry lands at pool_word+2, one halfword before the real function, and on accept the cursor jumps past the body so the true entry is never probed. In A32 the whole word decodes, so the phantom lands on the word itself. Upstream Ghidra does not have this: its reference analyzer defines pc-relative literal targets as DATA before AIF runs. This pass recovers the missing definition from the references that are there - every resolved [0xADDR] operand and every [pc,#imm] literal load, including the second word of a 64-bit vldr/ldrd - and takes maximal stride-4 runs of referenced words as the pools, which is strictly more conservative than an ELF $d mapping-symbol oracle. Two consumers. RECALL: emit an entry fact at the first address after a pool that abuts a return-class terminal, when it is undefined and passes AIF's own fingerprint and valid-subroutine tests; purely additive, so never-removes-an-entry is a property of the wiring as in ptrentry and tailcallentry. PRECISION: drop an AIF accept that lies inside an inferred pool, but ONLY when the pool end carries a replacement entry, which makes the removal a MOVE rather than a delete - unpaired it destroys 531 real bodies, paired it destroys zero. Measured on 98 stripped ARM images (48,553 DWARF addresses): 191 new entries, 188 ground truth (98.4 percent), ZERO ground-truth entries lost, ONE real body split, and 4,220 phantom entries retired of which zero are ground truth and 4,218 were strictly inside a real function body, with ZERO real bodies made unreachable. Cortex-M recall 97.25 to 97.43 percent, u-boot A32 58.35 to 60.65 percent, and the share of reported functions that are real DWARF entries 76.4 to 82.3 percent. ARM-only in effect: on 20 x86-64 ELFs and 8 i386 PE images it adds and removes exactly zero entries, because x86-64 RIP-relative loads target .rodata rather than .text interstices and i386 has no PC-relative addressing at all. Inert without --option listing on and without aif."
use_when = "Flip on for a stripped ARM firmware image whose function list is full of sub_<addr> entries two bytes below a real function, or whose functions each appear twice at addresses two bytes apart. The tell-tale in the C is a leading dead movs r0,#imm that kuna then constant-folds through the body, so a function loses a parameter or returns a constant. Also the only thing in the ARM entry sequence that moves an A32 image such as u-boot. Off (default) keeps the current AIF accept list exactly, so any binary that already worked is byte-identical either way."
example = "--option poolentry on"
source_decompiler = "kuna"
inspiration = "Ghidra's reference analyzer defines pc-relative literal targets as DATA before AIF runs, so the pool is never an undefined gap there; decbench O0/O2 betaflight, cleanflight, crazyflie, u-boot; step 5 of the arm-entry-granularity sequence, PR #239"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a stripped arm function list carries sub_<addr> entries two bytes below the real function|the same arm function appears twice at addresses two bytes apart|a decompiled arm function returns a constant or drops its first parameter because of a dead leading movs|kuna reports far more functions than the binary has on bare-metal arm|an arm function entry lands one halfword before the real prologue|a32 u-boot recall is far below the cortex-m images"
