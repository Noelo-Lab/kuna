# ---------------------------------------------------------------------------
# (kuna) Loader-tier capability (1 row): ET_REL relocatable-object support. Unlike
# the analysis-pass gates above, this gates the LOADER (run at `load file`, before
# any `option` is processed), so the on/off toggle is bridged to the loader via a
# process env var (`RELOC_OBJECTS_ENV`) rather than an Architecture flag — this row
# exists for LLM discoverability + the off-switch. Real-ELF (object) path only; the
# XML datatest path never constructs an ObjectLoadImage, so it is inert there.
[[settable]]
option = "relocobjects"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "angr-CLE-ET_REL"
summary = "Load relocatable objects — ELF `ET_REL` `.o` files (no PT_LOAD program headers, so they map zero bytes under the upstream loader) and COFF `.obj` files (every section at VMA 0, so they map one section on top of another): synthesize a section layout above 0x400000, apply the relocations (R_X86_64_PC32/PLT32/32/32S/64, COFF DIR32/REL32, with REL-style in-place addends), rebase defined symbols, and bind undefined externs to synthetic call targets — so an object decompiles fully instead of failing with 'Unable to load N bytes at ...' (ELF) or exposing only its first function (COFF)."
use_when = "On by default (a pure capability: linked images of every format are byte-identical — they keep the mapped-image path — and only a pre-link object takes the new path, which is otherwise ZERO output on ELF and first-function-only on COFF). Set off to restore the upstream mapped-image-only loader (an ELF `.o` then errors; a COFF `.obj` falls back to its first section). NB: this gates the loader, which runs at `load file` BEFORE per-function options, so flip it (or set env KUNA_RELOC_OBJECTS=0) before loading the object."
example = "option relocobjects off"
source_decompiler = "angr"
inspiration = "test_decompiling_ptx_fix_output_parameters; CLE ELF relocatable backend; fix_output_parameters"
change_kind = "structure-recovery"
tier = "analysis"
symptoms = "a .o relocatable object fails with 'Unable to load N bytes at ...'|ET_REL object maps zero bytes so nothing decompiles|a COFF .obj lists only its first function (the rest collide at address 0)"
# ---------------------------------------------------------------------------
# paramcopyhoist: the P6 trim-COPY anchor for an unmodified incoming parameter.
# ---------------------------------------------------------------------------
[[settable]]
option = "paramcopyhoist"
values = "on|off"
default = "off"
destructive = false
phase = "P6"
subphase = "merge-aggressiveness"
strength = "HARD"
rewind = "P6"
issue = "decbench-parameter-copy-shadow-placement"
summary = "Anchor the copy-shadow of an UNMODIFIED INCOMING PARAMETER in the function's entry block instead of at the tail of the MULTIEQUAL slot's predecessor, so a guarded parameter's `vN = aM;` prints where the source's spill is -- with the other parameter spills -- rather than below an earlier guard. gcc -O0 gives every parameter a stack home, and the source idiom `if (p && !*p) p = NULL;` leaves a MULTIEQUAL at the guard's join whose incoming slots are the raw input register. `Merge::mergeOp` cannot merge the input-register HighVariable with the address-tied stack-slot HighVariable, so `Merge::trimOpInput` snips each offending slot into a COPY and places it with `opInsertEnd(copyop, op->getParent()->getIn(slot))` -- the tail of that slot's PREDECESSOR -- and that COPY is what prints as `vN = aM;`. For the FIRST parameter the guard's join predecessors intersect at the entry block, so `Merge::buildDominantCopy`'s `findCommonBlock` lands the copy there and it renders correctly; for every later parameter the intersection is the previous guard's join, so the copy sinks below that guard and splits the source's single entry block in two. Both producing sub-cases are covered: two-or-more trimmed slots (later collapsed by buildDominantCopy) and exactly one trimmed slot (no dominant-copy pass at all, so the single opInsertEnd is final). Implemented as ActionParamCopyHoist, the LAST action in universal_sched: taking the decision inside `Merge::trimOpInput` itself defeats the trim's own purpose (the widened Cover fails mergeOp's test, mergeOp falls through to trimOpOutput, and markInternalCopies then hides both resulting COPYs, so the assignment DISAPPEARS from the emitted C), and running the move any earlier than ActionFinalStructure perturbs the P8 duplication passes. Legality is buildDominantCopy's own Cover test re-run against the hypothetical hoisted placement and the FINAL HighVariable (b_cover over the high's other instances vs an a_cover whose def point is taken at the START of the entry block, rejecting on `intersect > 1`), which over-approximates and errs toward rejecting; only a formal parameter's storage is ever hoisted, only when a MULTIEQUAL reads the copy, and only when the target variable has exactly one candidate."
use_when = "Turn ON when a parameter's copy-shadow assignment (`v6 = a1;`) is emitted below an earlier guard instead of with the other parameter spills at the top of the function, adding CFG nodes the source does not have. Measured on decbench O0 e2fsprogs/e2fsck save_output (0x4eeb6): 53 nodes/77 edges GED 29.0 -> 51 nodes/77 edges GED 17.0 (-12), which is GED-OPTIMAL for the construct (deleting the copies entirely and writing through the parameter, which is literally what the source does, also scores 17.0). Broad on -O0: over four O0 binaries (e2fsprogs/e2fsck, coreutils/ls, gzip/gzip, bzip2/bzip2; 3031 functions) 121 functions (4.0%) emit at least one top-level parameter copy-shadow outside the entry block -- 200 sunk copies against 318 correctly in the entry -- and turning it on moves 92 of them (200 -> 108 sunk, 318 -> 479 in the entry) across 116 changed functions with zero new decompile errors. Every one of those 116 was diffed: 99 are pure re-orderings of `vN = aM;`, 17 have a secondary rendering effect (mostly a comma side-effect inside a short-circuit condition becoming a plain statement, which is an improvement; 2 leave an empty `if (c) { }` then-branch). Default-OFF opt-in: it is a deliberate DIVERGENCE from upstream Ghidra, which sinks the copy to exactly the same place, and although the default-ON ablation is clean on the datatests (0/675, PARITY OK) it regresses one stage assertion (condfold #3) and the decbench aggregate has not been measured, so the flip is left to a follow-up."
example = "option paramcopyhoist on"
source_decompiler = "kuna"
inspiration = "decbench:O0-e2fsprogs-e2fsck-save_output; O0-e2fsprogs-e2fsck-ea_refcount_free (single-trim sub-case); Merge::trimOpInput / Merge::buildDominantCopy (merge.cc)"
change_kind = "structure-recovery"
tier = "transform"
symptoms = "parameter copy-shadow assignment (v6 = a1;) emitted below an earlier guard instead of at the top of the function|kuna places some parameter spill copies in the entry block and others after a guard in the same function|extra CFG nodes versus the source around a cascade of if (p && !*p) p = NULL; parameter guards|vN = aM; for an unmodified incoming parameter appearing in the middle of a guard cascade"

# ---------------------------------------------------------------------------
# (kuna) Loader-tier capability (1 row): arm64e Mach-O spec selection. Like
# `relocobjects` above, this gates a LOAD-time decision (language_id_for), so the
# live gate is an env var the CLI exports (KUNA_MACHO_ARM64E) rather than an
# Architecture flag. Real-Mach-O path only; inert on every ELF/PE/COFF/XML path.
[[settable]]
option = "macho-arm64e"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-multiformat-macho-arm64e"
summary = "Select the Apple-Silicon pointer-authentication SLEIGH spec for an arm64e Mach-O. When on, a Mach-O whose header reports cpusubtype CPU_SUBTYPE_ARM64E loads with the AARCH64:LE:64:AppleSilicon language (the vendored Apple-Silicon v8.5-A spec, which models the pointer-auth/AMX extensions) instead of the generic AARCH64:LE:64:v8A. Pointer authentication does NOT change import naming or symbols (the __stubs indirect-symbol walk is unaffected) — only the spec selection differs (design 3.7). Spec selection is a LOAD-time decision (language_id_for), which runs before any console `option` command, so the live gate is the KUNA_MACHO_ARM64E env var the kuna CLI exports when it sees `--option macho-arm64e on`; this option name also records the requested state on the Architecture for catalog consistency. Default-OFF (opt-in, multi-format loader PR-8): a non-arm64e Mach-O, a non-Mach-O target, and every ELF/PE/COFF path are byte-identical, so all parity gates are structurally untouched."
use_when = "Off (default; an arm64e Mach-O loads with the generic v8A spec, exactly as any arm64). Flip on to decompile an arm64e (Apple-Silicon, pointer-auth) Mach-O with the AppleSilicon spec that models its extensions."
example = "--option macho-arm64e on"
source_decompiler = "kuna"
inspiration = "Ghidra MachoLoader arm64e cpusubtype -> AARCH64:LE:64:AppleSilicon language mapping"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "arm64e mach-o decoded with the generic v8A spec so pointer-auth ops are unmodeled|pac instructions in an apple-silicon binary not modeled by the loaded spec"

[[settable]]
option = "outline"
values = "off|<fn>:<head>-<exit>[;...]"
default = "off"
destructive = true
phase = "P8"
subphase = "goto-quality"
strength = "HARD"
rewind = "P8"
issue = "kuna-inline-identification"
summary = "Stage 2 of inline identification: excise a SUPPLIED single-entry region and emit a call to a synthesized pseudofunction in its place. Where almostregion finds candidate inlined regions, this acts on one - and the choice does not have to come from almostregion, so a human reading the code or an LLM agent reading almostregion's report can drive the transform directly. The value names the owning function entry as well as the region, because an option value is global to the run and every function is decompiled under it. The region is a block SET re-derived from the CFG with the same single-entry predicate almostregion uses; the value only names the head and the exit, and is re-verified against the live bblocks every time rather than trusted. Runs in the pre-SSA window immediately before heritage, so the edge surgery needs no MULTIEQUAL patching and ActionFuncLink still materializes the call's argument and return varnodes. v1 declines - leaving the function untouched - unless the head/exit really bound a single-entry region, exactly one edge enters the head from outside it, at most one value is live out, and the region contains no call and no STORE. Liveness is computed over the region's continuation (blocks reachable from the exit) with sub-register aliases merged, because an x86 32-bit write zero-extends and would otherwise count one register twice."
use_when = "Off (default; inert, and inert also when a region is supplied for a different function). Supply a region to pull an inlined callee body back out into a named call - typically taking the head and exit from `--option almostregion report`."
example = "--option outline 0x401000:0x40100a-0x401018"
source_decompiler = "kuna"
inspiration = "Procedural abstraction / outlining as the inverse of compiler inlining; the region model is the angr RegionIdentifier's single-entry region"
change_kind = "opt-in-tool"
tier = "transform"
symptoms = "an inlined callee body is spliced into the caller and should read as a call|want to pull a chosen region out of a function into a named pseudofunction|acting on an almostregion inline-candidate report by hand or with an llm"
