issue = "decbench-ifnoexit-loopcondhoist"
summary = "Give the non-loop-heads a first pass in CollapseStructure's DEFERRED ruleBlockIfNoExit scan, so ruleBlockWhileDo keeps the loop's head test. The deferred scan walks the live components in order and folds the FIRST block whose terminal arm qualifies, then restarts the whole cascade. A head-tested loop whose exit arm is a `return` (after ActionReturnSplit/returndup has given that return in-degree 1) is such a block, and it sits ahead of its own body in that order -- so the head folds to `if (!C) return X;` and drops to ONE out-edge, at which point ruleBlockWhileDo can never match it again and the loop is emitted as `while( true ) { if (!C) return X; BODY; }`. The body block that carries the loop's `break` is ALSO a candidate in the same scan and folding it first is strictly better: the break arm absorbs the loop's follower (which the rule's own `size_in() == 1` test already requires be reached from nowhere else), the body collapses to a single back-edge clause, and the head test hoists into the `while`/`for` header on the next cascade pass with no new machinery. With this on the scan makes one pass skipping blocks that are live loop heads (resolved through the collapsed graph exactly as LoopBody::update resolves them) and only falls back to the unrestricted upstream pass when that finds nothing, so a function with no loop-head candidate is byte-identical to upstream and the scan still terminates on the same fixpoint."
use_when = "Turn ON when a loop comes back as `while( true ) {` with the real loop condition immediately inside it as a guarded exit -- `while( true ) { if (!C) return X; BODY; }` -- where the source and IDA write `while (C) { BODY }`. Witnesses: coreutils od read_char becomes `while (dat) { ... }`, and libacl getfacl walk_tree_visited reaches the source's exact `for (v1 = ...; v1 != a0; v1 = ...) { ... } return 0;`. The named hazard is handled by the existing rule rather than by a new predicate: libacl getfacl get_list, whose loop follower FREES the list and returns NULL, keeps its semantics exactly (the free+return moves into the `break` arm and the normal exit returns the list) because ruleBlockIfNoExit only folds a clause of in-degree 1; bash mksyntax main is byte-identical. MEASURED BIDIRECTIONALLY over the whole decbench O0 slice (32,339 functions scored in both arms, 265 slices, `scripts.decbench.optsweep`): 2,281 bodies change, GED 230,291 -> 224,670 (-5,621), GED-perfect 14,785 -> 15,454 (+669), 680 functions moved TO perfect against 11 moved OFF (61.8:1, McNemar z = +25.5), improved 1,347 / worsened 256. EVERY architecture gains: x86-64 +542, ARM Cortex-M +123, i386 PE +4. Over the 2,281 changed bodies the shape audit reads `while( true )` 2,087 -> 223, gotos 621 -> 409, labels 399 -> 251, lines 123,744 -> 118,891, and `// no-return` unchanged. Sixty-six of those functions lose duplicated callees (openssh addr_match_cidr_list emits `free(list)` once instead of five times) -- that is the returndup-cloned loop follower being re-shared as the single loop exit, and the resulting pane is the openssh source verbatim. Default OFF: it changes WHICH of two legal folds happens first, a divergence from upstream's component order, so the flip needs its own DIV row plus the 0/675 ablation and a speed number."
