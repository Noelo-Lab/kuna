[[settable]]
option = "rustabi"
values = "off|auto|always"
default = "off"
destructive = false
phase = "P4"
subphase = "output-prototype"
strength = "HARD"
rewind = "P4"
issue = "kuna-rust-scalarpair-return"
summary = "Keep the two-register value a rustc ScalarPair return (Result, Option, a slice, a fat pointer) is carried in, and connect it at the call. kuna already RECOVERS the pair -- the x86-64 cspec join_dual_class output rule matches the RAX/RDX trials and buildReturnOutput builds the join -- and then loses it twice. On the producer, SubvariableFlow::tryReturnPull truncates the RETURN to the logical width of the value it is tracing; rustc materializes the discriminant with `xor %eax,%eax; setb %al`, so RAX is a ONE-BIT logical value and the whole return narrows to it, deleting the other register: `Result<u32,u32>` comes back as `bool prod(uint4 a0)` with the EDX payload gone. On the consumer, FuncCallSpecs::buildOutputFromTrials handles one used output trial and returns early on two, so the call gets NO output at all and every read of the payload register renders as a local the function never assigns -- the phantom `int4 v3; // edx` that a Result guard tests. The two seams get DIFFERENT classifications, because they do not see the same thing. At the producer the concatenation's halves are values the function computed, so classify_return_pair reads their shape (never a size: size does not predict rustc's choice -- `Result<u32,u32>` is 8 bytes and a pair, `Result<Box<u64>,u32>` is 16 bytes and goes through memory). A pair is recognized when the least-significant half is discriminant-shaped -- a value whose known non-zero bits fit in a byte, which covers both the branchy `mov $0/$1` tag and the branchless `setCC` one -- and vetoed when that half traces back to the function's own incoming pointer argument, which is the sret epilogue rather than a tag. At the CALL there are no callee values in the IR at all (both halves are INDIRECT creations), so classify_call_output_pair rests on the model rule that matched, on the caller reading both halves out of the call, and on a bounded decode of the resolved callee: when that decode covers every path to a RETURN and never writes the payload register, the caller's read is a clobber and the pair is REFUSED. That callee check is one-sided -- it can refute a pair, never confirm one -- so `ScalarPair` at the consumer means `no counter-example`, not `the callee returns a pair`. At `auto` the rules act only on an image the loader detected as rustc-produced; at `always` the language test is dropped."
use_when = "Turn on (`auto`) when decompiling a Rust binary and a `Result`/`Option` payload is missing: the producer recovered as `bool` when the disassembly plainly writes a second return register, or a consumer testing `v & 1` reads a companion local that is declared, read, and never assigned anywhere in the function. Measured on a 4.9 MB static-PIE rustc binary (4194 functions): phantom guards -- conditional guards whose condition reads a local the function never assigns -- fall from 1476 of 9026 to 1116 of 9039 (-24.4%), never-assigned locals from 4805 to 3533 (-26.5%), and the functions containing one from 1225 to 983; 408 functions change (392 with strictly fewer phantoms, 1 with one more), every inspected one gaining a payload variable or a call output (`&str` fat pointers out of `String::borrow`, the `(usize, usize)` out of `physical_core_count`, `Instant::now`). Zero functions change across grep/sort/faillog/libselinux and the betaflight ARM fixture, because `auto` cannot see a non-Rust image, and `/usr/bin/ncat` and `/usr/bin/htop` are likewise byte-identical off vs auto. The call seam's callee veto costs nothing measurable on that corpus -- the whole-binary output is byte-identical with the veto ablated -- because a real ScalarPair producer does write its payload register; what it refuses is the caller that reads a register its callee provably never sets. Speed on that same Rust binary, interleaved off/auto, minimum of 6: 169.04 s -> 169.37 s, **+0.20%** (budget 5%); two separate min-of-3 runs disagreed in sign (+0.38% and -0.78%), so the real cost is below this machine's measurement floor. DEFAULT OFF this round: the classification is deliberately narrow (one discriminant byte, one payload register) and the pair it keeps alive is rendered as a raw `undefined16`/`[u8; 16]` container until a later pass gives it an enum type, so a producer that used to render as a tidy `bool` now renders as a two-field aggregate -- more information, less polish. `auto` cannot touch a non-Rust image at all (the language fact comes from the analyzer tier, which the XML datatest bootstrap never runs), so the risk is confined to Rust output; use `always` only to force the rules on a corpus with no `.comment` record, such as a stage-test bytechunk."
example = "option rustabi auto"
source_decompiler = "kuna"
inspiration = "rustc -C opt-level=2 ScalarPair return ABI (Result<u32,u32> in EAX:EDX) measured against the SysV cspec, plus the stubbed FuncCallSpecs::buildOutputFromTrials multi-trial branch"
change_kind = "correctness-fix"
tier = "core"
symptoms = "a Rust Result or Option producer recovers as bool and the payload register is missing from the return|a local commented with a register name is declared and read but never assigned anywhere in the function|a call to a Rust function that returns Result renders with no output at all|a discriminant guard tests a variable whose companion payload variable has no definition|two-register return recovered as one register when the first half holds a setCC flag"

