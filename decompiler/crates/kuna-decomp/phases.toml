summary = "Before the final block structuring, duplicate a SHARED bare-epilogue RETURN block into each of its predecessors but one, so the classic guard shape `if (cond) { body; return X; } return Y;` -- which gcc -O0 compiles to a single multi-predecessor RETURN block -- structures as per-predecessor early returns instead of ONE merged, comma-folded exit. kuna (like upstream Ghidra) otherwise keeps the merged form: CollapseStructure::rule_block_or fuses the guards (which share the epilogue out-target) into one short-circuit condition with comma-expression side effects (e.g. `if ((A||B) && (v=f(..), C||D)) { rest }`), and the existing ActionReturnSplit (the goto-driven ReturnDuplicatorLow analog) only splits when structuring left a goto into the return -- which the clean guard collapse never does. This is the gotoless complement: it reuses the SAME `return_split_is_splittable` filter (only MULTIEQUAL/COPY/RETURN over constant/annotation/non-free inputs -- a side-effect-free epilogue, angr's `_is_simple_return_graph`) and the SAME `node_split` machinery ActionReturnSplit drives, splitting every in-edge but one. Mirrors angr SAILR `ReturnDuplicatorHigh` (the gotoless return duplicator). SELECTIVE like angr: it duplicates ONLY when the shared return returns a CONSTANT (or a phi/COPY chain resolving to constants) -- angr's `_should_duplicate_dst = dst_is_const_ret`. A `return <variable>` shared block is left merged (the unselective version diverged from the source's short-circuit form often enough to regress the decbench GED-perfect count ~976 across 21768 firings, which reverted DIV-18; the const-return gate drops ~40-60% of firings -- the over-eager variable-return splits -- while keeping the guard-clause wins like coreutils factor, and it is what turned the aggregate measurement positive again for DIV-54)."
