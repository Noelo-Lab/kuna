[[settable]]
option = "aifstrict"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "GH-299"
summary = "Advance the Aggressive Instruction Finder gap cursor to the next 4-byte boundary instead of the next byte, so it stops planting function entries in the middle of function bodies (GH-299). run_aif walks the undefined-byte partition ONE BYTE at a time, because first_undefined_after is byte-granular by construction, so every byte of every hole is a candidate function start and the two acceptance tests - a 2-mnemonic prologue fingerprint shared by at least 4 discovered functions, and a valid-subroutine decode - are applied to addresses that cannot be instruction boundaries at all. A candidate starting mid-instruction reads the tail of one encoding plus the head of the next, and that synthetic pair matches a common prologue about as often as a real one does. On the reported 3.4 MB stripped i386 PE, AIF contributes 5,913 entries of which 2,067 land inside a function IDA decodes as one body, and 737 of those are inside a function kuna itself already has an entry for. With this on, a candidate is probed only when it is 4-byte aligned OR is the first byte of its hole: a hole boundary is evidence, since the recursive-descent walk decoded up to exactly there and stopped, while an interior byte the cursor slid onto is a guess. The exemption is also what keeps the aif_gap_x86_64 fixture green, whose indirect-only function at 0x13ae is 2-mod-4 but IS a hole start. 4 bytes on every architecture, deliberately: 16-byte alignment kills 91 percent of the bad Cortex-M entries but takes 80 percent of the real ones with it. The removal is not only a precision win: because an accept advances the cursor past the accepted body, a phantom accepted one halfword inside a literal pool CONSUMES the real function behind it, so declining that probe recovers the true entry. Measured bidirectionally over 110 stripped non-x86-64 decbench binaries against each stripped image unstripped twin symbol table: mid-body entries 11,010 to 6,728 (a 38.9 percent cut) and ground-truth recall 44,613 to 44,957 of 50,724 (plus 344). On the two large PE witnesses, mid-body entries 339 to 135 on a 590 KB i386 crackme scored against its unstripped twin (zero of its 636 AIF-recovered real entries lost, 9 gained) and 421 to 293 on IDA Pro 9.2 win32_remote32.exe (3 of 157 lost). u-boot A32, the image DIV-20 exists for, gains 56 functions at O2 and is unchanged at O2-noinline. The worst single-image cost is CMSIS_DAP.axf, where only 73.5 percent of ground-truth entries are 4-aligned and three Thumb functions at 2-mod-4 interior addresses are lost. This does NOT reach the acceptance bar pre-registered for the fix (a 60 percent corpus cut and 100 or fewer crackme mid-body entries), so it ships opt-in rather than as the default and GH-299 stays open. The issues other direction - reject a candidate bracketed by a known function - was implemented in two forms and measured OUT: on the Listings entry-ordered function model it costs u-boot 195 of 1,759 recovered functions, and A32 recovery is AIFs entire remaining justification. Inert without aif and without --option listing on."
use_when = "Off (default) keeps the byte-granular cursor and reproduces the GH-299 measurement exactly. The `aggressive` preset carries it, which is where every number above was measured. Flip on for a stripped image whose function list is far longer than the binary can hold, or that contains a sub_<addr> sitting on an ordinary call or mov in the middle of another function - and especially when two overlapping entries decompile the same instructions twice. Flip it back off if a function you know is real disappears on an architecture whose function starts are not 4-byte aligned (Thumb allows a 2-mod-4 start; three are lost on CMSIS_DAP.axf)."
example = "--option aifstrict on"
source_decompiler = "kuna"
inspiration = "GH-299; Ghidra AggressiveInstructionFinderAnalyzer ships setDefaultEnablement(false) with the warning IT MAY CREATE A LOT OF BAD CODE!, and its reference analyzer defines pc-relative literal targets as DATA before AIF runs so the pool is never an undefined gap there; poolentry solves the same phantom on ARM by inferring the pools from their references"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "a stripped binary reports far more functions than it has|a discovered function starts in the middle of another functions body|a sub_ entry lands on an ordinary call or mov instruction rather than a prologue|two overlapping functions decompile the same instructions twice|aif adds thousands of entries a reference decompiler does not agree are functions|an arm function entry lands one halfword before the real prologue"
[[settable]]
option = "tailcallentry"
values = "on|off"
default = "off"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-tailcallentry"
summary = "Recover the function entries the recursive-descent Listing walk absorbs at a tail call. walk.rs makes a new function only at a CALL target and treats every other flow target as a same-function successor, so a routine reached only by a tail `B` is swallowed by whichever function branched to it and never becomes a function of its own — 17.4% of the ARM Cortex-M entry-recall gap. This reads the COMPLETED walk (splitting at a tail call provably cannot change which instructions the walk decodes, because a function entry is walked and therefore decoded either way) and admits an unconditional-branch target as a NEW function entry when four containment guards hold: every predecessor of the target is an unconditional branch (no fall-through and no conditional-branch predecessor, which would make it ordinary intra-function flow); the branch leaves the caller's entry-ordered function region, so at least one other discovered entry lies between the branch and its target; the target's flow region reaches a RETURN or computed jump (terminating-routine validity, with no length floor, so a one-instruction `bx lr` handler qualifies); and the target does not open with a stack restore (a function does not begin by tearing down a frame it never built — that is the caller's shared epilogue). Emits the accepted targets as the existing entries fact and never rebuilds the Listing, so no already-discovered entry can be removed. ARM-only; requires the Listing (option listing on) — a no-op when the Listing is absent, so every parity gate is byte-identical."
use_when = "Off (default; it discovers more functions, so it changes emitted C by construction). Flip on (with option listing on) on stripped ARM firmware when a routine reached only by a tail `B` — a shared ISR stub's handler, a `pop {r4,lr} ; b helper` tail call, a jump-thunk target — produces no output at all because the walk absorbed it into an earlier function. Measured on 96 Cortex-M images: +561 ground-truth functions, 94.6% of the new entries are real function starts, zero real bodies split, zero entries lost."
example = "option listing on --option tailcallentry on"
source_decompiler = "kuna"
inspiration = "decbench: kuna's own ARM entry-recall measurement (docs/features/arm-entry-granularity/); angr CFGFast's job model, where a branch to an address outside the current function's block set starts a new function"
change_kind = "analysis-enablement"
tier = "analysis"
symptoms = "routine reached only by a tail B produces no decompiled output at all|a shared ISR handler is swallowed by the two-instruction stub that branches to it|function entry missing where the previous function ends in an unconditional branch|kuna emits one oversized function where the ground truth has two"
