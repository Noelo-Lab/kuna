[[settable]]
option = "dynrelocs"
values = "on|off"
default = "on"
destructive = false
phase = "P1"
subphase = "code-data-partition"
strength = "HARD"
rewind = "P1"
issue = "kuna-analysis-dynrelocs"
summary = "Apply a LINKED image's dynamic relocations (.rela.dyn / .rel.dyn / .rela.plt) when the loader snapshots it, and mark the slots PT_GNU_RELRO freezes as constant. kuna maps the PT_LOAD bytes the linker wrote, but a PIE (ET_DYN) or dynamically linked ET_EXEC leaves every R_*_RELATIVE / GLOB_DAT / JUMP_SLOT slot at 0 for the run-time loader, so the whole .got reads back null and a call through a function pointer the linker itself resolved renders (*dat_<addr>)(...). This fills the slots in (RELATIVE = load bias + addend; GLOB_DAT/JUMP_SLOT only when the symbol is DEFINED in this same image, so imports and the PLT naming path are untouched) and reports the written slots that PT_GNU_RELRO covers as constant, which is what lets the engine fold the load and resolve the call to its name. x86-64, AArch64, i386 and ARM; both RELA and REL (in-place addend) tables. Distinct from relocobjects/relocrebase, which own the pre-link ET_REL .o path. Loader-tier: read via the kuna_dynrelocs env var (the image bytes are snapshotted at load file)."
use_when = "On (default) names calls made through a relocated GOT slot in any PIE, and gives the relocated value to anything that reads that memory; an unrelocated slot holds 0, which the run-time image never holds, so this is a correctness fix rather than a judgement call. Flip off to restore the pre-fix bytes exactly - every GOT slot back to 0 and every such call back to (*dat_<addr>)(...)."
example = "option dynrelocs off"
source_decompiler = "kuna"
inspiration = "A static-PIE Rust binary rendered 27 of its own calls as (*dat_<addr>)(...): 640 of its 1539 R_X86_64_RELATIVE relocations point into .text, and every one of those GOT slots read back as 0. Ghidra's ElfRelocationHandler applies the same relocations at import; angr CLE applies them in the loader."
change_kind = "correctness-fix"
tier = "analysis"
symptoms = "a call in a pie binary renders as (*dat_<addr>)(...) with no name although the callee is a named function in the same image|a got slot reads back as 0 in the decompiled output|reading a relocated function-pointer table in a pie binary yields all zeroes"
