issue = "kuna-analysis-dwarfvariants"
summary = "Import a DWARF DW_TAG_variant_part: the DW_AT_discr discriminant member (its offset, width and type), every DW_TAG_variant's DW_AT_discr_value, and each variant's payload member and the name DWARF gives it (Ok, Err, Some, None, Cons). A Rust tagged enum carries NO DW_TAG_member of its own -- its whole layout lives under the variant part -- so dwarfstructs recovered its DW_AT_byte_size and zero fields, and a field-less aggregate is still misclassified by the ABI (an 8-byte Result return came out as a phantom-sret Result *ret_result(Result *rethidden,uint4 x), with the real parameter shifted a slot right). The recovered type is a struct of the tag plus a union of one payload struct per variant, forced to a single overlay offset, and the variant names and discriminant values come from the COMPILER, not from codegen shape -- shape does not distinguish a Result from a repr(C) struct, a (u64,u64) tuple or a fat pointer. A DW_TAG_variant with no DW_AT_discr_value is the DEFAULT (niche) variant and is kept as such; when the discriminant bytes overlap the payload there is no byte range that is only the tag, so the recovered type is the overlay union alone, with no enclosing struct and no tag field. A fieldless variant (None, Nil) overlays nothing and gets no union member -- an empty struct of the overlay width ties with the real facet in ScoreUnionFields and wins on declaration order, so ablating the exclusion makes a std-linked rustc -g witness write an Option<i64> payload as v13.payload.None and read drop glue as (*a0).dropfn.drop.None (2 functions of 612) -- but it keeps its name and discriminant value on the side table. The geometry is also recorded in a side table on the TypeFactory that nothing in the analysis reads, for a later match/if-let/Ok(v) renderer. Needs FULL debug info (-C debuginfo=2 / cargo debug = true): a Rust binary whose DWARF carries no type DIEs gains nothing. A union member selects itself by OFFSET and the discriminant is never consulted, so a variant NAME is only installed where it is forced: a facet keeps its DW_TAG_variant name only when no other variant claims a byte it claims, and a field inside a facet keeps its DWARF name only when every other variant either claims none of its bytes or names exactly that range the same way. Option<T> has one payload-carrying variant, so Some survives; Result<T,E> has two over one range, so both the union member and the facet type are spelled field_0x<offset> -- the same offset rendering dwarfvariants off produces. LOSS: for every enum with two or more payload-carrying variants -- which is most tagged enums, Result included -- no variant name appears in the emitted C at all, and the rule is conservative at facet granularity, so labels an access WIDTH could have singled out (an 8-byte store at offset 8 of enum Multi { P{a,b}, Q(u64) } can only be Q) go too. What is lost is the label, never the layout: offsets, widths, member types and the enum size are what DWARF states either way, and every variant name and DW_AT_discr_value stays on the side table for a later match renderer. Before this rule a Result<u64,u64> witness printed Ok on both arms of an if/else and on the consumer Err arm, and Err nowhere."
use_when = "On (default) gives a -g Rust binary its enums: Result<u32, u32> ret_result(uint4 x) instead of a phantom-sret pointer to a field-less shell, and rethidden->tag = 0 / (rethidden->payload).A.__0 = x instead of *(uint4 *)rethidden = 0 / *(uint4 *)&rethidden->field_0x4 = x. A variant name only appears where exactly one variant claims the bytes (Some on an Option, A/B on an enum whose payloads do not overlap); on a Result and on any enum with two payload variants over one range the payload is spelled (dst->payload).field_0x8.__0, which is the same offset rendering this option off produces -- the discriminant field, the recovered size and the lost phantom sret are the gain there, not the label. Flip off to restore the dwarfstructs mapping (a tagged enum keeps its width and gets no fields). Extends dwarfstructs and is gated on it too, so dwarfstructs off suppresses this arm as well. Inert on any binary without full debug info, and on C (a C aggregate has no variant part)."
example = "option dwarfvariants off"
