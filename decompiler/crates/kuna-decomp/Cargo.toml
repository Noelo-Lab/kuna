[package]
autotests = false
name = "kuna-decomp"
description = "kuna Rust port: the decompiler core (DECCORE + kuna_* stage model)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kuna-base.workspace = true
kuna-num.workspace = true
kuna-sleigh.workspace = true
thiserror.workspace = true
smallvec.workspace = true
slotmap.workspace = true

[dev-dependencies]
# Verifier-only: the datatest <stringmatch> engine (item w10-structure-printbody).
regex = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "actionprof_unwind"
path = "tests/actionprof_unwind.rs"

[[test]]
name = "verify_w6_s4_fspec_2_r2"
path = "tests/verify_w6_s4_fspec_2_r2.rs"

[[test]]
name = "verify_w8_sig_pack"
path = "tests/verify_w8_sig_pack.rs"
