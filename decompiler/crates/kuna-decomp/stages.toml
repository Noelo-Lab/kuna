summary = "Run the discovered-no-return consumer (the first Listing/xref consumer): the evidence-tally fixpoint over the Listing — a call target is no-return when at least 3 of its call sites show no valid fall-through (the instruction after the call is not a valid instruction start / fell into data / is another function's entry), iterated to a fixpoint (a function whose last act is a call to an already-discovered-no-return function is itself no-return). The kuna analog of Ghidra's FindNoReturnFunctionsAnalyzer. Requires the Listing (option listing on) — a no-op when the Listing is absent. DISABLED by default (a flow heuristic that can be wrong; real-ELF path only, so every parity gate is byte-identical)."
use_when = "Off (default; no Listing consumer runs and there is zero behavior change). Flip on (with option listing on) to mark custom/tail-calling no-return wrappers — that the static name lists do not know — no-return, eliminating the post-call dead code, on a real-ELF target."
example = "option listing on --option noreturn_disc on"
source_decompiler = "kuna"
inspiration = "Ghidra FindNoReturnFunctionsAnalyzer (discovered no-return, evidence threshold)"
change_kind = "analysis-enablement"
[[settable]]
option = "noreturn_propagate"
values = "on|off"
default = "off"
destructive = false
stage = "S1"
substage = "external-refinement"
strength = "HARD"
rewind = "S1"
issue = "kuna-analysis-noreturn-propagate"
summary = "Run the structural no-return propagation consumer (the second Listing/xref consumer): the kuna analog of angr's CFGFast call-graph no-return propagation. Seed the terminal set from the Known no-return list and conclude a function no-return when its last real instruction (skipping trailing NOP alignment padding) is a CALL (or tail JMP) to an already-no-return callee, with no RETURN path, no computed jump, and no branch escaping the reachable body — iterated to a fixpoint, with NO evidence threshold (unlike noreturn_disc's >=3 call sites). Catches a custom no-return wrapper (e.g. coreutils xalloc_die, which ends in `call abort` followed by padding) that the static name list does not know and the >=3-evidence rule does not reach, so a caller (e.g. tee_O2 x2nrealloc) no longer grows a spurious while(true)/goto from the dead fall-through. Emits the existing NoReturnFact -> the existing set_function_no_return commit seam (no new commit arm, no S7 work). Requires the Listing (option listing on) — a no-op when the Listing is absent. DISABLED by default (a flow heuristic that can be wrong; real-ELF path only, so every parity gate is byte-identical)."
use_when = "Off (default; no Listing consumer runs and there is zero behavior change). Flip on (with option listing on) when a custom no-return wrapper (a die()/fatal()/xalloc_die() that unconditionally ends in abort/exit) is treated as returning — angr renders the caller cleanly but kuna emits a spurious while(true) loop + goto + dead stack spills from the post-call fall-through (e.g. tee_O2 x2nrealloc). Broader than noreturn_disc: no >=3 call-site threshold and it seeds from the Known list."
example = "option listing on --option noreturn_propagate on"
source_decompiler = "angr"
inspiration = "test_decompiling_tee_O2_x2nrealloc; angr CFGFast no-return propagation (returning / _iteratively_analyze_function_features); x2nrealloc"
change_kind = "structure-recovery"
[[settable]]
option = "gopclntab"
values = "on|off"
default = "on"
destructive = false
stage = "S1"
substage = "code-data-partition"
strength = "HARD"
rewind = "S1"
issue = "kuna-analysis-gopclntab"
summary = "Run the Go pclntab function-name recovery pass: when the binary is Go (detect_compiler == Go), locate and parse the embedded pclntab (PC->line/name table) and emit a function symbol per Go function, so main.main / runtime.* / package functions render NAMED instead of sub_<addr> (the kuna analog of Ghidra's GolangSymbolAnalyzer, name-recovery half). Handles the go1.2/go1.16/go1.18/go1.20 header magics. Registered ONLY for a Go binary, so it is a structural no-op on every non-Go target. The existing symbol commit arm installs the names idempotently (a real .symtab name still wins; only a stripped Go binary's sub_<addr> functions take the recovered name)."
use_when = "On (default) names Go functions from the pclntab (main.main, runtime.gopanic, ...); off leaves a stripped Go binary's functions as sub_<addr>."
example = "option gopclntab off"
source_decompiler = "kuna"
inspiration = "Ghidra GolangSymbolAnalyzer (pclntab / GoPcHeader / GoModuledata / GoFuncData)"
change_kind = "analysis-enablement"

# ---------------------------------------------------------------------------
# (kuna) Loader-tier capability (1 row): ET_REL relocatable-object support. Unlike
# the analysis-pass gates above, this gates the LOADER (run at `load file`, before
# any `option` is processed), so the on/off toggle is bridged to the loader via a
# process env var (`RELOC_OBJECTS_ENV`) rather than an Architecture flag — this row
# exists for LLM discoverability + the off-switch. Real-ELF (object) path only; the
# XML datatest path never constructs an ObjectLoadImage, so it is inert there.
[[settable]]
option = "relocobjects"
values = "on|off"
default = "on"
destructive = false
stage = "S1"
substage = "code-data-partition"
strength = "HARD"
rewind = "S1"
issue = "angr-CLE-ET_REL"
summary = "Load ELF relocatable objects (ET_REL `.o` files, which have no PT_LOAD program headers and so map zero bytes under the upstream loader): synthesize a section layout above 0x400000, apply the `.rela.*` relocations (R_X86_64_PC32/PLT32/32/32S/64), rebase defined symbols, and bind undefined externs to synthetic call targets — so a `.o` decompiles instead of failing with 'Unable to load N bytes at ...'. The kuna analog of angr CLE's ELF relocatable backend."
use_when = "On by default (a pure capability: linked ET_EXEC/ET_DYN images are byte-identical — they keep the PT_LOAD path — and only a `.o`, which today produces ZERO output, takes the new path). Set off to restore the upstream PT_LOAD-only loader (a `.o` then errors). NB: this gates the loader, which runs at `load file` BEFORE per-function options, so flip it (or set env KUNA_RELOC_OBJECTS=0) before loading the `.o`."
example = "option relocobjects off"
source_decompiler = "angr"
inspiration = "test_decompiling_ptx_fix_output_parameters; CLE ELF relocatable backend; fix_output_parameters"
change_kind = "structure-recovery"

# ---------------------------------------------------------------------------
# (kuna) Loader-tier capability (1 row): arm64e Mach-O spec selection. Like
# `relocobjects` above, this gates a LOAD-time decision (language_id_for), so the
# live gate is an env var the CLI exports (KUNA_MACHO_ARM64E) rather than an
# Architecture flag. Real-Mach-O path only; inert on every ELF/PE/COFF/XML path.
[[settable]]
option = "macho-arm64e"
values = "on|off"
default = "off"
destructive = false
stage = "S1"
substage = "code-data-partition"
strength = "HARD"
rewind = "S1"
issue = "kuna-multiformat-macho-arm64e"
summary = "Select the Apple-Silicon pointer-authentication SLEIGH spec for an arm64e Mach-O. When on, a Mach-O whose header reports cpusubtype CPU_SUBTYPE_ARM64E loads with the AARCH64:LE:64:AppleSilicon language (the vendored Apple-Silicon v8.5-A spec, which models the pointer-auth/AMX extensions) instead of the generic AARCH64:LE:64:v8A. Pointer authentication does NOT change import naming or symbols (the __stubs indirect-symbol walk is unaffected) — only the spec selection differs (design 3.7). Spec selection is a LOAD-time decision (language_id_for), which runs before any console `option` command, so the live gate is the KUNA_MACHO_ARM64E env var the kuna CLI exports when it sees `--option macho-arm64e on`; this option name also records the requested state on the Architecture for catalog consistency. Default-OFF (opt-in, multi-format loader PR-8): a non-arm64e Mach-O, a non-Mach-O target, and every ELF/PE/COFF path are byte-identical, so all parity gates are structurally untouched."
use_when = "Off (default; an arm64e Mach-O loads with the generic v8A spec, exactly as any arm64). Flip on to decompile an arm64e (Apple-Silicon, pointer-auth) Mach-O with the AppleSilicon spec that models its extensions."
example = "--option macho-arm64e on"
source_decompiler = "kuna"
inspiration = "Ghidra MachoLoader arm64e cpusubtype -> AARCH64:LE:64:AppleSilicon language mapping"
change_kind = "analysis-enablement"
