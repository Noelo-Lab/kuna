[[settable]]
option = "tailcalljump"
values = "on|off"
default = "on"
destructive = false
stage = "S2"
substage = "flow-classification"
strength = "HARD"
rewind = "S2"
issue = "angr-tee-O2-tail-jumps"
summary = "Recover an -O2 tail jump (a direct `jmp` to another function's entry, e.g. `jmp setlocale@plt`) as a tail call (CALL + RETURN) so the callee resolves by name and its return value flows out, instead of flowing into the callee (which inlines a PLT thunk and mis-renders it as a `(*dat_...)(...)` indirect call with a 'Treating indirect jump as call' warning). When it fires it logs a `tailcalljump: recovered tail call` warning at the branch site so the introduced call is observable."
use_when = "Flip on when a leaf function ends in `jmp <func>@plt` and kuna emits `(*dat_...)(...)` + a 'Treating indirect jump as call' marker instead of `func(...)`. On = the named call plus a `tailcalljump: recovered tail call` WARNING. Off (default) is default-pipeline byte-identical; kept opt-in because default-on regresses 2 datatests (Long double #1/#2)."
example = "option tailcalljump on"
source_decompiler = "angr"
inspiration = "test_decompiling_tee_O2_tail_jumps; angr tail-call handling (direct jmp to a function/PLT thunk); setlocale_null_androidfix"
change_kind = "structure-recovery"
live_field = "tail_call_jumps"
live_true = "on"
live_false = "off"

[[settable]]
option = "noreturn_extern"
values = "on|off"
default = "on"
destructive = false
stage = "S2"
substage = "flow-classification"
strength = "HARD"
rewind = "S2"
issue = "angr-tail-tail-bytes-ret-dup"
summary = "REMOVES CODE: marks a matched extern call no-return, so code after the call (the fall-through) is dropped as unreachable. Treat a direct CALL whose resolved callee display name matches a known ELF no-return name (`__stack_chk_fail`, `abort`, `exit`, `__assert_fail`, `pthread_exit`, `longjmp`, `_Unwind_Resume`, the C++ terminate/throw family, ...) as no-return at decompile flow time - planting the artificial halt so flow stops at the call - even when the address-keyed no-return flag is unset. This is the undefined-extern case the analysis-tier `noreturn_known` pass cannot reach: in an ELF relocatable object (ET_REL `.o`) a libc no-return is an `UND` symbol with no definition/address, so the address-keyed pass never marks it, and flow runs off the function's end into the next function."
use_when = "On by default (DIV-14). Flip OFF only to restore the upstream fall-through past a matched extern no-return call (e.g. to study the raw flow). On = a direct call to a known ELF no-return name is treated as no-return, so the function is bounded at it and the post-call dead code is dropped (e.g. an ET_REL `.o` tail.o::tail_bytes renders 87 lines instead of ballooning to 326 lines / 9 gotos by swallowing adjacent `tail_lines`/`die_pipe` after `__stack_chk_fail()`). The name match overlaps `noreturn_known`'s for defined/imported symbols; default-on is byte-identical over the 675 datatests (no datatest call resolves to a no-return name)."
example = "option noreturn_extern on"
source_decompiler = "angr"
inspiration = "test_tail_tail_bytes_ret_dup; angr CFG call-graph no-return analysis (undefined-extern `__stack_chk_fail`); tail_bytes"
change_kind = "correctness-fix"
live_field = "noreturn_extern_calls"
live_true = "on"
live_false = "off"

