strength = "HARD"
rewind = "S2"
issue = "angr-tee-O2-tail-jumps"
summary = "Recover an -O2 tail jump (a direct `jmp` to another function's entry, e.g. `jmp setlocale@plt`) as a tail call (CALL + RETURN) so the callee resolves by name and its return value flows out, instead of flowing into the callee (which inlines a PLT thunk and mis-renders it as a `(*dat_...)(...)` indirect call with a 'Treating indirect jump as call' warning). When it fires it logs a `tailcalljump: recovered tail call` warning at the branch site so the introduced call is observable."
use_when = "Flip on when a leaf function ends in `jmp <func>@plt` and kuna emits `(*dat_...)(...)` + a 'Treating indirect jump as call' marker instead of `func(...)`. On = the named call plus a `tailcalljump: recovered tail call` WARNING. Off (default) is default-pipeline byte-identical; kept opt-in because default-on regresses 2 datatests (Long double #1/#2)."
example = "option tailcalljump on"
source_decompiler = "angr"
inspiration = "test_decompiling_tee_O2_tail_jumps; angr tail-call handling (direct jmp to a function/PLT thunk); setlocale_null_androidfix"
change_kind = "structure-recovery"
live_field = "tail_call_jumps"
live_true = "on"
live_false = "off"

