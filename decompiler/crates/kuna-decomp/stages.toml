[[settable]]
option = "switchsharedcase"
values = "on|off"
default = "on"
destructive = true
stage = "S2"
substage = "switch-model"
strength = "HARD"
rewind = "S2"
issue = "angr-switch-case-shared-case-node"
summary = "Recover a GCC PIC relative-offset jump table (target = base + sext(load4(base + idx*4))) whose table-base register is a loop-carried MULTIEQUAL: the `lea .rodata` base is set before a getopt-style loop while the BRANCHIND is inside it, so the path-meld collapses to the final base+offset add and the CBRANCH range guard on the load index never bounds the table. Rebuilds the meld as a clean single path down to the guarded index so the table resolves and the switch structures. On by default (DIV-14): SLOWER on the functions whose loop-carried switch it recovers (the extra meld-rebuild + table resolution walk runs there), but kept on for the better recovery quality; byte-identical (0/675) on every datatest, which has no such loop-carried PIC switch."
use_when = "On by default (DIV-14): recovers a getopt/dispatch switch inside a loop that would otherwise report 'Could not recover jumptable ... Too many branches' and render as a computed (code *)() call with goto spaghetti. Flip OFF only if the heuristic mis-sizes or accepts an unrelated indirect jump on a specific program (it reads a read-only table at a base it recovers across a loop phi) — it is marked destructive for that reason, but it is byte-identical over the 675 datatests and kept on for quality despite being slower on the functions it recovers."
example = "option switchsharedcase on"
source_decompiler = "angr"
inspiration = "test_switch_case_shared_case_nodes_b2sum_digest; angr CFGFast indirect-jump resolution across the loop phi; main"
