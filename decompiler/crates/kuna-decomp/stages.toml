# ---------------------------------------------------------------------------
# Analysis-pass gates (8 rows): per-run `--option <id> on|off` enablement of the
# `kuna_analysis` passes. The option id IS the pass's `AnalysisPass::id()`. The
# console's `commit_analysis_output` (run at `read symbols`, after these options
# are applied) consults the matching `analysis_*` flag on the Architecture and
# skips a disabled pass's facts. Real-ELF analysis tier only — the XML datatest
# path never produces analysis facts, so these are structurally inert there
# (faithful to Ghidra's per-analyzer `setDefaultEnablement`). No `live_field`:
# they flip a plain bool, not a printer/engine "live value" reader; the live
# state is surfaced console-side via `kuna_live_value`. See docs/missing-analyses.md.
