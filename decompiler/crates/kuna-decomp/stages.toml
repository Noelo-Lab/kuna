rewind = "S1"
issue = "kuna-analysis-funcstart-patterns"
summary = "Run the FULL byte-pattern function-start pass: a faithful port of Ghidra's FunctionStartAnalyzer over the entire vendored pattern corpus (Ghidra/Processors/<P>/data/patterns/*.xml), parsing every <patternpairs> (the DittedBitSequence prepattern/postpattern pairs) and bare <funcstart/> pattern for x86/x86-64 (headline) plus AArch64/ARM/RISC-V/MIPS/PPC. A candidate is a function start iff a postpattern (the prologue shape) matches at it AND a prepattern (the preceding context: a RET/JMP/NOP/...) matches the bytes immediately before it, at the instruction alignment. This is the full superset of entry_disc's always-on oracle 5, which ports only a minimal three-prologue x86-64 subset. Default-OFF because it is output-changing (it discovers MORE functions): when off, the pass's facts are dropped at commit and every decompilation is byte-identical to the entry_disc-only baseline. The after=defined / validcode=N pattern post-rules and the <possiblefuncstart/> / thunk / label actions are dropped (they need a PseudoDisassembler the analyzer tier does not have) — a documented LOSS, the same wall entry_disc's oracle-5 docs record."
use_when = "On discovers additional function starts in a stripped binary via the full Ghidra prologue pattern set (e.g. a `push rbx; mov rbx,rdi` function after NOP padding that the minimal oracle misses); off (default) keeps only the entry_disc + symbol-stream functions so the output is byte-identical to the baseline."
