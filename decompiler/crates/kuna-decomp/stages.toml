# ---------------------------------------------------------------------------
# (kuna) Loader-tier capability (1 row): ET_REL relocatable-object support. Unlike
# the analysis-pass gates above, this gates the LOADER (run at `load file`, before
# any `option` is processed), so the on/off toggle is bridged to the loader via a
# process env var (`RELOC_OBJECTS_ENV`) rather than an Architecture flag — this row
# exists for LLM discoverability + the off-switch. Real-ELF (object) path only; the
# XML datatest path never constructs an ObjectLoadImage, so it is inert there.
[[settable]]
option = "relocobjects"
values = "on|off"
default = "on"
destructive = false
stage = "S1"
substage = "code-data-partition"
strength = "HARD"
rewind = "S1"
issue = "angr-CLE-ET_REL"
summary = "Load ELF relocatable objects (ET_REL `.o` files, which have no PT_LOAD program headers and so map zero bytes under the upstream loader): synthesize a section layout above 0x400000, apply the `.rela.*` relocations (R_X86_64_PC32/PLT32/32/32S/64), rebase defined symbols, and bind undefined externs to synthetic call targets — so a `.o` decompiles instead of failing with 'Unable to load N bytes at ...'. The kuna analog of angr CLE's ELF relocatable backend."
use_when = "On by default (a pure capability: linked ET_EXEC/ET_DYN images are byte-identical — they keep the PT_LOAD path — and only a `.o`, which today produces ZERO output, takes the new path). Set off to restore the upstream PT_LOAD-only loader (a `.o` then errors). NB: this gates the loader, which runs at `load file` BEFORE per-function options, so flip it (or set env KUNA_RELOC_OBJECTS=0) before loading the `.o`."
example = "option relocobjects off"
source_decompiler = "angr"
inspiration = "test_decompiling_ptx_fix_output_parameters; CLE ELF relocatable backend; fix_output_parameters"
change_kind = "structure-recovery"

