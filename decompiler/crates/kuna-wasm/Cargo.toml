# Browser/WASI front-end, also built natively for output parity tests.
# See docs/web-integration.md.
[package]
name = "kuna-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kuna_wasm"
path = "src/lib.rs"

[[bin]]
name = "kuna_wasm"
path = "src/main.rs"

[dependencies]
kuna-base.workspace = true
kuna-console.workspace = true
kuna-decomp.workspace = true
# `object` is already a workspace dependency (the ELF/PE/Mach-O LoadImage
# backend); reused here to read the machine for the non-x86-64
# `funcstart_patterns`/`aif` injections that remain after resolving `auto`,
# mirroring `kuna decompile-all` exactly. No new crate enters the dependency
# graph.
object.workspace = true
# (kuna outlang) `sourcelang::detect_compiler` backs the auto language policy:
# a Rust binary renders as Rust unless the caller names a language.
kuna-analysis.workspace = true

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
