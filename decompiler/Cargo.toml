# kuna Rust port -- cargo workspace.
#
# A parallel reimplementation of the C++ decompiler under decompiler/cpp/
# (the test ORACLE, which stays green throughout the port). Crate boundaries,
# dependency edges, and the C++ -> crate file mapping are documented in each
# crate's lib.rs and in docs/rust-port/.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# External
thiserror = "2.0"
flate2 = "1.1"
smallvec = "1.15"
slotmap = "1.0"
# The real-ELF LoadImage backend (W11 / `loadimage_object.rs`) substitutes the
# `object` crate for the C++ console's GNU BFD dependency (LoadImageBfd /
# loadimage_bfd.cc); see docs/rust-port/losses.md (the BFD dependency-substitution
# LOSS).  Read-only parsing only -- no_default_features keeps the surface to the
# explicit format readers.  `elf` is the established path; `pe`/`macho`/`coff`
# are the multi-format expansion (docs/multiformat-loader-design.md), enabling
# `object::File::parse` to recognize PE/Mach-O/COFF — gated on the load path
# behind `--experimental-formats` so default behavior stays ELF-only.
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "pe", "macho", "coff", "std"] }
# Dev-only (kuna-harness): the datatest <stringmatch> engine.  std::regex
# (ECMAScript) has no Rust equivalent; the regex crate is the documented
# substitution (LOSS-007).  Used by the harness crate only -- never the engine.
regex = "1"
# Symbol demangling (kuna-analysis / `s1_demangle/`), the kuna analog of
# Ghidra's `GnuDemanglerAnalyzer`.  Ghidra's GNU/Itanium demangler is NOT Java
# logic: `GnuDemanglerNativeProcess` shells out to a native `demangle`
# executable (libiberty `cplus_demangle`), so mirroring Ghidra = "call a
# third-party demangler and consume its string".  Per the same
# dependency-substitution LOSS the BFD object model takes (see
# `loadimage_object.rs` / docs/rust-port/losses.md), these permissive crates
# replace Ghidra's native `demangle`/libiberty dependency.  cpp_demangle =
# Itanium C++ (MIT/Apache); rustc-demangle = Rust legacy `_ZN` + v0 `_R`
# (MIT/Apache).  Used by kuna-analysis only -- never the engine.
cpp_demangle = "0.5"
rustc-demangle = "0.1"
# DWARF debug-info parsing (kuna-analysis / `s1_dwarf/`), the kuna analog of
# Ghidra's `DWARFAnalyzer`.  Ghidra hand-rolls a complete DWARF reader in
# `ghidra.app.util.bin.format.dwarf.*` (DWARFProgram, DebugInfoEntry,
# DIEAggregate, DWARFAbbreviation, StringTable, …).  Per the same
# dependency-substitution LOSS the BFD object model takes (BFD -> `object`; see
# `loadimage_object.rs` / docs/rust-port/losses.md), kuna substitutes `gimli`,
# the de-facto Rust DWARF reader (MIT/Apache), for Ghidra's hand-rolled parser
# wholesale.  Read-only over the `.debug_*` section bytes -- no_default_features
# keeps the surface to `read` + `std`.  Used by kuna-analysis only -- never the
# engine.
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
# Intra-workspace
kuna-base = { path = "crates/kuna-base" }
kuna-num = { path = "crates/kuna-num" }
kuna-sleigh = { path = "crates/kuna-sleigh" }
kuna-decomp = { path = "crates/kuna-decomp" }
kuna-analysis = { path = "crates/kuna-analysis" }
kuna-console = { path = "crates/kuna-console" }

[workspace.lints.clippy]
# Wired to rust/clippy.toml: std::collections::HashMap / HashSet are banned
# workspace-wide because decompiler output must be deterministic and hash-map
# iteration order is not. Use BTreeMap/BTreeSet with ported Ord comparators
# (see docs/rust-port/adr/0002-ordered-containers.md).
disallowed_types = "deny"
