# Workspace for the decompiler, SLEIGH toolchain, and frontends.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2.0"
flate2 = "1.1"
smallvec = "1.15"
slotmap = "1.0"
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "pe", "macho", "coff", "std"] }
regex = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "proc-macro"] }
cpp_demangle = "0.5"
rustc-demangle = "0.1"
msvc-demangler = "0.11"
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
pdb = "0.8"
kuna-base = { path = "crates/kuna-base" }
kuna-num = { path = "crates/kuna-num" }
kuna-sleigh = { path = "crates/kuna-sleigh" }
kuna-decomp = { path = "crates/kuna-decomp" }
kuna-analysis = { path = "crates/kuna-analysis" }
kuna-console = { path = "crates/kuna-console" }

[workspace.lints.clippy]
# Ordered collections keep output decisions deterministic; see clippy.toml.
disallowed_types = "deny"

# Exercise real-image workloads without disabling debug validation.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
