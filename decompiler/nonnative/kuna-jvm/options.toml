# kuna-facing options of the JVM engine (kuna-jvm, a port of Vineflower 1.12.0).
#
# One [[option]] row per exposed decision, spelled jvm_<vineflower long name with
# '-' turned into '_'>; `vineflower` and `short` are Vineflower's own long and
# three-letter names, accepted as aliases. Fields follow a [[settable]] row of
# decompiler/crates/kuna-decomp/phases.toml; `phase`/`subphase` name the
# kuna-jvm source folder and the module(s) that read the key. build.rs turns
# this file into the static table of src/p0_knowledge/kuna_options.rs; a test
# checks it one to one against IFernflowerPreferences.all_options().
#
# [[driver_owned]] keys are set by kuna's driver or front end, never by a row.

[[option]]
option = "jvm_remove_bridge"
vineflower = "remove-bridge"
short = "rbr"
aliases = ["remove-bridge", "rbr"]
values = "on|off"
default = "on"
destructive = false
phase = "p9_emit"
subphase = "class_writer"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Leave out methods flagged ACC_BRIDGE: the forwarders javac generates for covariant return types and erased generic overrides."
use_when = "Turn off to see the bridge forwarders a class really carries, e.g. when checking which erased signatures a library exposes or when an obfuscator hid code in a method marked bridge."
example = "kuna decompile app.jar com.ex.Box --option jvm_remove_bridge off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.REMOVE_BRIDGE (remove-bridge, -rbr)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "method javap lists as bridge is missing from the output|need the generated Object-typed forwarder of a generic override|an obfuscated method marked bridge vanished"

[[option]]
option = "jvm_remove_synthetic"
vineflower = "remove-synthetic"
short = "rsy"
aliases = ["remove-synthetic", "rsy"]
values = "on|off"
default = "on"
destructive = false
phase = "p9_emit"
subphase = "class_writer"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Leave out synthetic fields, methods and member classes (this$0, val$x, access$000, lambda$main$0, switch-map classes) once their uses have been folded back into source form."
use_when = "Turn off when reversing obfuscated or non-javac bytecode that keeps real code in members flagged synthetic, or to read the accessor and lambda implementation methods themselves."
example = "kuna decompile app.jar com.ex.Main --option jvm_remove_synthetic off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.REMOVE_SYNTHETIC (remove-synthetic, -rsy)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "code javap shows is missing from the decompiled class|lambda$main$0 or access$000 body needed but hidden|obfuscator flagged real methods synthetic and they disappeared"

[[option]]
option = "jvm_decompile_inner"
vineflower = "decompile-inner"
short = "din"
aliases = ["decompile-inner", "din"]
values = "on|off"
default = "on"
destructive = false
phase = "p1_classfile"
subphase = "classes_processor"
strength = "HARD"
rewind = "p1_classfile"
issue = ""
summary = "Nest member, local and anonymous classes inside their enclosing class, as the InnerClasses and EnclosingMethod attributes describe; off writes every class file as its own top-level class."
use_when = "Turn off when InnerClasses attributes are stripped or forged and nesting goes wrong, or to get Outer$Inner as a separate compilation unit."
example = "kuna decompile-project app.jar -o out --option jvm_decompile_inner off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.DECOMPILE_INNER (decompile-inner, -din)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "Outer$Inner written as a separate class instead of nested|anonymous class body lands in the wrong method|need each class file decompiled on its own"

[[option]]
option = "jvm_decompile_java4"
vineflower = "decompile-java4"
short = "dc4"
aliases = ["decompile-java4", "dc4"]
values = "on|off"
default = "on"
destructive = false
phase = "p3_dataflow"
subphase = "simplify_exprents_helper, class_writer"
strength = "HARD"
rewind = "p3_dataflow"
issue = ""
summary = "Turn the pre-Java-5 class-literal idiom (a synthetic static class$(String) helper, a cached Class field and Class.forName) back into Foo.class."
use_when = "Turn off to see the literal class$ helper calls and cache fields in Java 1.4-and-older class files, e.g. when the helper was tampered with."
example = "kuna decompile legacy.jar com.ex.Old --option jvm_decompile_java4 off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.DECOMPILE_CLASS_1_4 (decompile-java4, -dc4)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "class$(\"java.lang.String\") calls instead of String.class|static Class class$java$lang$String fields in old class files|need the raw Class.forName cache logic"

