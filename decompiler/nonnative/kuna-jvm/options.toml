example = "kuna decompile app.jar com.ex.Repo --option jvm_explicit_generics on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.EXPLICIT_GENERIC_ARGUMENTS (explicit-generics, -ega)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "decompiled code fails to recompile with an inference error|need the type argument of a generic method call"

[[option]]
option = "jvm_rename_members"
vineflower = "rename-members"
short = "ren"
aliases = ["rename-members", "ren"]
values = "on|off"
default = "off"
destructive = false
phase = "p0_knowledge"
subphase = "fernflower, identifier_converter, converter_helper"
strength = "HARD"
rewind = "p0_knowledge"
issue = ""
summary = "Rename classes, fields and methods whose names are not valid Java identifiers, are reserved words, or are short obfuscated names, to class_N/field_N/method_N, rewriting every reference and noting the original name."
use_when = "Turn on for obfuscated jars whose names (if, do, a, ., unicode garbage) make the output unreadable or uncompilable."
example = "kuna decompile-project obf.jar -o out --option jvm_rename_members on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.RENAME_ENTITIES (rename-members, -ren)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "class or method named like a Java keyword|identifiers that are not valid Java (obfuscated names)|many classes named a, b, c that clash"

[[option]]
option = "jvm_decompiler_comments"
vineflower = "decompiler-comments"
short = "dec"
aliases = ["decompiler-comments", "dec"]
values = "on|off"
default = "on"
destructive = false
phase = "p9_emit"
subphase = "class_writer, finally_processor, assignment_exprent, const_exprent, invocation_exprent"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Write $VF: comments where the decompiler had to bend the code: irreducible flow, unverifiable finally blocks, MethodType constants, constructors it could not resugar, ambiguous variable types."
use_when = "Turn off for output free of decompiler remarks; keep on to know which parts of the code to distrust."
example = "kuna decompile app.jar com.ex.Main --option jvm_decompiler_comments off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.DECOMPILER_COMMENTS (decompiler-comments, -dec)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "/* $VF: ... */ and // $VF: comments clutter the output|need to know where the decompiler approximated (option is off)"

[[option]]
option = "jvm_decompile_complex_constant_dynamic"
vineflower = "decompile-complex-constant-dynamic"
short = "dcc"
aliases = ["decompile-complex-constant-dynamic", "dcc"]
values = "on|off"
default = "off"
destructive = false
phase = "p4_calls"
subphase = "condy_helper"
strength = "HARD"
rewind = "p4_calls"
issue = ""
summary = "Write constant-dynamic VarHandle constants (fieldVarHandle, staticFieldVarHandle, arrayVarHandle) as the equivalent MethodHandles lookup expression, marked with a comment because it runs eagerly; off keeps the raw condy form."
use_when = "Turn on to read code using condy VarHandles in plain Java terms, accepting that the expression is not lazily evaluated."
example = "kuna decompile app.jar com.ex.Atomic --option jvm_decompile_complex_constant_dynamic on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.DECOMPILE_COMPLEX_CONDYS (decompile-complex-constant-dynamic, -dcc)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "condy bootstrap call with ConstantBootstraps.fieldVarHandle in the output|VarHandle constant shown as an unresolved dynamic constant"

[[option]]
option = "jvm_force_jsr_inline"
vineflower = "force-jsr-inline"
short = "fji"
aliases = ["force-jsr-inline", "fji"]
values = "on|off"
default = "off"
destructive = false
phase = "infra"
subphase = "method_processor"
strength = "HARD"
rewind = "infra"
issue = ""
summary = "Inline jsr/ret subroutines in every class file; normally only class files of Java 6 or older, where they are legal, get this."
use_when = "Turn on for hand-assembled or obfuscated Java 7+ class files that use jsr/ret anyway and fail to decompile."
example = "kuna decompile obf.jar a.b --option jvm_force_jsr_inline on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.FORCE_JSR_INLINE (force-jsr-inline, -fji)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "method with jsr/ret fails to decompile in a modern class file|finally logic of a modern class built from subroutines"

[[option]]
option = "jvm_mark_corresponding_synthetics"
vineflower = "mark-corresponding-synthetics"
short = "mcs"
aliases = ["mark-corresponding-synthetics", "mcs"]
values = "on|off"
default = "off"
destructive = false
phase = "p9_emit"
subphase = "class_writer"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Write a comment naming the synthetic construct behind each lambda (its lambda$name$N method) and each anonymous or local class (its Outer$N class)."
use_when = "Turn on to map lambdas and anonymous classes in the output back to the class-file members and stack-trace names they compile to."
example = "kuna decompile app.jar com.ex.Handlers --option jvm_mark_corresponding_synthetics on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.MARK_CORRESPONDING_SYNTHETICS (mark-corresponding-synthetics, -mcs)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "stack trace names lambda$main$0 or Main$1 and the matching code is hard to find|need the class file of an anonymous class"

[[option]]
option = "jvm_validate_inner_classes_names"
vineflower = "validate-inner-classes-names"
short = ""
aliases = ["validate-inner-classes-names"]
values = "on|off"
default = "on"
destructive = false
phase = "p1_classfile"
subphase = "classes_processor"
strength = "HARD"
rewind = "p1_classfile"
issue = ""
summary = "Nest a member class only when its name is its outer class's name, $, and its simple name (Outer$Inner); a member entry with any other name is ignored and the class stays top-level."
use_when = "Turn off for renamed or obfuscated jars whose inner class names do not follow the Outer$Inner scheme, so they still nest."
example = "kuna decompile obf.jar a --option jvm_validate_inner_classes_names off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.VALIDATE_INNER_CLASSES_NAMES (validate-inner-classes-names)"
change_kind = "vineflower-option"
tier = "analysis"
symptoms = "member classes of an obfuscated jar written as separate top-level classes|renamed inner classes not nested"

[[option]]
option = "jvm_prettify_ifs"
vineflower = "prettify-ifs"
short = ""
aliases = ["prettify-ifs"]
values = "on|off"
default = "on"
destructive = false
phase = "p9_emit"
subphase = "class_writer, if_helper"
strength = "HARD"
rewind = "p9_emit"
issue = ""
summary = "Before writing, turn if (c) { ..; return; } else { rest } into the if followed by rest: the else after a branch that always returns or throws is dropped (unless the else exits too)."
use_when = "Turn off to keep the if/else pairs as structured from the control flow, e.g. when comparing with older Fernflower output."
example = "kuna decompile app.jar com.ex.Main --option jvm_prettify_ifs off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.PRETTIFY_IFS (prettify-ifs)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "else branch missing after an if that returns|deep else chains after returns (option is off)"

[[option]]
option = "jvm_siblings"
vineflower = ""
short = ""
aliases = []
values = "on|off"
default = "on"
destructive = false
phase = "p0_knowledge"
subphase = "kuna_input"
strength = "HARD"
rewind = "p0_knowledge"
issue = ""
summary = "For a single .class input, also load the Name$*.class files next to it, so nested, local and anonymous classes are decompiled inside it."
use_when = "Turn off to decompile exactly the given class file, e.g. when a directory holds unrelated classes with the same prefix."
example = "kuna decompile Main.class --option jvm_siblings off"
source_decompiler = "kuna"
inspiration = "Vineflower's test fixture and IntelliJ integration, which add Name$*.class to a decompiled Name.class"
change_kind = "kuna-input"
tier = "analysis"
symptoms = "inner and anonymous classes missing when decompiling one .class file|unrelated Name$x.class files nested into the class"

[[option]]
option = "jvm_resugar_idea_notnull"
vineflower = "resugar-idea-notnull"
short = "inn"
aliases = ["resugar-idea-notnull", "inn"]
values = "on|off"
default = "on"
destructive = false
phase = "plugins"
subphase = "idea_not_null_pass, idea_not_null_plugin"
strength = "HARD"
rewind = "plugins"
issue = ""
summary = "Remove the null checks IntelliJ IDEA's compiler inserts for @NotNull parameters and return values (if (x == null) { $$$reportNull$$$0(n); }), leaving the @NotNull annotations (IdeaNotNull plugin)."
use_when = "Turn off to see the checks IDEA instrumented into a method, e.g. to confirm which parameters are checked at run time."
example = "kuna decompile app.jar com.ex.Service --option jvm_resugar_idea_notnull off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IdeaNotNull plugin: IdeaNotNullOptions.IDEA_NOT_NULL_ANNOTATION (resugar-idea-notnull, -inn)"
change_kind = "vineflower-option"
tier = "transform"
symptoms = "if (x == null) { $$$reportNull$$$0(0); } at the top of methods|explicit null checks on @NotNull parameters or before returns (option is off)"

[[option]]
option = "jvm_kt_enable"
vineflower = "kt-enable"
short = ""
aliases = ["kt-enable"]
values = "on|off"
default = "on"
destructive = false
phase = "kotlin"
subphase = "kotlin_chooser"
strength = "HARD"
rewind = "kotlin"
issue = ""
summary = "Kotlin plugin: write classes that carry @kotlin.Metadata as Kotlin source (.kt) through the plugin's own pipeline and writer; off writes them as Java (.java) with the @Metadata annotation, like any other class."
use_when = "Turn off to see the Java view of a Kotlin class (accessor methods, $default bridges, Intrinsics checks, every JVM method on its own), or when the Kotlin output of a class is wrong or fails and the Java output is enough; the CLI's --language java turns it off for the run."
example = "kuna decompile app.jar com.ex.UserKt --option jvm_kt_enable off"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 Kotlin plugin: KotlinOptions.DECOMPILE_KOTLIN (kt-enable)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "Kotlin classes come out as Java with @Metadata(mv = ..., d1 = ...)|a Kotlin class is written as .kt but Java output is wanted|Kotlin output of a class is wrong or failed"

