[[option]]
option = "jvm_keep_literals"
vineflower = "keep-literals"
short = "lit"
aliases = ["keep-literals", "lit"]
values = "on|off"
default = "off"
destructive = false
phase = "substrate"
subphase = "const_exprent"
strength = "HARD"
rewind = "substrate"
issue = ""
summary = "Print floating-point and long constants as plain literals (0.0F / 0.0F for NaN, 1.0 / 0.0 for infinity, 3.141592653589793) instead of resugaring them to Double.NaN, Double.POSITIVE_INFINITY, Long.MAX_VALUE or Math.PI."
use_when = "Turn on when the exact numeric value matters more than the named constant, e.g. when a magic number happens to equal Math.PI or Long.MAX_VALUE."
example = "kuna decompile app.jar com.ex.Math2 --option jvm_keep_literals on"
source_decompiler = "vineflower"
inspiration = "Vineflower 1.12.0 IFernflowerPreferences.LITERALS_AS_IS (keep-literals, -lit)"
change_kind = "vineflower-option"
tier = "core"
symptoms = "Math.PI where the source had a numeric literal|Long.MAX_VALUE or Double.MAX_VALUE instead of the number|need raw digits of a float constant"

[[option]]
